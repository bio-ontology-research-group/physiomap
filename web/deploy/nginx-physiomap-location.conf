# Replace the bio2vec.net vhost's existing /physiomap/ location with this block.
# The exporter commits deterministic .json.gz siblings for the bootstrap and lazy buckets.
location /physiomap/ {
    alias /var/www/physiomap/;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;
    add_header Cache-Control "no-cache" always;
}
