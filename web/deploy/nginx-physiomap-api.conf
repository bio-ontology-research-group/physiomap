# nginx location block — reverse-proxy the PhysioMap knockout API.
# Add INSIDE the existing `server { }` for bio2vec.net (the same one that serves /physiomap/).
#
#   sudo cp web/deploy/nginx-physiomap-api.conf /etc/nginx/snippets/physiomap-api.conf
#   # then inside the bio2vec.net server block add:  include snippets/physiomap-api.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# The trailing slash on proxy_pass strips the /physiomap/api/ prefix, so the service receives
# /knockout, /health, /nodes. (The handler also matches the full prefixed path, so either is fine.)

location /physiomap/api/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
}
