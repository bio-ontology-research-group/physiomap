# =============================================================================
# Human-scale PhysioMap — composed map + intervention gold set
#                                                   *** DRAFT FOR REVIEW ***
# =============================================================================
# Composes the Guyton CV/renal/RAAS core with the homeostatic-system fragments into one
# whole-body map. Expected signs are established clinical/physiological steady-state
# outcomes. `loop_critical` flags targets whose correct sign requires reasoning over a
# feedback loop (naive forward propagation would be wrong).
#
# NOTE on scale: the composed map has one large (~31-node) whole-body homeostatic SCC;
# predictions routed through it are solved by the conservative loop-aware engine and may
# return '?' (honest: their sign depends on loop magnitudes). Self-contained subsystems
# (thyroid HPT, calcium-PTH, respiratory chemoreflex, thermoregulation) keep tight SCCs
# and are solved exactly. The focused Guyton benchmark remains the determinate-loop check.
# =============================================================================

