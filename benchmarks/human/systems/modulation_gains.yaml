    effects of glucocorticoid on hepatic gluconeogenesis...'', J Biol Chem 1984;259 (PMID 6234302, verified via PubMed) -
    in hepatocytes/perfused livers from fasted rats, ADRENALECTOMY produced ''a reduction in both sensitivity and responsiveness
    to the hormone [glucagon] in gluconeogenesis'' (the glucagon dose-response slope fell: 1 nM glucagon failed to stimulate
    glucose output from lactate in adrenalectomized livers but 10 nM did), and glucocorticoid replacement restored it - an
    explicit slope/gain change with the modulator. Corroborated by Exton et al., J Biol Chem 1972;247(11):3579-88 (PMID 4337859,
    verified).'
  causal_evidence: perturbation
