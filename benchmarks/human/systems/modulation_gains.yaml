- modulator: plasma_calcium
  influence_id: influence:synaptic_acetylcholine_concentration:positive:postsynaptic_membrane_potential
  sign: '-'
  can_flip_sign: false
  mechanism: Extracellular (plasma, ionised) Ca2+ screens the fixed negative surface charges on the outer membrane face and
    on voltage-gated Na+ channels (Frankenhaeuser-Hodgkin surface-potential effect). Raising [Ca2+]o increases screening,
    right-shifting (depolarising) the voltage-dependence of Na+-channel activation, so a given excitatory (ACh) synaptic drive
    moves the cell less far toward firing threshold. The gain of the depolarising-input -> membrane-potential/excitability
    edge therefore FALLS as [Ca2+]o rises (membrane-stabilising action; hypercalcaemia -> hypoexcitability) and RISES in hypocalcaemia
    (latent tetany / Chvostek-Trousseau). This is a genuine multiplicative gain on the depolarising input, not an additive
    push on membrane potential.
  evidence: 'Base causal edge synaptic_acetylcholine_concentration -> postsynaptic_membrane_potential (+) already present
    in all_edges.json; modulator plasma_calcium already a node in all_nodes.json. Interaction (two-factor interventional cross-term):
    Martiszus, Tsintsadze, Chang & Smith, ''Enhanced excitability of cortical neurons in low-divalent solutions is primarily
    mediated by altered voltage-dependence of voltage-gated sodium channels'', eLife 2021;10:e67914 (VERIFIED via WebSearch,
    elifesciences.org/articles/67914; authors confirmed). Switching the bath from physiological to reduced extracellular divalent/Ca2+
    (a do() on [Ca2+]o) left-shifted Na+-channel V0.5, increasing channel availability and the efficacy of a given depolarisation
    -> enhanced excitability; thus the SLOPE of the depolarising-input -> firing relation changes with [Ca2+]o (the required
    gain cross-term). Foundation: Frankenhaeuser & Hodgkin 1957 (surface-charge screening). Textbook anchors: Guyton & Hall,
    Textbook of Medical Physiology (low plasma Ca2+ raises neuromuscular excitability -> tetany); Boron & Boulpaep, Medical
    Physiology (membrane potential / hypocalcaemic tetany). Sign: d(gain)/d([Ca2+]o) < 0 (membrane stabilisation), monotonic
    screening so can_flip_sign=false. [NB: first-order additive shadow (plasma_calcium -> postsynaptic_membrane_potential)
    is not currently in the causal graph, so only the second-order gain query is represented; sound (adds no node-level prediction).]'
  causal_evidence: perturbation
