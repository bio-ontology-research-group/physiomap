name: modulation_gains
description: DRAFT multiplicative (gain) MODULATION edges over core physiology — permissive / sensitizing effects where a
  node SCALES the strength of an existing causal edge (target = ... + k(modulator)*source). Multi-agent literature fan-out
  (propose + adversarial verify per gain domain), following George Gkoutoss T3 -> (sympathetic_tone -> heart_rate) template.
  Every modulated base edge already exists in the map; each gain carries interventional two-factor-do()/cross-term interaction
  evidence. Modulation edges sit in a PARALLEL layer (not in causal_subgraph) and change no node-level sign prediction — they
  only enable the gain-sensitivity query. See benchmarks/results/phenotype_connections.md.
nodes: []
causal_edges: []
modulation_edges:
- modulator: angiotensin_II
  influence_id: influence:baroreceptor_firing_rate:negative:sympathetic_tone
  sign: +
  can_flip_sign: true
  mechanism: 'Angiotensin II acts centrally (area postrema / rostral medulla, AT1-receptor mediated) to attenuate the maximum
    range and gain of the arterial baroreflex control of renal sympathetic nerve activity (RSNA): a given fall in baroreceptor
    afferent firing produces a smaller reflex disinhibition of sympathetic outflow. This scales the SLOPE (gain) of the existing
    inhibitory baroreceptor_firing_rate -> sympathetic_tone edge rather than adding to sympathetic_tone directly. Because
    the base coefficient is negative, blunting |gain| toward zero is a positive d(gain)/d(AngII). Route-dependent reversal
    (some central/intracerebroventricular protocols increase rather than blunt max gain) means the gain can in principle cross
    zero, so can_flip_sign is true.'
  evidence: 'Two-factor interventional infusion (verified). Sanderford & Bishop, ''Angiotensin II acutely attenuates range
    of arterial baroreflex control of renal sympathetic nerve activity'', Am J Physiol Heart Circ Physiol 279(4):H1804, 2000
    (PMID 11009467, verified): a 5-min IV do(AngII) infusion (10 and 20 ng/kg/min) in conscious rabbits, with the full baroreflex
    MAP->RSNA curve constructed, dose-dependently reduced the maximum RSNA observed at low MAP (i.e. reduced the range/slope
    of baroreceptor-firing -> sympathetic outflow), with a greater effect via the vertebral circulation implicating a CNS
    site of action -- a genuine do(AngII) change in baroreflex GAIN, not just baseline. Corroborated by central-mechanism
    follow-up, AJP-Heart 2002 (PMID 11959620, verified). Base causal edge baroreceptor_firing_rate -> sympathetic_tone (sign
    ''-'') exists in all_edges.json; modulator angiotensin_II exists in all_nodes.json. Textbook anchor: Guyton & Hall, baroreceptor
    reflex resetting by the renin-angiotensin system. [NB: first-order additive shadow (angiotensin_II -> sympathetic_tone)
    is not currently in the causal graph, so only the second-order gain query is represented; sound (adds no node-level prediction).]'
  causal_evidence: pharmacological
- modulator: arterial_pco2
  influence_id: influence:arterial_po2:positive:hemoglobin_o2_saturation
  sign: '-'
  can_flip_sign: false
  mechanism: 'Bohr effect (CO2 arm): CO2 (and the H+ generated from it by erythrocyte carbonic anhydrase) binds and stabilizes
    the deoxy/T-state of hemoglobin, lowering O2 affinity and right-shifting the oxyhemoglobin dissociation curve (P50 rises).
    At a fixed sub-saturating PaO2 on the steep part of the sigmoid, the right-shift reduces the local slope d(SaO2)/d(PaO2),
    so this is a genuine rescaling of the PaO2->SaO2 responsiveness, not an additive push. Cross-partial d2(SaO2)/d(PaO2)d(PaCO2)
    < 0.'
  evidence: 'Verified two-factor interventional measurement of the human SaO2-vs-PO2 dissociation curve with PCO2 set across
    20/40/60/80 mmHg (crossed with temperature): both the CO2-Bohr coefficient and the curve position/slope change with PCO2
    (P50 27.1 +/- 2.6 mmHg at 37C/40 mmHg, rising with PCO2), a measured CO2 x temperature interaction. The modulator is manipulated
    while the PaO2->SaO2 slope is read out. Woyke/Reinke et al., ''Effects of Carbon Dioxide and Temperature on the Oxygen-Hemoglobin
    Dissociation Curve of Human Blood'', Front. Med. 2021, doi:10.3389/fmed.2021.808025 (DOI confirmed via web). Textbook
    anchor: Boron & Boulpaep, Medical Physiology, Bohr effect. Base edge arterial_po2->hemoglobin_o2_saturation (+) exists;
    additive shadow edge arterial_pco2->hemoglobin_o2_saturation (-) present and sign-consistent.'
  causal_evidence: curated_mechanistic
- modulator: arterial_ph
  influence_id: influence:arterial_po2:positive:hemoglobin_o2_saturation
  sign: +
  can_flip_sign: false
  mechanism: 'Bohr effect (proton arm): raising pH (lowering H+) increases hemoglobin O2 affinity and left-shifts the dissociation
    curve (P50 falls). The left-shift moves the steep sigmoid region to lower PaO2, so at a fixed sub-saturating PaO2 the
    local slope d(SaO2)/d(PaO2) increases. Cross-partial d2(SaO2)/d(PaO2)d(pH) > 0. pH and PaCO2 are distinct map nodes; this
    is the separately-evidenced proton arm of the Bohr effect.'
  evidence: 'Direct ODC measurements: an acute ~0.1-unit pH change moves P50 by ~3 mmHg (Severinghaus standard relation),
    i.e. the SaO2-vs-PO2 slope at fixed PaO2 shifts with pH (left-shift on alkalinization). The H+/CO2 dependence of the measured
    curve is documented in Woyke/Reinke et al., Front. Med. 2021, doi:10.3389/fmed.2021.808025 (DOI confirmed via web). Textbook
    anchor: Boron & Boulpaep, Medical Physiology, Bohr effect. Base edge arterial_po2->hemoglobin_o2_saturation (+) exists;
    additive shadow edge arterial_ph->hemoglobin_o2_saturation (+) present and sign-consistent.'
  causal_evidence: curated_mechanistic
- modulator: core_temperature
  influence_id: influence:arterial_po2:positive:hemoglobin_o2_saturation
  sign: '-'
  can_flip_sign: false
  mechanism: O2-Hb binding is exothermic, so raising temperature shifts the equilibrium toward deoxy-Hb, lowering O2 affinity
    and right-shifting the dissociation curve (P50 rises). At a fixed sub-saturating PaO2, the right-shift reduces the local
    slope d(SaO2)/d(PaO2), rescaling the PaO2->SaO2 responsiveness. Cross-partial d2(SaO2)/d(PaO2)d(temperature) < 0.
  evidence: 'Verified two-factor interventional measurement of the human SaO2-vs-PO2 dissociation curve at 13.7/23/30/37/42
    C (crossed with PCO2): increasing temperature produces a significant rightward shift (P50 increase), i.e. the PaO2->SaO2
    slope changes with temperature, with a measured temperature x PCO2 interaction term. The modulator is set while the curve
    is read out. Woyke/Reinke et al., Front. Med. 2021, doi:10.3389/fmed.2021.808025 (DOI confirmed via web). Textbook anchor:
    Guyton & Hall, Textbook of Medical Physiology (temperature shift of the ODC). Base edge arterial_po2->hemoglobin_o2_saturation
    (+) exists; additive shadow edge core_temperature->hemoglobin_o2_saturation (-) present and sign-consistent.'
  causal_evidence: curated_mechanistic
