    disposition -> induction of gluconeogenic enzyme machinery (PEPCK/G6Pase), maintenance of glucagon-cAMP-PKA-CREB coupling,
    and supply of gluconeogenic precursors -> a given plasma glucagon level produces a larger hepatic glucose output. Scales
    the gain of the glucagon -> hepatic_glucose_production edge.'
  evidence: 'Base edge plasma_glucagon -> hepatic_glucose_production (+) confirmed present in all_edges.json; cortisol, plasma_glucagon,
