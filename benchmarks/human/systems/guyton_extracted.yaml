    and systemic arterial baroreceptors”'
  causal_evidence: curated_mechanistic
- source: capillary_permeability
  target: blood_volume
  sign: '-'
  mechanism: raised microvascular permeability raises the transudation disposition so fluid leaves plasma into tissues,
