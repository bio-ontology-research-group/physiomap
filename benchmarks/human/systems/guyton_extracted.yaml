causal_edges:
- source: afferent_arteriolar_resistance
  target: glomerular_hydrostatic_pressure
  sign: '-'
  mechanism: afferent constriction increases upstream resistance, dropping pressure delivered to the glomerular
    capillaries
  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.26 (Urine Formation by the Kidneys: I. Glomerular Filtration,
    Renal Blood Flow, and Their Control) §Increased Glomerular Capillary Hydrostatic Pressure Increases GFR: “Increased
    resistance of afferent arterioles reduces glomerular hydrostatic pressure and decreases GFR.”'
  causal_evidence: curated_mechanistic
- source: afferent_arteriolar_resistance
  target: renal_blood_flow
  sign: '-'
  mechanism: increased segmental vascular resistance reduces flow at fixed renal artery-vein pressure gradient
  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.26 (Urine Formation by the Kidneys: I. Glomerular Filtration,
    Renal Blood Flow, and Their Control) §Determinants of Renal Blood Flow: “An increase in the resistance of any
    of the vascular segments of the kidneys tends to reduce the renal blood flow”'
  causal_evidence: curated_mechanistic
- source: aldosterone
  target: arterial_ph
  sign: +
  mechanism: aldosterone drives tubular H+ secretion in intercalated cells, lowering ECF hydrogen ion concentration
    (raising pH)
  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.77 (Adrenocortical Hormones) §Excess Aldosterone Increases
    Tubular Hydrogen Ion Secretion: “Aldosterone ... causes secretion of hydrogen ions in exchange for sodium ...
    This decreases the hydrogen ion concentration in the extracellular fluid, causing a mild degree of alkalosis.”'
  causal_evidence: curated_mechanistic
- source: aldosterone
  target: renal_hydrogen_secretion
  sign: +
  mechanism: aldosterone stimulates H+ secretion by intercalated cells of the collecting duct, increasing bicarbonate
    added to blood
  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.30 (Regulation of Acid-Base Balance) §Regulation of
    Renal Tubular Hydrogen Ion Secretion: “Aldosterone stimulates the secretion of H+ by the intercalated cells
    of the collecting duct.”'
  causal_evidence: curated_mechanistic
- source: alveolar_air_pressure
  target: pulmonary_perfusion
  sign: '-'
  mechanism: alveolar air pressure compresses alveolar-wall capillaries from outside; when it exceeds capillary
    pressure the capillaries close and flow ceases
  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.38 (Pulmonary Circulation, Pulmonary Edema, Pleural
    Fluid) §Zones 1, 2, and 3 of Pulmonary Blood Flow: “any time the lung alveolar air pressure becomes greater
    than the capillary blood pressure, the capillaries close and there is no blood flow”'
  causal_evidence: curated_mechanistic
- source: angiotensin_II
  target: efferent_arteriolar_resistance
  sign: +
  mechanism: angiotensin II preferentially constricts the efferent arteriolar smooth muscle, raising efferent resistance
  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.26 (Urine Formation by the Kidneys: I. Glomerular Filtration,
    Renal Blood Flow, and Their Control) §Angiotensin II Constricts Efferent Arterioles: “Because angiotensin II
    preferentially constricts efferent arterioles, increased angiotensin II levels raise glomerular hydrostatic
    pressure while reducing renal blood flow.”'
  causal_evidence: curated_mechanistic
- source: angiotensin_II
  target: renal_hydrogen_secretion
  sign: +
  mechanism: angiotensin II directly stimulates the Na+-H+ exchanger in the renal tubules, raising H+ secretion
    and HCO3- reabsorption
  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.30 (Regulation of Acid-Base Balance) §Regulation of
    Renal Tubular Hydrogen Ion Secretion: “increased angiotensin II levels, which directly stimulate the activity
    of the Na+-H+ exchanger in the renal tubules”'
  causal_evidence: curated_mechanistic
- source: arterial_pco2
  target: renal_hydrogen_secretion
  sign: +
  mechanism: raised tubular-cell PCO2 increases intracellular H+ formation via carbonic anhydrase, driving the Na+-H+
    exchanger
  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.30 (Regulation of Acid-Base Balance) §Regulation of
    Renal Tubular Hydrogen Ion Secretion: “The increased PCO2 raises the PCO2 of the tubular cells, causing increased
    formation of H+ in the tubular cells, which in turn stimulates the secretion of H+.”'
  causal_evidence: curated_mechanistic
- source: arterial_pco2
  target: total_peripheral_resistance
  sign: '?'
  mechanism: CO2 directly dilates most tissue arterioles but, via the brain vasomotor center and sympathetic system,
    drives widespread vasoconstriction; net systemic sign is ambiguous
  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.17 (Local and Humoral Control of Blood Flow by the Tissues)
    §Vascular Control by Ions and Other Chemical Factors: “An increase in carbon dioxide concentration causes moderate
    vasodilation in most tissues ... acting on the brain vasomotor center, has an extremely powerful indirect effect
    ... to cause widespread vasoconstriction.” [degraded to ? in adversarial verification: Ch17: CO2 moderately
    dilates local tissues but drives powerful CNS-sympathetic v]'
  causal_evidence: curated_mechanistic
- source: arterial_ph
  target: renal_hydrogen_secretion
  sign: '-'
  mechanism: raised extracellular H+ (lowered pH) directly stimulates tubular H+ secretion; the tubular cells reduce
    secretion when pH rises
  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.30 (Regulation of Acid-Base Balance) §Regulation of
    Renal Tubular Hydrogen Ion Secretion: “The tubular cells usually respond to a decrease in H+ concentration (alkalosis)
    by reducing H+ secretion.”'
  causal_evidence: curated_mechanistic
- source: arterial_ph
  target: renal_tubular_ammonia_secretion
  sign: '-'
  mechanism: raised extracellular H+ (lowered pH) stimulates renal glutamine metabolism, increasing NH4+ formation
    and new HCO3-
  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.30 (Regulation of Acid-Base Balance) §Chronic Acidosis
    Increases NH4+ Excretion: “An increase in extracellular fluid H+ concentration stimulates renal glutamine metabolism
    and, therefore, increases the formation of NH4+”'
  causal_evidence: curated_mechanistic
- source: arterial_ph
  target: total_peripheral_resistance
  sign: +
  mechanism: lower pH (raised hydrogen ion) relaxes arteriolar smooth muscle; raising pH (lowering H+) conversely
    constricts arterioles, raising resistance
  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.17 (Local and Humoral Control of Blood Flow by the Tissues)
    §Vascular Control by Ions and Other Chemical Factors: “An increase in hydrogen ion concentration (decrease in
    pH) causes dilation of the arterioles. Conversely, slight decrease in hydrogen ion concentration causes arteriolar
    constriction.”'
  causal_evidence: curated_mechanistic
- source: blood_colloidal_osmotic_pressure
  target: glomerular_colloid_osmotic_pressure
  sign: +
  mechanism: higher arterial plasma colloid osmotic pressure enters the glomerular capillaries and raises their
    colloid osmotic pressure
  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.26 (Urine Formation by the Kidneys: I. Glomerular Filtration,
    Renal Blood Flow, and Their Control) §Increased Glomerular Capillary Colloid Osmotic Pressure Decreases GFR:
    “Increasing the arterial plasma colloid osmotic pressure raises the glomerular capillary colloid osmotic pressure”'
  causal_evidence: curated_mechanistic
- source: blood_volume
  target: adh
  sign: '-'
  mechanism: low-pressure cardiopulmonary/atrial stretch receptors sense reduced blood volume and, via vagal/glossopharyngeal
