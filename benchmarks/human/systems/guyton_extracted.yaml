  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.28 (Regulation of Extracellular Fluid Osmolarity and
    Sodium Concentration) §Cardiovascular Reflex Stimulation of ADH Release by Decreased Arterial Pressure and/or
    Decreased Blood Volume: “Whenever blood pressure and blood volume are reduced, such as occurs during hemorrhage,
    increased ADH secretion causes increased fluid reabsorption by the kidneys”'
  causal_evidence: curated_mechanistic
- source: blood_volume
  target: water_intake
  sign: '-'
  mechanism: reduced blood volume unloads cardiopulmonary and systemic arterial baroreceptors, whose afferent input
