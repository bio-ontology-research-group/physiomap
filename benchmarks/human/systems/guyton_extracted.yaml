  evidence: 'Guyton & Hall, Medical Physiology, 11th ed. Ch.25 (The Body Fluid Compartments: Extracellular and Intracellular
    Fluids; Interstitial Fluid and Edema) §Factors That Can Increase Capillary Filtration: “Kf is the capillary
    filtration coefficient (the product of the permeability and surface area of the capillaries) ... Increased capillary
    filtration coefficient.”'
  causal_evidence: curated_mechanistic
- source: cardiac_muscle_metabolic_rate
  target: coronary_blood_flow
  sign: +
  mechanism: raised myocardial metabolic/O2-demand lowers local cardiac O2, releasing adenosine and other vasodilators
