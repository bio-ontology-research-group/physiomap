# =============================================================================
# Cerebrospinal-fluid (CSF) analyte markers  — PhysioMap fragment
#                                              *** DRAFT FOR REVIEW ***
# =============================================================================
# Coverage target: the HPO directional "Abnormal CSF <analyte> concentration/level"
# gap terms (theme = csf_markers). Each such HPO term denotes the CONCENTRATION (or
# protein/amount) of a defined substance in cerebrospinal fluid, with a direction
# (Increased/Elevated/High/Hyper- => "+"; Decreased/Reduced/Low/Hypo- => "-").
#
# MODELLING DECISION
# ------------------
# A CSF analyte is a measurable physiological quantity = an (entity, PATO quality)
# variable in the cerebrospinal-fluid compartment. CSF is a body fluid that bathes
# the CNS; in PhysioMap terms each analyte is a fluid-compartment CONCENTRATION node.
# These are biomarkers read out clinically (lumbar puncture); they sit at the
# ORGAN_SYSTEM scale (the CSF / central-nervous-fluid compartment), exactly as
# plasma/serum analytes are organ_system in the existing corpus.
#
# This is a deliberately SELF-CONTAINED ISLAND fragment: it adds grounded
# CONCENTRATION nodes (each abstains safely — a grounded node with no edges is
# valuable) and a SMALL number of WITHIN-CSF causal edges only where a cited
# enzymatic/precursor-product mechanism gives a defensible sign. CSF analyte levels
# are downstream readouts of CNS / blood-CSF-barrier metabolism that the current
# corpus does not yet model, so we do NOT fabricate edges to existing systemic
# nodes. validate_fragment will WARN "island; will not integrate" (NOT an error).
#
# ENTITY IRIs: verified by grepping ontology/.obo_cache/{CHEBI,PR}.obo for an exact
# `name:` (or exact synonym) match. Where no exact class matched, entity_iri is left
# OUT (null) rather than fabricated. Small molecules -> CHEBI; proteins -> PR.
#
# PATO qualities: concentration PATO:0000033 (substance-in-fluid level). The protein
# "concentration" terms also use PATO:0000033 (mass-per-volume concentration).
#
# Provenance for the physiology / sign logic:
#   - Lehninger Principles of Biochemistry (amino-acid, purine/pyrimidine, folate,
#     pterin, creatine, one-carbon, neurotransmitter biosynthesis).
#   - Blau, Duran, Gibson, Dionisi-Vici (eds.), "Physician's Guide to the Diagnosis,
#     Treatment, and Follow-Up of Inherited Metabolic Diseases" (Springer) — the
#     standard reference for CSF neurotransmitter-metabolite & pterin patterns.
#   - Harrison's Principles of Internal Medicine ("CSF analysis"; neurodegeneration
#     biomarkers; CNS infection — hypoglycorrhachia / elevated CSF protein/lactate).
#   - Boron & Boulpaep Medical Physiology (CSF formation, blood-CSF barrier).
#   - HPO (human-phenotype-ontology) term definitions for each marker.
# Disorders these markers come from (cited for context, NOT encoded as nodes):
#   AADC deficiency (DDC; OMIM 608643), tyrosine hydroxylase deficiency (TH; 605407),
#   BH4-synthesis defects (GCH1/PTS/QDPR/SPR), cerebral folate deficiency (FOLR1),
#   D-2-hydroxyglutaric aciduria (D2HGDH/IDH2; 600721), nonketotic hyperglycinemia
#   (GLDC/AMT; 605899), GABA-transaminase deficiency (ABAT; 613163), Canavan disease
#   (ASPA; 271900 — elevated NAA), Alzheimer disease (low CSF Abeta42, high t-tau),
#   Creutzfeldt-Jakob (14-3-3+), maple-syrup-urine disease (alloisoleucine+),
#   urea-cycle / hyperammonemia, neurosarcoidosis (CSF ACE+), CNS infection.
# =============================================================================

name: hpo_csf_markers
description: >-
  DRAFT cerebrospinal-fluid (CSF) analyte markers as PhysioMap concentration/amount
  nodes (ORGAN_SYSTEM scale: the CSF compartment). Covers the HPO directional
  "Abnormal CSF <analyte> level" gap terms — neurotransmitter metabolites (HVA, 5-HIAA,
  dopamine, DOPA, MHPG-aldehyde, epinephrine, metanephrine), pterins (biopterin, BH4,
  BH2, neopterin, sepiapterin), amino acids and their derivatives, purine/pyrimidine
