causal_edges:
  # Only edges whose sign follows from a cited within-CSF precursor->product or
  # neighbouring-metabolite mechanism. CSF metabolite levels reflect CNS pool
  # turnover; the blood-CSF barrier and CNS enzymology are not modelled here, so we
  # keep edges minimal and defensible (prefer abstention).

  # --- BH4 / pterin pathway (sepiapterin -> BH2 -> BH4; BH4 is cofactor for the
  #     aromatic-amino-acid hydroxylases) ---
  - source: csf_sepiapterin
    target: csf_dihydrobiopterin
    sign: "+"
    mechanism: sepiapterin is reduced by sepiapterin reductase / aldo-keto reductases to 7,8-dihydrobiopterin (BH2) in the salvage pathway; a larger sepiapterin pool feeds more BH2 (product formation)
    evidence: "Lehninger Principles of Biochemistry (tetrahydrobiopterin biosynthesis & salvage); Blau et al., Physician's Guide to Inherited Metabolic Diseases (sepiapterin-reductase deficiency: raised CSF sepiapterin and BH2, low BH4)"
  - source: csf_dihydrobiopterin
    target: csf_tetrahydrobiopterin
    sign: "+"
    mechanism: 7,8-dihydrobiopterin (BH2) is reduced to tetrahydrobiopterin (BH4) by dihydrofolate reductase / dihydropteridine reductase; more substrate (BH2) supports more BH4 regeneration (product formation, salvage limb)
    evidence: "Lehninger Principles of Biochemistry (BH4 regeneration by dihydropteridine reductase, QDPR); Blau et al., Physician's Guide to Inherited Metabolic Diseases (BH4 salvage)"

  # --- BH4 is the obligatory cofactor for tyrosine hydroxylase (DOPA synthesis) and
  #     tryptophan hydroxylase (serotonin -> 5-HIAA): more BH4 -> more monoamine
  #     synthesis -> higher HVA / 5-HIAA. (BH4 deficiency lowers HVA & 5-HIAA.) ---
  - source: csf_tetrahydrobiopterin
    target: csf_dopa
    sign: "+"
    mechanism: BH4 is the obligatory cofactor of tyrosine hydroxylase, the rate-limiting step converting tyrosine to L-DOPA; reduced BH4 lowers DOPA/dopamine synthesis (BH4-deficiency states show low CSF HVA)
    evidence: "Lehninger Principles of Biochemistry (tyrosine hydroxylase requires BH4); Blau et al., Physician's Guide to Inherited Metabolic Diseases (BH4-synthesis defects: low CSF HVA and 5-HIAA)"
  - source: csf_tetrahydrobiopterin
    target: csf_homovanillic_acid
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: BH4 cofactor drives tyrosine-hydroxylase dopamine synthesis; homovanillic acid is the terminal dopamine catabolite, so dopaminergic synthesis sets the HVA pool (BH4 deficiency -> low CSF HVA)
    evidence: "Blau et al., Physician's Guide to Inherited Metabolic Diseases (CSF HVA reflects central dopamine turnover; reduced in BH4 and TH/AADC defects); Lehninger (dopamine catabolism to HVA via MAO/COMT)"
  - source: csf_tetrahydrobiopterin
    target: csf_5hiaa
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: BH4 is also cofactor for tryptophan hydroxylase (serotonin synthesis); 5-HIAA is the terminal serotonin catabolite, so reduced BH4 lowers CSF 5-HIAA (serotonergic turnover marker)
    evidence: "Blau et al., Physician's Guide to Inherited Metabolic Diseases (CSF 5-HIAA reflects central serotonin turnover; low in BH4 defects); Lehninger (tryptophan hydroxylase requires BH4)"

  # --- dopamine synthesis/catabolism axis: DOPA -> dopamine -> HVA ---
  - source: csf_dopa
    target: csf_dopamine
    sign: "+"
    mechanism: L-DOPA is decarboxylated to dopamine by aromatic-L-amino-acid decarboxylase (AADC); more DOPA supports more dopamine (product formation). In AADC deficiency DOPA accumulates while dopamine/HVA fall (separate AADC lesion), so this edge is the substrate-supply limb only
    evidence: "Lehninger Principles of Biochemistry (catecholamine biosynthesis: DOPA -> dopamine by AADC); Blau et al., Physician's Guide to Inherited Metabolic Diseases (catecholamine pathway)"
  - source: csf_dopamine
    target: csf_homovanillic_acid
    sign: "+"
    mechanism: homovanillic acid is the principal end-metabolite of dopamine (via MAO + COMT); the size of the dopamine pool that is turned over sets the HVA level
    evidence: "Lehninger Principles of Biochemistry (dopamine catabolism by MAO/COMT to HVA); Blau et al., Physician's Guide to Inherited Metabolic Diseases (CSF HVA as dopamine-turnover marker)"

  # --- serotonin metabolite from tryptophan precursor ---
  - source: csf_tryptophan
    target: csf_5hiaa
    sign: "+"
    mechanism: tryptophan is the precursor of serotonin (via tryptophan hydroxylase + AADC); 5-HIAA is serotonin's terminal catabolite, so greater precursor supply raises serotonergic turnover and CSF 5-HIAA
    evidence: "Lehninger Principles of Biochemistry (serotonin biosynthesis from tryptophan; catabolism to 5-HIAA); Blau et al., Physician's Guide to Inherited Metabolic Diseases"

  # --- creatine synthesis: guanidinoacetate -> creatine -> creatinine ---
  - source: csf_guanidinoacetate
    target: csf_creatine
    sign: "+"
    mechanism: guanidinoacetate is methylated by GAMT to creatine; more guanidinoacetate substrate supports more creatine (product). In GAMT deficiency guanidinoacetate accumulates and creatine falls (separate GAMT lesion); this edge is the substrate-supply limb
    evidence: "Lehninger Principles of Biochemistry (creatine biosynthesis: AGAT then GAMT); Blau et al., Physician's Guide to Inherited Metabolic Diseases (cerebral creatine-deficiency syndromes: GAMT, AGAT)"
  - source: csf_creatine
    target: csf_creatinine
    sign: "+"
    mechanism: creatinine is formed non-enzymatically from the creatine/phosphocreatine pool at a rate proportional to that pool; a larger creatine pool yields more creatinine
    evidence: "Lehninger Principles of Biochemistry (creatine -> creatinine non-enzymatic conversion); Boron & Boulpaep Medical Physiology (creatinine as the creatine-pool turnover product)"

constitutive_edges: []   # none — single-scale CSF-compartment fragment (Phase 1)
