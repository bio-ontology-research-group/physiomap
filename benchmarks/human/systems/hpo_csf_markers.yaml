  14-3-3, NfL, GFAP, MBP, CHI3L1, chitotriosidase, ACE, ApoB, albumin, total protein).
  Self-contained island fragment; nodes abstain unless a cited within-CSF
  precursor->product mechanism fixes an edge sign. DRAFT for domain review.

