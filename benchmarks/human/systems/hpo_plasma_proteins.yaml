# =============================================================================
# Plasma / circulating protein analytes  — PhysioMap fragment  *** DRAFT FOR REVIEW ***
# =============================================================================
# Purpose: provide PhysioMap NODES (grounded variables) for the HPO directional
# "abnormal circulating/secreted protein concentration (or activity)" terms in the
# plasma_proteins theme, so the HPO forward/backward benchmark can map each term to a
# physiological variable + a PATO direction. This is predominantly an *ISLAND* fragment
# (mostly grounded nodes with NO causal edges) — by PhysioMap policy a grounded node
# with no defensible cited mechanism is valuable and safe (it abstains under the solver),
# and is strongly preferred over a fabricated edge.  ROBERT: please correct nodes/IRIs.
#
# Provenance / textbooks consulted for each analyte's identity and biology:
#   - Burtis & Ashwood, Tietz Textbook of Clinical Chemistry & Molecular Diagnostics
#     (serum protein electrophoresis: albumin / alpha-1 / alpha-2 / beta / gamma fractions;
#      acute-phase reactants; tumor markers).
#   - Harrison's Principles of Internal Medicine (acute-phase response, tumor markers,
#     nephrotic syndrome / protein-losing enteropathy, alpha-1-antitrypsin deficiency).
#   - Boron & Boulpaep Medical Physiology (plasma protein synthesis, oncotic pressure,
#     thyroid/steroid transport proteins).
#   - Williams Textbook of Endocrinology (TBG, CBG, SHBG, thyroglobulin, IGFALS/IGF axis).
#   - Lehninger Principles of Biochemistry (enzyme/transport-protein roles).
#
# IRI policy: protein analytes grounded in PRO (PR:) where an exact OBO 'name:'/'synonym:'
# match was verified against ontology/.obo_cache/PR.obo; small molecules in CHEBI; protein
# complexes in GO. Where no exact verified class exists (e.g. "total globulin",
# "alpha-globulin fraction", "tenascin-C" — PRO has only the 'tenascin' family class),
# entity_iri is left NULL rather than fabricated. PATO: concentration = PATO:0000033,
# catalytic/enzyme activity = PATO:0001414.
#
# EXISTING corpus nodes reused (NOT redefined here): plasma_albumin (CHEBI:166964) and
# c_reactive_protein (PR:000005991) — the albumin (HP:0003073 / HP:0012117) and CRP
# (HP:0032437) terms map onto those existing nodes; they are NOT in this file's `nodes`.
#
# Single-scale: organ_system for plasma/serum/fecal analyte concentrations; cellular for
# the one enzyme-ACTIVITY analyte (carboxypeptidase N activity), with a bearer_entity_iri.
# =============================================================================

name: hpo_plasma_proteins
description: >-
  DRAFT PhysioMap nodes for circulating / secreted / fecal protein analytes referenced by
  HPO abnormal-concentration (and one abnormal-activity) terms in the plasma_proteins theme:
  alpha-fetoprotein, haptoglobin, beta-2-microglobulin, transthyretin/prealbumin, the serum
  protein-electrophoresis globulin fractions (total + alpha), calprotectin (plasma + fecal),
  CEA, serum amyloid A, retinol-binding protein, thyroglobulin, thyroxine-binding globulin,
  CA-125, surfactant protein, procalcitonin, IGFALS, fecal alpha-1-antitrypsin, plasma
  alpha-1-antitrypsin, corticosteroid-binding globulin, progranulin, fetuin A, ACE, CHI3L1,
  DNAJB9, E-selectin, COMP, hyaluronic acid, neuron-specific enolase, pancreatic secretory
  trypsin inhibitor, sCD163, tenascin-C, trypsinogen, PSA, galectin-3, superoxide dismutase,
  fibronectin, MMP-2, SHBG, and carboxypeptidase N activity. Mostly a grounded ISLAND
  (no fabricated edges). Single-scale (organ_system / cellular), Phase 1, DRAFT for review.

