# =============================================================================
# Purine & pyrimidine metabolism — HPO biochemical-marker fragment
#                                    — PhysioMap fragment  *** DRAFT FOR REVIEW ***
# =============================================================================
# Hand-encoded coverage of the directional HPO "abnormal purine/pyrimidine metabolite
# / enzyme activity" terms. Most nodes are biofluid metabolite POOLS (plasma/serum,
# urine, CSF; scale organ_system) or enzyme ACTIVITY roots (scale cellular/organ with
# a bearer cell/organ). Each node is a physiological VARIABLE = (entity, PATO quality).
#
# Physiology / provenance (textbooks + databases):
#   - Lehninger Principles of Biochemistry (Nelson & Cox), "Nucleotide metabolism":
#     PURINE catabolism  AMP/IMP -> inosine -> hypoxanthine -(XDH)-> xanthine
#       -(XDH)-> urate -(urate oxidase, absent in humans)-> allantoin; GMP -> guanosine
#       -> guanine -> xanthine. dAMP -> deoxyadenosine; dGMP -> deoxyguanosine.
#     PYRIMIDINE catabolism  uracil -(DPYD)-> 5,6-dihydrouracil -(DPYS/dihydropyrimidinase)
#       -> N-carbamoyl-beta-alanine (= 3-ureidopropionate) -(UPB1/beta-ureidopropionase)
#       -> beta-alanine; thymine -(DPYD)-> 5,6-dihydrothymine -(DPYS)->
#       N-carbamoyl-beta-aminoisobutyrate (= 3-ureidoisobutyrate) -(UPB1)->
#       beta-aminoisobutyrate. De-novo pyrimidine: orotate -> OMP -(UMPS, orotidine-5'-P
#       decarboxylase)-> UMP.
#   - Harrison's Principles of Internal Medicine, inborn errors of purine/pyrimidine
#     metabolism; OMIM gene-disease entries (cited per enzyme below).
#   - HMDB / KEGG for biofluid metabolite identities; CHEBI for the chemical IRIs.
#
# DISORDERS this fragment is built to reproduce (the sign of the marker change):
#   - DPD deficiency (DPYD LoF; OMIM 274270): dihydropyrimidine_dehydrogenase_activity
#       DOWN -> plasma/urinary uracil & thymine UP (substrate accumulation).
#   - Dihydropyrimidinase deficiency (DPYS LoF; OMIM 222748): dihydrouracil &
#       dihydrothymine UP.
#   - Beta-ureidopropionase deficiency (UPB1 LoF; OMIM 613161): N-carbamoyl-beta-alanine
#       & N-carbamoyl-beta-aminoisobutyrate (ureidopropionate / ureidoisobutyrate) UP.
#   - Xanthinuria (XDH LoF; OMIM 278300 / molybdenum-cofactor): plasma & urinary
#       xanthine/hypoxanthine UP, urate DOWN; type II also AOX deficiency.
#   - MNGIE (TYMP LoF; OMIM 603041): thymidine_phosphorylase_activity DOWN ->
#       plasma & urinary thymidine & deoxyuridine UP.
#   - ADA deficiency (SCID; OMIM 102700) / ADA2 deficiency (DADA2; OMIM 615688):
#       adenosine_deaminase / ada2 activity DOWN; deoxyadenosine UP.
#   - PRPS1 superactivity (OMIM 300661, gout) vs deficiency (Arts/CMTX5; OMIM 311070):
#       prpp_synthetase_activity UP / DOWN.
#   - APRT deficiency (OMIM 614723): 2,8-dihydroxyadenine UP (DHA urolithiasis).
#   - ADSL (adenylosuccinate lyase) deficiency (OMIM 103050): urinary succinyladenosine
#       (SAdo) & SAICA-riboside UP.
#   - AICA-ribosiduria (ATIC LoF; OMIM 608688): urinary AICA-riboside (AICAR) UP.
#   - Hereditary orotic aciduria (UMPS LoF; OMIM 258900).
#   - P5N-1 / NT5C3A deficiency (OMIM 266120, hemolytic anemia), AK1, ITPA, AMPD1
#     (myoadenylate deaminase deficiency, OMIM 102770) enzyme-activity roots.
#
# Sign discipline: more enzyme activity => LESS substrate ("-" enzyme->substrate) and
#   MORE product ("+" enzyme->product). Edges added ONLY for the linear catabolic
#   chains above where BOTH metabolite nodes and the enzyme node are in this fragment;
#   biofluid pools (plasma/urine/CSF) of the SAME metabolite are NOT linked by a
#   fabricated transport edge (renal handling sign is context-dependent) — they are
#   left as independent groundable pools.
#
# Boundary refs to EXISTING corpus nodes:
#   - plasma_xanthine            (existing: "plasma xanthine (and hypoxanthine) conc")
#   - xanthine_oxidase_activity  (existing: "xanthine oxidoreductase (XDH/XO)")
# Most nodes have no defensible edge into the corpus -> this is largely an ISLAND
# fragment (validate_fragment WARNs "island", not an error). A grounded node with no
# edge is valuable: it abstains correctly. Phase 1.
# =============================================================================

name: hpo_purine_pyrimidine
description: >-
  DRAFT purine and pyrimidine catabolite/biofluid-marker and enzyme-activity fragment
  for HPO monogenic-phenotype coverage. Encodes plasma/serum, urinary and CSF pools of
  purine (xanthine, hypoxanthine, inosine, guanosine, deoxyadenosine, allantoin,
  2,8-dihydroxyadenine, succinyladenosine, AICA-riboside, SAICA-riboside, oxoguanosine)
  and pyrimidine (uracil, thymine, dihydrouracil, dihydrothymine, ureidopropionate /
  N-carbamoyl-beta-alanine, ureidoisobutyrate / N-carbamoyl-beta-aminoisobutyrate,
  uridine, cytidine, thymidine, deoxyuridine, 5-hydroxymethyluracil) metabolites, plus
  the enzyme-activity roots whose LoF/GoF drive them (DPYD, DPYS, UPB1, XDH/XO, AOX,
  TYMP, ADA, ADA2, PRPS1, APRT, ATIC, UMPS, NT5C, P5N, AK1, ITPA, AMPD1). Signed edges
  added only along the established linear catabolic chains. Single-scale pools +
  cellular/organ enzyme roots. Phase 1, DRAFT for domain review.

