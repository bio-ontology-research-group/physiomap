causal_edges:
  # ---- pyrimidine catabolic chain: uracil -(DPYD)-> dihydrouracil -(DPYS)->
  #      N-carbamoyl-beta-alanine -(UPB1)-> beta-alanine  (Lehninger, Nucleotide metab) ----
  - source: dihydropyrimidine_dehydrogenase_activity
    target: plasma_uracil
    sign: "-"
    mechanism: DPYD reduces uracil to 5,6-dihydrouracil; more DPYD consumes more uracil substrate.
    evidence: "Lehninger Principles of Biochemistry (Nelson & Cox), Nucleotide metabolism; OMIM 274270 (DPD deficiency: uracil/thymine accumulate)"
    causal_evidence: genetic_lof_gof
  - source: dihydropyrimidine_dehydrogenase_activity
    target: plasma_thymine
    sign: "-"
    mechanism: DPYD reduces thymine to 5,6-dihydrothymine; more DPYD consumes more thymine.
    evidence: "Lehninger, Nucleotide metabolism; OMIM 274270"
    causal_evidence: genetic_lof_gof
  - source: dihydropyrimidine_dehydrogenase_activity
    target: plasma_dihydrouracil
    sign: "+"
    mechanism: 5,6-dihydrouracil is the DPYD product from uracil.
    evidence: "Lehninger, Nucleotide metabolism; van Kuilenburg, Biochim Biophys Acta 2006 (DPD)"
    causal_evidence: genetic_lof_gof
  - source: dihydropyrimidine_dehydrogenase_activity
    target: plasma_dihydrothymine
    sign: "+"
    mechanism: 5,6-dihydrothymine is the DPYD product from thymine.
    evidence: "Lehninger, Nucleotide metabolism"
  - source: dihydropyrimidinase_activity
    target: plasma_dihydrouracil
    sign: "-"
    mechanism: DPYS hydrolyses 5,6-dihydrouracil; more DPYS consumes more dihydrouracil substrate.
    evidence: "Lehninger, Nucleotide metabolism; OMIM 222748 (dihydropyrimidinase deficiency: dihydrouracil/dihydrothymine accumulate)"
    causal_evidence: genetic_lof_gof
  - source: dihydropyrimidinase_activity
    target: plasma_dihydrothymine
    sign: "-"
    mechanism: DPYS hydrolyses 5,6-dihydrothymine substrate.
    evidence: "Lehninger; OMIM 222748"
    causal_evidence: genetic_lof_gof
  - source: dihydropyrimidinase_activity
    target: plasma_n_carbamyl_beta_alanine
    sign: "+"
    mechanism: N-carbamoyl-beta-alanine (ureidopropionate) is the DPYS ring-opening product of dihydrouracil.
    evidence: "Lehninger, Nucleotide metabolism"
  - source: dihydropyrimidinase_activity
    target: plasma_n_carbamyl_beta_aminoisobutyrate
    sign: "+"
    mechanism: N-carbamoyl-beta-aminoisobutyrate (ureidoisobutyrate) is the DPYS product of dihydrothymine.
    evidence: "Lehninger, Nucleotide metabolism"
  - source: beta_ureidopropionase_activity
    target: plasma_n_carbamyl_beta_alanine
    sign: "-"
    mechanism: UPB1 hydrolyses N-carbamoyl-beta-alanine to beta-alanine; more UPB1 consumes more substrate.
    evidence: "Lehninger, Nucleotide metabolism; OMIM 613161 (beta-ureidopropionase deficiency: ureidopropionate accumulates)"
    causal_evidence: genetic_lof_gof
  - source: beta_ureidopropionase_activity
    target: plasma_n_carbamyl_beta_aminoisobutyrate
    sign: "-"
    mechanism: UPB1 hydrolyses N-carbamoyl-beta-aminoisobutyrate to beta-aminoisobutyrate.
    evidence: "Lehninger; OMIM 613161"
    causal_evidence: genetic_lof_gof

  # ---- purine: hypoxanthine/xanthine handled by XDH (existing corpus nodes) ----
  - source: xanthine_oxidase_activity
    target: plasma_xanthine
    sign: "-"
    mechanism: XDH oxidises hypoxanthine->xanthine->urate; loss of XDH causes xanthine/hypoxanthine accumulation (xanthinuria).
    evidence: "Harrison's Principles of Internal Medicine, purine metabolism disorders; OMIM 278300 (xanthinuria type I, XDH)"

  # ---- thymidine phosphorylase (MNGIE): TYMP degrades thymidine & deoxyuridine ----
  - source: thymidine_phosphorylase_activity
    target: plasma_thymidine
    sign: "-"
    mechanism: TYMP phosphorolyses thymidine to thymine; loss of TYMP raises plasma thymidine (MNGIE).
    evidence: "Nishino et al., Science 1999 (MNGIE = TYMP deficiency); OMIM 603041"
    causal_evidence: genetic_lof_gof
  - source: thymidine_phosphorylase_activity
    target: plasma_deoxyuridine
    sign: "-"
    mechanism: TYMP also phosphorolyses 2'-deoxyuridine; loss raises plasma deoxyuridine (MNGIE).
    evidence: "Nishino et al., Science 1999; OMIM 603041"
    causal_evidence: genetic_lof_gof
  - source: thymidine_phosphorylase_activity
    target: urinary_thymidine
    sign: "-"
    mechanism: With TYMP loss, elevated circulating thymidine spills into urine.
    evidence: "Marti et al., Ann Neurol 2002 (MNGIE biochemistry); OMIM 603041"
    causal_evidence: genetic_lof_gof
  - source: thymidine_phosphorylase_activity
    target: urinary_deoxyuridine
    sign: "-"
    mechanism: With TYMP loss, elevated circulating deoxyuridine spills into urine.
    evidence: "Marti et al., Ann Neurol 2002; OMIM 603041"
    causal_evidence: genetic_lof_gof

  # ---- ADA (deoxyadenosine accumulates in ADA-SCID) ----
  - source: adenosine_deaminase_activity
    target: urinary_deoxyadenosine
    sign: "-"
    mechanism: ADA deaminates (deoxy)adenosine; ADA loss causes dAdo accumulation and urinary excretion (ADA-SCID).
    evidence: "Hershfield, Genet Med 2003 (ADA deficiency); OMIM 102700"
    causal_evidence: genetic_lof_gof
