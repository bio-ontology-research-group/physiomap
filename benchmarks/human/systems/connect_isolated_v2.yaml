  mechanism: 'Malonyl-CoA decarboxylase (MLYCD) activity (disposition) decarboxylates malonyl-CoA to acetyl-CoA; loss of activity raises malonyl-CoA, which is converted to malonic acid and malonylcarnitine (C3DC). MLYCD LoF is a natural do(low MLYCD) that elevates malonylcarnitine.'
