- source: plasma_valine
  target: urinary_3_hydroxyisobutyrate
  sign: +
  causal_evidence: pharmacological
  mechanism: '3-hydroxyisobutyrate is an obligatory intermediate of valine catabolism; raising valine flux increases 3-hydroxyisobutyrate production and urinary excretion, and lowering dietary valine (a do() on the precursor) reduces it - establishing plasma valine as a positive causal driver of urinary 3-hydroxyisobutyrate, the analyte that joins this valine-catabolism enzyme island to the core BCAA hub.'
  evidence: 'PMID 34176136; (Meyer et al., HIBADH deficiency - a novel disorder of valine metabolism (J Inherit Metab Dis), abstract); “Under strict adherence to a low-valine diet a rapid decrease of 3HiB excretion in the urine was observed.” | Reducing the precursor valine lowers urinary 3-hydroxyisobutyrate (3HiB), i.e. valine causally increases urinary 3-hydroxyisobutyrate (sign +). [citations PubMed-verified]'
- source: skeletal_muscle_blood_flow
  target: cardiac_output
  sign: +
  causal_evidence: mechanistic_model
  mechanism: 'Skeletal-muscle vasodilation (e.g. driven by intracellular ATP/creatine-phosphate depletion during work) increases local muscle blood flow; because venous return is the sum of all local tissue blood flows, increasing muscle blood flow raises venous return and therefore cardiac output - the Guyton local-flow control of cardiac output.'
  evidence: 'Guyton & Hall, Textbook of Medical Physiology, 12th edition; (Ch. 20, Cardiac Output, Venous Return, and Their Regulation); “The venous return to the heart is the sum of all the local blood flows through all the individual tissue segments of the peripheral circulation. Therefore, it follows that cardiac output regulation is the sum of all the local blood flow regulations.” | Local tissue blood flow (here skeletal-muscle blood flow) sums into venous return and thereby sets cardiac output, supporting skeletal_muscle_blood_flow -> cardiac_output with sign +.'
