  evidence: 'PMID 9525594; (Title/abstract: RNase L mediates the antiviral effect of interferon through a selective reduction in viral RNA during encephalomyocarditis virus infection); “RNase L induction markedly enhanced the anti-EMCV activity of IFN via a reduction in EMCV RNA.” | Inducing RNase L activity reduces viral RNA/viral burden, supporting rnasel_activity -> blood_viral_load with sign - (interventional induction of the enzyme). [citations PubMed-verified]'
- source: beta_hexosaminidase_b_activity
  target: plasma_beta_hexosaminidase
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: 'The beta subunit (HEXB) is shared by both hexosaminidase isoenzymes (HexA = alpha-beta, HexB = beta-beta); biallelic HEXB loss-of-function (Sandhoff disease, a natural do()) abolishes both isoenzymes, so total serum beta-hexosaminidase falls - hence beta-hexosaminidase-B activity positively determines measured serum total hexosaminidase, joining the lysosomal HEX/GM2 island to the core serum analyte.'
  evidence: 'PMID 28553389; (Sandhoff Disease without Hepatosplenomegaly Due to Hexosaminidase B Gene Mutation, abstract/introduction); “Sandhoff disease is a neurodegenerative disease caused due to deficiency of hexosaminidase (HEX) A and B.” | HEXB (beta-subunit) loss causes deficiency of both HexA and HexB, so loss of beta-hexosaminidase-B activity lowers total (serum) hexosaminidase, supporting beta_hexosaminidase_b_activity -> plasma_beta_hexosaminidase with sign +. [citations PubMed-verified]'
