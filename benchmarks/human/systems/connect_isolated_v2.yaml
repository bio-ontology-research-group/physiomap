  sign: +
  causal_evidence: curated_mechanistic
  mechanism: 'Acid sphingomyelinase (SMPD1) hydrolyzes sphingomyelin to ceramide; higher SMPD1 activity -> more ceramide generation. This links the acid-ceramidase/ceramide island (acid ceramidase separately degrades ceramide) to the core SMPD1 node via the ceramide-producing reaction.'
  evidence: 'PMID 25803076; (Abstract; Secretory sphingomyelinase in health and disease, Biol Chem 2015); “Acid sphingomyelinase (ASM), a key enzyme in sphingolipid metabolism, hydrolyzes sphingomyelin to ceramide and phosphorylcholine.” | SMPD1 hydrolyzes sphingomyelin to ceramide, so do(SMPD1 up) raises tissue ceramide: acid sphingomyelinase activity --(+)--> ceramide. [citations PubMed-verified]'
- source: methylcrotonyl_coa_carboxylase_activity
  target: plasma_3_hydroxyisovalerylcarnitine
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: '3-methylcrotonyl-CoA carboxylase activity (disposition) carboxylates 3-methylcrotonyl-CoA in leucine catabolism; loss of activity backs up 3-methylcrotonyl-CoA into alternative products, primarily 3-hydroxyisovalerylcarnitine (C5-OH). MCC LoF is a natural do(low MCC) that raises C5-OH.'
  evidence: 'PMID 29767664; (Abstract; Biochemical and molecular characterization of 3-Methylcrotonylglycinuria (PMC6082241)); “Its deficiency leads to accumulation in blood and/or urine of 3-methylcrotonyl-CoA metabolites, primarily 3-hydroxyisovaleryl-carnitine (C5-OH) in plasma and 3-methylcrotonyl-glycine (3-MCG) and 3-hydroxyisovaleric acid (3-HIVA) in urine” | MCC deficiency elevates plasma C5-OH (and urinary 3-MCG), so do(MCC down) raises C5-OH: enzyme activity --(-)--> 3-hydroxyisovalerylcarnitine. [citations PubMed-verified]'
- source: isobutyryl_coa_dehydrogenase_activity
  target: plasma_c4_acylcarnitine
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: 'Isobutyryl-CoA dehydrogenase (ACAD8) activity (disposition) dehydrogenates isobutyryl-CoA in valine catabolism; loss of activity backs up isobutyryl-CoA, raising C4 (butyryl/isobutyryl) acylcarnitine. ACAD8 LoF is a natural do(low ACAD8) that elevates C4-carnitine.'
  evidence: 'PMID 16857760; (Abstract; Pediatr Res 2006 (Variations in IBD/ACAD8 in children with elevated C4-carnitine)); “four newborns with elevated C(4)-carnitine identified by tandem mass spectrometry (MS/MS) screening” | ACAD8/IBD deficiency presents with elevated C4-acylcarnitine, so do(ACAD8 down) raises C4-carnitine: enzyme activity --(-)--> C4 acylcarnitine. [citations PubMed-verified]'
- source: malonyl_coa_decarboxylase_activity
