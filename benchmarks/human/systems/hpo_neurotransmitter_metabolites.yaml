causal_edges:
  # AADC (DOPA decarboxylase) consumes L-DOPA -> produces dopamine.
  - source: aadc_activity
    target: plasma_dopa
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: aromatic L-amino acid decarboxylase decarboxylates L-DOPA to dopamine; higher enzyme activity consumes L-DOPA, lowering it (AADC deficiency therefore RAISES circulating L-DOPA, the diagnostic marker)
    evidence: "Lehninger Principles of Biochemistry (catecholamine biosynthesis: L-DOPA --DOPA decarboxylase--> dopamine); Harrison's Principles of Internal Medicine (aromatic L-amino acid decarboxylase / DDC deficiency, OMIM 608643: elevated L-DOPA); natural human LoF (AADC/DDC deficiency) elevates L-DOPA and its shunt product 3-O-methyldopa, confirming do(AADC)->[L-DOPA] sign '-' (PMC10530573, AADC-deficiency 3-OMD screening study; OMIM 608643)"
  - source: aadc_activity
    target: csf_dopamine
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: aromatic L-amino acid decarboxylase produces dopamine from L-DOPA; higher enzyme activity raises CNS dopamine synthesis (AADC deficiency lowers CSF dopamine/HVA)
    evidence: "Lehninger Principles of Biochemistry (L-DOPA --DOPA decarboxylase--> dopamine); Harrison's Principles of Internal Medicine (AADC/DDC deficiency: reduced dopamine and its CSF metabolite HVA); natural human LoF (AADC deficiency) causes combined dopamine/serotonin deficiency with reduced CSF dopamine/HVA, confirming do(AADC)->CSF dopamine sign '+' (PMC10530573; OMIM 608643)"
  # DBH consumes dopamine -> produces norepinephrine (existing corpus node).
  - source: dbh_activity
    target: csf_dopamine
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: dopamine beta-hydroxylase hydroxylates dopamine to norepinephrine; higher enzyme activity consumes dopamine (DBH deficiency therefore lets dopamine ACCUMULATE)
    evidence: "Lehninger Principles of Biochemistry (dopamine --dopamine beta-hydroxylase--> norepinephrine); Harrison's Principles of Internal Medicine (dopamine-beta-hydroxylase deficiency, OMIM 223360: dopamine accumulation, absent norepinephrine/epinephrine); natural human LoF (DBH deficiency) raises dopamine 5- to 10-fold (plasma; concordant CSF elevation), confirming do(DBH)->dopamine sign '-' (GeneReviews NBK1474, DBH Deficiency; OMIM 223360)"
  - source: dbh_activity
    target: norepinephrine
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: dopamine beta-hydroxylase produces norepinephrine from dopamine; higher enzyme activity raises norepinephrine synthesis (DBH deficiency abolishes norepinephrine and epinephrine)
    evidence: "Lehninger Principles of Biochemistry (dopamine --DBH--> norepinephrine); Harrison's Principles of Internal Medicine (dopamine-beta-hydroxylase deficiency, OMIM 223360: undetectable plasma norepinephrine/epinephrine); pathognomonic natural human LoF: plasma NE undetectable (<25 pg/mL) and restored by droxidopa (a NE precursor bypassing DBH), confirming do(DBH)->norepinephrine sign '+' (GeneReviews NBK1474, DBH Deficiency; OMIM 223360)"

constitutive_edges: []   # none — analytes are organ_system; enzymes are cellular roots (lift omitted this phase)
