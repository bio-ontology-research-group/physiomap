# =============================================================================
# Neurotransmitter metabolites — catecholamine / serotonin / GABA analytes
#                                    — PhysioMap fragment  *** DRAFT FOR REVIEW ***
# =============================================================================
# Hand-encoded grounding nodes for the HPO "neurotransmitter_metabolites" gap terms:
# directional abnormal-quantity terms for monoamine (catecholamine + serotonin) and
# GABA precursors, neurotransmitters, and degradation products, measured in URINE,
# PLASMA/SERUM, and CSF; plus three catabolic/biosynthetic ENZYME-ACTIVITY roots
# (SSADH, AADC, DBH). ROBERT: please correct signs / edges / IRIs.
#
# Compartment matters: the same molecule measured in urine vs plasma vs CSF is a
# DIFFERENT physiological variable (different clearance, blood-brain-barrier, renal
# handling), so each gets its own node. The corpus already owns plasma EPINEPHRINE
# (`epinephrine`, CHEBI:28918) and plasma NOREPINEPHRINE (`norepinephrine`,
# CHEBI:18357) and their secretion cells — these are NOT redefined here; the DBH
# edge below references the existing `norepinephrine` node as a boundary ref.
#
# Physiology / biochemistry provenance (standard textbooks + DBs):
#   - Lehninger Principles of Biochemistry / Voet — catecholamine biosynthesis:
#       L-tyrosine --(TH)--> L-DOPA --(AADC/DOPA-decarboxylase)--> dopamine
#       --(DBH, dopamine beta-hydroxylase)--> norepinephrine --(PNMT)--> epinephrine.
#     Catabolism (MAO + COMT): dopamine -> DOPAC / homovanillic acid (HVA);
#     norepinephrine/epinephrine -> normetanephrine/metanephrine -> vanillylmandelic
#     acid (VMA); serotonin --(MAO)--> 5-hydroxyindoleacetic acid (5-HIAA).
#   - Boron & Boulpaep Medical Physiology — adrenal medulla & sympathetic
#     catecholamines; urinary catecholamine/metanephrine/VMA/HVA as clinical assays.
#   - Williams Textbook of Endocrinology — pheochromocytoma/paraganglioma diagnosis
#     by plasma & urinary fractionated metanephrines and catecholamines (elevated).
#   - Harrison's Principles of Internal Medicine — carcinoid (elevated urinary 5-HIAA,
#     serotonin); DOPA-decarboxylase (AADC) deficiency; dopamine-beta-hydroxylase
#     deficiency; SSADH deficiency (4-hydroxybutyric aciduria).
#   - SSADH deficiency (ALDH5A1 LoF, OMIM 271980): blocks GABA -> succinate, so the
#     "tissue SSADH activity" enzyme root is the lesion node (decreased activity).
#   - AADC deficiency (DDC LoF, OMIM 608643): low dopamine/serotonin synthesis ->
#     elevated upstream L-DOPA and vanillactic acid (a 3-methoxytyrosine/DOPA shunt
#     metabolite), reduced HVA/5-HIAA. AADC is the enzyme root.
#   - DBH deficiency (DBH LoF, OMIM 223360): dopamine accumulates, norepinephrine/
#     epinephrine fall; DBH is the enzyme root.
#
# IRIs verified against ontology/.obo_cache OBO files (exact 'name:' match) on
# 2026-06-04:
#   CHEBI:33567 catecholamine; CHEBI:18243 dopamine; CHEBI:33569 noradrenaline;
#   CHEBI:33568 adrenaline; CHEBI:28790 serotonin; CHEBI:16865 gamma-aminobutyric
#   acid; CHEBI:545959 homovanillic acid; CHEBI:20106 vanillylmandelic acid;
#   CHEBI:27823 (5-hydroxyindol-3-yl)acetic acid (= 5-HIAA); CHEBI:89633 Metanephrine;
#   CHEBI:15765 L-dopa; CHEBI:15760 tyramine; CHEBI:88526 Vanillactic acid.
#   PR:P20711 aromatic-L-amino-acid decarboxylase (human) = AADC/DDC;
#   PR:P09172 dopamine beta-hydroxylase (human) = DBH;
#   PR:P51649 succinate-semialdehyde dehydrogenase, mitochondrial (human) = ALDH5A1.
#   CL:0000540 neuron; CL:0000617 GABAergic neuron; CL:0000166 chromaffin cell.
#   DOPAC (3,4-dihydroxyphenylacetic acid): the cache only has the GENERIC
#   "dihydroxyphenylacetic acid" (CHEBI:61409, no positional 3,4- locant) — left
#   null rather than mis-ground to the unlocanted parent.
#
# Most edges are deliberately OMITTED: the giant homeostatic SCC, MAO/COMT branch
# points, and renal/BBB clearance make most cross-analyte signs ambiguous. Only the
# three enzyme-root edges whose substrate-consumption / product-formation sign is a
# clean textbook 1-step relation are encoded. Per PhysioMap policy: prefer NO edge
# over a guessed sign. This fragment is essentially a set of grounded analyte nodes
# (an "island"; validate_fragment will WARN — not an error) that abstain safely.
# =============================================================================

name: hpo_neurotransmitter_metabolites
description: >-
  DRAFT grounding nodes for HPO neurotransmitter-metabolite abnormal-quantity terms:
  catecholamines (dopamine, norepinephrine, epinephrine, metanephrine), their
  precursors (L-DOPA) and degradation products (DOPAC, HVA, VMA, vanillactate),
  serotonin and 5-HIAA, GABA, and the trace amine tyramine — measured in urine,
  plasma/serum, and CSF — plus the SSADH, AADC, and DBH enzyme-activity roots.
  Compartment-specific analyte nodes (urine vs plasma vs CSF are distinct variables).
  Three textbook 1-step enzyme->substrate/product edges; otherwise grounded
  abstaining nodes. Single/cross-scale (ORGAN_SYSTEM analytes; CELLULAR enzymes).

