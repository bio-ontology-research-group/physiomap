# =============================================================================
# Other endocrine hormones / biomarkers — HPO directional-gap coverage
#                                    — PhysioMap fragment  *** DRAFT FOR REVIEW ***
# =============================================================================
# Hand-encoded grounding nodes for a set of circulating endocrine analytes,
# bone-turnover markers, natriuretic peptides, steroid intermediates, thyroid
# species, and two enzyme-activity roots, each required to cover an HPO
# abnormal-quantity term. Most are plasma/serum concentrations (scale
# organ_system, PATO:0000033). Two are enzyme catalytic-activity roots
# (scale cellular, PATO:0001414) with a verified bearer cell.
#
# This is deliberately mostly an ISLAND fragment: a grounded concentration node
# with NO causal edges is valuable and safe — the comparative-statics solver
# simply abstains on it, and the HPO forward/backward harness maps the term to
# the node + sign. Edges are added ONLY where a cited mechanism gives a
# defensible interventional sign (the two enzyme roots -> their product/substrate
# steroid or thyroid pools). Per PhysioMap policy, NO guessed edges.
#
# Provenance (physiology / biochemistry):
#   - Williams Textbook of Endocrinology (steroidogenesis: pregnenolone ->
#     17-OH-pregnenolone -> DHEA -> androstenedione -> testosterone/estrone;
#     aromatase CYP19A1 converts androstenedione->estrone and testosterone->
#     estradiol; DHEA-S is the sulfated DHEA pool; corticosterone & 18-OH species
#     are mineralocorticoid-pathway intermediates).
#   - Boron & Boulpaep Medical Physiology (thyroid hormone synthesis &
#     peripheral deiodination: D1/D2 5'-deiodinase activate T4->T3; D3 and D1
#     inner-ring deiodination produce reverse T3; thyroglobulin is the follicular
#     storage protein; calcitonin from thyroid C cells; natriuretic peptides
#     ANP/BNP and their N-terminal pro-fragments NT-proANP/NT-proBNP).
#   - Harrison's Principles of Internal Medicine (tumor markers / endocrine labs:
#     beta-hCG, VIP (VIPoma), gastrin, thyroglobulin; bone-turnover markers
#     osteocalcin, beta-CTX, osteopontin; EPO, thrombopoietin, adiponectin, VEGF).
#   - Lehninger Principles of Biochemistry (steroid & thyroid hormone chemistry).
#
# Entity IRIs verified by grepping ontology/.obo_cache (CHEBI/PR/CL); any analyte
# without an exact OBO 'name:' match has entity_iri: null (NOT fabricated):
#   - 18-hydroxycortisone: CHEBI has 18-hydroxycorticoSTERONE (a distinct
#     compound), not 18-hydroxycortiSONE -> null.
#   - beta-CTX (C-terminal collagen telopeptide crosslink): no clean OBO class -> null.
#   - VEGF / NT-proANP / NT-proBNP / reverse-T3-as-distinct-pool / total-T4 vs
#     free-T4: PR/CHEBI have the parent protein/small molecule but not always the
#     exact circulating species; IRIs given only where the OBO name matches.
#
# Existing-node mappings (NOT re-created here; the HPO term maps to the existing id):
#   anp, cortisol, erythropoietin, gastrin, fgf23, free_t4 (free fraction only).
# =============================================================================

name: hpo_other_endocrine_hormones
description: >-
  DRAFT grounding nodes for circulating endocrine hormones, steroid pathway
  intermediates, thyroid hormone species, natriuretic peptides, bone-turnover
  markers, and two enzyme-activity roots (aromatase, type-II deiodinase) needed
  to cover HPO abnormal-quantity terms in the "other endocrine hormones" theme.
  Mostly a self-contained island of grounded concentration nodes (the solver
  abstains); a small number of cited enzyme -> steroid/thyroid product/substrate
  edges are included. Single/dual-scale (ORGAN_SYSTEM concentrations + CELLULAR
  enzyme roots), Phase 1.

