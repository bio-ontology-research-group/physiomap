causal_edges:
  # --- aromatase converts androgens -> estrogens ---------------------------
  - source: aromatase_activity
    target: plasma_estrone
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: aromatase (CYP19A1) aromatizes androstenedione to estrone (and testosterone to estradiol); higher enzyme activity raises the estrogen product pool
    evidence: "Williams Textbook of Endocrinology (aromatase CYP19A1 converts androstenedione->estrone, testosterone->estradiol); aromatase-excess syndrome (gain of CYP19A1) raises circulating estrogens"
  - source: aromatase_activity
    target: plasma_androstenedione
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: aromatase consumes androstenedione as substrate; higher aromatase activity lowers the androstenedione pool (substrate consumption), while aromatase deficiency raises androgens
    evidence: "Williams Textbook of Endocrinology (aromatase deficiency: accumulation of androgenic precursors incl. androstenedione, low estrogens); substrate-consumption sign convention"

  # --- type-II deiodinase: T4 -> T3 (does NOT make reverse T3) --------------
  - source: type_2_deiodinase_activity
    target: plasma_t4
    sign: "-"
    mechanism: type-II 5'-deiodinase (DIO2) removes an outer-ring iodine from T4 to generate T3, consuming T4 substrate; higher DIO2 activity lowers the local/contributory T4 pool
    evidence: "Boron & Boulpaep Medical Physiology (peripheral deiodination: D2 5'-deiodinase activates T4->T3, consuming T4 substrate)"

constitutive_edges: []   # none — grounding fragment (no cross-scale lift this phase)
