# =============================================================================
# Pulmonary / right-heart hemodynamics + blood-gas pressures
#                                    — PhysioMap fragment  *** DRAFT FOR REVIEW ***
# =============================================================================
# Hand-encoded, ORGAN / ORGAN_SYSTEM scale. Each edge sign is the sign of the
# partial derivative of the target w.r.t. the source at steady state, all else
# equal (interventionist partial). ROBERT: please correct signs/edges/IRIs.
#
# Physiology / provenance (textbook + standard hemodynamics):
#   - Boron & Boulpaep, Medical Physiology, 3rd ed., "The Heart as a Pump" and
#     "The Microcirculation": pulmonary artery pressure (PAP), pulmonary vascular
#     resistance (PVR), right atrial pressure (RAP, ~ central venous pressure),
#     left atrial pressure (LAP), right ventricular systolic pressure (RVSP),
#     and pulmonary capillary wedge pressure (PCWP, a left-atrial / LV filling
#     surrogate).
#   - Harrison's Principles of Internal Medicine, 21st ed., "Pulmonary
#     Hypertension": PAP rises with PVR and with downstream (left-heart / LAP /
#     PCWP) pressure; mean PAP = PVR x CO + PCWP (the steady-state pulmonary
#     pressure-flow identity). RVSP approximates systolic PAP in the absence of
#     pulmonic stenosis (echo estimate of PASP from tricuspid regurgitant jet).
#   - Pulse pressure = systolic - diastolic arterial pressure; widens with
#     increased stroke volume and decreased arterial compliance, narrows with
#     reduced stroke volume (Boron & Boulpaep, "Arterial pressure"). High and Low
#     pulse pressure map to the SAME node with opposite signs.
#   - Cardiac index = cardiac output / body surface area: a flow rate (same PATO
#     determinable as cardiac output, PATO:0000161). Increased cardiac index
#     tracks increased cardiac output (Boron & Boulpaep).
#   - Base excess (BE): the amount of strong acid/base needed to titrate blood to
#     pH 7.40 at pCO2 40 mmHg, 37C; a metabolic acid-base index (Boron &
#     Boulpaep, "Acid-Base Physiology"; Siggaard-Andersen). "Abnormal base
#     excess" is a non-directional umbrella term; per task convention it is mapped
#     as "+" to a single base-excess node (the analyte is real and groundable; the
#     specific direction is not asserted by the HPO term).
#
# Boundary references to EXISTING PhysioMap nodes (verified in node_inventory.tsv):
#   cardiac_output (organ_system, PATO:0000161), stroke_volume (organ),
#   plasma_bicarbonate (organ_system).
# =============================================================================

name: pulmonary_bloodgas
description: >-
  Pulmonary and right-heart hemodynamic pressures (PAP, PVR, RAP, LAP, PCWP,
  RVSP), systemic pulse pressure, cardiac index, and blood base excess. Covers
  HPO directional abnormal-quantity terms for pulmonary/blood-gas hemodynamics.
  DRAFT FOR REVIEW.

