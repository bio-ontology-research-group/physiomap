    quality_iri: PATO:0000070         # amount (titratable base, mEq/L)

causal_edges:
  # PVR raises pulmonary artery pressure (mean PAP = PVR x CO + PCWP).
  - source: pulmonary_vascular_resistance
    target: pulmonary_artery_pressure
    sign: "+"
    mechanism: >-
      Steady-state pulmonary pressure-flow relation: mean PAP = PVR x CO + PCWP;
      raising pulmonary vascular resistance at fixed flow and wedge pressure
      raises pulmonary artery pressure (pre-capillary pulmonary hypertension).
    evidence: "Harrison's Principles of Internal Medicine, 21st ed., 'Pulmonary Hypertension'; Boron & Boulpaep, Medical Physiology 3rd ed."

  # Downstream (left-heart) pressure transmitted back into the pulmonary bed:
  # PCWP is an additive term in the same identity -> raises PAP.
  - source: pulmonary_capillary_wedge_pressure
    target: pulmonary_artery_pressure
    sign: "+"
    mechanism: >-
      mean PAP = PVR x CO + PCWP: the wedge (left-atrial) pressure is an additive
      downstream term; elevated PCWP (post-capillary/left-heart disease) raises
      pulmonary artery pressure for given PVR and flow.
    evidence: "Harrison's Principles of Internal Medicine, 21st ed., 'Pulmonary Hypertension' (post-capillary PH); Boron & Boulpaep, Medical Physiology 3rd ed."

  # Left atrial pressure equilibrates with the wedge pressure (PCWP is a LAP
  # surrogate measured by occluding a pulmonary arterial branch).
  - source: left_atrial_pressure
    target: pulmonary_capillary_wedge_pressure
    sign: "+"
    mechanism: >-
      With a static column from the wedged catheter through the pulmonary
      capillaries to the left atrium, PCWP equilibrates with and tracks left
      atrial pressure.
    evidence: "Boron & Boulpaep, Medical Physiology 3rd ed., 'The Heart as a Pump' (Swan-Ganz wedge pressure)."

  # RVSP ~ systolic PAP (no pulmonic stenosis): elevated PAP raises RVSP.
  - source: pulmonary_artery_pressure
    target: right_ventricular_systolic_pressure
    sign: "+"
    mechanism: >-
      In the absence of pulmonary valve stenosis the right ventricle and
      pulmonary artery are continuous in systole, so RV systolic pressure equals
      systolic pulmonary artery pressure; elevated PAP raises RVSP (basis of the
      echocardiographic TR-jet estimate of PASP from RVSP).
    evidence: "Harrison's Principles of Internal Medicine, 21st ed., 'Pulmonary Hypertension' (echo estimation of PASP)."

  # Pulmonary hypertension raises right-heart filling pressure (RV afterload ->
  # RV failure / venous congestion -> elevated RAP).
  - source: pulmonary_artery_pressure
    target: right_atrial_pressure
    sign: "+"
    mechanism: >-
      Sustained elevation of pulmonary artery pressure raises right ventricular
      afterload; the failing/congested right ventricle transmits elevated filling
      pressure backward, raising right atrial (central venous) pressure.
    evidence: "Harrison's Principles of Internal Medicine, 21st ed., 'Pulmonary Hypertension' / 'Cor Pulmonale'; Boron & Boulpaep, Medical Physiology 3rd ed."

  # Stroke volume widens pulse pressure (more ejected volume into the arterial
  # tree per beat raises systolic relative to diastolic pressure).
  - source: stroke_volume
    target: pulse_pressure
    sign: "+"
    mechanism: >-
      Pulse pressure = systolic - diastolic arterial pressure; for a given
      arterial compliance, a larger ejected stroke volume per beat raises systolic
      pressure more than diastolic, widening pulse pressure.
    evidence: "Boron & Boulpaep, Medical Physiology 3rd ed., 'Arterial pressure' (pulse pressure ~ SV / arterial compliance). | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-112 (20.3: Blood Flow, Blood Pressure, and Resistance): 'a low or narrow [pulse pressure] may occur in patients with a low stroke volume... a high or wide pulse pressure is common in healthy people following strenuous exercise, when...pulse pressure...may increase...as stroke volume increases.'"

  # Cardiac index tracks cardiac output (CI = CO / BSA).
  - source: cardiac_output
    target: cardiac_index
    sign: "+"
    mechanism: >-
      Cardiac index is cardiac output normalized to body surface area
      (CI = CO / BSA); at fixed body surface area cardiac index rises with
      cardiac output.
    evidence: "Boron & Boulpaep, Medical Physiology 3rd ed., 'The Heart as a Pump' (cardiac index definition)."
