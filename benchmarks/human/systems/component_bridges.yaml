- source: plasma_histidine
  target: plasma_histamine
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: Histamine is biosynthesized from L-histidine by the enzyme histidine decarboxylase (HDC; pyridoxal-5-phosphate-dependent decarboxylase) in mast cells, basophils, enterochromaffin-like cells, and neurons. Histidine is the sole substrate for HDC; the Km of HDC for histidine is in the physiological range (~2-5 mM), so elevated plasma histidine (as in histidinemia, HAL LoF) increases HDC substrate availability and drives more histamine synthesis. do(HAL LoF) → plasma histidine ↑ → HDC substrate ↑ → histamine production ↑ → plasma histamine ↑.
  evidence: 'Histidinemia OMIM 235800 (HAL deficiency — elevated plasma histidine); Befus AD et al., in: Metzger H ed. Immunoglobulin E (mast cell histamine synthesis rate determined by histidine availability); Schayer RW, Physiol Rev 1959 (histidine is the sole precursor for all histamine in mammals; tissue histidine concentration influences histamine synthesis rate); Lehninger Principles of Biochemistry (histidine catabolism; HDC reaction). | intervention: do(HAL loss-of-function) — histidinemia OMIM 235800 [citations PubMed-verified]'
- source: haao_activity
  target: cellular_nadh
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: '3-Hydroxyanthranilate 3,4-dioxygenase (HAAO) catalyses the committed step from 3-hydroxyanthranilic acid to alpha-amino-beta-carboxymuconate semialdehyde, which spontaneously cyclizes to quinolinate — the universal de novo precursor of the NAD+ pyridine ring. Biallelic HAAO LoF blocks de novo NAD+ biosynthesis from tryptophan (congenital NAD deficiency disorder, CNDD), reducing the total cellular NAD+ pool and consequently cellular NADH. Sign: more HAAO activity → more quinolinate flux → more NAD+ → more NADH (do(HAAO LoF) = NAD/NADH falls).'
  evidence: 'Shi H et al. NEJM 2017 (doi:10.1056/NEJMoa1616361) — biallelic HAAO loss-of-function causes congenital NAD deficiency disorder with congenital malformations rescued by niacin supplementation; patient plasma showed increased 3-HAA and decreased NAD/NADH. GeneReviews NBK593504 (CNDD): HAAO, KYNU, and NADSYN1 are the three CNDD-causing genes, all essential for de novo NAD synthesis from tryptophan. Lehninger Principles of Biochemistry (kynurenine pathway → quinolinate → NaMN via QPRT → NAD+; HAAO catalyses the penultimate step). | intervention: do(HAAO biallelic LoF) = congenital NAD deficiency disorder; HAAO activity falls → NAD+ and NADH levels fall | intervention: do(HAAO biallelic LoF) — congenital NAD deficiency disorder (CNDD), OMIM via Shi NEJM 2017'
- source: p5c_dehydrogenase_activity
  target: aadc_activity
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: 'Delta-1-pyrroline-5-carboxylate dehydrogenase (ALDH4A1) oxidises pyrroline-5-carboxylate (P5C) to glutamate. ALDH4A1 LoF (hyperprolinemia type II) causes P5C to accumulate. P5C spontaneously condenses with pyridoxal 5''-phosphate (PLP) in a Knoevenagel-type reaction, forming a stable aldamine adduct that inactivates PLP. Since aromatic L-amino acid decarboxylase (AADC/DDC) requires PLP as an essential cofactor, secondary functional B6 deficiency reduces AADC activity. Sign: more ALDH4A1 activity → less P5C → less PLP trapping → more AADC activity (do(ALDH4A1 LoF) = AADC activity falls).'
  evidence: 'Farrant RD et al. J Biol Chem 2001 276:15108-15116 (PMID 11134058) — ''Pyridoxal phosphate de-activation by pyrroline-5-carboxylic acid: increased risk of vitamin B6 deficiency and seizures in hyperprolinemia type II''; mechanism confirmed as Knoevenagel condensation of P5C with PLP. PMC9492674 (Comm Biol 2022, Brolese et al.) — new biomarkers for hyperprolinemia type II confirm P5C accumulation and PLP trapping. Frontiers Psychiatry PMC6423912 — ''Intellectual disability associated with pyridoxine-responsive epilepsies'': P5C-mediated PLP inactivation reduces AADC and other PLP-dependent enzyme activities. | intervention: do(ALDH4A1 biallelic LoF) = hyperprolinemia type II (OMIM 239500): P5C accumulates → PLP trapped → AADC activity reduced | intervention: do(ALDH4A1 biallelic LoF) — hyperprolinemia type II, OMIM 239500 [citations PubMed-verified]'
- source: aldh7a1_activity
  target: aadc_activity
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: 'Alpha-aminoadipic semialdehyde dehydrogenase (ALDH7A1 / antiquitin) oxidises alpha-AASA to alpha-aminoadipate. ALDH7A1 LoF (pyridoxine-dependent epilepsy, PDE) causes alpha-AASA and its cyclic Schiff base piperideine-6-carboxylate (P6C) to accumulate. P6C condenses with pyridoxal 5''-phosphate (PLP) via a Knoevenagel adduction, forming a covalent P6C-PLP adduct that severely depletes bioavailable PLP. Aromatic L-amino acid decarboxylase (AADC/DDC) requires PLP as its obligatory cofactor; PLP depletion reduces AADC activity, causing secondary AADC deficiency with reduced synthesis of dopamine and serotonin. Sign: more ALDH7A1 → less P6C → less PLP trapping → more AADC activity (do(ALDH7A1 LoF) = AADC activity falls).'
  evidence: 'GeneReviews NBK1486 (Pyridoxine-Dependent Epilepsy, ALDH7A1): ''P6C inactivates PLP and leads to a lifelong hyperphysiologic pyridoxine demand''; AADC secondary deficiency is documented as a consequence. Mills PB et al. Biochem J 2006 — pyridoxine-dependent epilepsy (antiquitin/ALDH7A1 deficiency): P6C condensation with PLP, PLP-dependent enzyme (AADC, GABA-T) deficiency confirmed. OMIM 266100 (pyridoxine-dependent epilepsy). pdeonline.org/resources/PDE-review-MGM.pdf — mechanism of PLP trapping by P6C leading to secondary neurotransmitter synthesis defects. | intervention: do(ALDH7A1 biallelic LoF) = pyridoxine-dependent epilepsy, OMIM 266100: P6C accumulates → PLP trapped → AADC activity reduced | intervention: do(ALDH7A1 biallelic LoF) — pyridoxine-dependent epilepsy (PDE), OMIM 266100'
- source: kynureninase_activity
  target: cellular_nadh
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: 'Kynureninase (KYNU) catalyses the PLP-dependent cleavage of 3-hydroxykynurenine to 3-hydroxyanthranilate + alanine, a step required for flux through the tryptophan → kynurenine → 3-HK → 3-HAA → quinolinate (via HAAO) → NaMN (via QPRT) → NAD+ de novo biosynthesis pathway. KYNU LoF blocks this flux at 3-hydroxykynurenine, preventing generation of 3-hydroxyanthranilate and all downstream NAD+ precursors. The total cellular NAD+ pool (and therefore NADH) falls. Sign: more KYNU activity → more 3-HAA produced → more quinolinate → more NAD+/NADH (do(KYNU LoF) = NAD/NADH falls).'
  evidence: 'Shi H et al. NEJM 2017 (doi:10.1056/NEJMoa1616361) — biallelic KYNU loss-of-function explicitly identified as a cause of congenital NAD deficiency disorder (CNDD) alongside HAAO and NADSYN1; ''affected patients had biallelic pathogenic variants in KYNU, HAAO, or NADSYN1''. GeneReviews NBK593504 (CNDD): KYNU is one of three CNDD genes. Lehninger Principles of Biochemistry (kynurenine pathway: KYNU is obligate upstream of HAAO and QPRT in de novo NAD synthesis from tryptophan). | intervention: do(KYNU biallelic LoF) = congenital NAD deficiency disorder (CNDD): 3-HK not cleaved → no flux to quinolinate → NAD+/NADH falls | intervention: do(KYNU biallelic LoF) — congenital NAD deficiency disorder (CNDD) caused by kynureninase deficiency, Shi NEJM 2017'
- source: cystinosin_transport_activity
