  mechanism: 'Acetaldehyde (the first oxidation product of ethanol, cleared by hepatic ALDH2) directly inhibits mitochondrial oxidative phosphorylation in hepatocytes by disrupting Complex I and Complex III of the respiratory chain. This impairs NADH reoxidation, causing intrahepatic NADH/NAD+ ratio to rise. The excess NADH drives the lactate dehydrogenase (LDH) equilibrium strongly toward lactate: pyruvate + NADH + H+ -> lactate + NAD+. Additionally, NADH excess impairs hepatic gluconeogenesis (which requires NAD+ for glyceraldehyde-3-phosphate dehydrogenase), further diverting pyruvate toward lactate rather than glucose. The net effect is plasma lactic acidosis. ALDH2 deficiency (reduced acetaldehyde clearance) exacerbates both acetaldehyde accumulation and the secondary lactic acidosis.'
  evidence: 'Lehninger Principles of Biochemistry, Ch. 17 — ethanol metabolism: ethanol -> (ADH, consumes NAD+) -> acetaldehyde -> (ALDH2, consumes NAD+) -> acetate; NADH accumulation drives pyruvate -> lactate; alcohol-induced lactic acidosis is a recognized complication (elevated plasma lactate, reduced gluconeogenesis). ALDH2 deficiency (OMIM 610251, Asian flush / Acute Alcohol Sensitivity) — ALDH2*2 (Glu487Lys) LoF results in acetaldehyde accumulation; Cederbaum AI ''Alcohol metabolism: its biology and pathology'' Alcohol Research & Health 2012 (PMC6527027) — NADH/NAD+ ratio increase underlies ethanol-associated lactic acidosis; PMC6875787 (ALDH2 deficiency, Alcohol Res 2019). Intervention: do(plasma_acetaldehyde ↑, e.g. ALDH2 LoF or ethanol challenge in ALDH2-deficient subjects) -> hepatic NADH excess -> LDH shifts toward lactate -> plasma lactate rises. | intervention: do(plasma_acetaldehyde ↑) via ALDH2 LoF (ALDH2*2 homozygosity, OMIM 610251) or pharmacological ALDH2 inhibition (disulfiram analogue) following ethanol challenge — acetaldehyde accumulates, hepatic NADH/NAD+ ratio rises, plasma lactate increases'
