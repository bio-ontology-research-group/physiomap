  mechanism: 'Elevated plasma urate (as in HPRT deficiency / Lesch-Nyhan disease, OMIM 300322, or PRPS1 superactivity, OMIM 300661) leads to supersaturation of uric acid in the renal tubular lumen, particularly in the acidic environment of the collecting duct and distal nephron. Uric acid crystallises in situ, causing intratubular obstruction, raised intrarenal pressure, compression of the renal venous microvasculature, and a consequent fall in renal blood flow and GFR. This is the established mechanism of acute uric acid nephropathy: do(hyperuricaemia) -> crystal-mediated tubular obstruction -> GFR decreases.'
