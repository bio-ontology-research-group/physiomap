  mechanism: 'Cystinosin (CTNS) is the H+-driven lysosomal cystine transporter that exports free cystine from lysosomes to the cytosol. CTNS LoF (nephropathic cystinosis) abolishes lysosomal cystine export, causing progressive intralysosomal cystine crystal accumulation in all cells, most critically in renal proximal tubular epithelial cells. Crystal accumulation causes oxidative stress, impaired autophagy, and tubular cell apoptosis, producing Fanconi syndrome (generalised proximal tubular dysfunction). Progressive tubular and glomerular injury then causes sustained GFR decline, with untreated patients reaching end-stage renal disease in the first two decades. Sign: more cystinosin activity → better lysosomal cystine clearance → preserved tubular function → higher GFR (do(CTNS LoF) = GFR falls).'
