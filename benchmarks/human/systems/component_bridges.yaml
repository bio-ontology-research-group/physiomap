- source: plasma_branched_chain_amino_acids
  target: muscle_protein_synthesis_rate
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: Branched-chain amino acids — especially leucine — are the primary activators of the mTORC1 kinase complex in skeletal muscle; mTORC1 phosphorylates 4E-BP1 and S6K1, stimulating cap-dependent translation and muscle protein synthesis. Elevated plasma BCAA (as in maple syrup urine disease, BCKDH LoF) drives supraphysiological mTORC1 activation and protein anabolism. do(BCKDH LoF) → plasma BCAA ↑ → mTORC1 ↑ → muscle protein synthesis rate ↑.
  evidence: 'Maple syrup urine disease OMIM 248600; Norton LE & Layman DK, J Nutr 2006 (leucine regulates translation initiation of muscle protein synthesis via mTOR); Suryawan A et al., Am J Physiol Endocrinol Metab 2008 (BCAA stimulate mTORC1-mediated protein synthesis); Lehninger Principles of Biochemistry Ch. 18 (BCAA catabolism, BCKDH complex); StatPearls MSUD NBK557773. | intervention: do(BCKDH complex loss-of-function) — maple syrup urine disease OMIM 248600'
- source: plasma_serine
  target: hepatic_gluconeogenesis
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: L-serine is a gluconeogenic amino acid; hepatic serine dehydratase (SDS) deaminates serine to pyruvate, which enters the gluconeogenic pathway (pyruvate carboxylase → OAA → PEPCK → …→ glucose-6-phosphate). Higher plasma serine provides more gluconeogenic substrate, raising hepatic gluconeogenesis flux. In PHGDH deficiency (serine biosynthesis defect), low plasma serine reduces gluconeogenic substrate supply. do(PHGDH LoF) → plasma serine ↓ → hepatic gluconeogenesis ↓.
  evidence: 'Lehninger Principles of Biochemistry Ch. 14 (serine dehydratase: serine → pyruvate + NH3; pyruvate as gluconeogenic precursor); Boron & Boulpaep Medical Physiology (amino acid gluconeogenesis); OMMBID PHGDH deficiency (serine biosynthesis disorders) — low serine, impaired gluconeogenic substrate availability; Newsholme & Leech, Functional Biochemistry in Health and Disease (amino acid gluconeogenesis). | intervention: do(PHGDH loss-of-function) — serine biosynthesis deficiency; also: do(glycine cleavage system LoF) — nonketotic hyperglycinemia (NKH), OMIM 605899'
- source: plasma_creatine
  target: plasma_creatinine
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: Creatinine is formed by the spontaneous, non-enzymatic, irreversible cyclization of phosphocreatine and creatine in muscle and other tissues. The daily creatinine production rate is directly proportional to the total body creatine pool; plasma creatinine concentration reflects this production at steady state. In creatine synthesis deficiency (AGAT or GAMT LoF), the total creatine pool is markedly reduced, resulting in very low plasma and urinary creatinine. do(AGAT LoF or GAMT LoF) → plasma creatine ↓ → creatinine production ↓ → plasma creatinine ↓.
  evidence: 'Creatine deficiency syndromes — AGAT deficiency OMIM 612718, GAMT deficiency OMIM 601240; Schulze A, J Inherit Metab Dis 2003 (markedly reduced urinary creatinine in AGAT/GAMT deficiency); GeneReviews creatine deficiency (NBK3794): ''plasma creatinine is reduced''; Wyss M & Kaddurah-Daouk R, Physiol Rev 2000 (creatine-to-creatinine conversion rate proportional to creatine pool size). | intervention: do(AGAT loss-of-function) — AGAT deficiency OMIM 612718; do(GAMT loss-of-function) — GAMT deficiency OMIM 601240'
- source: carbamoylphosphate_synthetase_1_activity
  target: blood_urea_nitrogen
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: 'Carbamoylphosphate synthetase 1 (CPS1) catalyzes the first committed and rate-limiting step of the urea cycle: NH3 + HCO3- + 2 ATP → carbamoyl phosphate + 2 ADP + Pi. CPS1 activity determines the rate of urea synthesis; urea is excreted by the kidney, and blood urea nitrogen (BUN) reflects the steady-state balance of urea production and renal excretion. CPS1 LoF abolishes carbamoyl phosphate production, blocking the entire urea cycle and markedly reducing BUN. Identical logic applies to NAGS LoF (NAGS makes the CPS1 activator N-acetylglutamate) and OTC LoF. do(CPS1 LoF) → urea cycle blocked → urea production ↓ → BUN ↓.'
  evidence: 'CPS1 deficiency OMIM 237300; ScienceDirect CPS1 deficiency overview — ''CPS1 deficiency causes hyperammonemia with low citrulline and reduced BUN''; Lehninger Principles of Biochemistry Ch. 18 (the urea cycle; CPS1 as the committed step, rate-limiting mitochondrial enzyme); Boron & Boulpaep Medical Physiology (hepatic nitrogen handling, urea synthesis); Batshaw ML et al., N Engl J Med 1984 (urea cycle disorders, low BUN in CPS1/OTC deficiency). | intervention: do(CPS1 loss-of-function) — CPS1 deficiency OMIM 237300; do(OTC loss-of-function) — OTC deficiency OMIM 311250; do(NAGS loss-of-function) — NAGS deficiency OMIM 237310'
- source: dmgdh_activity
  target: cellular_atp_level
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: Dimethylglycine dehydrogenase (DMGDH) is a mitochondrial FAD-dependent oxidoreductase that catalyzes the oxidative demethylation of N,N-dimethylglycine to sarcosine. The FADH2 generated is transferred to the mitochondrial electron-transfer flavoprotein (ETF), donating electrons to ETF-ubiquinone oxidoreductase and thence to ubiquinol-complex III of the respiratory chain, ultimately driving ATP synthesis. DMGDH LoF reduces this electron-donating flux, slightly lowering mitochondrial ATP production in liver cells where DMGDH is most active. do(DMGDH LoF) → FADH2 from DMG catabolism absent → reduced mitochondrial electron input → cellular ATP ↓ (slight).
  evidence: 'DMGDH deficiency OMIM 605850; Porter DH et al., J Biol Chem 1985 (DMGDH isolated from mitochondria; FAD reoxidation by ETF); PMC1275637 (AJHG 2005) — DMGDH deficiency with ~100-fold elevation of dimethylglycine; Lehninger Principles of Biochemistry (mitochondrial electron transport, ETF for fatty acid / amino acid oxidation). | intervention: do(DMGDH loss-of-function) — dimethylglycinuria / DMGDH deficiency OMIM 605850 [citations PubMed-verified]'
- source: plasma_sah
