- source: suox_activity
  target: cellular_atp_level
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: 'Sulfite oxidase (SUOX) oxidises sulfite to sulfate, the terminal step of cysteine/methionine catabolism. SUOX LoF (isolated sulfite oxidase deficiency or molybdenum cofactor deficiency) causes sulfite to accumulate; sulfite reacts with cystine to produce S-sulfocysteine (SSC). SSC is a structural analogue of glutamate that acts as a potent NMDA receptor agonist, causing sustained calcium influx, activation of calpain and downstream apoptotic cascades, and mitochondrial network disruption. NMDA-driven excitotoxicity and mitochondrial dysfunction deplete intracellular ATP in neurons (Na+/K+-ATPase overload + impaired oxidative phosphorylation). Sign: more SUOX activity → less SSC → less NMDA excitotoxicity → higher cellular ATP (do(SUOX LoF) = SSC accumulates → cellular ATP falls).'
  evidence: 'PMC5707142 (JCI 2017, Veldman et al.) — ''S-sulfocysteine/NMDA receptor-dependent signaling underlies neurodegeneration in molybdenum cofactor deficiency'': SSC activates NMDA-R, causes dose-dependent depolarisation, increased intracellular Ca2+, calpain activation, and cell death; pharmacological NMDA blockade abolishes neurotoxicity. PMC7817995 (Frontiers Genetics 2021) — ''Sulfite alters the mitochondrial network in molybdenum cofactor deficiency'': sulfite causes mitochondrial fragmentation and impairs oxidative phosphorylation, reducing cellular ATP. OMIM 272300 (isolated sulfite oxidase deficiency). Schwahn BC et al. JIMD 2024 consensus guidelines (doi:10.1002/jimd.12730). | intervention: do(SUOX biallelic LoF) = isolated sulfite oxidase deficiency, OMIM 272300: SSC accumulates → NMDA excitotoxicity → mitochondrial dysfunction → cellular ATP falls | intervention: do(SUOX biallelic LoF) — isolated sulfite oxidase deficiency, OMIM 272300'
