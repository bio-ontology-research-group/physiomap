  mechanism: 'S-adenosylhomocysteine (SAH) is a potent product inhibitor of all SAM-dependent methyltransferases (Ki ~0.5-1 µM, comparable to physiological concentrations); it competes with SAM at the methyl-donor binding site. Accumulation of SAH (as occurs in AHCY/SAH hydrolase deficiency) inhibits DNA methyltransferases and histone methyltransferases in hepatocytes, impairing transcriptional regulation of liver-specific genes including the albumin (ALB) gene. Clinical consequence: AHCY deficiency causes progressive liver disease including hypoalbuminemia. do(AHCY LoF) → SAH ↑ → global methyltransferase inhibition in hepatocytes → reduced albumin gene transcription → hepatic albumin synthesis ↓.'
