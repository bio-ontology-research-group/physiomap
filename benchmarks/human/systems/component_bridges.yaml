- source: plasma_selenium
  target: erythrocyte_glutathione_peroxidase_activity
  sign: +
  causal_evidence: perturbation
  mechanism: 'Selenium is the obligate selenocysteine constituent of the glutathione peroxidase 1 (GPX1) catalytic centre; within the selenium-deficient (below-plateau) range selenium availability is rate-limiting for functional GPX1 selenoprotein synthesis, so raising plasma selenium raises erythrocyte glutathione peroxidase activity. Above the plateau (~90-100 ng/mL plasma Se) the erythrocyte selenoprotein pool is saturated and d(GPx)/d(Se) approaches zero. The additive sign graph cannot express this saturation, so the + sign is asserted ONLY for the below-plateau / selenium-deficient regime, where the relationship is monotone non-decreasing (never negative).'
  evidence: 'Interventional selenium supplementation and cellular depletion/repletion. Endpoint measured: erythrocyte glutathione peroxidase (GPX1) activity. Intervention: controlled human selenium supplementation (sodium selenite or selenomethionine) in low-selenium subjects, and cellular selenium depletion followed by re-addition. Meta-analysis of organic-selenium RCTs on erythrocyte GPx (PMID 22443071): pooled controlled supplementation raises erythrocyte GPx activity (SMD ~0.36) in healthy adults — interventional do(Se up) -> GPx up. Thomson/Robinson New Zealand selenium-supplementation series (PMID 4026872): erythrocyte GPx activity rises with selenium then plateaus, valid as a selenium-status indicator only below the plateau (saturable enzyme). Context: human RCTs / depletion studies and cell culture; SATURABLE — sign + holds only in the deficient (below-plateau) range. | intervention: controlled selenium supplementation within the below-plateau range, do(plasma_selenium up) -> erythrocyte glutathione peroxidase activity up'
