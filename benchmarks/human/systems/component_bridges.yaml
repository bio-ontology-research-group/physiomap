  causal_evidence: genetic_lof_gof
  mechanism: Methemoglobin (Fe3+ haem) cannot bind molecular oxygen and does not participate in O2 transport. When the erythrocyte methemoglobin fraction rises, the proportion of functional oxyhaemoglobin (Fe2+ haem) available at any alveolar PO2 is correspondingly reduced, lowering arterial SaO2. Additionally, methemoglobin allosterically shifts the O2-dissociation curve of the remaining Fe2+ haem leftward (higher O2 affinity, impaired O2 unloading), but the dominant acute effect is the direct reduction in O2-carrying haemoglobin fraction. In hereditary methemoglobinemia (CYB5R3 LoF, OMIM 250800), metHb rises to 10-70% of total haemoglobin and patients present with cyanosis and reduced functional SaO2. do(CYB5R3 LoF) => erythrocyte_methemoglobin UP => hemoglobin_o2_saturation DOWN.
