# =============================================================================
# Renal function markers (urinary solute excretion, GFR estimators, tubular handling)
#                                    — PhysioMap fragment  *** DRAFT FOR REVIEW ***
# =============================================================================
# Hand-encoded to give PhysioMap groundable NODES for the HPO "renal_function_markers"
# directional gap terms (urinary electrolyte/solute excretion, plasma & urinary
# creatinine, BUN, cystatin C, urine osmolality, urinary tubular-injury / -secreted
# proteins, the serum osmolal gap, and PTH-independent tubular Ca reabsorption).
#
# Provenance (standard physiology + clinical chemistry):
#   - Boron & Boulpaep, Medical Physiology — renal handling of Na/K/Cl/Ca/Mg/PO4,
#     urine concentration (countercurrent multiplier / ADH / urea recycling),
#     glomerular filtration & creatinine clearance.
#   - Harrison's Principles of Internal Medicine — "Azotemia and Urinary Abnormalities",
#     biomarkers of GFR (creatinine, cystatin C, BUN) and acute kidney injury (NGAL).
#   - Rose & Post, Clinical Physiology of Acid-Base and Electrolyte Disorders —
#     urinary electrolyte excretion, osmolal gap.
#   - Brenner & Rector's The Kidney — uromodulin (Tamm-Horsfall protein), tubular
#     biomarkers (NGAL/LCN2, orosomucoid/AGP), proximal-tubule injury markers.
#
# Sign convention: each causal edge sign is the sign of the partial derivative of the
# target w.r.t. the source at steady state, all else equal (interventionist partial).
# More tubular REABSORPTION of a solute => LESS of that solute in the urine ("-"); the
# filtered load (plasma concentration x GFR) raises urinary excretion ("+").
#
# Boundary nodes referenced (owned by sibling fragments; verified present in the
# corpus node_inventory): gfr, plasma_calcium, plasma_phosphate, plasma_urate,
# plasma_sodium_concentration, plasma_potassium, plasma_magnesium,
# renal_phosphate_reabsorption, renal_magnesium_reabsorption, renal_urate_excretion,
# renal_potassium_excretion, sodium_excretion, sodium_water_reabsorption,
# plasma_bicarbonate, plasma_osmolality, anp/adh-related (NOT referenced unless verified).
#
# This fragment is INTENTIONALLY conservative on edges: most urinary-excretion nodes are
# grounded with ONLY the well-established "plasma filtered-load (+)" and/or
# "tubular-reabsorption (-)" edges that have an unambiguous textbook sign. Where a clean
# determinate mechanism/sign is not defensible (osmolal gap, secreted/injury proteins,
# urinary creatine), the node is left as a grounded island (it abstains) rather than
# fabricating an edge. Single/multi-scale (ORGAN_SYSTEM / ORGAN / CELLULAR).
# =============================================================================

name: hpo_renal_function_markers
description: >-
  DRAFT renal-function-marker fragment: urinary excretion of Na/K/Cl/Ca/Mg/PO4/urate,
  plasma & urinary creatinine, blood urea nitrogen, plasma cystatin C, urine osmolality,
  urine bicarbonate, the serum osmolal gap, urinary tubular proteins (uromodulin, NGAL,
  orosomucoid), urinary creatine, and PTH-independent renal tubular calcium reabsorption.
  Provides groundable PhysioMap nodes for the HPO renal_function_markers directional
  terms, with conservative, textbook-signed causal edges only where defensible.

