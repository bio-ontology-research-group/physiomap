causal_edges:
  # ---- filtered load raises urinary excretion (plasma conc x GFR) ----
  - source: plasma_calcium
    target: urinary_calcium
    sign: "+"
    mechanism: urinary calcium excretion = filtered load (plasma [Ca] x GFR) minus tubular reabsorption; raising plasma calcium raises the filtered load and thus calcium excretion (e.g. hypercalcemia -> hypercalciuria)
    evidence: "Boron & Boulpaep Medical Physiology (renal handling of calcium; filtered load); Rose & Post, Clinical Physiology of Acid-Base and Electrolyte Disorders (hypercalcemia -> hypercalciuria)"
  - source: plasma_phosphate
    target: urinary_phosphate
    sign: "+"
    mechanism: filtered phosphate load = plasma [PO4] x GFR; higher plasma phosphate raises filtered load and urinary phosphate excretion
    evidence: "Boron & Boulpaep Medical Physiology (renal phosphate handling); Brenner & Rector's The Kidney (phosphate excretion)"
  - source: plasma_urate
    target: urinary_urate
    sign: "+"
    mechanism: filtered urate load = plasma [urate] x GFR; higher plasma urate raises filtered load and (net of reabsorption) urinary urate excretion
    evidence: "Boron & Boulpaep Medical Physiology (renal urate handling); Harrison's (uric acid excretion) | textbook corroboration: OpenStax Biology 2e §bio-41.4 (Nitrogenous Wastes): uric acid is formed from purine breakdown; excess plasma urate is excreted in urine"
  - source: plasma_sodium_concentration
    target: urinary_sodium
    sign: "+"
    mechanism: filtered sodium load = plasma [Na] x GFR; higher filtered Na (all else equal) raises distal Na delivery and urinary sodium excretion
    evidence: "Boron & Boulpaep Medical Physiology (renal sodium handling; filtered load)"
  - source: plasma_potassium
    target: urinary_potassium
    sign: "+"
    mechanism: hyperkalemia stimulates aldosterone-independent and aldosterone-dependent distal K secretion; higher plasma potassium raises renal potassium excretion
    evidence: "Boron & Boulpaep Medical Physiology (renal potassium secretion; plasma K as a primary driver of distal K secretion)"
  - source: plasma_magnesium
    target: urinary_magnesium
    sign: "+"
    mechanism: filtered magnesium load = plasma [Mg] x GFR; higher plasma magnesium raises filtered load and urinary magnesium excretion (and reduces TAL paracellular reabsorption)
    evidence: "Boron & Boulpaep Medical Physiology (renal magnesium handling); Rose & Post (Mg excretion)"

  # ---- GFR clears creatinine/urea/cystatin C: higher GFR lowers the plasma marker ----
  - source: gfr
    target: plasma_creatinine
    sign: "-"
    mechanism: creatinine is produced at a near-constant rate and cleared almost entirely by glomerular filtration; at steady state plasma [creatinine] is inversely related to GFR (falling GFR raises plasma creatinine)
    evidence: "Harrison's Principles of Internal Medicine, 'Azotemia and Urinary Abnormalities' (creatinine as an inverse GFR marker); Boron & Boulpaep Medical Physiology (creatinine clearance ~ GFR)"
  - source: gfr
    target: blood_urea_nitrogen
    sign: "-"
    mechanism: urea is filtered and partially reabsorbed; at steady state with constant urea production, plasma urea nitrogen rises as GFR falls (azotemia)
    evidence: "Harrison's, 'Azotemia and Urinary Abnormalities' (BUN rises with falling GFR); Boron & Boulpaep Medical Physiology (renal urea handling) | textbook corroboration: OpenStax Biology 2e §bio-41.4 (Nitrogenous Wastes): BUN is used as an indicator of kidney function; impaired GFR reduces urea clearance and raises BUN"
  - source: gfr
    target: plasma_cystatin_c
    sign: "-"
    mechanism: cystatin C is produced at a constant rate by all nucleated cells, freely filtered, and catabolized by the proximal tubule; plasma cystatin C is inversely related to GFR (an endogenous GFR marker)
    evidence: "Harrison's Principles of Internal Medicine (cystatin C as a GFR estimator); Brenner & Rector's The Kidney (cystatin C and GFR)"
  - source: gfr
    target: urinary_creatinine
    sign: "+"
    mechanism: at steady state urinary creatinine excretion equals near-constant creatinine production; the spot urine creatinine level is filtration-driven and falls when GFR is very low (oliguric AKI), so higher GFR supports higher urine creatinine output
    evidence: "Boron & Boulpaep Medical Physiology (creatinine filtered and excreted; clearance ~ GFR); Harrison's (urine creatinine in clearance estimation)"

  # ---- urea recycling contributes to the inner-medullary osmotic gradient ----
  - source: blood_urea_nitrogen
    target: urine_osmolality
    sign: "+"
    mechanism: urea recycling into the inner medulla contributes substantially to the medullary osmotic gradient that drives maximal urine concentration; higher delivered urea raises achievable urine osmolality
    evidence: "Boron & Boulpaep Medical Physiology (urea recycling and the countercurrent multiplier; contribution of urea to maximal urine concentration)"

  # ---- tubular calcium reabsorption removes Ca from the urine ----
  - source: renal_calcium_reabsorption
    target: urinary_calcium
    sign: "-"
    mechanism: tubular reabsorption returns filtered calcium to the blood; higher reabsorption lowers urinary calcium (PTH-independent gain-of-function of CaSR/TRPV5-type reabsorption -> hypocalciuria; loss -> hypercalciuria)
    evidence: "Boron & Boulpaep Medical Physiology (renal calcium reabsorption: TAL paracellular + DCT TRPV5); Brenner & Rector's The Kidney (tubular Ca handling)"

constitutive_edges: []   # none — within/cross-scale lifts deferred (Phase 1)
