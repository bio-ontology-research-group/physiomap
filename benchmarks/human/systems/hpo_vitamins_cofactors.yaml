causal_edges:
  # --- cobalamin uptake / transport -> circulating coenzyme forms ---
  # Transcobalamin-II is the functional plasma carrier that delivers cobalamin into
  # cells (TCN2 deficiency, OMIM 275350, causes functional intracellular B12 deficiency
  # despite normal total serum B12); higher TC-II raises cellular cobalamin uptake.
  - source: plasma_transcobalamin_2
    target: cellular_cobalamin_uptake
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: transcobalamin-II is the plasma transport protein that binds cobalamin and is endocytosed via the TC-II receptor (CD320), delivering B12 into cells; more functional TC-II raises cellular cobalamin uptake (TCN2 LoF -> functional intracellular B12 deficiency)
    evidence: "Boron & Boulpaep Medical Physiology (B12 plasma transport by transcobalamin II); OMIM 275350 (transcobalamin-II deficiency -> functional B12 deficiency); Harrison's, 'Megaloblastic Anemias'"
  # Cellular cobalamin uptake supplies the intracellular cobalamin that is converted to
  # the two coenzyme forms: cytosolic methylcobalamin (methionine synthase) and
  # mitochondrial adenosylcobalamin (methylmalonyl-CoA mutase).
  - source: cellular_cobalamin_uptake
    target: plasma_methylcobalamin
    sign: "+"
    mechanism: intracellular cobalamin (from cellular uptake) is processed to methylcobalamin (the MTR / methionine-synthase coenzyme); reduced cobalamin uptake lowers methylcobalamin
    evidence: "Lehninger Principles of Biochemistry (cobalamin coenzymes: methylcobalamin for methionine synthase); cblC/cblF/cblJ intracellular-cobalamin disorders reduce both coenzyme forms"
  - source: cellular_cobalamin_uptake
    target: plasma_adenosylcobalamin
    sign: "+"
    mechanism: intracellular cobalamin (from cellular uptake) is processed in mitochondria to adenosylcobalamin (the methylmalonyl-CoA-mutase coenzyme); reduced cobalamin uptake lowers adenosylcobalamin
    evidence: "Lehninger Principles of Biochemistry (cobalamin coenzymes: adenosylcobalamin for methylmalonyl-CoA mutase); intracellular cobalamin-processing disorders (cblA/cblB) reduce adenosylcobalamin"
  # Total plasma B12 is the precursor pool for both coenzyme forms.
  - source: plasma_vitamin_b12
    target: plasma_methylcobalamin
    sign: "+"
    mechanism: methylcobalamin is a coenzyme form derived from the body cobalamin pool; lower total cobalamin lowers the methylcobalamin available
    evidence: "Lehninger Principles of Biochemistry (cobalamin vitamers / coenzyme forms derive from the cobalamin pool); Harrison's, 'Megaloblastic Anemias'"
  - source: plasma_vitamin_b12
    target: plasma_adenosylcobalamin
    sign: "+"
    mechanism: adenosylcobalamin is a coenzyme form derived from the body cobalamin pool; lower total cobalamin lowers the adenosylcobalamin available
    evidence: "Lehninger Principles of Biochemistry (cobalamin vitamers / coenzyme forms derive from the cobalamin pool)"

  # --- folate: 5-methyl-THF is the dominant circulating folate; CSF pool is supplied
  #     from blood by the choroid-plexus folate receptor (FOLR1). ---
  - source: plasma_folate
    target: plasma_5_methyltetrahydrofolate
    sign: "+"
    mechanism: 5-methyltetrahydrofolate is the principal circulating form of folate; total blood folate and 5-methyl-THF move together (5-methyl-THF is ~the measured blood folate)
    evidence: "Lehninger Principles of Biochemistry (5-methyl-THF is the dominant plasma folate); Harrison's, 'Folate deficiency'"
  - source: plasma_folate
    target: csf_folate
    sign: "+"
    mechanism: CSF folate is actively transported from blood across the choroid plexus by the folate receptor FOLR1 (cerebral folate transport); lower blood folate lowers CSF folate (and FOLR1 LoF causes isolated CSF folate deficiency)
    evidence: "GeneReviews / OMIM 613068 (cerebral folate transport deficiency, FOLR1); Boron & Boulpaep Medical Physiology (choroid-plexus transport)"

  # --- biotin recycling: biotinidase releases free biotin from biocytin/biotinylated
  #     peptides; deficiency causes secondary biotin deficiency. ---
  - source: biotinidase_activity
    target: plasma_biotin
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: biotinidase cleaves biocytin and biotinyl-peptides to release free biotin for recycling and intestinal absorption; reduced biotinidase activity lowers free biotin (biotinidase deficiency = secondary biotin deficiency)
    evidence: "Lehninger Principles of Biochemistry (biotin recycling by biotinidase); OMIM 253260 (biotinidase deficiency); Harrison's, 'Vitamin deficiency'"

  # --- vitamin D 25-hydroxylation (edge into EXISTING corpus node) ---
  # boundary ref: plasma_25oh_vitamin_d is reused / shared with the existing map.
  # NOTE: no defensible additional driver added here; the node is shared so its HPO
  # directional terms attach to the existing node. (No fabricated edge.)

constitutive_edges: []   # none — single-scale analyte/activity pools (Phase 1)
