  acid, CoQ10, transcobalamins I & II, CSF pyridoxal-5'-phosphate) plus cofactor-handling
  enzyme-activity roots (biotinidase, holocarboxylase synthetase, 6-pyruvoyltetrahydro-
  pterin synthase, sepiapterin reductase) and cellular cobalamin uptake. Encodes the
  HPO directional gap terms for the vitamins_cofactors theme as (node, sign). Mostly
  single-scale analyte/activity nodes; only well-cited mechanistic edges added.

