# =============================================================================
# Vitamins & cofactors — circulating / tissue pools + cofactor-handling enzymes
#                                    — PhysioMap fragment  *** DRAFT FOR REVIEW ***
# =============================================================================
# Hand-encoded, mostly single-scale analyte pools (ORGAN_SYSTEM = plasma/serum/blood;
# TISSUE = muscle/adipose/CSF pools) plus a handful of cofactor-handling ENZYME
# ACTIVITY roots (scale CELLULAR, with a bearer cell/organ). Each node is a
# physiological VARIABLE; HPO directional terms map to (node, sign). Edge signs are
# the sign of the partial derivative of the target w.r.t. the source at steady state.
# ROBERT: please correct signs / edges / IRIs.
#
# Provenance (textbooks / databases):
#   - Lehninger Principles of Biochemistry (vitamins as coenzyme precursors;
#     one-carbon / folate metabolism; biotin & biotin-dependent carboxylases;
#     NAD biosynthesis; cobalamin coenzymes methyl-/adenosyl-Cbl).
#   - Boron & Boulpaep Medical Physiology (intestinal absorption & plasma transport
#     of B12 by haptocorrin / transcobalamin; vitamin D 25-hydroxylation).
#   - Harrison's Principles of Internal Medicine ("Vitamin and Trace-Mineral
#     Deficiency and Excess"; megaloblastic anemia / B12 & folate).
#   - Williams Textbook of Endocrinology (vitamin D metabolism: 25-OH-D = calcifediol).
#   - OMIM / GeneReviews for the monogenic loci that produce these directional
#     phenotypes (cited per node where relevant), e.g.:
#       BTD (biotinidase deficiency, OMIM 253260), HLCS / holocarboxylase synthetase
#       deficiency (OMIM 253270), PTS / 6-pyruvoyltetrahydropterin synthase deficiency
#       (OMIM 261640), SPR / sepiapterin reductase deficiency (OMIM 612716),
#       TCN2 transcobalamin-II deficiency (OMIM 275350), TCN1 transcobalamin-I /
#       haptocorrin deficiency (OMIM 193090), MTHFR / cerebral folate transport
#       (FOLR1, OMIM 613068), primary CoQ10 deficiency, ataxia with vitamin-E
#       deficiency (TTPA, OMIM 277460), NAD-dependent CNDD (NADSYN1/HAAO).
#   - Ontology IRIs verified by grepping the local OBO caches
#     (CHEBI.obo / PR.obo / UBERON.obo / CL.obo); null where not exactly matched.
#
# Existing-map node REUSED (no new node created):
#   plasma_25oh_vitamin_d  (calcidiol / calcifediol) — HP:0012053 (-) & HP:0031414 (+)
#
# Most nodes are grounded ISLANDS (no causal edge) — a deliberately safe encoding that
# abstains. A few defensible mechanistic edges are added with citations (see below).
# validate_fragment will WARN "island; will not integrate" only if NO boundary ref is
# used; here we add a boundary edge into the EXISTING node plasma_25oh_vitamin_d.
# =============================================================================

name: hpo_vitamins_cofactors
