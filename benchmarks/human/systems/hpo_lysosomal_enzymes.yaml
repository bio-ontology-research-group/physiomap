  - id: plasma_beta_hexosaminidase
    label: serum total beta-hexosaminidase concentration
    scale: organ_system
    # entity_iri omitted: serum "total hexosaminidase" is a mix of Hex A + Hex B isozymes,
    # not a single PR protein class — left null rather than fabricated.
    quality_iri: PATO:0000033         # concentration

