    scale: cellular
    entity_iri: PR:000008015          # alpha-galactosidase A
    quality_iri: PATO:0001414
    bearer_entity_iri: CL:0000738     # leukocyte (Fabry disease assay source)
  - id: beta_hexosaminidase_a_activity
    label: beta-hexosaminidase A (HEXA, alpha-subunit) activity
    scale: cellular
    entity_iri: PR:000008524          # beta-hexosaminidase subunit alpha (HEXA; deficient in Tay-Sachs)
    quality_iri: PATO:0001414
