# =============================================================================
# Lysosomal (and lysosome-related) enzyme activities / circulating levels
#                                    — PhysioMap fragment  *** DRAFT FOR REVIEW ***
# =============================================================================
# Covers the HPO "abnormal lysosomal enzyme activity/level" gap terms used to encode
# the lysosomal storage disorders (LSDs) and related conditions. Each term is a clean
# single-enzyme directional quantity: a measured ENZYME ACTIVITY (catalytic activity,
# PATO:0001414) in leukocytes / cultured fibroblasts / tissue, OR a circulating
# protein LEVEL (concentration, PATO:0000033) in plasma/serum.
#
# Provenance (clinical/biochemical genetics references):
#   - Online Metabolic & Molecular Bases of Inherited Disease (OMMBID), "Lysosomal
#     storage disorders" chapters.
#   - Harrison's Principles of Internal Medicine, "Lysosomal Storage Diseases".
#   - Nelson Textbook of Pediatrics, "Mucopolysaccharidoses", "Sphingolipidoses",
#     "Mucolipidoses", "Oligosaccharidoses".
#   - Lehninger Principles of Biochemistry (glycosaminoglycan / sphingolipid / glycoprotein
#     catabolism — the lysosomal hydrolase cascades).
#   - Gene/enzyme identities cross-checked against OMIM and UniProt; protein IRIs verified
#     against the downloaded Protein Ontology (PR.obo); cells/GO verified against CL.obo/GO.obo.
#
# MODELING DECISIONS
#   - These are *primary* enzyme/level analytes. A monogenic LoF clamps the enzyme-activity
#     node DOWN (deficiency); a few terms are the SECONDARY *rise* of a non-deficient
#     lysosomal hydrolase or a macrophage activation marker measured as a disease biomarker
#     (chitotriosidase, cathepsin D, the "elevated circulating beta-mannosidase /
#     alpha-L-fucosidase / arylsulfatase / N-acetylglucosaminidase" terms). Both directions
#     of a given analyte map to the SAME node with opposite signs.
#   - Activity nodes: scale CELLULAR, quality PATO:0001414 (catalytic activity), with a
#     bearer cell. Most LSD enzymes are assayed in LEUKOCYTES (CL:0000738) or cultured
#     FIBROBLASTS (CL:0000057); macrophage-derived biomarkers (chitotriosidase, cathepsin D
#     in activated macrophages) bear MACROPHAGE (CL:0000235). The bearer is the standard
#     clinical assay source, not an exhaustive claim of expression.
#   - Circulating protein LEVELS (serum beta-hexosaminidase total, plasma cathepsin D):
#     scale ORGAN_SYSTEM, quality PATO:0000033 (concentration).
#   - entity_iri = the human enzyme PROTEIN class in PR (Protein Ontology), verified by exact
#     name/synonym match in PR.obo. Left null only where no clean PR class matched.
#
# NO CAUSAL EDGES: each analyte is a primary enzyme/level root. There is no defensible,
# citation-backed within-scale signed edge to an EXISTING PhysioMap node (the downstream
# substrate/storage phenotypes — GAG storage, HS/DS/KS accumulation, sphingolipid storage —
# are not yet modeled as nodes). Per PhysioMap policy we add NO fabricated edges; these are
# grounded ABSTAINING roots (clamped under a do() intervention). This is therefore a
# self-contained ISLAND fragment (validate_fragment WARNs "island", which is allowed).
# =============================================================================

name: hpo_lysosomal_enzymes
description: >-
  DRAFT lysosomal (and lysosome-related) enzyme activity and circulating-level analytes
  underpinning the lysosomal storage disorders (sphingolipidoses, mucopolysaccharidoses,
  oligosaccharidoses, mucolipidoses, NCLs, Wolman/CESD) and related macrophage biomarkers.
  Each node is a primary enzyme-activity (cellular, catalytic activity) or circulating
  protein-level (organ_system, concentration) variable; entity IRIs are the human enzyme
  protein classes verified against the Protein Ontology. Self-contained island (no causal
  edges) — every node is a grounded abstaining root. Phase 1.

nodes:
  # ---- Sphingolipidoses ----
  - id: beta_galactosidase_activity
    label: lysosomal acid beta-galactosidase (GLB1) activity
    scale: cellular
    entity_iri: PR:000008016          # eukaryotic-type beta-galactosidase (syn "acid beta-galactosidase", GLB1 product)
    quality_iri: PATO:0001414         # catalytic activity
    bearer_entity_iri: CL:0000738     # leukocyte (standard GM1-gangliosidosis/Morquio-B assay source)
  - id: glucocerebrosidase_activity
    label: lysosomal acid glucocerebrosidase (GBA, glucosylceramidase) activity
    scale: cellular
    entity_iri: PR:000007867          # lysosomal acid glucosylceramidase (syn "beta-glucocerebrosidase")
    quality_iri: PATO:0001414
    bearer_entity_iri: CL:0000738     # leukocyte (Gaucher disease assay source)
  - id: galactocerebrosidase_activity
    label: galactocerebrosidase (GALC, galactosylceramidase) activity
    scale: cellular
    entity_iri: PR:000007811          # galactocerebrosidase (syn "galactosylceramidase")
    quality_iri: PATO:0001414
    bearer_entity_iri: CL:0000738     # leukocyte (Krabbe disease assay source)
  - id: acid_ceramidase_activity
