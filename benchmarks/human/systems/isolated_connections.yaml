causal_edges:
- source: plasma_pyruvate
  target: urinary_organic_acids
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: Pyruvate is an organic acid; when plasma pyruvate is elevated (e.g., pyruvate dehydrogenase complex deficiency, PDC def), it spills into urine and directly elevates total urinary organic acid output — do(plasma pyruvate UP) => urinary organic acids UP
  evidence: 'Lehninger Principles of Biochemistry Ch. 16 (pyruvate as organic acid, renal filtration/excretion); pyruvate dehydrogenase complex deficiency (OMIM 312170): elevated plasma pyruvate and increased urinary organic acids are diagnostic; Scriver''s OMMBID (organic aciduria overview: elevated organic acids in urine reflect elevated plasma precursors) | intervention: do(PDC deficiency / plasma pyruvate elevation)'
- source: plasma_alpha_ketoglutarate
  target: urinary_ketoacids
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: Alpha-ketoglutarate (2-oxoglutarate) is a 2-oxo monocarboxylic acid (keto acid); elevated plasma alpha-KG exceeds the renal reabsorption threshold, spilling into urine and raising total urinary keto acid levels — do(plasma alpha-KG UP) => urinary keto acids UP
  evidence: 'Alpha-ketoglutarate dehydrogenase complex deficiency / OGDH deficiency (OMIM 203740): elevated urine alpha-ketoglutarate is a hallmark (MedLink Neurology, alpha-ketoglutarate dehydrogenase deficiency review); Lehninger Principles of Biochemistry Ch. 16 (TCA cycle: alpha-ketoglutarate = 2-oxoglutarate, a keto acid; renal organic acid excretion) | intervention: do(OGDH/alpha-ketoglutarate dehydrogenase deficiency)'
- source: aco2_activity
  target: urinary_citrate
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: Aconitase 2 (ACO2) catalyses the isomerisation of citrate to isocitrate via cis-aconitate in the TCA cycle; reduced ACO2 activity leaves citrate unconsumed, causing it to accumulate — do(ACO2 deficiency) => citrate UP. Citrate is excreted in urine (major urinary organic acid).
  evidence: 'Lehninger Principles of Biochemistry Ch. 16 (aconitase: citrate -> cis-aconitate -> isocitrate); Boron & Boulpaep Medical Physiology (renal citrate handling) | intervention: do(ACO2 loss-of-function) [citations PubMed-verified]'
- source: aco2_activity
  target: urinary_aconitic_acid
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: 'ACO2 converts citrate to cis-aconitate (intermediate) and then to isocitrate; ACO2 deficiency causes cis-aconitate to FALL (net: less aconitate produced from the accumulating citrate at physiological equilibrium). Higher ACO2 activity produces more cis-aconitate from citrate. PMID 28463998 confirms cis-aconitate is reduced 36.9-fold in ACO2-deficient plasma.'
  evidence: 'Plasma metabolomics in ACO2 deficiency (PMID 28463998, Schwarzmayr et al. 2017): cis-aconitate and isocitrate markedly decreased in ACO2-deficient patients; Lehninger Principles of Biochemistry Ch. 16 (aconitase reaction: citrate -> cis-aconitate -> isocitrate) | intervention: do(ACO2 loss-of-function) [citations PubMed-verified]'
- source: aco2_activity
  target: plasma_aconitate
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: 'ACO2 produces cis-aconitate from citrate; ACO2 deficiency reduces plasma cis-aconitate (PMID 28463998: 36.9-fold decrease). More ACO2 activity => more aconitate produced => higher plasma aconitate.'
  evidence: 'Plasma metabolomics in ACO2 deficiency (PMID 28463998, Schwarzmayr et al. 2017 PLOS One): cis-aconitate is a primary diagnostic biomarker reduced in ACO2-deficient patients; infantile cerebellar-retinal degeneration (OMIM 614559) | intervention: do(ACO2 loss-of-function) [citations PubMed-verified]'
- source: alpha_ketoglutarate_dehydrogenase_activity
  target: urinary_alpha_ketoglutarate
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: The alpha-ketoglutarate (2-oxoglutarate) dehydrogenase complex (OGDH) oxidatively decarboxylates alpha-ketoglutarate to succinyl-CoA in the TCA cycle; reduced OGDH activity leaves alpha-ketoglutarate unconsumed, causing it to accumulate and spill into urine — do(OGDH deficiency) => elevated urinary alpha-ketoglutarate
  evidence: 'Alpha-ketoglutarate dehydrogenase deficiency (OMIM 203740; Orphanet oxoglutaric aciduria): elevated urine alpha-ketoglutarate is the hallmark biomarker; MedLink Neurology (alpha-KG dehydrogenase deficiency review); Lehninger Principles of Biochemistry Ch. 16 (TCA cycle: OGDH complex, step 4) | intervention: do(OGDH / alpha-ketoglutarate dehydrogenase complex deficiency)'
- source: alpha_ketoglutarate_dehydrogenase_activity
  target: csf_alpha_ketoglutarate
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: OGDH deficiency causes systemic alpha-ketoglutarate accumulation; the compound crosses into CSF and is elevated there in OGDH-deficient patients — reduced OGDH activity raises CSF alpha-KG
  evidence: 'Alpha-ketoglutarate dehydrogenase deficiency (OMIM 203740): neurological phenotype with elevated CSF metabolites; MedLink Neurology (oxoglutaric aciduria); Lehninger Principles of Biochemistry Ch. 16 | intervention: do(OGDH / alpha-ketoglutarate dehydrogenase complex deficiency)'
- source: succinate_dehydrogenase_activity
  target: plasma_succinate
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: Succinate dehydrogenase (complex II / SDHA) oxidises succinate to fumarate in the TCA cycle; deficiency blocks succinate consumption, causing succinate accumulation in blood — do(SDH/SDHA deficiency) => plasma succinate UP
  evidence: 'Mitochondrial complex II deficiency (SDHA; OMIM 252011): urine organic acids show elevated succinic acid; SDH-deficient tumors show high succinate (PMC5219629); Succinate Dehydrogenase Deficiency review (PMC7660022): evaluation of urine organic acids shows significantly elevated succinic acid; Lehninger Principles of Biochemistry Ch. 16 (SDH, TCA step 6: succinate -> fumarate) | intervention: do(SDH/SDHA loss-of-function)'
- source: succinate_dehydrogenase_activity
  target: urinary_succinate
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: SDH deficiency causes succinate accumulation; succinate is excreted in urine (succinic aciduria) — reduced SDH activity raises urinary succinate
  evidence: 'Mitochondrial complex II deficiency (OMIM 252011): significantly elevated urinary succinic acid is documented (PMC7660022, Succinate Dehydrogenase Deficiency: A Treatable Neurometabolic Disorder); Lehninger Principles of Biochemistry Ch. 16 | intervention: do(SDH/SDHA loss-of-function)'
- source: succinate_dehydrogenase_activity
  target: urinary_succinic_acid
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: SDH deficiency causes succinic acid accumulation and urinary succinic aciduria — same mechanism as urinary_succinate (both are CHEBI:15741 succinic acid nodes representing the same analyte in urine)
  evidence: 'Mitochondrial complex II deficiency (OMIM 252011): MRS detects high succinate peak; urine organic acids show significantly elevated succinic acid (PMC7660022); Lehninger Principles of Biochemistry Ch. 16 | intervention: do(SDH/SDHA loss-of-function)'
- source: fumarate_hydratase_activity
  target: plasma_fumarate
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: Fumarate hydratase (fumarase, FH) catalyses the reversible hydration of fumarate to malate in the TCA cycle; FH deficiency blocks fumarate consumption, causing fumarate accumulation in plasma — do(FH deficiency) => plasma fumarate UP
  evidence: 'Fumarase deficiency / fumaric aciduria (FH; OMIM 606812): urinary fumarate, succinate, and citrate elevated; fumarate hydratase activity profoundly decreased in fibroblasts (PMID 10805328, Kerrigan et al. 2000 Ann Neurol); Lehninger Principles of Biochemistry Ch. 16 (fumarase, TCA step 7: fumarate -> malate) | intervention: do(FH / fumarate hydratase deficiency) [citations PubMed-verified]'
- source: fumarate_hydratase_activity
  target: urinary_fumarate
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: FH deficiency causes fumarate accumulation and urinary fumaric aciduria — reduced FH activity leaves fumarate unconsumed, raising urinary fumarate
  evidence: 'Fumarase deficiency / fumaric aciduria (FH; OMIM 606812): elevated urinary fumarate, succinate, and citrate are the hallmark findings (PMID 10805328; MedlinePlus Genetics: fumarase deficiency); Scriver''s OMMBID (fumaric aciduria) | intervention: do(FH / fumarate hydratase deficiency) [citations PubMed-verified]'
- source: fumarate_hydratase_activity
  target: csf_fumarate
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: FH deficiency causes systemic fumarate accumulation including in CSF; reduced FH activity raises CSF fumarate
  evidence: 'Fumarase deficiency (FH; OMIM 606812): neurological disease with brain involvement; fumarate is found elevated in CSF in fumaric aciduria (Saudubray, Inborn Metabolic Diseases); Lehninger Principles of Biochemistry Ch. 16 | intervention: do(FH / fumarate hydratase deficiency)'
- source: fumarate_hydratase_activity
  target: urinary_malic_acid
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: Fumarate hydratase produces malate from fumarate; FH deficiency reduces malate production — do(FH deficiency) => urinary malate FALLS. Higher FH activity => more malate produced => higher urinary malate.
  evidence: 'Fumarase deficiency (FH; OMIM 606812); Lehninger Principles of Biochemistry Ch. 16 (fumarase: fumarate + H2O -> L-malate) | intervention: do(FH / fumarate hydratase deficiency) [citations PubMed-verified]'
- source: scot_activity
  target: urinary_3_hydroxybutyrate
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: SCOT (succinyl-CoA:3-oxoacid CoA transferase, OXCT1) activates acetoacetate to acetoacetyl-CoA for peripheral ketolysis; SCOT deficiency blocks ketone body utilisation, causing ketone bodies including 3-hydroxybutyrate to accumulate in blood and spill into urine — reduced SCOT raises urinary 3-hydroxybutyrate
  evidence: 'SCOT/OXCT1 deficiency (OMIM 245050): persistent non-fasting ketosis; elevated beta-hydroxybutyric acid and acetoacetic acid detected in urine (ScienceDirect clinical case series, OMIM 245050 entry); Scriver''s OMMBID (SCOT deficiency: ketoaciduria) | intervention: do(SCOT / OXCT1 loss-of-function)'
- source: scot_activity
  target: plasma_hydroxybutyrate
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: SCOT deficiency blocks peripheral ketolysis; 3-hydroxybutyrate (the predominant circulating ketone body at steady state) accumulates in plasma — reduced SCOT raises plasma hydroxybutyrate (generic hydroxybutyrate node, same CHEBI:20067 as plasma_3_hydroxybutyrate)
  evidence: 'SCOT/OXCT1 deficiency (OMIM 245050): persistent non-fasting ketosis with elevated plasma ketone bodies; Scriver''s OMMBID (SCOT deficiency: permanent ketosis) | intervention: do(SCOT / OXCT1 loss-of-function)'
- source: ssadh_activity
  target: urinary_4_hydroxybutyrate
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: Succinic semialdehyde dehydrogenase (SSADH / ALDH5A1) oxidises succinic semialdehyde (SSA) to succinate in the GABA catabolism pathway; SSADH deficiency allows SSA to be reduced instead to gamma-hydroxybutyrate (GHB / 4-hydroxybutyric acid), which accumulates massively in urine — reduced SSADH raises urinary 4-hydroxybutyrate
  evidence: 'SSADH deficiency (ALDH5A1; OMIM 271980): the hallmark laboratory finding is elevated 4-hydroxybutyric (gamma-hydroxybutyric) acid in urine (GeneReviews NBK1195; NORD rare disease profile; SSADH Association); Saudubray, Inborn Metabolic Diseases; Blau, Physician''s Guide to Inherited Metabolic Diseases | intervention: do(SSADH / ALDH5A1 loss-of-function)'
- source: ssadh_activity
  target: plasma_4_hydroxybutyrate
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: SSADH deficiency causes systemic 4-hydroxybutyrate (GHB) accumulation; GHB elevates in plasma — reduced SSADH raises plasma 4-hydroxybutyrate
  evidence: 'SSADH deficiency (ALDH5A1; OMIM 271980): GHB elevated in urine, plasma, and CSF (NORD; GeneReviews NBK1195: ''elevated levels of GHB in the liquid portion of the blood (plasma)'') | intervention: do(SSADH / ALDH5A1 loss-of-function)'
- source: ssadh_activity
  target: csf_4_hydroxybutyrate
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: SSADH deficiency elevates GHB/4-hydroxybutyrate in CSF — particularly relevant as SSADH is highly expressed in GABAergic neurons (CL:0000617), and the GABA catabolic block causes CNS GHB accumulation
  evidence: 'SSADH deficiency (ALDH5A1; OMIM 271980): GHB elevated in urine, plasma, AND CSF — CSF 4-HBA elevation is the clearest CNS biomarker (GeneReviews NBK1195; NORD: ''the fluid that flows through the brain and spinal canal'') | intervention: do(SSADH / ALDH5A1 loss-of-function)'
- source: agt_activity
