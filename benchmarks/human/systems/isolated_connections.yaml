  evidence: 'Primary hyperoxaluria type 1 (AGXT; OMIM 259900): plasma oxalate elevation leading to systemic oxalosis documented in PH1 (Harrison''s Principles of Internal Medicine; Scriver''s OMMBID — PH1: hyperoxaluria, nephrolithiasis, systemic oxalosis with elevated plasma oxalate) | intervention: do(AGT / AGXT loss-of-function)'
- source: agt_activity
  target: plasma_glycolate
