  mechanism: In AGT deficiency (PH1), undegraded glyoxylate is reduced by lactate dehydrogenase to glycolate; elevated plasma glycolate is part of the diagnostic signature — reduced AGT activity raises plasma glycolate
  evidence: 'Primary hyperoxaluria type 1 (AGXT; OMIM 259900): diagnostic signature is elevated urinary oxalate AND glycolate (Scriver''s OMMBID — PH1: ''hyperoxaluria with elevated urinary glycolate + oxalate is the diagnostic signature''); elevated plasma glycolate in systemic PH1 | intervention: do(AGT / AGXT loss-of-function)'
- source: agt_activity
  target: urinary_glyoxylate
  sign: '-'
