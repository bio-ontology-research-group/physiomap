# =============================================================================
# Reproductive hypothalamic-pituitary-gonadal (HPG) axis — PhysioMap fragment
# *** DRAFT FOR REVIEW ***
# =============================================================================
# Hand-encoded canonical HPG-axis physiology. Every causal edge sign is the sign
# of the partial derivative of the target w.r.t. the source at steady state, all
# else equal (interventionist partial). The axis is encoded sex-generically at the
# hypothalamic/pituitary tier (GnRH -> LH/FSH) and then split into the gonadal
# steroid/peptide outputs (estradiol, progesterone, testosterone, inhibin).
#
# FEEDBACK LOOPS encoded (the whole point):
#   * Negative feedback (tonic / luteal & male):
#       GnRH -> LH (+), GnRH -> FSH (+)
#       LH -> {estradiol, progesterone, testosterone} (+)
#       FSH -> {estradiol, inhibin} (+)
#       estradiol/progesterone/testosterone -| GnRH, LH, FSH      (negative)
#       inhibin -| FSH (selective FSH suppression; activin/inhibin balance)
#     => classic HPG negative-feedback SCC that defends steroid levels.
#   * Positive feedback (mid-cycle LH surge): sustained high estradiol SWITCHES
#     to STIMULATING GnRH/LH (the surge). This is genuinely sign-AMBIGUOUS as a
#     single steady-state partial (E2 -> LH is negative at low/moderate E2 but
#     positive at sustained high E2). Because causal_subgraph() builds a plain
#     nx.DiGraph (one edge per (source,target)), the tonic "-" and surge "+" arms
#     are FOLDED INTO A SINGLE estradiol->lh "?" edge rather than two parallel edges
#     (two would collapse to whichever loads last). Note E2 -| GnRH and E2 -| FSH
#     remain "-" (tonic). Documented for ROBERT to split if the model gains a
#     thresholded/dynamic representation.
#
# CROSS-SYSTEM COUPLING to the existing map (boundary nodes, owned by siblings):
#   * cortisol -| gnrh, lh   (stress/HPA suppression of reproduction; functional
#     hypothalamic amenorrhea) — connects to adrenal_cortisol.yaml.
#   * leptin -> gnrh (+)  (energy availability / adipostat signal permissively
#     gating the GnRH pulse generator) — connects to energy_balance_appetite.yaml.
#     NOTE: this edge was originally (incorrectly) drawn FROM thyroid.yaml's
#     metabolic_rate (an O2-consumption / energy-EXPENDITURE variable). The
#     interventionist partial of an expenditure variable on GnRH is NEGATIVE (raising
#     expenditure at fixed intake worsens energy availability and suppresses GnRH),
#     so it was re-sourced to the true energy-AVAILABILITY/stores signal, leptin (+).
#
# KISSPEPTIN COLLAPSE (documented abstraction): the kisspeptin/KNDy pulse-generator
# intermediary is collapsed — GnRH is used directly as the hypothalamic drive. The
# steroid/leptin/cortisol feedbacks physiologically act largely via kisspeptin neurons;
# this is an acceptable single-scale ORGAN_SYSTEM abstraction and removes no loop.
#
# SOURCES (verified):
#   * BioModels BIOMD0000000494 — Roblitz2013, "Menstrual Cycle following GnRH
#     analogue administration"; Röblitz S, Stötzel C, Deuflhard P, Jones HM,
#     Azulay D-O, van der Graaf PH, Martin SW. "A mathematical model of the human
#     menstrual cycle for the administration of GnRH analogues." J Theor Biol.
#     2013;321:8-27. PMID:23206386. (GnRH->LH/FSH->E2/P4 with E2/P4/inhibin
#     feedback and the E2-driven mid-cycle LH surge.)
#   * Boron & Boulpaep, Medical Physiology — reproductive endocrinology chapters
#     (HPG axis; gonadotropin regulation; inhibin selective FSH feedback; the
#     mid-cycle estradiol positive-feedback LH surge).
#   * Williams Textbook of Endocrinology — neuroendocrine control of reproduction;
#     functional hypothalamic amenorrhea (CRH/cortisol suppression of GnRH).
#
# Scope: single scale (ORGAN_SYSTEM); no constitutive (cross-scale) edges.
# ROBERT: please correct signs/edges; in particular the E2 positive-feedback arm.
# =============================================================================

name: reproductive_hpg
description: >-
  DRAFT reproductive HPG-axis fragment as a PhysioMap signed cyclic causal graph.
  Owns gnrh, lh, fsh, estradiol, progesterone, testosterone, inhibin. Encodes the
  GnRH->LH/FSH->gonadal-steroid cascade, the HPG negative-feedback loops, inhibin's
  selective FSH feedback, and the (sign-ambiguous) mid-cycle estradiol positive
  feedback driving the LH surge. Couples to the existing map via cortisol (HPA
  suppression of GnRH/LH) and leptin (energy-availability gating of GnRH).
  Single-scale (Phase 1). Sources: BioModels BIOMD0000000494 (Roblitz2013); Boron
  & Boulpaep Medical Physiology; Endocrine Society FHA Guideline (Gordon 2017);
  Welt 2004 (leptin and hypothalamic amenorrhea).

