# =============================================================================
# TYPED PRODUCTION relations: connect secretion processes to their outputs.
# Production is distinct from constitution—the source cell/process is not asserted
# part_of the hormone—and from authored causal influence. Provenance is recorded
# above each edge.
# =============================================================================
production_edges:
  # Hypothalamic GnRH neurons secrete GnRH; pulse/secretion rate sets the hypothalamic
  # GnRH drive. Boron & Boulpaep, Medical Physiology, Ch. 55 (GnRH-neuron pulse generator).
- source: gnrh_neuron_gnrh_secretion
  target: gnrh
  sign: "+"
  production_evidence: legacy-evidence-unclassified
  # Anterior-pituitary gonadotrophs secrete LH; secretion rate sets plasma LH.
  # Boron & Boulpaep, Medical Physiology, Ch. 55 (gonadotroph LH/FSH secretion).
- source: gonadotroph_lh_secretion
  target: pituitary_lh_secretion
  sign: "+"
  production_evidence: legacy-evidence-unclassified
  # Anterior-pituitary gonadotrophs (same cell type) secrete FSH; secretion rate sets
  # plasma FSH. Boron & Boulpaep, Medical Physiology, Ch. 55 (gonadotroph LH/FSH secretion).
- source: gonadotroph_fsh_secretion
  target: pituitary_fsh_secretion
  sign: "+"
  production_evidence: legacy-evidence-unclassified
  # Ovarian granulosa cells aromatise androgen to estradiol and secrete it; secretion
  # rate sets plasma estradiol. Boron & Boulpaep, Medical Physiology, Ch. 55
  # (two-cell two-gonadotropin model; granulosa aromatase/estradiol output).
- source: granulosa_estradiol_secretion
  target: estradiol
  sign: "+"
  production_evidence: legacy-evidence-unclassified
  # Corpus-luteum (luteal) cells secrete progesterone; secretion rate sets plasma
  # progesterone (luteal phase). Boron & Boulpaep, Medical Physiology, Ch. 55
  # (corpus luteum progesterone production).
- source: luteal_progesterone_secretion
  target: progesterone
  sign: "+"
  production_evidence: legacy-evidence-unclassified
  # Testicular Leydig cells synthesise and secrete testosterone; secretion rate sets
  # plasma testosterone. Boron & Boulpaep, Medical Physiology, Ch. 54
  # (Leydig-cell testosterone biosynthesis).
- source: leydig_testosterone_secretion
  target: testosterone
  sign: "+"
  production_evidence: legacy-evidence-unclassified
  # Inhibin-B is secreted by gonadal cells — testicular Sertoli cells in males and
  # ovarian granulosa cells in females. We ground the canonical male source (Sertoli
  # cell); the female granulosa source is the same `inhibin` macro and could be added
  # as a second producer node. Boron & Boulpaep, Medical Physiology, Ch. 54
