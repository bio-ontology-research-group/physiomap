causal_edges:
  # --- hypothalamus -> pituitary --------------------------------------------
- source: gnrh
  target: pituitary_lh_secretion
  sign: "+"
  mechanism: GnRH pulses bind gonadotrope GnRHR, stimulating LH synthesis/secretion
  evidence: "BioModels BIOMD0000000494 (Roblitz2013, GnRH->LH); Boron & Boulpaep reproductive endocrinology | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-091 (17.4: The Pituitary Gland and Hypothalamus): 'GnRH stimulates the anterior pituitary to secrete gonadotropins.'; OpenStax Anatomy & Physiology 2e §anp-160 (27.2: Anatomy and Physiology of the Male Reproductive System): GnRH binding to anterior pituitary stimulates release of LH.; OpenStax Anatomy & Physiology 2e §anp-161 (27.3: Anatomy and Physiology of the Female Reproductive System): 'the hypothalamus produces GnRH, a hormone that signals the anterior pituitary gland to produce the gonadotropins FSH and LH'; OpenStax Anatomy & Physiology 2e §anp-162 (27.4: Development of the Male and Female Reproductive Systems): 'a concerted release of hormones from the hypothalamus (GnRH), the anterior pituitary (LH and FSH), and the gonads...is responsible for the maturation of the reproductive systems'; 'initiation of puberty is the result of...increases in either estrogen or testosterone [driven by LH/FSH increases following GnRH]'.; OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): 'the hypothalamus produces gonadotropin-releasing hormone (GnRH), which stimulates the production and release of follicle-stimulating hormone (FSH) and luteinizing hormone (LH) from the anterior pituitary gland.'; OpenStax Biology 2e §bio-43.3 (43.3: Human Reproductive Anatomy and Gametogenesis): 'the hypothalamus sends a gonadotropin-releasing hormone (GnRH) to the anterior pituitary. This causes the release of follicle stimulating hormone (FSH) and luteinizing hormone (LH) from the anterior pituitary into the blood.'"
- source: gnrh
  target: pituitary_fsh_secretion
  sign: "+"
  mechanism: GnRH pulses stimulate gonadotrope FSH synthesis/secretion (slower-frequency pulses favour FSH)
  evidence: "BioModels BIOMD0000000494 (Roblitz2013, GnRH->FSH); Boron & Boulpaep reproductive endocrinology | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-091 (17.4: The Pituitary Gland and Hypothalamus): 'GnRH stimulates the anterior pituitary to secrete gonadotropins.''; OpenStax Anatomy & Physiology 2e §anp-160 (27.2: Anatomy and Physiology of the Male Reproductive System): GnRH binding to anterior pituitary stimulates release of FSH.; OpenStax Anatomy & Physiology 2e §anp-161 (27.3: Anatomy and Physiology of the Female Reproductive System): 'the hypothalamus produces GnRH, a hormone that signals the anterior pituitary gland to produce the gonadotropins FSH and LH'; OpenStax Anatomy & Physiology 2e §anp-162 (27.4: Development of the Male and Female Reproductive Systems): GnRH from hypothalamus drives LH and FSH release from anterior pituitary, which then stimulate gonads to produce sex hormones in both male and female adolescents.; OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): 'the hypothalamus produces gonadotropin-releasing hormone (GnRH), which stimulates the production and release of follicle-stimulating hormone (FSH) and luteinizing hormone (LH) from the anterior pituitary gland.'; OpenStax Biology 2e §bio-43.3 (43.3: Human Reproductive Anatomy and Gametogenesis): 'the hypothalamus sends a gonadotropin-releasing hormone (GnRH) to the anterior pituitary. This causes the release of follicle stimulating hormone (FSH) and luteinizing hormone (LH) from the anterior pituitary into the blood.'"

  # --- pituitary secretory output sets the plasma gonadotropin level (within-scale mediation) ---
  # Curatorial correction (Paul N. Schofield, 2026-06-11): GnRH drive and the gonadal-steroid /
  # inhibin / cortisol feedbacks onto plasma LH & FSH are INDIRECT — they act on the gonadotroph's
  # LH/FSH *secretory output* (`pituitary_lh_secretion` / `pituitary_fsh_secretion`), which then set
  # the plasma levels (secretion vs clearance). Typed production relations link the gonadotroph
  # outputs below. Routed through the supported secretory intermediates rather than an unsupported
  # direct macro-to-cell shortcut. Inserting these monotone pass-through nodes
  # preserves every loop sign, so all comparative-statics predictions are unchanged.
- source: pituitary_lh_secretion
  target: lh
  sign: "+"
  causal_evidence: mechanistic_model
  mechanism: "anterior-pituitary gonadotroph LH secretory output sets the circulating LH concentration (mass balance: plasma [LH] = secretion − clearance)"
  evidence: "BioModels BIOMD0000000494 (Roblitz2013) models plasma LH as the gonadotroph secretory output into the circulation. Curated by Paul N. Schofield. *** DRAFT FOR REVIEW ***"
- source: pituitary_fsh_secretion
  target: fsh
  sign: "+"
  causal_evidence: mechanistic_model
  mechanism: "anterior-pituitary gonadotroph FSH secretory output sets the circulating FSH concentration (mass balance: plasma [FSH] = secretion − clearance)"
  evidence: "BioModels BIOMD0000000494 (Roblitz2013) models plasma FSH as the gonadotroph secretory output into the circulation. Curated by Paul N. Schofield. *** DRAFT FOR REVIEW ***"

  # --- pituitary -> gonadal outputs -----------------------------------------
- source: lh
  target: estradiol
  sign: "+"
  causal_evidence: mechanistic_model
  mechanism: LH drives thecal androgen production aromatised to estradiol; granulosa/Leydig steroidogenesis
  evidence: "BioModels BIOMD0000000494 (Roblitz2013, LH->E2); Boron & Boulpaep two-cell two-gonadotropin model | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-161 (27.3: Anatomy and Physiology of the Female Reproductive System): 'LH also stimulates the granulosa and theca cells of the follicles to produce the sex steroid hormone estradiol'; OpenStax Anatomy & Physiology 2e §anp-162 (27.4: Development of the Male and Female Reproductive Systems): 'During puberty, the release of LH and FSH from the anterior pituitary stimulates the gonads to produce sex hormones in both male and female adolescents'; 'the dominant follicle produces more estrogen, triggering positive feedback and the LH surge'.; OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): 'LH also plays a role in the development of ova, induction of ovulation, and stimulation of estradiol and progesterone production by the ovaries.'; OpenStax Biology 2e §bio-43.3 (43.3: Human Reproductive Anatomy and Gametogenesis): 'LH also plays a role in the development of ova, induction of ovulation, and stimulation of estradiol...and progesterone production by the ovaries.'"
- source: fsh
  target: estradiol
  sign: "+"
  causal_evidence: mechanistic_model
  mechanism: FSH induces granulosa-cell aromatase converting androgens to estradiol (follicular growth)
  evidence: "BioModels BIOMD0000000494 (Roblitz2013, FSH->follicle/E2); Boron & Boulpaep folliculogenesis | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-161 (27.3: Anatomy and Physiology of the Female Reproductive System): 'FSH stimulates the follicles to grow'; 'FSH stimulates the growth of a tertiary follicle, and LH stimulates the production of estrogen by granulosa and theca cells'; OpenStax Anatomy & Physiology 2e §anp-162 (27.4: Development of the Male and Female Reproductive Systems): 'Early tertiary follicles...will be stimulated by an increase in FSH...to grow'; 'Supporting granulosa and theca cells in the growing follicles produce estrogens'.; OpenStax Anatomy & Physiology 2e §anp-163 (28.2: Fertilization): FSH analogs support development of multiple follicles in IVF, consistent with FSH driving folliculogenesis and granulosa-cell estradiol production.; OpenStax Biology 2e §bio-43.3 (43.3: Human Reproductive Anatomy and Gametogenesis): 'In females, FSH stimulates development of egg cells...Follicle cells produce the hormone inhibin...LH also plays a role in...stimulation of estradiol'; 'As the follicles grow, they begin releasing estrogens.'"
- source: lh
  target: progesterone
  sign: "+"
  causal_evidence: mechanistic_model
  mechanism: LH maintains corpus luteum steroidogenesis raising progesterone (luteal phase)
  evidence: "BioModels BIOMD0000000494 (Roblitz2013, LH->corpus luteum P4); Boron & Boulpaep luteal phase | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-161 (27.3: Anatomy and Physiology of the Female Reproductive System): 'The surge of LH also stimulates a change in the granulosa and theca cells...luteinized granulosa and theca cells of the corpus luteum begin to produce large amounts of the sex steroid hormone progesterone'; OpenStax Anatomy & Physiology 2e §anp-163 (28.2: Fertilization): LH analog triggers ovulation in IVF protocol, consistent with the LH surge triggering follicle rupture and subsequent luteal progesterone secretion.; OpenStax Biology 2e §bio-43.3 (43.3: Human Reproductive Anatomy and Gametogenesis): 'LH also plays a role in...stimulation of estradiol...and progesterone production by the ovaries.' Also: 'The corpus luteum produces estrogen and progesterone.'"
- source: lh
  target: testosterone
  sign: "+"
  mechanism: LH stimulates testicular Leydig-cell testosterone synthesis (and thecal androgen)
  evidence: "Boron & Boulpaep, Medical Physiology, 3rd ed., Ch. 54 'The Male Reproductive System' (LH -> Leydig-cell testosterone biosynthesis). NOTE: not in BIOMD0000000494, which is a female menstrual-cycle model with no testosterone variable. | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-160 (27.2: Anatomy and Physiology of the Male Reproductive System): 'LH binds to receptors on Leydig cells in the testes and upregulates the production of testosterone.'; OpenStax Anatomy & Physiology 2e §anp-162 (27.4: Development of the Male and Female Reproductive Systems): FSH and LH stimulation of the gonads leads to 'secretion of higher levels of sex hormones'; 'interplay between the testes and the endocrine system precisely control the production of testosterone with a negative feedback loop'.; OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): 'LH stimulates production of the sex hormones (androgens) by the interstitial cells of the testes'; testosterone is the primary androgen produced.; OpenStax Biology 2e §bio-43.3 (43.3: Human Reproductive Anatomy and Gametogenesis): 'LH also enters the testes and stimulates the interstitial cells of Leydig to make and release testosterone into the testes and the blood.'"
- source: fsh
  target: inhibin
  sign: "+"
  causal_evidence: mechanistic_model
  mechanism: FSH stimulates granulosa/Sertoli inhibin-B production
  evidence: "BioModels BIOMD0000000494 (Roblitz2013) — inhibin synthesis driven by gonadotropin/follicle dynamics; Boron & Boulpaep, Medical Physiology, 3rd ed., Ch. 55 'The Female Reproductive System' (FSH-driven granulosa inhibin secretion) | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-160 (27.2: Anatomy and Physiology of the Male Reproductive System): 'FSH also stimulates the Sertoli cells to produce hormones called inhibins.'; OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): 'Follicle cells produce the hormone inhibin, which inhibits FSH production.' (from ovarian follicles stimulated by FSH); 'FSH stimulates the maturation of sperm cells. FSH production is inhibited by the hormone inhibin, which is released by the testes.'; OpenStax Biology 2e §bio-43.3 (43.3: Human Reproductive Anatomy and Gametogenesis): 'FSH enters the testes and stimulates the Sertoli cells to begin facilitating spermatogenesis...The Sertoli cells produce the hormone inhibin.'"

  # --- gonadal negative feedback (loop closure) -----------------------------
- source: estradiol
  target: gnrh
  sign: "-"
  mechanism: tonic/moderate estradiol exerts hypothalamic negative feedback slowing the GnRH pulse generator
  evidence: "BioModels BIOMD0000000494 (Roblitz2013, E2 feedback); Boron & Boulpaep estradiol negative feedback | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-161 (27.3: Anatomy and Physiology of the Female Reproductive System): 'high concentrations of estrogen will stimulate the hypothalamus and pituitary to reduce the production of GnRH, LH, and FSH'; OpenStax Anatomy & Physiology 2e §anp-162 (27.4: Development of the Male and Female Reproductive Systems): 'very low concentrations of androgens or estrogens will negatively feed back onto the hypothalamus and pituitary, keeping the production of GnRH, LH, and FSH low'; 'the level of estrogen in the bloodstream is high enough that it triggers negative feedback at the hypothalamus and pituitary'.; OpenStax Biology 2e §bio-43.3 (43.3: Human Reproductive Anatomy and Gametogenesis): 'high level of estrogen causes FSH and especially LH to rise rapidly' (mid-cycle positive feedback) and 'The decrease in progesterone also allows the hypothalamus to send GnRH' (negative context when progesterone/estrogen are high)."
- source: estradiol
  target: pituitary_fsh_secretion
  sign: "-"
  causal_evidence: mechanistic_model
  mechanism: estradiol negative feedback suppresses pituitary FSH secretion
  evidence: "BioModels BIOMD0000000494 (Roblitz2013, E2->FSH feedback); Boron & Boulpaep | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-161 (27.3: Anatomy and Physiology of the Female Reproductive System): 'high concentrations of estrogen will stimulate the hypothalamus and pituitary to reduce the production of GnRH, LH, and FSH' (negative feedback); OpenStax Anatomy & Physiology 2e §anp-162 (27.4: Development of the Male and Female Reproductive Systems): 'the level of estrogen...triggers negative feedback at the hypothalamus and pituitary. This results in a reduction of FSH and LH'; 'Birth control pills provide constant levels of estrogen and progesterone to negatively feed back on the hypothalamus and pituitary, and suppress the release of FSH and LH'.; OpenStax Anatomy & Physiology 2e §anp-166 (28.5: Changes During Pregnancy, Labor, and Birth): 'They suppress FSH and LH production, effectively preventing ovulation.'"
- source: progesterone
  target: gnrh
  sign: "-"
  causal_evidence: mechanistic_model
  mechanism: progesterone (with estradiol) slows the GnRH pulse generator (luteal-phase negative feedback)
  evidence: "BioModels BIOMD0000000494 (Roblitz2013, P4 feedback); Boron & Boulpaep luteal feedback | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-161 (27.3: Anatomy and Physiology of the Female Reproductive System): 'Progesterone triggers negative feedback at the hypothalamus and pituitary, which keeps GnRH, LH, and FSH secretions low'; OpenStax Anatomy & Physiology 2e §anp-162 (27.4: Development of the Male and Female Reproductive Systems): 'Birth control pills provide constant levels of estrogen and progesterone to negatively feed back on the hypothalamus and pituitary, and suppress the release of FSH and LH, which inhibits ovulation'.; OpenStax Anatomy & Physiology 2e §anp-166 (28.5: Changes During Pregnancy, Labor, and Birth): 'Like estrogen, progesterone suppresses FSH and LH.' (via GnRH pulse suppression)"
- source: progesterone
  target: pituitary_lh_secretion
  sign: "-"
  causal_evidence: mechanistic_model
  mechanism: progesterone reduces LH pulse frequency/secretion (luteal-phase negative feedback)
  evidence: "BioModels BIOMD0000000494 (Roblitz2013) — P4 negative feedback term on gonadotropin secretion; Boron & Boulpaep, Medical Physiology, 3rd ed., Ch. 55 'The Female Reproductive System' (progesterone slowing of GnRH/LH pulse frequency) | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-162 (27.4: Development of the Male and Female Reproductive Systems): 'Birth control pills provide constant levels of estrogen and progesterone to negatively feed back on the hypothalamus and pituitary, and suppress the release of FSH and LH, which inhibits ovulation'.; OpenStax Anatomy & Physiology 2e §anp-166 (28.5: Changes During Pregnancy, Labor, and Birth): 'Like estrogen, progesterone suppresses FSH and LH.'; OpenStax Biology 2e §bio-43.3 (43.3: Human Reproductive Anatomy and Gametogenesis): 'Progesterone assists in endometrial regrowth and inhibition of FSH and LH release.' Also: 'The progesterone...inhibits the release of further FSH and LH.'; OpenStax Biology 2e §bio-43.5 (43.5: Human Pregnancy and Birth): 'Hormonal methods use synthetic progesterone (sometimes in combination with estrogen), to inhibit the hypothalamus from releasing FSH or LH, and thus prevent an egg from being available for fertilization.'"
- source: testosterone
  target: gnrh
  sign: "-"
  mechanism: testosterone (and its estradiol metabolite) exerts hypothalamic negative feedback on GnRH
  evidence: "Boron & Boulpaep, Medical Physiology, 3rd ed., Ch. 54 'The Male Reproductive System' (testosterone/estradiol negative feedback on hypothalamic GnRH pulse generator) | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-160 (27.2: Anatomy and Physiology of the Male Reproductive System): testosterone binds androgen receptors on the hypothalamus, inhibiting GnRH synthesis and secretion.; OpenStax Anatomy & Physiology 2e §anp-162 (27.4: Development of the Male and Female Reproductive Systems): 'very low concentrations of androgens or estrogens will negatively feed back onto the hypothalamus and pituitary, keeping the production of GnRH, LH, and FSH low'.; OpenStax Biology 2e §bio-43.3 (43.3: Human Reproductive Anatomy and Gametogenesis): 'A negative feedback system occurs in the male with rising levels of testosterone acting on the hypothalamus and anterior pituitary to inhibit the release of GnRH, FSH, and LH.'"
- source: testosterone
  target: pituitary_lh_secretion
  sign: "-"
  mechanism: testosterone suppresses pituitary LH secretion (male negative feedback)
  evidence: "Boron & Boulpaep, Medical Physiology, 3rd ed., Ch. 54 'The Male Reproductive System' (testosterone negative feedback on pituitary LH secretion) | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-160 (27.2: Anatomy and Physiology of the Male Reproductive System): testosterone binds androgen receptors on the anterior pituitary, inhibiting LH secretion.; OpenStax Anatomy & Physiology 2e §anp-162 (27.4: Development of the Male and Female Reproductive Systems): 'Interplay between the testes and the endocrine system precisely control the production of testosterone with a negative feedback loop' (testosterone suppresses LH via negative feedback).; OpenStax Biology 2e §bio-43.3 (43.3: Human Reproductive Anatomy and Gametogenesis): 'rising levels of testosterone acting on the hypothalamus and anterior pituitary to inhibit the release of GnRH, FSH, and LH.'"
- source: inhibin
  target: pituitary_fsh_secretion
  sign: "-"
  mechanism: inhibin selectively suppresses pituitary FSH secretion (gonadal peptide feedback)
  evidence: "BioModels BIOMD0000000494 (Roblitz2013) — inhibin selective negative feedback on FSH; Boron & Boulpaep, Medical Physiology, 3rd ed., Ch. 55 'The Female Reproductive System' (inhibin-B selective FSH feedback) | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-096 (17.9: Gonadal and Placental Hormones): 'the testes produce the peptide hormone inhibin, which inhibits the secretion of FSH from the anterior pituitary gland' and 'the granulosa cells of the ovarian follicles produce inhibin, which inhibits the secretion of FSH.'; OpenStax Anatomy & Physiology 2e §anp-160 (27.2: Anatomy and Physiology of the Male Reproductive System): inhibins 'function to inhibit FSH release from the pituitary.'; OpenStax Anatomy & Physiology 2e §anp-161 (27.3: Anatomy and Physiology of the Female Reproductive System): 'inhibin, which normally participates in a negative feedback loop to the pituitary to control the production of FSH'; menopausal decrease in inhibin leads to an increase in FSH'; OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): 'FSH production is inhibited by the hormone inhibin, which is released by the testes'; 'Follicle cells produce the hormone inhibin, which inhibits FSH production.'; OpenStax Biology 2e §bio-43.3 (43.3: Human Reproductive Anatomy and Gametogenesis): 'The Sertoli cells produce the hormone inhibin, which is released into the blood when the sperm count is too high. This inhibits the release of GnRH and FSH, which will cause spermatogenesis to slow down.'"

  # --- estradiol -> LH: dual-mode (tonic suppression + mid-cycle surge) -------
  # SINGLE "?" edge (not two parallel edges): causal_subgraph() builds a plain
  # nx.DiGraph, so two estradiol->lh edges would collapse to whichever loads last
  # rather than combine. The net steady-state sign is genuinely ambiguous, so the
  # two physiological arms are folded into ONE "?" edge per project policy.
- source: estradiol
  target: pituitary_lh_secretion
  sign: "?"
  causal_evidence: mechanistic_model
  mechanism: >-
