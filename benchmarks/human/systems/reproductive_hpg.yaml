# =============================================================================
# Benchmark GOLD interventions (proposed). loop_critical flags targets whose
# correct steady-state sign requires reasoning over a feedback loop (naive
# forward propagation would be wrong). All ids exist in the final map.
# =============================================================================
interventions:
- id: primary_hypogonadism
  label: Primary gonadal failure (gonadal steroid/inhibin output lost)
  do: {estradiol: "-", testosterone: "-", inhibin: "-"}
  expected:
    gnrh: "+"
    lh: "+"
    fsh: "+"
  loop_critical: [gnrh, lh, fsh]
  rationale: >-
    loss of gonadal negative feedback disinhibits the hypothalamus/pituitary,
    raising GnRH/LH/FSH (hypergonadotropic hypogonadism) — requires loop reasoning.

- id: gnrh_agonist_continuous
  label: Continuous GnRH-agonist (downregulates gonadotropes after initial flare)
  do: {gnrh: "+"}
  expected:
    lh: "+"
    fsh: "+"
    estradiol: "+"
    testosterone: "+"
  loop_critical: []
  rationale: >-
    treating sustained GnRH drive as a steady up-clamp raises gonadotropins and
    thus gonadal steroids (the steady-state partial; clinical desensitisation is
    a dynamic/pulsatility effect outside this static sign model).

- id: hpa_stress_suppression
  label: Chronic stress / hypercortisolism (functional hypothalamic amenorrhea)
  do: {cortisol: "+"}
  expected:
    gnrh: "-"
    lh: "-"
    estradiol: "-"
    progesterone: "-"
  loop_critical: [estradiol, progesterone]
  rationale: >-
    cortisol suppresses GnRH/LH; the downstream fall in estradiol/progesterone
    is mediated through the gonadal cascade and feedback loop.
