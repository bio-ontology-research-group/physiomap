# =============================================================================
# Fatty-acid oxidation (FAO), carnitine cycle, peroxisomal & branched-chain
# fatty-acid metabolism  — PhysioMap fragment  *** DRAFT FOR REVIEW ***
# =============================================================================
# Covers the directional HPO "abnormal-quantity" gap terms for the fatty_acid_oxidation
# theme: plasma/serum carnitine & acylcarnitine species (the acylcarnitine profile from
# tandem-MS newborn screening), tissue carnitine pools, peroxisomal very-long-chain and
# branched-chain fatty acids (VLCFA, phytanic/pristanic acid, THCA), and the enzyme/
# transporter ACTIVITY roots of the mitochondrial carnitine cycle and beta-oxidation
# spiral plus the peroxisomal beta-oxidation enzymes.
#
# Physiology / biochemistry provenance:
#   - Lehninger Principles of Biochemistry (Nelson & Cox), "Fatty acid catabolism":
#     long-chain fatty acids are activated to acyl-CoA, then shuttled into the
#     mitochondrion by the CARNITINE CYCLE (CPT1 -> CACT/SLC25A20 -> CPT2), and
#     degraded two carbons at a time by the beta-oxidation spiral
#     (acyl-CoA dehydrogenase [SCAD/MCAD/VLCAD] -> enoyl-CoA hydratase ->
#     3-hydroxyacyl-CoA dehydrogenase -> 3-ketoacyl-CoA thiolase).
#   - Harrison's Principles of Internal Medicine, "Inherited disorders of fatty acid
#     metabolism" / "Disorders of peroxisome biogenesis": MCAD/VLCAD/LCHAD/CPT-I/CPT-II/
#     CACT deficiencies present with a characteristic plasma ACYLCARNITINE profile
#     (chain-length-specific species accumulate proximal to the enzymatic block) and
#     secondary CARNITINE DEFICIENCY; X-ALD and Zellweger-spectrum disorders accumulate
#     VLCFA; Refsum disease accumulates phytanic acid (PHYH deficiency); AMACR / DBP
#     defects accumulate pristanic acid and THCA bile-acid intermediates.
#   - Williams Textbook of Endocrinology / standard clinical-biochemistry references
#     (newborn-screening acylcarnitine panel) for the individual C-length species.
#   - IEMbase / OMIM for the disorder-marker correspondences.
#
# MODELING NOTE — this is deliberately an ISLAND fragment (no edges into the existing
# corpus). Each analyte is a GROUNDED node that ABSTAINS under the comparative-statics
# solver, which is the safe and valuable behaviour for these screening metabolites: the
# acylcarnitine "profile" is determined by which specific upstream enzyme is blocked, and
# encoding determinate quantitative edges between dozens of individual chain-length
# species would require fabricating signs that the literature does not pin down for an
# arbitrary intervention. We therefore provide the NODES (so the HPO terms map and the
# pipeline can attach disorder-specific do() clamps later) and only the small number of
# enzyme->pool edges whose sign is unambiguous from the catalytic mechanism.
#
# BRIDGE ADDENDUM (reviewed 2026-07-18): one reviewed component-bridge edge now connects
# this fragment to core — hydroxyacyl_coa_dehydrogenase_activity -(-)-> glutamate_dehydrogenase_activity
# (CB-MET-012; the SCHAD-HI GDH-disinhibition mechanism). See the causal_edges section.
#
# PATO qualities used: concentration PATO:0000033; catalytic activity PATO:0001414;
# amount PATO:0000070.
# Entity IRIs: verified by grep against ontology/.obo_cache/{CHEBI,PR,CL,UBERON}.obo;
# left null wherever no exact OBO 'name:'/synonym match exists (NOT fabricated).
# =============================================================================

