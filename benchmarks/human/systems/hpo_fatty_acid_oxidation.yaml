causal_edges:
  # Only edges whose sign is UNAMBIGUOUS from the catalytic mechanism (enzyme consumes
  # its substrate, so reduced activity raises the upstream substrate pool / the
  # corresponding acylcarnitine that mirrors the blocked acyl-CoA species).

  # MCAD (ACADM) oxidizes medium-chain acyl-CoA (C6-C10). Reduced MCAD -> accumulation of
  # medium-chain acyl-CoA, trapped as medium-chain acylcarnitines (C8 octanoylcarnitine is
  # the diagnostic marker), and secondary depletion of free carnitine.
  - source: mcad_activity
    target: plasma_medium_chain_acylcarnitine
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: MCAD dehydrogenates medium-chain acyl-CoA in the beta-oxidation spiral; reduced activity backs up medium-chain acyl-CoA, which is esterified to medium-chain acylcarnitine and exported to plasma (MCAD deficiency RAISES medium-chain acylcarnitines)
    evidence: "Harrison's Principles of Internal Medicine, 'Inherited disorders of fatty acid metabolism' (MCAD deficiency, OMIM 201450; elevated C6-C10 acylcarnitines, esp. octanoylcarnitine C8); Lehninger Principles of Biochemistry, beta-oxidation spiral"
  - source: mcad_activity
    target: plasma_octanoylcarnitine
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: octanoylcarnitine (C8) is the principal acylcarnitine accumulating proximal to the MCAD block; reduced MCAD activity raises plasma C8
    evidence: "Harrison's Principles of Internal Medicine (MCAD deficiency; C8 octanoylcarnitine is the diagnostic newborn-screening marker, OMIM 201450)"
  - source: mcad_activity
    target: plasma_free_carnitine
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: chronic accumulation and urinary excretion of acylcarnitines depletes the free-carnitine pool (secondary carnitine deficiency); higher MCAD activity preserves free carnitine, lower activity lowers it
    evidence: "Harrison's Principles of Internal Medicine (secondary carnitine deficiency in fatty-acid oxidation disorders); Williams Textbook of Endocrinology (carnitine homeostasis)"

  # CPT2 reconverts acylcarnitine -> acyl-CoA inside the mitochondrion. Reduced CPT2 (or
  # CACT) blocks the carnitine cycle and causes long-chain acylcarnitines to accumulate.
  - source: cpt2_activity
    target: plasma_long_chain_acylcarnitine
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: CPT2 regenerates long-chain acyl-CoA from acylcarnitine at the inner mitochondrial membrane; reduced CPT2 activity backs up long-chain acylcarnitines (C16/C18) into plasma (CPT-II deficiency RAISES long-chain acylcarnitines)
    evidence: "Harrison's Principles of Internal Medicine, 'Inherited disorders of fatty acid metabolism' (CPT-II deficiency, OMIM 255110; elevated C16/C18 acylcarnitines); Lehninger Principles of Biochemistry, carnitine shuttle"
  - source: cact_activity
    target: plasma_long_chain_acylcarnitine
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: CACT (SLC25A20) imports acylcarnitine into the mitochondrial matrix in exchange for free carnitine; reduced translocase activity strands long-chain acylcarnitines in the cytosol/plasma (CACT deficiency RAISES long-chain acylcarnitines)
    evidence: "Harrison's Principles of Internal Medicine (carnitine-acylcarnitine translocase deficiency, OMIM 212138; elevated long-chain acylcarnitines); Lehninger Principles of Biochemistry, carnitine shuttle"

  # PHYH (phytanic acid oxidase) is the rate-limiting alpha-oxidation enzyme for phytanic
  # acid. Reduced PHYH -> phytanic acid accumulates (Refsum disease).
  - source: phytanoyl_coa_hydroxylase_activity
    target: plasma_phytanic_acid
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: phytanic acid (3-methyl-branched) cannot undergo beta-oxidation and is first alpha-oxidized via PHYH; reduced PHYH activity blocks its degradation and raises plasma phytanic acid (Refsum disease)
    evidence: "Harrison's Principles of Internal Medicine, 'Disorders of peroxisome metabolism' (Refsum disease, PHYH deficiency, OMIM 266500; phytanic acid accumulation); Lehninger Principles of Biochemistry, alpha-oxidation"

  # AMACR racemizes (2R)-pristanoyl-CoA / branched bile-acid CoA to the (2S) form required
  # for peroxisomal beta-oxidation. Reduced AMACR -> pristanic acid + THCA accumulate.
  - source: amacr_activity
    target: plasma_pristanic_acid
    sign: "-"
    causal_evidence: genetic_lof_gof
