# =============================================================================
# Lipids & lipoproteins — plasma/serum analytes, sterol-synthesis intermediates,
# apolipoproteins, sphingolipids, fatty acids, and lipid-handling enzymes
#                                    — PhysioMap fragment  *** DRAFT FOR REVIEW ***
# =============================================================================
# Hand-encoded for HPO directional-gap coverage in the "lipids_lipoproteins" theme.
# Each node is a physiological VARIABLE = (entity, PATO determinable-quality) at a
# named scale. Most are plasma/serum/CSF/urine/fecal CONCENTRATION nodes (scale
# organ_system, PATO:0000033 concentration); a handful are enzyme ACTIVITY roots
# (scale cellular, PATO:0001414 catalytic activity, with bearer_entity_iri).
#
# This is largely an ISLAND fragment: the specialized lipid analytes below have no
# defensible *signed* causal partner among the existing corpus nodes, so an
# ungrounded concentration node that simply ABSTAINS is the correct (safe) encoding.
# A small number of within-fragment enzyme->substrate / enzyme->product edges are
# added where a cited biochemical mechanism gives a determinate sign (sterol-synthesis
# block accumulating the immediate precursor; LPL hydrolysing chylomicron TG; LCAT
# esterifying cholesterol). Boundary refs to existing corpus nodes are added only
# where a textbook mechanism is unambiguous.
#
# Provenance (textbooks / databases consulted per term):
#   - Lehninger Principles of Biochemistry (Nelson & Cox), "Lipid biosynthesis":
#     cholesterol biosynthesis (mevalonate -> squalene -> lanosterol -> ...; the
#     Bloch and Kandutsch-Russell pathways) — desmosterol, 7-DHC, 8-DHC, lathosterol,
#     8(9)-cholestenol, dimethyl/monomethyl sterols are post-squalene intermediates.
#   - Boron & Boulpaep Medical Physiology, "Lipid metabolism / lipoprotein transport":
#     chylomicron, VLDL, LDL, HDL, apolipoproteins (apoA-I/A-II/A-IV, apoB, apoC-II/
#     C-III, apoE), LPL, LCAT.
#   - Harrison's Principles of Internal Medicine, "Disorders of lipoprotein metabolism"
#     and "Lysosomal storage diseases": apolipoproteinemias, Tangier/apoA-I, ABL/HBL
#     (apoB), LPL deficiency (chylomicronemia), LCAT deficiency, Fabry (Gb3), MLD
#     (sulfatide), Niemann-Pick (lysosphingomyelin/SPC).
#   - OMIM phenotype context (cited, NOT encoded): SLOS 270400 (DHCR7; 7-DHC/8-DHC up,
#     C-triol/cholestane-triol up); desmosterolosis 602398 (DHCR24; desmosterol up);
#     CTX 213700 (CYP27A1; cholestanol up, bile alcohols up, 27-OHC down/altered);
#     sitosterolemia 210250 (ABCG5/8; sitosterol up); MVK deficiency 610377 (mevalonate
#     kinase); LCAT deficiency 245900; LPL deficiency 238600; Fabry 301500; MLD 250100.
#   - ChEBI / GO / PR identifiers verified by grep against ontology/.obo_cache OBO
#     files (per-node comment gives the matched OBO name).
#
# Existing corpus nodes reused as boundary refs (NOT redefined here):
#   ldl_cholesterol, hdl_cholesterol, plasma_triglycerides, plasma_free_fatty_acids,
#   plasma_bile_acids  (ontology/.obo_cache/node_inventory.tsv).
#
# ROBERT: please correct signs / IRIs / scales / edges.
# =============================================================================

name: hpo_lipids_lipoproteins
