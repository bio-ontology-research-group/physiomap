causal_edges:
  # LPL hydrolyses chylomicron/VLDL triglyceride -> more LPL clears chylomicrons (-)
  # and lowers plasma TG. LPL deficiency (OMIM 238600) => chylomicronemia + high TG.
  - source: lipoprotein_lipase_activity
    target: plasma_chylomicron
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: >-
      LPL anchored on capillary endothelium hydrolyses core triacylglycerol of
      chylomicrons (and VLDL), driving their clearance; loss of LPL activity causes
      fasting chylomicronemia (familial chylomicronemia syndrome).
    evidence: "Harrison's Principles of Internal Medicine, Disorders of Lipoprotein Metabolism; OMIM 238600 (LPL deficiency)"
  - source: lipoprotein_lipase_activity
    target: plasma_triglycerides
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: >-
      LPL hydrolysis of TG-rich lipoprotein core lowers plasma triglyceride; LPL or
      apoC-II loss raises plasma TG (type I/V hyperlipoproteinemia).
    evidence: "Boron & Boulpaep Medical Physiology, Lipoprotein transport; OMIM 238600"
  # apoC-II is the obligate cofactor that activates LPL; less apoC-II -> less LPL action
  - source: plasma_apolipoprotein_c2
    target: lipoprotein_lipase_activity
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: >-
      Apolipoprotein C-II is the physiological activator of lipoprotein lipase; apoC-II
      deficiency phenocopies LPL deficiency (impaired TG-rich lipoprotein lipolysis).
    evidence: "Harrison's, Disorders of Lipoprotein Metabolism; OMIM 207750 (apoC-II deficiency)"
  # apoC-III inhibits LPL; more apoC-III -> less LPL action -> higher TG-rich particles
  - source: plasma_apolipoprotein_c3
    target: lipoprotein_lipase_activity
    sign: "-"
    mechanism: >-
      Apolipoprotein C-III inhibits lipoprotein lipase and hepatic remnant uptake;
      apoC-III excess raises triglyceride-rich lipoproteins.
    evidence: "Harrison's, Disorders of Lipoprotein Metabolism (apoC-III as LPL inhibitor / ANGPTL pathway)"
  # LCAT esterifies free cholesterol on HDL -> raises cholesterol esters, sets the
  # plasma cholesterol esterification rate; LCAT deficiency lowers esterified
  # cholesterol fraction (OMIM 245900).
  - source: lcat_activity
    target: cholesterol_esterification_rate
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: >-
      LCAT (plasma, HDL-associated) transfers an acyl group from phosphatidylcholine to
      free cholesterol forming cholesteryl ester; it is the rate-determining enzyme of
      plasma cholesterol esterification.
    evidence: "Lehninger Principles of Biochemistry, cholesterol transport; OMIM 245900 (LCAT deficiency). Natural human loss-of-function do(): familial LCAT deficiency (a clean LoF) significantly reduces plasma cholesteryl ester levels, LCAT being the only enzyme able to esterify cholesterol in plasma (PMID:35598637, J Lipid Res, opened primary)."
  - source: lcat_activity
    target: plasma_cholesterol_esters
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: >-
      LCAT generates plasma cholesteryl esters; familial LCAT deficiency reduces the
      esterified-cholesterol fraction.
    evidence: "Harrison's, Disorders of Lipoprotein Metabolism; OMIM 245900"
  # mevalonate kinase phosphorylates mevalonate, committing flux toward squalene/sterols;
  # MVK deficiency blocks the pathway upstream of squalene (mevalonate accumulates).
  - source: mevalonate_kinase_activity
    target: plasma_squalene
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: >-
      Mevalonate kinase is an early committed step of the isoprenoid/sterol pathway;
      loss of MVK activity reduces downstream isoprenoid (squalene) flux.
    evidence: "Lehninger, isoprenoid/cholesterol biosynthesis; OMIM 610377 (mevalonate kinase deficiency)"
  # CYP27A1 (sterol 27-hydroxylase) catabolises cholesterol via the acidic bile-acid
  # pathway; its loss (CTX, OMIM 213700) diverts to bile-alcohol and cholestanol
  # accumulation. More enzyme activity -> more 27-hydroxycholesterol product.
  - source: sterol_27_hydroxylase_activity
    target: plasma_27_hydroxycholesterol
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: >-
      CYP27A1 27-hydroxylates cholesterol/sterol intermediates (acidic bile-acid
      synthesis pathway); its product is 27-hydroxycholesterol.
    evidence: "Williams Textbook of Endocrinology / Lehninger, bile-acid synthesis; OMIM 213700 (CTX, CYP27A1)"
  - source: sterol_27_hydroxylase_activity
    target: plasma_bile_alcohol
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: >-
      Loss of CYP27A1 (cerebrotendinous xanthomatosis) diverts bile-acid synthesis to
      accumulation of C27 bile alcohols (excreted in urine); more enzyme activity
      lowers bile-alcohol accumulation.
    evidence: "Harrison's, inborn errors of bile-acid synthesis; OMIM 213700 (CTX)"
