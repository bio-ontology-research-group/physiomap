# =============================================================================
# HPO "other_metabolites" coverage fragment        *** DRAFT FOR REVIEW ***
# =============================================================================
# Author: PhysioMap HPO-coverage authoring agent (biomedical curation pass).
# Purpose: ground the directional HPO "abnormal-quantity" gap terms in the
#   "other_metabolites" theme as PhysioMap nodes so the HPO benchmark can map each
#   term to a (node, sign). This is a deliberately BROAD grounding fragment: it is
#   mostly a self-contained ISLAND of analyte/activity nodes (a grounded node with
#   no edges legitimately abstains under comparative statics). Edges are added ONLY
#   where a textbook/database mechanism gives a defensible interventional sign.
#
# Provenance (general): Boron & Boulpaep *Medical Physiology* (acid-base, electro-
#   lytes, sweat/CFTR, energy expenditure, cardiac); Lehninger *Principles of
#   Biochemistry* (heme/porphyrin pathway, sulfur metabolism, one-carbon/B12);
#   Harrison's *Principles of Internal Medicine* (porphyrias, mastocytosis, lyso-
#   somal storage); Williams *Textbook of Endocrinology*. Small-molecule entity
#   IRIs verified by grep against the downloaded ChEBI.obo; protein/enzyme IRIs vs
#   PR.obo; cells/organs vs CL.obo / UBERON.obo. Where an IRI could NOT be verified
#   the field is null (never fabricated).
#
# Scales: plasma/serum/urine/stool/sweat analytes and vital/ECG/hemodynamic
#   measures = organ_system (whole-body lab/vital readouts). Enzyme/transporter
#   ACTIVITY roots = cellular, with a verified bearer_entity_iri (the cell/organ
#   that bears the activity) where identifiable.
#
# PATO qualities used (verified vs PATO.obo): concentration PATO:0000033;
#   catalytic activity PATO:0001414; rate PATO:0000161; pressure PATO:0001025;
#   temperature PATO:0000146; volume PATO:0000918; contractility PATO:0001579;
#   acidity PATO:0001842; diameter PATO:0001334; electric potential PATO:0001464.
#
# Existing nodes REUSED (no new node created): core_temperature, plasma_potassium,
#   metabolic_rate, blood_volume, myocardial_contractility. Their HPO terms are
#   mapped to those ids in hpo_mappings (not redefined here).
# =============================================================================

name: hpo_other_metabolites
description: >-
  DRAFT grounding fragment for the HPO "other_metabolites" theme: plasma/urine/stool/
  sweat metabolite pools (porphyrins and heme-pathway intermediates, sulfur metabolites,
  bone-turnover markers, eicosanoids, glycosphingolipids/GAGs, exogenous compounds,
  electrolytes) plus the corresponding enzyme/transporter ACTIVITY roots and a few
  hemodynamic/ECG/energy measures. Mostly a self-contained island; a small set of
  heme-pathway and sulfur-pathway causal edges encode defensible enzyme->substrate/
  product signs. Single/most-organism scale, Phase 1.

