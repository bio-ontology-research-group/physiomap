causal_edges:
  # Heme/porphyrin biosynthetic pathway (Lehninger, "Biosynthesis of porphyrins";
  # Harrison's, "The Porphyrias"). Pathway order:
  #   ALA --(ALAD)--> PBG --(HMBS/PBGD)--> hydroxymethylbilane --(UROS)--> uro'gen III
  #   --(UROD)--> copro'gen --> proto'gen --> protoporphyrin IX --(ferrochelatase)--> heme.
  # Enzyme->substrate sign "-" (more enzyme consumes more substrate); deficiency raises
  # the upstream substrate. These reproduce the classic porphyria marker patterns.
  - source: ala_dehydratase_activity
    target: urinary_ala
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: "ALAD converts delta-aminolevulinic acid to porphobilinogen; loss of activity (ALAD-deficiency porphyria) raises ALA, which spills into urine."
    evidence: "Lehninger Principles of Biochemistry, heme biosynthesis; Harrison's PIM, The Porphyrias (ALAD deficiency: elevated urinary ALA)."
  - source: porphobilinogen_deaminase_activity
    target: urinary_porphobilinogen
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: "HMBS/PBGD condenses porphobilinogen into hydroxymethylbilane; deficiency (acute intermittent porphyria) causes PBG (and ALA) accumulation and urinary excretion."
    evidence: "Harrison's PIM, The Porphyrias (acute intermittent porphyria: HMBS deficiency, elevated urinary PBG and ALA)."
  - source: porphobilinogen_deaminase_activity
    target: urinary_ala
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: "Block at HMBS backs up the pathway through PBG to ALA; both ALA and PBG rise in AIP."
    evidence: "Harrison's PIM, The Porphyrias (AIP: elevated urinary ALA and PBG)."
  - source: uroporphyrinogen_iii_synthase_activity
    target: urinary_uroporphyrin
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: "UROS deficiency (congenital erythropoietic porphyria) shunts hydroxymethylbilane to non-physiologic uroporphyrin I isomers that accumulate and are excreted in urine."
    evidence: "Harrison's PIM, The Porphyrias (congenital erythropoietic porphyria: massive uroporphyrin I accumulation)."
  - source: uroporphyrinogen_iii_synthase_activity
    target: erythrocyte_uroporphyrin
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: "In CEP the UROS block causes erythrocyte uroporphyrin I accumulation."
    evidence: "Harrison's PIM, The Porphyrias (CEP: erythrocyte uroporphyrin elevated)."
  - source: uroporphyrinogen_decarboxylase_activity
    target: urinary_uroporphyrin
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: "UROD decarboxylates uroporphyrinogen III; deficiency (porphyria cutanea tarda) causes uroporphyrin (and 7-/hepta-carboxyl porphyrin) accumulation, excreted in urine."
    evidence: "Harrison's PIM, The Porphyrias (porphyria cutanea tarda: UROD deficiency, elevated urinary uroporphyrin and heptacarboxylporphyrin)."
  - source: uroporphyrinogen_decarboxylase_activity
    target: plasma_heptacarboxylporphyrin
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: "UROD partial block accumulates the 7-carboxyl (heptacarboxyl) intermediate characteristic of PCT."
    evidence: "Harrison's PIM, The Porphyrias (PCT: heptacarboxylporphyrin elevated)."
  # Methionine synthase: B12/folate methyl trap. Loss raises homocysteine (substrate of
  # the methionine-forming reaction backs up). Boundary ref to existing plasma_homocysteine.
  - source: methionine_synthase_activity
    target: plasma_homocysteine
    sign: "-"
    mechanism: "Methionine synthase remethylates homocysteine to methionine using 5-methyl-THF / methylcobalamin; loss of activity (cblG, MTR/MTRR defects) causes homocysteine to accumulate."
    evidence: "Lehninger, one-carbon metabolism; Harrison's PIM, homocystinuria/cobalamin disorders (methionine synthase deficiency -> hyperhomocysteinemia)."
  # Sulfite oxidase: terminal oxidation of sulfite to sulfate. Deficiency raises sulfite
  # (and thiosulfate, S-sulfocysteine) and LOWERS sulfate.
  - source: sulfite_oxidase_activity
    target: urinary_sulfite
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: "Sulfite oxidase oxidizes sulfite to sulfate; deficiency (isolated SUOX or molybdenum-cofactor) causes sulfite accumulation and urinary excretion."
    evidence: "Lehninger, sulfur amino-acid catabolism; Harrison's PIM, sulfite oxidase / molybdenum cofactor deficiency (elevated urinary sulfite)."
  - source: sulfite_oxidase_activity
    target: urinary_sulfate
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: "Sulfate is the product of sulfite oxidase; loss of activity reduces sulfate formation, lowering urinary sulfate."
    evidence: "Harrison's PIM, sulfite oxidase deficiency (reduced sulfate, accumulation of sulfite/thiosulfate)."
  - source: sulfite_oxidase_activity
    target: plasma_sulfate
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: "Plasma sulfate is the downstream product; sulfite oxidase deficiency lowers circulating sulfate."
    evidence: "Harrison's PIM, sulfite oxidase / molybdenum-cofactor deficiency (low sulfate)."
  - source: sulfite_oxidase_activity
    target: urinary_thiosulfate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: "When sulfite oxidation is blocked, excess sulfite is diverted to thiosulfate, which rises in urine."
    evidence: "Harrison's PIM / J Inherit Metab Dis: sulfite oxidase deficiency elevates urinary thiosulfate and S-sulfocysteine."
  # Heme oxygenase: heme -> biliverdin. Loss reduces biliverdin formation.
  - source: heme_oxygenase_activity
    target: plasma_biliverdin
    sign: "+"
    mechanism: "Heme oxygenase opens the heme ring to biliverdin (the product); reduced activity lowers biliverdin production."
    evidence: "Lehninger, heme catabolism (heme oxygenase -> biliverdin -> bilirubin)."
