    evidence: "OMMBID nonketotic hyperglycinemia — glycinuria secondary to hyperglycinemia"

  # --- lysine catabolism (OMMBID hyperlysinemia / saccharopinuria) --------------
  - source: alpha_aminoadipic_semialdehyde_synthase_activity
