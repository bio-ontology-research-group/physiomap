# =============================================================================
# Amino-acid metabolism — plasma / urine / CSF / intracellular pools + enzyme
# activities for HPO directional coverage         *** DRAFT FOR REVIEW ***
# =============================================================================
# Hand-encoded grounding fragment for the HPO "amino_acids" theme. Its purpose is
# to provide a PhysioMap NODE (an (entity, PATO quality) physiological variable) for
# every directional HPO term in the theme, so the term can be attached and ABSTAIN
# safely (a grounded node with no edge is valuable). Where a defensible, cited
# enzyme->substrate/product mechanism exists, a signed causal edge is added; where
# the sign would be a guess, NO edge is written (PhysioMap sign discipline).
#
# Provenance / textbook anchors:
#   - Lehninger Principles of Biochemistry (Nelson & Cox), "Amino Acid Oxidation and
#     the Production of Urea" and "Biosynthesis of Amino Acids" — urea cycle,
#     transamination, one-carbon/methionine cycle, glycine cleavage, kynurenine
#     pathway, proline/ornithine metabolism.
#   - Boron & Boulpaep Medical Physiology — renal handling / tubular reabsorption of
#     amino acids (aminoaciduria), CSF composition.
#   - Harrison's Principles of Internal Medicine — inborn errors of amino-acid
#     metabolism (PKU, MSUD, homocystinuria, urea-cycle disorders, cystinuria,
#     cystinosis, hyperlysinemia, hyperprolinemia, NKH, etc.).
#   - Scriver's OMMBID (The Online Metabolic and Molecular Bases of Inherited Disease)
#     — disorder-specific biochemistry for each enzyme-deficiency node.
# Entity IRIs grepped+verified against ontology/.obo_cache/CHEBI.obo (exact 'name:');
# null where no exact ChEBI name/synonym matched (NEVER fabricated).
#
# Boundary nodes reused from the existing corpus (NOT redefined here):
#   plasma_glutamine, plasma_homocysteine, plasma_tyrosine — already in the map; the
#   matching HPO terms are mapped to those existing ids (see hpo_mappings).
#
# This is a SINGLE-SCALE / mostly-island grounding fragment; most nodes are roots
# that abstain. Phase 1, DRAFT for domain review.
# =============================================================================

name: hpo_amino_acids
description: >-
  DRAFT amino-acid metabolism grounding fragment for HPO phenotype coverage: plasma,
  urinary, CSF and intracellular amino-acid / derivative pools plus the relevant
  biosynthetic/catabolic enzyme-activity roots (urea cycle, one-carbon/methionine
  cycle, glycine cleavage, kynurenine pathway, glutathione synthesis, creatine
  synthesis, serine biosynthesis). Provides one grounded node per directional HPO
  term so each can attach and abstain; signed causal edges added only where a cited
  enzyme->substrate/product mechanism gives a defensible sign. Single-scale, Phase 1.

