    mechanism: the glycine cleavage system (GCS) is the principal route of glycine catabolism; reduced GCS activity (nonketotic hyperglycinemia) causes glycine to accumulate
    evidence: "Harrison's / OMMBID nonketotic hyperglycinemia (glycine encephalopathy, GLDC/AMT) — HYPERglycinemia"
