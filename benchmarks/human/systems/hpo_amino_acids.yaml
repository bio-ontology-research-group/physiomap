# -----------------------------------------------------------------------------
# Causal edges — ONLY where a cited enzyme->substrate/product mechanism gives a
# defensible sign. Enzyme activity DOWN => substrate UP ("-" substrate edge) and
# product DOWN ("+" product edge). Each edge below is a direct, textbook biochemical
# step. Where the systemic sign is confounded (multiple inputs / homeostatic loop),
# NO edge is written (the node abstains).
# -----------------------------------------------------------------------------
causal_edges:
  # --- urea cycle (Lehninger, "Production of Urea"; Harrison's, urea-cycle disorders)
  - source: otc_activity
    target: plasma_citrulline
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: ornithine transcarbamylase condenses ornithine + carbamoyl-phosphate -> citrulline; OTC activity is required to form citrulline, so reduced activity (OTC deficiency) lowers citrulline
    evidence: "Lehninger Principles of Biochemistry, 'Amino Acid Oxidation and the Production of Urea' (urea cycle step 2, OTC); Harrison's, urea-cycle disorders — OTC deficiency gives LOW/low-normal citrulline"
  - source: argininosuccinate_synthetase_activity
    target: plasma_citrulline
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: argininosuccinate synthetase (ASS1) consumes citrulline + aspartate -> argininosuccinate; reduced ASS1 activity (citrullinemia type I) lets citrulline accumulate
    evidence: "Lehninger, urea cycle step 3 (ASS1); Harrison's / OMMBID citrullinemia type I (ASS1 deficiency) — markedly ELEVATED plasma citrulline"
  - source: argininosuccinate_synthetase_activity
    target: plasma_argininosuccinate
    sign: "+"
    mechanism: ASS1 produces argininosuccinate; reduced activity lowers its formation
    evidence: "Lehninger, urea cycle step 3 (ASS1 forms argininosuccinate)"
  - source: arginase_activity
    target: plasma_arginine
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: arginase (ARG1) hydrolyzes arginine -> ornithine + urea; reduced arginase activity (argininemia) causes arginine to accumulate
    evidence: "Lehninger, urea cycle step 5 (arginase); Harrison's / OMMBID argininemia (ARG1 deficiency) — HYPERargininemia"
  - source: arginase_activity
    target: plasma_ornithine
    sign: "+"
    mechanism: arginase produces ornithine from arginine; reduced activity lowers ornithine production
    evidence: "Lehninger, urea cycle (arginase yields ornithine + urea)"

  # --- creatine synthesis (Lehninger; OMMBID creatine-deficiency syndromes) -----
  - source: agat_activity
    target: plasma_guanidinoacetate
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: AGAT (GATM) transfers the amidino group of arginine to glycine forming guanidinoacetate; reduced AGAT activity lowers guanidinoacetate
    evidence: "Lehninger, creatine biosynthesis; OMMBID AGAT (GATM) deficiency — DECREASED guanidinoacetate"
  - source: gamt_activity
    target: plasma_guanidinoacetate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: GAMT methylates guanidinoacetate -> creatine; reduced GAMT activity causes guanidinoacetate to accumulate
    evidence: "Lehninger, creatine biosynthesis; OMMBID GAMT deficiency — ELEVATED guanidinoacetate (plasma/urine/CSF)"
  - source: gamt_activity
    target: csf_guanidinoacetate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: GAMT consumes guanidinoacetate; reduced GAMT lets guanidinoacetate accumulate, including in CSF (CNS creatine deficiency)
    evidence: "OMMBID GAMT deficiency — elevated CSF guanidinoacetate"
  - source: agat_activity
    target: urinary_guanidinoacetate
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: lower guanidinoacetate synthesis by AGAT lowers the filtered/excreted guanidinoacetate load
    evidence: "OMMBID AGAT (GATM) deficiency — low urinary guanidinoacetate"

  # --- methionine / one-carbon cycle (Lehninger; OMMBID) ------------------------
  - source: sah_hydrolase_activity
    target: plasma_sah
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: SAH hydrolase (AHCY) hydrolyzes S-adenosylhomocysteine -> homocysteine + adenosine; reduced activity causes SAH to accumulate
    evidence: "Lehninger, methionine/one-carbon cycle; OMMBID AHCY deficiency — markedly ELEVATED S-adenosylhomocysteine (and SAM)"
  - source: sah_hydrolase_activity
    target: plasma_sam
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: SAH accumulation from AHCY deficiency feeds back to raise SAM as the transmethylation block builds up upstream
    evidence: "OMMBID AHCY deficiency — elevated SAM and SAH"
  - source: methionine_adenosyltransferase_activity
    target: plasma_sam
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: MAT1A converts methionine + ATP -> S-adenosylmethionine; reduced MAT activity lowers SAM
    evidence: "Lehninger, activated-methyl cycle (MAT); OMMBID MAT I/III deficiency — low/normal SAM with hypermethioninemia"

  # --- proline / ornithine / P5C (OMMBID hyperprolinemia type II) ---------------
  - source: p5c_dehydrogenase_activity
    target: plasma_pyrroline_5_carboxylate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: P5C dehydrogenase (ALDH4A1) oxidizes pyrroline-5-carboxylate -> glutamate; reduced activity (hyperprolinemia type II) causes P5C and proline to accumulate
    evidence: "OMMBID hyperprolinemia type II (P5C dehydrogenase / ALDH4A1 deficiency) — elevated P5C and proline"
  - source: p5c_dehydrogenase_activity
    target: plasma_proline
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: blocked P5C oxidation backs up the proline<->P5C equilibrium, raising plasma proline
    evidence: "OMMBID hyperprolinemia type II — hyperprolinemia"

  # --- glutathione cycle (OMMBID glutathione-synthetase / gamma-GCS deficiency) -
  - source: oxoprolinase_activity
    target: plasma_5_oxoproline
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: 5-oxoprolinase (OPLAH) hydrolyzes 5-oxoproline -> glutamate; reduced activity causes 5-oxoproline (pyroglutamate) to accumulate
    evidence: "OMMBID 5-oxoprolinase deficiency — 5-oxoprolinuria/elevated 5-oxoproline"
  - source: glutathione_synthetase_activity
    target: plasma_glutathione
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: glutathione synthetase (GSS) makes glutathione from gamma-glutamylcysteine + glycine; reduced GSS activity lowers glutathione
    evidence: "OMMBID glutathione synthetase deficiency — low glutathione, 5-oxoprolinuria"
  - source: glutathione_synthetase_activity
    target: plasma_5_oxoproline
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: GSS deficiency disinhibits gamma-GCS (loss of glutathione feedback), overproducing gamma-glutamylcysteine which is converted to 5-oxoproline, raising 5-oxoproline
    evidence: "OMMBID glutathione synthetase deficiency — massive 5-oxoprolinuria (pyroglutamic aciduria)"
  - source: gamma_glutamylcysteine_synthetase_activity
    target: plasma_glutathione
    sign: "+"
    mechanism: gamma-glutamylcysteine synthetase (GCLC) catalyzes the first, rate-limiting step of glutathione synthesis; reduced activity lowers glutathione
    evidence: "OMMBID gamma-glutamylcysteine synthetase deficiency — low erythrocyte glutathione"

  # --- serine biosynthesis (OMMBID PHGDH / PSPH deficiency) ---------------------
  - source: phosphoglycerate_dehydrogenase_activity
    target: plasma_serine
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: PHGDH catalyzes the first step of de novo serine synthesis (3-phosphoglycerate -> 3-phosphohydroxypyruvate); reduced activity lowers serine
    evidence: "OMMBID serine-deficiency disorders (PHGDH deficiency) — low serine (plasma and CSF) | textbook corroboration: Jakubowski & Flatt, Fundamentals of Biochemistry Vol I §biochem-6.6.2 (Allosteric Regulation) — PHGDH catalyzes the first step of serine synthesis; serine is the pathway end-product and allosteric feedback inhibitor of PHGDH, confirming PHGDH activity drives plasma serine levels; Wong, Cells: Molecules and Mechanisms §wong-6.7 (Amino Acid Synthesis - Undeclared): 'The synthesis of serine begins with the metabolic intermediate 3-phosphoglycerate (glycolysis). Phosphoglycerate dehydrogenase oxidizes it to 3-phosphohydroxypyruvate … phosphoserine phosphatase to produce serine'"
  - source: phosphoglycerate_dehydrogenase_activity
    target: csf_serine
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: reduced de novo serine synthesis lowers CSF serine (CNS serine deficiency)
    evidence: "OMMBID PHGDH deficiency — low CSF serine"
  - source: phosphoglycerate_dehydrogenase_activity
    target: plasma_glycine
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: serine is the precursor of glycine (via SHMT); reduced serine synthesis lowers downstream glycine
    evidence: "OMMBID serine-biosynthesis defects — low serine AND glycine"
  - source: phosphoserine_phosphatase_activity
    target: plasma_serine
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: phosphoserine phosphatase (PSPH) catalyzes the final serine-synthesis step (phosphoserine -> serine); reduced activity lowers serine
    evidence: "OMMBID PSPH deficiency — low serine"
  - source: phosphoserine_phosphatase_activity
    target: plasma_phosphoserine
    sign: "-"
    mechanism: PSPH consumes O-phosphoserine; reduced activity causes phosphoserine to accumulate
    evidence: "Lehninger, serine biosynthesis (PSPH dephosphorylates phosphoserine)"

