causal_edges:
  # ===========================================================================
  # PKU — PAH deficiency (OMIM 261600)
  #   Phenotype under LoF (PAH activity DOWN): phenylalanine UP, tyrosine DOWN.
  # ===========================================================================
  - source: pah_enzyme_activity
    target: plasma_phenylalanine
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: PAH hydroxylates phenylalanine to tyrosine; phenylalanine is the SUBSTRATE, so ∂[Phe]/∂(PAH activity) < 0 — more enzyme clears Phe, LoF (activity DOWN) => Phe accumulates (PKU).
    evidence: "Lehninger Principles of Biochemistry (Nelson & Cox) Ch. 18 (Phe -> Tyr by phenylalanine hydroxylase); PKU / PAH deficiency OMIM 261600; Boron & Boulpaep Medical Physiology | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-141 (24.5: Protein Metabolism): 'People afflicted with PKU lack sufficient activity of the enzyme phenylalanine hydroxylase and are therefore unable to break down phenylalanine into tyrosine adequately. Because of this, levels of phenylalanine rise to toxic levels in the body'; Wong, Cells: Molecules and Mechanisms §wong-6.7 (Amino Acid Synthesis - Undeclared): 'phenylalanine oxygenase reduces phenylalanine to produce the tyrosine' (phenylalanine consumed as substrate)"
  - source: pah_enzyme_activity
    target: plasma_tyrosine
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: tyrosine is the product of PAH; loss of PAH activity lowers tyrosine production, so product co-varies with enzyme activity (LoF => Tyr falls).
    evidence: "Lehninger Principles of Biochemistry Ch. 18 (tyrosine is the PAH product; becomes dietarily essential in PKU); PKU OMIM 261600 | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-141 (24.5: Protein Metabolism): 'People afflicted with PKU lack sufficient activity of the enzyme phenylalanine hydroxylase and are therefore unable to break down phenylalanine into tyrosine adequately' — PAH converts Phe to Tyr, so reduced PAH lowers plasma tyrosine; Wong, Cells: Molecules and Mechanisms §wong-6.7 (Amino Acid Synthesis - Undeclared): 'phenylalanine oxygenase reduces phenylalanine to produce the tyrosine' (tyrosine is the product)"

  # ===========================================================================
  # Classic homocystinuria — CBS deficiency (OMIM 236200)
  #   Phenotype under LoF (CBS activity DOWN): homocysteine UP, methionine UP.
  #   CBS catalyzes the first transsulfuration step (homocysteine + serine ->
  #   cystathionine). Its loss accumulates homocysteine; the excess homocysteine
  #   is remethylated back to methionine, so methionine ALSO rises.
  # ===========================================================================
  - source: cbs_enzyme_activity
    target: plasma_homocysteine
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: CBS condenses homocysteine with serine to cystathionine (first transsulfuration step); homocysteine is the SUBSTRATE, so ∂[Hcy]/∂(CBS activity) < 0 — LoF (activity DOWN) => homocysteine accumulates.
    evidence: "Lehninger Principles of Biochemistry Ch. 22 (transsulfuration: cystathionine beta-synthase, homocysteine + serine -> cystathionine); classic homocystinuria OMIM 236200"
  - source: plasma_homocysteine
    target: plasma_methionine
    sign: "+"
    mechanism: accumulated homocysteine is salvaged by remethylation (methionine synthase / betaine-homocysteine methyltransferase) back to methionine; higher homocysteine drives higher methionine remethylation flux, so plasma methionine rises (the characteristic high-methionine signature of CBS deficiency).
    evidence: "Lehninger Principles of Biochemistry Ch. 22 (homocysteine remethylation to methionine via the methionine cycle); classic homocystinuria OMIM 236200 (hypermethioninemia); Boron & Boulpaep Medical Physiology"

  # ===========================================================================
  # Maple syrup urine disease — BCKDH deficiency (OMIM 248600)
  #   Phenotype under LoF (BCKDH activity DOWN): branched-chain amino acids UP.
  # ===========================================================================
  - source: bckdh_enzyme_activity
    target: plasma_branched_chain_amino_acids
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: the branched-chain alpha-keto acid dehydrogenase complex irreversibly decarboxylates the branched-chain alpha-keto acids; the upstream branched-chain amino acids are the SUBSTRATE pool, so ∂[BCAA]/∂(BCKDH activity) < 0 — LoF (activity DOWN) => BCAA accumulate (MSUD).
    evidence: "Lehninger Principles of Biochemistry Ch. 18 (branched-chain amino-acid catabolism; BCKDH oxidative decarboxylation); maple syrup urine disease OMIM 248600"

  # ===========================================================================
  # Urea-cycle disorders / OTC deficiency (OMIM 311250)
  #   Phenotype under LoF (urea-cycle enzyme activity DOWN): urea synthesis DOWN,
  #   ammonia UP, glutamine UP. The liver normally detoxifies ammonia to urea;
  #   when blocked, ammonia accumulates and is buffered into glutamine.
  # ===========================================================================
  - source: urea_cycle_enzyme_activity
    target: hepatic_urea_synthesis
    sign: "+"
    causal_evidence: genetic_lof_gof
    mechanism: the urea cycle (CPS1, ornithine transcarbamylase OTC, ASS1, ASL, arginase) converts ammonia + aspartate nitrogen to urea; urea-cycle enzyme activity sets the urea synthesis flux (LoF => urea synthesis falls).
    evidence: "Lehninger Principles of Biochemistry Ch. 18 (the urea cycle; OTC catalyzes carbamoyl-phosphate + ornithine -> citrulline); OTC deficiency OMIM 311250 | textbook corroboration: OpenStax Biology 2e §bio-41.4 (Nitrogenous Wastes): urea cycle enzymes catalyze the conversion of ammonia to urea in the liver, so higher enzyme activity drives higher urea synthesis"
  - source: hepatic_urea_synthesis
    target: plasma_ammonia
    sign: "-"
    mechanism: urea synthesis is the principal route of ammonia disposal; higher hepatic ureagenesis lowers the circulating ammonia load, so reduced urea synthesis raises plasma ammonia (hyperammonemia of urea-cycle disorders).
    evidence: "Lehninger Principles of Biochemistry Ch. 18 (ureagenesis as ammonia detoxification); Boron & Boulpaep Medical Physiology (hepatic ammonia clearance); OTC deficiency OMIM 311250 | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-141 (24.5: Protein Metabolism): 'In the urea cycle, ammonium is combined with CO2, resulting in urea and water. The urea is eliminated through the kidneys in the urine' — urea synthesis removes ammonia from circulation"
  - source: plasma_ammonia
    target: plasma_glutamine
    sign: "+"
    mechanism: excess ammonia is buffered by glutamine synthetase amidation of glutamate to glutamine (the major non-toxic ammonia carrier); rising ammonia raises plasma glutamine (elevated glutamine is an early marker of hyperammonemia).
    evidence: "Boron & Boulpaep Medical Physiology (glutamine as the principal circulating ammonia carrier); Lehninger Principles of Biochemistry Ch. 18 (glutamine synthetase ammonia fixation); urea-cycle disorders OMIM 311250"

  # --- coupling of plasma ammonia to the urea cycle (substrate availability) ---
  - source: plasma_ammonia
    target: hepatic_urea_synthesis
    sign: "+"
    mechanism: ammonia (as carbamoyl phosphate via CPS1) is the entry substrate of the urea cycle; higher ammonia load drives higher ureagenesis when urea-cycle capacity is intact (substrate-driven flux). This closes a negative-feedback loop with hepatic_urea_synthesis -(-)-> plasma_ammonia.
    evidence: "Lehninger Principles of Biochemistry Ch. 18 (ammonia/carbamoyl phosphate is the first urea-cycle substrate; flux responds to nitrogen load); Boron & Boulpaep Medical Physiology | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-141 (24.5: Protein Metabolism): 'The urea cycle is a set of biochemical reactions that produces urea from ammonium ions in order to prevent a toxic level of ammonium in the body... ammonium ions are produced from the breakdown of amino acids... enters into the urea cycle to be eliminated'"

constitutive_edges: []   # none — self-contained single-scale subsystem (Phase 1)
