# =============================================================================
# Amino-acid & urea-cycle metabolism (inborn errors of metabolism)
#   PhysioMap fragment  *** DRAFT FOR REVIEW ***
# =============================================================================
# Hand-encoded, single-scale (ORGAN_SYSTEM / ORGAN). Each edge sign is the sign of
# the partial derivative of the target w.r.t. the source at steady state, all else
# equal (interventionist partial). ROBERT: please correct signs/edges.
#
# SIGN CONVENTION FOR ENZYME -> METABOLITE EDGES (comparative-statics, ∂target/∂source):
#   The enzyme nodes are *enzyme-activity* variables; an inborn error is modelled as a
#   do() clamping that activity DOWN (LoF). Edge signs follow the canonical flux reading:
#     - enzyme_activity -(-)-> SUBSTRATE  : ∂[substrate]/∂(activity) < 0 (more enzyme clears
#       it), so LoF (activity DOWN) => substrate ACCUMULATES.
#     - enzyme_activity -(+)-> PRODUCT    : ∂[product]/∂(activity) > 0, so LoF => product FALLS.
#   Verified: do(PAH-) => Phe+, Tyr-;  do(CBS-) => homocysteine+, methionine+ (remethylation);
#   do(BCKDH-) => branched-chain AA+;  do(urea-cycle enzyme-) => urea synthesis-, ammonia+.
#   For each disorder the canonical biochemical phenotype under LoF is stated in a comment.
#
# Sources for canonical signs / mechanisms / disease numbers:
#   - Lehninger Principles of Biochemistry (Nelson & Cox), Ch. 18 "Amino Acid
#     Oxidation and the Production of Urea" and Ch. 22 (amino-acid biosynthesis):
#     PAH (Phe -> Tyr), the urea cycle (NH3/aspartate -> urea via OTC/CPS1/ASS1/ASL/ARG1),
#     transsulfuration (CBS: homocysteine + serine -> cystathionine), BCAA catabolism
#     (BCKDH oxidative decarboxylation of branched-chain alpha-keto acids).
#   - Boron & Boulpaep, Medical Physiology (hepatic nitrogen handling; glutamine as
#     the major non-toxic ammonia carrier; ammonia detoxification to urea).
#   - OMIM disease numbers (real, as supplied in the fragment spec):
#       PKU (PAH deficiency)                  OMIM 261600
#       Classic homocystinuria (CBS def.)     OMIM 236200
#       Maple syrup urine disease (BCKDH def.) OMIM 248600
#       OTC deficiency (urea-cycle disorder)  OMIM 311250
#
# DISORDER MAP (phenotype under loss-of-function = enzyme activity DOWN):
#   PKU            : PAH down   -> phenylalanine UP, tyrosine DOWN
#   Homocystinuria : CBS down   -> homocysteine UP, methionine UP
#   MSUD           : BCKDH down  -> branched-chain amino acids UP
#   OTC def. / UCD : urea-cycle enzyme down -> ammonia UP, glutamine UP, urea synthesis DOWN
#
# Boundary: this is a SELF-CONTAINED subsystem (hepatic amino-acid metabolism).
# It is intentionally NOT forced to link to the cardiovascular/renal core; no
# defensible single-scale causal edge to an existing boundary node was available
# without fabrication. validate_fragment will WARN "island" — that is acceptable
# per the fragment spec (a WARN, not an error).
# =============================================================================

name: aminoacid_metabolism
description: >-
  DRAFT amino-acid & urea-cycle metabolism (inborn errors of metabolism) as a
  PhysioMap signed causal graph. Covers four classic enzyme-deficiency disorders —
  PKU (PAH), classic homocystinuria (CBS), maple syrup urine disease (BCKDH), and
  OTC deficiency / urea-cycle disorders — and the hepatic ammonia -> glutamine /
  urea detoxification axis. Single-scale (organ_system / organ), Phase 1. DRAFT
  FOR REVIEW.

