# =============================================================================
# Thermoregulation / body-temperature homeostasis — PhysioMap fragment   *** DRAFT FOR REVIEW ***
# =============================================================================
# Hand-encoded, single-scale (ORGAN / ORGAN_SYSTEM). Each edge sign is the sign of
# the partial derivative of the target w.r.t. the source at steady state, all else
# equal. ROBERT: please correct signs/edges.
#
# Sources for canonical signs:
#   - Stolwijk 1971 (NASA CR-1855) — 25-node controlled human thermoregulation model:
#     hypothalamic error signal drives sweating, vasomotor (skin blood flow) and
#     shivering effectors.
#   - HumMod thermoregulation module (core temperature -> sweat rate, skin blood flow,
#     shivering; metabolic heat -> body temperature).
#   - Boron & Boulpaep / Guyton & Hall: warm response = sweating + cutaneous vasodilation
#     (heat loss); cold response = shivering + cutaneous vasoconstriction (heat conservation).
#
# Thermoregulatory NEGATIVE-FEEDBACK loops (each net negative) are included:
#   core_temperature -> sweating (+) -> core_temperature (-)            [evaporative loss]
#   core_temperature -> skin_blood_flow (+) -> core_temperature (-)     [convective/radiative dissipation]
#   core_temperature -> shivering (-) -> metabolic_heat_production (+) -> core_temperature (+)
#                                                                        [cold-defense, net negative]
#
# Boundary nodes (defined in sibling fragments; referenced, NOT redefined here):
#   metabolic_rate                 (thyroid / metabolism fragment)
#   total_peripheral_resistance    (CV/renal core)
#   heart_rate                     (CV/renal core)
# A standalone load of this file alone will flag those as unknown — EXPECTED; they
# resolve on merge() with the sibling fragments.
# =============================================================================

name: thermoregulation
description: >-
  DRAFT thermoregulation / body-temperature homeostasis as a PhysioMap signed cyclic
  causal graph. Core temperature is regulated by three effector arms — sweating and
  cutaneous vasodilation (heat loss) and shivering (heat production) — each closing a
  negative-feedback loop on core temperature. Includes couplings into cardiovascular
  boundary nodes (cutaneous vasodilation lowers TPR; fever raises heart rate).
  Single-scale (Phase 1).

nodes:
  - id: core_temperature
    label: body core temperature
    scale: organ_system
    entity_iri: UBERON:0000468        # multicellular organism (bearer)
    quality_iri: PATO:0000146         # temperature
  - id: metabolic_heat_production
    label: metabolic heat production (thermogenesis)
    scale: organ_system
    entity_iri: GO:0031649            # heat generation (occurrent bearer of the rate)
    quality_iri: PATO:0000161         # rate
  - id: skin_blood_flow
    label: cutaneous (skin) blood flow
    scale: organ
    quality_iri: PATO:0000161         # rate (flow)
  - id: sweating
    label: sweat (eccrine) secretion rate
    scale: organ
    entity_iri: GO:0160269            # sweat secretion (occurrent bearer of the rate)
    quality_iri: PATO:0000161         # rate
  - id: shivering
    label: shivering thermogenesis (skeletal-muscle tremor)
    scale: organ_system
    quality_iri: PATO:0000161         # rate

causal_edges:
  # --- heat balance: production raises temperature -------------------------
  - source: metabolic_heat_production
    target: core_temperature
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: heat generated by oxidative metabolism and shivering raises body heat content, hence core temperature
    evidence: "Stolwijk 1971 heat-balance equations; HumMod (heat production -> body temperature) | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-054 (10.3: Skeletal Muscle): 'when sustained muscle movement causes body temperature to rise' — ATP breakdown during muscle contraction produces heat that raises core temperature.; OpenStax Anatomy & Physiology 2e §anp-143 (24.7: Energy and Heat Balance): approximately 60% of ATP energy is in the form of heat used to maintain body temperature; OpenStax Anatomy & Physiology 2e §anp-167 (28.6: Adjustments of the Infant at Birth and Postnatal Stages): brown adipose tissue mitochondria 'engage in cellular respiration reactions that produce less ATP and more heat than standard cellular respiration reactions', raising body temperature."
  - source: metabolic_rate
    target: metabolic_heat_production
    sign: "+"
    mechanism: increased whole-body oxidative metabolism dissipates energy as obligatory heat
    evidence: "thermoregulation: metabolic rate is the source term for metabolic heat production | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-143 (24.7: Energy and Heat Balance): 10% of daily energy expenditure is for body thermoregulation/temperature control; metabolic rate links to heat generation"

  # --- warm-defense arm 1: sweating (negative feedback) --------------------
  - source: core_temperature
    target: sweating
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: hypothalamic warm signal drives eccrine sweat secretion above the sweating threshold
    evidence: "Stolwijk 1971 (sweat command ~ positive core error); HumMod sweat rate control | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-003 (1.4: Functions of Human Life): 'increased body temperature can cause the responses of sweating … in order to decrease body temperature'; OpenStax Anatomy & Physiology 2e §anp-004 (1.5: Requirements for Human Life): 'One of the body's responses to heat is, of course, sweating.'; OpenStax Anatomy & Physiology 2e §anp-005 (1.6: Homeostasis): 'As blood flow to the skin increases, sweat glands are activated to increase their output'; OpenStax Anatomy & Physiology 2e §anp-026 (5.3: Accessory Structures of the Skin): 'When the body becomes warm, sudoriferous glands produce sweat to cool the body' — body warmth drives eccrine sweat secretion.; OpenStax Anatomy & Physiology 2e §anp-027 (5.4: Functions of the Integumentary System): 'If the body becomes excessively warm... sweat glands will be stimulated by the sympathetic nervous system to produce large amounts of sweat'; OpenStax Anatomy & Physiology 2e §anp-143 (24.7: Energy and Heat Balance): hypothalamus initiates sweating to allow evaporation of water on the skin when temperature is too high; OpenStax Biology 2e §bio-33.3 (Homeostasis): 'The hypothalamus maintains the set point for body temperature through reflexes that cause vasodilation and sweating when the body is too warm.'"
  - source: sweating
    target: core_temperature
    sign: "-"
    causal_evidence: mechanistic_model
    mechanism: evaporation of sweat removes latent heat from the skin, lowering body heat content
    evidence: "Boron & Boulpaep: evaporative heat loss; Stolwijk evaporative cooling term | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-004 (1.5: Requirements for Human Life): 'As sweat evaporates from skin, it removes some thermal energy from the body, cooling it.'; OpenStax Anatomy & Physiology 2e §anp-026 (5.3: Accessory Structures of the Skin): 'Eccrine glands are a primary component of thermoregulation in humans and thus help to maintain homeostasis' — sweat production lowers core temperature.; OpenStax Anatomy & Physiology 2e §anp-027 (5.4: Functions of the Integumentary System): 'When the sweat evaporates from the skin surface, the body is cooled as body heat is dissipated'; OpenStax Anatomy & Physiology 2e §anp-068 (12.2: Basic Structures and Function of the Nervous System): 'When you are hot, sweating helps cool your body down. That is a homeostatic mechanism.'; OpenStax Anatomy & Physiology 2e §anp-143 (24.7: Energy and Heat Balance): evaporation of water (sweat) takes heat from the skin, cooling it"

  # --- warm-defense arm 2: skin blood flow / vasodilation (negative feedback)
  - source: core_temperature
    target: skin_blood_flow
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: warm signal causes active cutaneous vasodilation, increasing skin perfusion
    evidence: "Stolwijk 1971 vasomotor control; HumMod (core temperature -> skin blood flow) | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-003 (1.4: Functions of Human Life): 'increased body temperature can cause … the dilation of blood vessels in the skin in order to decrease body temperature'; OpenStax Anatomy & Physiology 2e §anp-004 (1.5: Requirements for Human Life): 'The body responds to cold by reducing blood circulation to the extremities... in order to prevent blood from cooling there and so that the body's core can stay warm.'; OpenStax Anatomy & Physiology 2e §anp-005 (1.6: Homeostasis): 'Blood vessels in the skin begin to dilate allowing more blood from the body core to flow to the surface of the skin allowing the heat to radiate into the environment'; OpenStax Anatomy & Physiology 2e §anp-027 (5.4: Functions of the Integumentary System): 'arterioles in the dermis dilate so that excess heat carried by the blood can dissipate through the skin and into the surrounding environment'; OpenStax Anatomy & Physiology 2e §anp-115 (20.6: Circulatory Pathways): 'When the ambient temperature is warm, more blood is diverted to the superficial veins where heat can be more easily dissipated to the environment. In colder weather, there is more constriction of the superficial veins and blood is diverted deeper where the body can retain more of the heat.'; OpenStax Anatomy & Physiology 2e §anp-143 (24.7: Energy and Heat Balance): hypothalamus initiates increasing circulation to surface to allow dissipation of heat through skin when temperature too high; OpenStax Biology 2e §bio-33.3 (Homeostasis): 'Vasodilation brings more blood and heat to the body surface, facilitating radiation and evaporative heat loss'; 'Vasoconstriction reduces blood flow in peripheral blood vessels.'"
  - source: skin_blood_flow
    target: core_temperature
    sign: "-"
    causal_evidence: mechanistic_model
    mechanism: higher skin perfusion carries core heat to the surface for radiative/convective dissipation
    evidence: "Boron & Boulpaep: skin blood flow sets dry heat loss; Stolwijk core->skin conduction | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-027 (5.4: Functions of the Integumentary System): 'the arterioles constrict to minimize heat loss... passive heat loss is prevented, and internal organs and structures remain warm'; OpenStax Anatomy & Physiology 2e §anp-143 (24.7: Energy and Heat Balance): increased blood circulation to skin surface dissipates heat, lowering core temperature"

  # --- cold-defense arm: shivering (net-negative loop via heat production) --
  - source: core_temperature
    target: shivering
    sign: "-"
    causal_evidence: mechanistic_model
    mechanism: shivering is engaged by the cold (low-temperature) signal; below the threshold, lower core temperature raises shivering
    evidence: "Stolwijk 1971 (shivering command ~ negative core error); HumMod shivering control | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-004 (1.5: Requirements for Human Life): 'One response to cold is shivering, which is random muscle movement that generates heat.'; OpenStax Anatomy & Physiology 2e §anp-005 (1.6: Homeostasis): 'activation of the brain's heat-gain center by exposure to cold reduces blood flow to the skin... the brain triggers an increase in random signals to skeletal muscles, causing them to contract and producing shivering'; OpenStax Anatomy & Physiology 2e §anp-022 (4.5: Muscle Tissue and Motion): shivering is an involuntary contraction of skeletal muscles in response to perceived lower than normal body temperature; OpenStax Anatomy & Physiology 2e §anp-143 (24.7: Energy and Heat Balance): if temperature falls below set core temperature, hypothalamus initiates shivering to generate heat; OpenStax Biology 2e §bio-33.3 (Homeostasis): 'vasoconstriction and shivering when the body is too cold' — hypothalamic thermoregulatory reflex."
  - source: shivering
    target: metabolic_heat_production
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: involuntary skeletal-muscle tremor performs no external work, so all energy appears as heat
    evidence: "Guyton & Hall: shivering can raise heat production several-fold; HumMod shivering thermogenesis | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-004 (1.5: Requirements for Human Life): 'shivering, which is random muscle movement that generates heat.'; OpenStax Anatomy & Physiology 2e §anp-005 (1.6: Homeostasis): 'The muscle contractions of shivering release heat while using up ATP'; OpenStax Anatomy & Physiology 2e §anp-022 (4.5: Muscle Tissue and Motion): skeletal muscles generate heat as a byproduct of their contraction, thus participating in thermal homeostasis via shivering; OpenStax Anatomy & Physiology 2e §anp-054 (10.3: Skeletal Muscle): 'in cases of extreme cold, when shivering produces random skeletal muscle contractions to generate heat' — shivering thermogenesis raises metabolic heat production.; OpenStax Anatomy & Physiology 2e §anp-143 (24.7: Energy and Heat Balance): shivering uses more energy and generates more heat"

  # --- cardiovascular couplings (boundary nodes) ---------------------------
  - source: skin_blood_flow
    target: total_peripheral_resistance
    sign: "-"
    mechanism: cutaneous vasodilation adds a low-resistance parallel bed, lowering systemic vascular resistance
    evidence: "Rowell 1974 (cutaneous vasodilation reduces TPR during heat stress)"
  - source: core_temperature
    target: sa_node_automaticity     # re-routed through the explicit pacemaker mediator (G. Gkoutos curated HR model)
    sign: "+"
    mechanism: rising core temperature accelerates SA-node pacemaker rate / ion-channel kinetics (fever tachycardia, ~10 bpm/degC); see george_heart_rate.yaml
    evidence: "Guyton & Hall: temperature directly raises heart rate; clinical fever tachycardia | re-routed core_temperature->heart_rate through sa_node_automaticity per G. Gkoutos curated heart-rate mechanism (ECO:0000305)"

constitutive_edges: []   # none yet — multi-scale expansion is the next step
