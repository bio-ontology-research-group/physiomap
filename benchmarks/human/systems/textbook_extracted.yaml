causal_edges:
  - source: intracellular_atp
    target: phosphofructokinase_activity
    sign: "-"
    causal_evidence: perturbation
    mechanism: "Allosteric negative feedback: excess ATP binds to an allosteric site on PFK (outside the fructose-6-phosphate active site), conformationally inhibiting the enzyme and blocking glycolysis"
    evidence: "Wong, Cells: Molecules and Mechanisms §wong-3.4 (Regulation of Enzyme Activity): 'if there are high enough levels of ATP in the cell that other cellular processes aren't using, then it can bind to phosphofructokinase outside of its active site... and turn it off. This blocks glycolysis and production of excess ATP when the cell does not need it.' | textbook corroboration: OpenStax Biology 2e §bio-7.2 (7.2: Glycolysis): 'it is less active when ADP levels are low and the concentration of ATP is high. Thus, if there is 'sufficient' ATP in the system, the pathway slows down. This is a type of end product inhibition, since ATP is the end product of glucose catabolism.'"
  - source: na_k_atpase_activity
    target: cardiomyocyte_intracellular_sodium
    sign: "-"
    causal_evidence: pharmacological
    mechanism: "Na+/K+-ATPase continuously exports 3 Na+ per cycle, keeping intracellular [Na+] low; greater pump activity lowers cytosolic [Na+] (quality: pump activity -> process: electrogenic Na+ extrusion -> quality: intracellular [Na+])"
    evidence: "Wong, Cells: Molecules and Mechanisms §wong-4.4 (The Action Potential in Neurons): 'the Na+/K+ ATPase...utilizes the energy from ATP hydrolysis to power the conformational changes needed to move both Na+ and K+ ions against the gradient'; cardiac glycosides 'inhibit the Na+/K+ ATPase...causes a rise in [Na+]in'"
  - source: plasma_ketone_bodies
    target: arterial_ph
    sign: "-"
    causal_evidence: mechanistic_model
    mechanism: "Ketone bodies (acetoacetate, 3-hydroxybutyrate) are acidic; their accumulation in blood raises [H+] and lowers arterial pH (ketoacidosis)."
    evidence: "Wong, Cells: Molecules and Mechanisms §wong-5.7 (5.7 Starch and Glycogen Depolymerization Undeclared): 'This leads to a buildup of the molecules in the bloodstream, which lowers the pH, since the molecules are acidic.'"
  - source: norepinephrine
    target: plasma_free_fatty_acids
    sign: "+"
    causal_evidence: pharmacological
    mechanism: "norepinephrine activates beta-adrenergic receptors on brown (and white) adipocytes, stimulating hormone-sensitive lipase via cAMP/PKA, mobilising free fatty acids from stored triacylglycerol"
    evidence: "Wong, Cells: Molecules and Mechanisms §wong-5.9 (Amino Acid Degradation - Undeclared): 'The hormone norepinephrine increases production of free fatty acids, which open the thermogenin channel' (section 5.5, Uncoupling Electron Transport from ATP Synthesis)"
  - source: plasma_free_fatty_acids
    target: metabolic_heat_production
    sign: "+"
    causal_evidence: perturbation
    mechanism: "free fatty acids open the UCP1/thermogenin proton channel in brown adipose tissue inner mitochondrial membrane, uncoupling electron transport from ATP synthesis so the proton gradient dissipates as heat (non-shivering thermogenesis)"
    evidence: "Wong, Cells: Molecules and Mechanisms §wong-5.9 (Amino Acid Degradation - Undeclared): free fatty acids open the thermogenin channel, allowing protons to flow back into the matrix without ATP synthase, and 'the excess energy not being used in ATP production is released as heat' (section 5.5, Uncoupling Electron Transport from ATP Synthesis)"
  - source: tert_expression
    target: telomerase_activity
    sign: "+"
    causal_evidence: perturbation
    mechanism: "TERT gene encodes the catalytic reverse-transcriptase subunit of the telomerase holoenzyme; more TERT expression produces more functional telomerase enzyme"
    evidence: "Wong, Cells: Molecules and Mechanisms §wong-7.7 (Telomeres - Undeclared): 'The activity of telomerase is primarily regulated by expression of the TERT gene (telomerase reverse transcriptase)'"
  - source: telomerase_activity
    target: telomere_length
    sign: "+"
    causal_evidence: perturbation
    mechanism: "Telomerase acts as a reverse transcriptase reading its self-contained RNA template to add telomeric repeat sequences to the 3' ends of linear chromosomes, thereby extending telomere length"
    evidence: "Wong, Cells: Molecules and Mechanisms §wong-7.7 (Telomeres - Undeclared): 'Telomerase is a large holoenzyme that acts as a reverse transcriptase, reading a self-contained RNA template to add on telomere sequence to the 3’ ends of linear chromosomes' and 'while telomerases are active, the 3’ ends can be extended'"
  - source: helper_t_cell_activation
    target: b_cell_proliferation
    sign: "+"
    mechanism: "Activated helper T cell binds to and activates a B cell that has also bound to the same antigen, leading to massive B-cell proliferation"
    evidence: "Wong, Cells: Molecules and Mechanisms §wong-16.8 (The Immune System - Undeclared): 'The activated helper T-cell binds to and activates a B cell that has also bound to the antigen of interest, leading to massive B-cell proliferation'"
  - source: nmj_ache_activity
    target: synaptic_acetylcholine
    sign: "-"
    causal_evidence: pharmacological
    mechanism: "Acetylcholinesterase hydrolyzes acetylcholine in the synapse, reducing its concentration"
    evidence: "Jakubowski & Flatt, Fundamentals of Biochemistry Vol I §biochem-5.7 (Binding - Enzyme Linked Immunosorbant): 'The transmitter must not reside too long in the synapse; otherwise, muscle contraction will continue uncontrolled. To prevent this, a hydrolytic enzyme, acetylcholinesterase, a serine esterase found in the synapse, cleaves the transmitter at rates close to diffusion-controlled.'"
  - source: core_temperature
    target: metabolic_rate
    sign: "+"
    causal_evidence: perturbation
    mechanism: "Temperature sets the rate of enzyme-catalysed metabolic reactions; controlled hypothermia (reduced core temperature) decreases whole-body metabolic rate, while hyperthermia raises it (Q10 effect on cellular chemistry)."
    evidence: "OpenStax Anatomy & Physiology 2e §anp-004 (1.5: Requirements for Human Life): 'controlled hypothermia... decreases the metabolic needs of the brain, heart, and other organs' and 'slows the patient's metabolic rate'; also: 'chemical reactions upon which the body depends can only take place within a narrow range of body temperature'."
  - source: uterine_contraction_rate
    target: cervical_distension
    sign: "+"
    mechanism: "stronger uterine contractions push the fetus against and through the cervix, increasing cervical mechanical stretch"
    evidence: "OpenStax Anatomy & Physiology 2e §anp-005 (1.6: Homeostasis): 'This causes even greater stretching of the cervix' — parturition positive-feedback loop"
  - source: plasma_histamine
    target: capillary_permeability
    sign: "+"
    causal_evidence: pharmacological
    mechanism: "Histamine released by mast cells acts on vascular endothelium to loosen interendothelial junctions, making the vessel wall 'leaky' and increasing fluid/protein extravasation into interstitial tissue"
    evidence: "OpenStax Anatomy & Physiology 2e §anp-024 (4.7: Tissue Injury and Aging): 'The endothelium lining the local blood vessel becomes leaky under the influence of histamine and other inflammatory mediators allowing neutrophils, macrophages, and fluid to move from the blood into the interstitial tissue spaces.' | textbook corroboration: OpenStax Biology 2e §bio-42.1 (42.1: Innate Immune Response): 'In response to a cut, mast cells secrete histamines that cause nearby capillaries to dilate' (Figure 42.5 caption) — histamine from mast cells/basophils increases microvascular permeability during inflammation."
  - source: plasma_histamine
    target: total_peripheral_resistance
    sign: "-"
    causal_evidence: pharmacological
    mechanism: "Histamine is a potent vasodilator: it binds H1 receptors on vascular smooth muscle and endothelium to cause arteriolar dilation, reducing total peripheral resistance"
    evidence: "OpenStax Anatomy & Physiology 2e §anp-024 (4.7: Tissue Injury and Aging): 'mast cells present in tissue degranulate, releasing the potent vasodilator histamine. Increased blood flow results in apparent redness and heat' — vasodilation implies decreased peripheral resistance. | textbook corroboration: OpenStax Biology 2e §bio-42.1 (42.1: Innate Immune Response): 'mast cells secrete histamines that cause nearby capillaries to dilate' (Figure 42.5 caption) — histamine-mediated arteriolar vasodilation reduces peripheral resistance.; OpenStax Biology 2e §bio-42.4 (42.4: Disruptions in the Immune System): 'effects of an allergic reaction range from...plummeting blood pressure' in anaphylactic shock — histamine-driven vasodilation causes the observed MAP/TPR drop"
  - source: plasma_calcitonin
    target: plasma_calcium
    sign: "-"
    causal_evidence: pharmacological
    mechanism: "Calcitonin stimulates calcium uptake by bones and inhibits osteoclasts, thereby lowering plasma calcium concentration"
    evidence: "OpenStax Anatomy & Physiology 2e §anp-034 (Exercise, Nutrition, Hormones, and Bone Tissue): 'Calcitonin inhibits osteoclast activity and stimulates calcium uptake by the bones, thus reducing the concentration of calcium ions in the blood.' | textbook corroboration: OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): 'Calcitonin decreases blood calcium levels by inhibiting osteoclasts, stimulating osteoblasts, and stimulating calcium excretion by the kidneys.'; OpenStax Biology 2e §bio-37.5 (37.5: Endocrine Glands): 'The combination of these two events [inhibit osteoclast activity; stimulate renal calcium excretion] lowers body fluid levels of calcium.'"
  - source: plasma_calcium
    target: plasma_calcitonin
    sign: "+"
    causal_evidence: perturbation
    mechanism: "Elevated blood calcium stimulates the thyroid gland to release calcitonin"
    evidence: "OpenStax Anatomy & Physiology 2e §anp-035 (6.8: Calcium Homeostasis - Interactions of the Skeletal System and Other Organ): 'When blood levels of calcium get too high, the thyroid gland is stimulated to release calcitonin.' | textbook corroboration: OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): 'The hormone calcitonin...has the opposite effect on blood calcium levels as does PTH.' — implied: calcitonin is released in response to high blood calcium.; OpenStax Biology 2e §bio-37.5 (37.5: Endocrine Glands): 'calcitonin is produced by parafollicular cells of the thyroid... Calcitonin release is not controlled by TSH, but instead is released when calcium ion concentrations in the blood rise.'"
  - source: skeletal_muscle_creatine_phosphate
    target: skeletal_muscle_atp
    sign: "+"
    causal_evidence: perturbation
    mechanism: "Creatine kinase transfers the phosphate group from creatine phosphate to ADP, rapidly regenerating ATP during the first seconds of muscle contraction"
    evidence: "OpenStax Anatomy & Physiology 2e §anp-055 (10.4: Muscle Fiber Contraction and Relaxation): 'creatine phosphate transfers its phosphate back to ADP to form ATP and creatine. This reaction is catalyzed by the enzyme creatine kinase and occurs very quickly; thus, creatine phosphate-derived ATP powers the first few seconds of muscle contraction'"
  - source: motor_unit_recruitment
    target: skeletal_muscle_tension
    sign: "+"
    causal_evidence: perturbation
    mechanism: "Activating more motor units (each comprising a motor neuron and its innervated muscle fibers) adds their contractile forces; larger motor units contribute disproportionately more force (up to 50x that of smallest units)"
    evidence: "OpenStax Anatomy & Physiology 2e §anp-056 (10.5: Nervous System Control of Muscle Tension): 'As more motor units are recruited, the muscle contraction grows progressively stronger'; 'the largest motor units may generate a contractile force of 50 times more than the smallest motor units in the muscle'"
  - source: testosterone
    target: lean_body_mass
    sign: "+"
    mechanism: "testosterone (anabolic steroid form) stimulates myofibril formation and structural protein synthesis in skeletal muscle, increasing muscle fiber diameter (hypertrophy) and overall lean body mass"
    evidence: "OpenStax Anatomy & Physiology 2e §anp-058 (10.7: Exercise and Muscle Performance): 'Anabolic steroids are a form of testosterone, a male sex hormone that stimulates muscle formation, leading to increased muscle mass'"
  - source: pituitary_gh
    target: lean_body_mass
    sign: "+"
    causal_evidence: pharmacological
    mechanism: "growth hormone facilitates anabolic building of skeletal muscle mass and promotes healing/repair of muscle tissue after exercise-induced damage, supporting net accretion of lean mass"
    evidence: "OpenStax Anatomy & Physiology 2e §anp-058 (10.7: Exercise and Muscle Performance): 'Human growth hormone (hGH)...can facilitate building muscle mass, its main role is to promote the healing of muscle and other tissues after strenuous exercise'"
  - source: sympathetic_tone
    target: respiratory_rate
    sign: "+"
    mechanism: "Sympathetic activation increases breathing rate to deliver more oxygen to activated skeletal muscle during fight-or-flight response."
    evidence: "OpenStax Anatomy & Physiology 2e §anp-080 (15.2: Divisions of the Autonomic Nervous System): 'As a response to a threat, the sympathetic system would increase heart rate and breathing rate and cause blood flow to the skeletal muscle to increase.'"
  - source: sympathetic_tone
    target: splanchnic_blood_flow
    sign: "-"
