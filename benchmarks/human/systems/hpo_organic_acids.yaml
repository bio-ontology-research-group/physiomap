# =============================================================================
# Organic acids — urinary / plasma / CSF organic-acid analytes + the organic-acidemia
# enzyme-activity roots                       — PhysioMap fragment  *** DRAFT FOR REVIEW ***
# =============================================================================
# Hand-encoded coverage fragment for the HPO "organic acids" directional gap terms.
# These are abnormal-quantity terms used in clinical organic-acid analysis (urine
# GC-MS organic-acid profiling, plasma/CSF metabolomics) and the cultured-fibroblast /
# tissue enzyme assays that define the classic organic acidemias.
#
# DESIGN: This is deliberately an almost-pure ISLAND of grounded analyte/activity nodes.
# Each organic acid is a measurable physiological VARIABLE (concentration in a body fluid,
# or an enzyme activity). A grounded node with NO edges is valuable — under a do() clamp
# it abstains rather than guessing. We add causal edges ONLY for the small number of
# enzyme -> substrate/product relations whose sign is unambiguous from a cited, textbook
# biochemical mechanism (enzyme activity DOWN => substrate UP). We do NOT attempt to wire
# the full intermediary-metabolism network here (that would require guessed signs through
# branched, looped pathways).  ROBERT: please correct nodes / signs / IRIs.
#
# Provenance (textbooks / DBs consulted per analyte cluster):
#   - Lehninger Principles of Biochemistry (citric-acid cycle intermediates: citrate,
#     aconitate, alpha-ketoglutarate/2-oxoglutarate, succinate, fumarate, malate;
#     ketone bodies acetoacetate/3-hydroxybutyrate; glyoxylate/oxalate; BCAA catabolism).
#   - Scriver's The Metabolic & Molecular Bases of Inherited Disease (OMMBID) / Saudubray,
#     Inborn Metabolic Diseases — the canonical reference for the organic acidemias and
#     their diagnostic organic-acid signatures.
#   - Blau, Physician's Guide to the Diagnosis, Treatment, and Follow-up of Inherited
#     Metabolic Diseases (urinary organic-acid GC-MS markers).
#   - Boron & Boulpaep Medical Physiology (renal handling of organic acids; citrate;
#     oxalate). Harrison's Principles of Internal Medicine (organic acidemias, oxalosis).
#   - ChEBI for small-molecule entity IRIs (verified by exact `name:`/synonym match in the
#     downloaded CHEBI.obo; null where no exact class was found — never fabricated).
#
# Disease anchors (cited as REAL OMIM #, encoded only as enzyme-activity roots, not nodes):
#   Propionic acidemia (PCC, OMIM 606054), isovaleric acidemia (IVD, OMIM 243500),
#   3-methylcrotonyl-CoA carboxylase deficiency (MCCC1/2, OMIM 210200/210210),
#   primary hyperoxaluria type 1 (AGXT/AGT, OMIM 259900), type 2 (GRHPR, OMIM 260000),
#   D-glyceric aciduria (GLYCTK, OMIM 220120), SSADH deficiency (ALDH5A1; GHB/4-OH-butyrate,
#   OMIM 271980), malonic aciduria (MLYCD, OMIM 248360), Canavan disease (ASPA; NAA,
#   OMIM 271900), beta-ketothiolase / SCOT deficiency (OXCT1, OMIM 245050), HIBCH and
#   HIBADH defects, MMSDH (ALDH6A1) deficiency, 3-methylglutaconic aciduria (AUH).
# =============================================================================

name: hpo_organic_acids
description: >-
  DRAFT coverage fragment for HPO organic-acid abnormal-quantity terms: urinary, plasma,
  and CSF organic-acid analytes (TCA-cycle intermediates, ketone bodies, glyoxylate/oxalate
  pathway, BCAA-catabolite acylglycines/acylcarnitines, dicarboxylic and aromatic acids) and
  the organic-acidemia enzyme-activity roots. Predominantly an island of grounded analyte and
  enzyme-activity nodes; a few enzyme->substrate/product causal edges with textbook-defensible
  signs. Scales: organ_system (body-fluid concentrations), cellular (enzyme activities, with a
  bearer cell). Phase 1, single-scale-per-node.

