causal_edges:
  # --- Primary hyperoxaluria type 1: AGT deficiency. AGT detoxifies glyoxylate
  #     (-> glycine); loss raises glyoxylate, which is oxidised to oxalate. ---
  - source: agt_activity
    target: plasma_glyoxylate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: peroxisomal alanine-glyoxylate aminotransferase transaminates glyoxylate to glycine; reduced AGT activity leaves glyoxylate unconsumed, raising it (substrate consumption => enzyme down raises substrate)
    evidence: "Scriver's OMMBID / Saudubray, Inborn Metabolic Diseases — primary hyperoxaluria type 1 (AGXT, OMIM 259900): AGT deficiency causes glyoxylate accumulation; Lehninger (glyoxylate metabolism)"
  - source: agt_activity
    target: urinary_oxalate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: glyoxylate not detoxified by AGT is oxidised (LDH) to oxalate; reduced AGT activity therefore raises oxalate production and urinary oxalate excretion (hyperoxaluria)
    evidence: "Harrison's Principles of Internal Medicine (primary hyperoxaluria / oxalosis); Scriver's OMMBID — PH1 (AGXT, OMIM 259900) is the canonical hyperoxaluria-causing AGT deficiency"
  - source: agt_activity
    target: urinary_glycolate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: in PH1 the diverted glyoxylate is also reduced to glycolate, raising urinary glycolate; reduced AGT activity raises it
    evidence: "Scriver's OMMBID / Saudubray — PH1 (AGXT, OMIM 259900): elevated urinary glycolate + oxalate is the diagnostic signature"

  # --- Primary hyperoxaluria type 2: GRHPR (glyoxylate reductase / hydroxypyruvate
  #     reductase) deficiency => glyoxylate -> oxalate, and L-glycerate accumulates. ---
  - source: glyoxylate_reductase_activity
    target: urinary_oxalate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: GRHPR reduces glyoxylate to glycolate (detoxification); loss diverts glyoxylate to oxalate, raising urinary oxalate (hyperoxaluria type 2)
    evidence: "Scriver's OMMBID / Saudubray — primary hyperoxaluria type 2 (GRHPR, OMIM 260000)"
  - source: glyoxylate_reductase_activity
    target: urinary_l_glycerate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: GRHPR also reduces hydroxypyruvate to D-glycerate; in deficiency hydroxypyruvate is instead reduced by LDH to L-glycerate, which accumulates and is excreted (L-glyceric aciduria) — reduced GRHPR activity raises L-glycerate
    evidence: "Scriver's OMMBID — PH2 (GRHPR, OMIM 260000) presents with L-glyceric aciduria"

  # --- D-glyceric aciduria: GLYCTK (D-glycerate kinase) deficiency => D-glycerate
  #     accumulates (not phosphorylated). ---
  - source: glycerate_kinase_activity
    target: urinary_d_glycerate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: D-glycerate kinase phosphorylates D-glycerate to 2-phosphoglycerate; loss leaves D-glycerate unconsumed, raising it (D-glyceric aciduria) — reduced activity raises substrate
    evidence: "Saudubray, Inborn Metabolic Diseases — D-glyceric aciduria (GLYCTK, OMIM 220120)"
  - source: glycerate_kinase_activity
    target: plasma_d_glycerate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: unphosphorylated D-glycerate accumulates systemically when D-glycerate kinase is deficient
    evidence: "Saudubray, Inborn Metabolic Diseases — D-glyceric aciduria (GLYCTK, OMIM 220120)"

  # --- Propionic acidemia: PCC deficiency => propionyl-CoA accumulation, diagnostic
  #     3-hydroxypropionate, 2-methylcitrate, propionylglycine. ---
  - source: propionyl_coa_carboxylase_activity
    target: urinary_3_hydroxypropionate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: PCC carboxylates propionyl-CoA to methylmalonyl-CoA; deficiency backs up propionyl-CoA, diverted to 3-hydroxypropionate which is excreted — reduced PCC activity raises this marker
    evidence: "Scriver's OMMBID / Saudubray — propionic acidemia (PCCA/PCCB, OMIM 606054): urinary 3-hydroxypropionate + 2-methylcitrate diagnostic"
  - source: propionyl_coa_carboxylase_activity
    target: urinary_2_methylcitrate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: accumulated propionyl-CoA condenses with oxaloacetate to 2-methylcitrate; reduced PCC activity raises urinary 2-methylcitrate
    evidence: "Scriver's OMMBID — propionic acidemia (OMIM 606054): 2-methylcitrate is a hallmark organic-acid marker"
  - source: propionyl_coa_carboxylase_activity
    target: urinary_propionylglycine
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: excess propionyl-CoA is conjugated with glycine to propionylglycine; reduced PCC activity raises it
    evidence: "Saudubray, Inborn Metabolic Diseases — propionic acidemia (OMIM 606054)"

  # --- Isovaleric acidemia: IVD deficiency => isovaleryl-CoA accumulation =>
  #     isovalerylglycine, isovaleric acid. ---
  - source: isovaleryl_coa_dehydrogenase_activity
    target: urinary_isovalerylglycine
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: IVD dehydrogenates isovaleryl-CoA in leucine catabolism; deficiency accumulates isovaleryl-CoA, conjugated with glycine to isovalerylglycine (the most reliable marker) — reduced IVD activity raises it
    evidence: "Scriver's OMMBID / Saudubray — isovaleric acidemia (IVD, OMIM 243500): urinary isovalerylglycine is the diagnostic marker"
  - source: isovaleryl_coa_dehydrogenase_activity
    target: plasma_isovalerate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: hydrolysis of accumulated isovaleryl-CoA yields free isovaleric acid; reduced IVD activity raises plasma isovaleric acid
    evidence: "Scriver's OMMBID — isovaleric acidemia (OMIM 243500)"
  - source: isovaleryl_coa_dehydrogenase_activity
    target: urinary_isovaleric_acid
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: free isovaleric acid from accumulated isovaleryl-CoA is excreted; reduced IVD activity raises urinary isovaleric acid
    evidence: "Scriver's OMMBID — isovaleric acidemia (OMIM 243500)"

  # --- 3-MCC deficiency: MCC => 3-methylcrotonylglycine and 3-hydroxyisovalerate. ---
  - source: methylcrotonyl_coa_carboxylase_activity
    target: urinary_3_methylcrotonylglycine
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: MCC carboxylates 3-methylcrotonyl-CoA in leucine catabolism; deficiency accumulates 3-methylcrotonyl-CoA, conjugated with glycine to 3-methylcrotonylglycine — reduced activity raises it
    evidence: "Scriver's OMMBID / Saudubray — 3-methylcrotonyl-CoA carboxylase deficiency (MCCC1/MCCC2, OMIM 210200/210210)"

  # --- Malonic aciduria: MLYCD deficiency => malonyl-CoA / malonate accumulation. ---
  - source: malonyl_coa_decarboxylase_activity
    target: urinary_malonate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: malonyl-CoA decarboxylase converts malonyl-CoA to acetyl-CoA; deficiency accumulates malonyl-CoA hydrolysed to malonic acid (malonic aciduria) — reduced activity raises urinary malonate
    evidence: "Scriver's OMMBID / Saudubray — malonic aciduria (MLYCD, OMIM 248360)"

  # --- 3-methylglutaconyl-CoA hydratase (AUH) deficiency => 3-methylglutaconic +
  #     3-hydroxy-3-methylglutaric (3-MGA type I). ---
  - source: methylglutaconyl_coa_hydratase_activity
    target: urinary_glutaconic_acid
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: AUH hydrates 3-methylglutaconyl-CoA in leucine catabolism; deficiency accumulates 3-methylglutaconate (excreted as glutaconic/methylglutaconic acid) — reduced activity raises it
    evidence: "Scriver's OMMBID / Saudubray — 3-methylglutaconic aciduria type I (AUH, OMIM 250950)"
  - source: methylglutaconyl_coa_hydratase_activity
    target: urinary_3_hydroxy_3_methylglutarate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: blocked 3-methylglutaconyl-CoA is diverted to 3-hydroxy-3-methylglutarate; reduced AUH activity raises urinary 3-hydroxy-3-methylglutarate
    evidence: "Scriver's OMMBID — 3-methylglutaconic aciduria type I (AUH, OMIM 250950)"

  # --- HIBCH deficiency => methacrylyl-CoA toxicity; HIBADH => 3-hydroxyisobutyrate.
  #     Both valine pathway: loss raises 3-hydroxyisobutyrate excretion. ---
  - source: hibadh_activity
    target: urinary_3_hydroxyisobutyrate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: 3-hydroxyisobutyrate dehydrogenase oxidises 3-hydroxyisobutyrate in valine catabolism; deficiency leaves 3-hydroxyisobutyrate unconsumed, raising urinary 3-hydroxyisobutyrate — reduced activity raises substrate
    evidence: "Saudubray, Inborn Metabolic Diseases — 3-hydroxyisobutyrate dehydrogenase (HIBADH) deficiency: 3-hydroxyisobutyric aciduria"

  # --- SCOT / OXCT1 deficiency => permanent ketosis (cannot use ketone bodies);
  #     acetoacetate / 3-hydroxybutyrate accumulate. ---
  - source: scot_activity
    target: urinary_acetoacetate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: SCOT (OXCT1) activates acetoacetate to acetoacetyl-CoA for peripheral ketone-body utilisation; deficiency blocks ketolysis, so acetoacetate accumulates — reduced SCOT activity raises ketone-body markers
    evidence: "Scriver's OMMBID / Saudubray — SCOT (succinyl-CoA:3-oxoacid CoA transferase, OXCT1) deficiency (OMIM 245050): persistent ketosis / ketoaciduria"
  - source: scot_activity
    target: plasma_3_hydroxybutyrate
    sign: "-"
    causal_evidence: genetic_lof_gof
    mechanism: impaired ketolysis raises circulating ketone bodies including 3-hydroxybutyrate; reduced SCOT activity raises plasma 3-hydroxybutyrate
    evidence: "Scriver's OMMBID — SCOT/OXCT1 deficiency (OMIM 245050): persistent non-fasting ketosis"
