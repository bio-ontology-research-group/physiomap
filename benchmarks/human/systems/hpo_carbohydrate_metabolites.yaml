# =============================================================================
# Carbohydrate metabolites, polyols & carbohydrate-pathway enzyme activities
#                                    — PhysioMap fragment  *** DRAFT FOR REVIEW ***
# =============================================================================
# Hand-encoded HPO directional-gap coverage for the "carbohydrate_metabolites"
# theme. Each node is a measurable physiological VARIABLE (entity, PATO
# determinable-quality) at a named scale. Three physiological families:
#
#  (A) CARBOHYDRATE / POLYOL POOLS in a body fluid or tissue (scale organ_system,
#      except muscle glycogen = tissue). These are the small-molecule biomarkers of
#      the disorders of galactose metabolism (galactosemia: galactose, galactitol,
#      galactonate, gal-1-P), fructose metabolism (HFI/essential fructosuria:
#      fructose), the polyol pathway (sorbitol, in diabetic/galactose flux), the
#      pentitol/tetritol disorders (ribitol/D-arabinitol/erythritol/threitol in
#      transaldolase deficiency & ribose-5-P-isomerase / RFT1-CDG; CSF polyols in
#      the polyol-pathway leukodystrophies), 1,5-anhydroglucitol (a short-term
#      glycemic marker that FALLS with glycosuria), L-xylulose (essential
#      pentosuria / DCXR), L-fucose (fucosidosis), N-acetylneuraminic acid (sialuria
#      / Salla), sedoheptulose (SHPK / sedoheptulokinase), and the urinary
#      oligo/di-saccharide patterns of the oligosaccharidoses & Pompe (Glc4),
#      sucrase-isomaltase / lactase deficiency, etc.
#      Refs: Lehninger Principles of Biochemistry (galactose, fructose, pentose-
#      phosphate & polyol pathways); Scriver's OMMBID / Saudubray "Inborn Metabolic
#      Diseases" (galactosemia, HFI, pentosuria, polyol disorders, oligosaccharidoses);
#      Boron & Boulpaep Medical Physiology (intestinal disaccharidases, renal
#      glucose/polyol handling); Harrison's (inborn errors of carbohydrate metabolism).
#
#  (B) INTRACELLULAR / MEMBRANE ENZYME & TRANSPORTER ACTIVITIES (scale cellular),
#      each borne by a named cell/organ. These are the lesion loci of the
#      glycogenoses (phosphorylase kinase PHK, liver/muscle glycogen phosphorylase,
#      glycogen debrancher AGL, muscle PFK [Tarui], G6P-translocase SLC37A4 [GSD-Ib]),
#      galactosemias (GALT/GALK/GALE), the glycolytic erythroenzymopathies
#      (G6PD, hexokinase, glucose-phosphate isomerase, aldolase B, pyruvate kinase,
#      bisphosphoglycerate mutase), gluconeogenic defects (FBPase, PEPCK, aldolase B),
#      the CDGs (PMM2 [CDG-Ia], MPI [CDG-Ib], FUT [LAD-II/FUT-CDG]), glycerol-kinase
#      deficiency, and the disaccharidase deficiencies (sucrase-isomaltase, lactase).
#      Refs: Lehninger (glycolysis, glycogen, gluconeogenesis, PPP, N-glycosylation);
#      Williams Hematology (G6PD / HK / GPI / PK / aldolase / BPGM erythroenzymopathies);
#      Scriver's OMMBID (GSDs, CDGs, galactosemias); Harrison's "Glycogen-storage
#      diseases & glycolytic defects".
#
# SIGN POLICY / EDGES: this is deliberately an ISLAND fragment with NO causal edges.
#   Each enzyme-activity node is a do()-clampable molecular root; each metabolite
#   pool is the downstream readout of one (often disease-specific) lesion. A single
#   defensible signed driver per analyte across the corpus does not exist without a
#   per-disorder flux node that is not modelled here, so per PhysioMap policy we
#   prefer NO edge over a guessed one. Every node is grounded and abstains; the HPO
#   directional terms map onto these grounded variables (the comparative-statics
#   value for these leaf markers is the do()-clamp itself).
#
#   NOTE — all nodes are defined here; none of these analytes pre-exist in the
#   corpus (checked vs ontology/.obo_cache/node_inventory.tsv). The many G6PD HPO
#   terms (tissue/blood/RBC/leukocyte/dried-blood-spot, increased & decreased) all
#   collapse to the single `g6pd_activity` node (same enzyme, opposite signs); the
#   GALE terms (circulating/erythrocyte, increased & decreased) collapse to
#   `udp_glucose_4_epimerase_activity`; phosphorylase-kinase terms (hepatic/muscle/
#   tissue) collapse to `phosphorylase_kinase_activity`.
#
# ENTITY IRIs: verified by grep against ontology/.obo_cache (CHEBI/PR/GO/CL/UBERON).
#   Small molecules -> CHEBI; protein enzymes -> PR; multi-subunit complexes -> GO;
#   bearer cells -> CL; tissue/organ -> UBERON. IRIs left null where no exact OBO
#   'name:' match (oligosaccharide mixtures, isoenzyme-pool activities).
# =============================================================================

name: hpo_carbohydrate_metabolites
description: >-
  DRAFT carbohydrate-metabolite HPO coverage fragment. Carbohydrate/polyol pools in
  plasma/serum, urine, CSF, and red cells (galactose, galactitol, galactonate,
  sorbitol, fructose, L-fucose, L-xylulose, N-acetylneuraminate, sedoheptulose,
  ribitol/ribose, arabinitol/arabitol, erythritol, threitol, xylitol, 1,5-
  anhydroglucitol, disaccharides & oligosaccharides) plus muscle glycogen content,
  and the carbohydrate-pathway enzyme/transporter activities of the glycogenoses,
  galactosemias, glycolytic erythroenzymopathies, gluconeogenic defects, CDGs and
  disaccharidase deficiencies. Island fragment (no causal edges) — grounded leaf
  variables that abstain pending defensible per-disorder flux mechanism nodes.

