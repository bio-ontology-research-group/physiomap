    drives active iodide accumulation inside the follicular cell. do(NIS activity UP) → intracellular iodide concentration
    UP.
  evidence: 'AOP-Wiki KER uuid 19f3b2a4-c7fd-4363-9e2a-cf13496ac1b4 (AOPs: ''Inhibition of Na+/I- symporter (NIS) leads to
    learning and memory impairment''; ''Sodium Iodide Symporter (NIS) Inhibition and Subsequent Adverse Neurodevelopmental
    Outcomes in Mammals''; ''Sodium Iodide Symporter (NIS) Inhibition leading to altered amphibian metamorphosis''); no PMID
    supplied; pmid_ok=false; pmid_concordant=false. Mechanism is textbook thyroid physiology (Dohan et al. 2003 Endocr Rev).
    *** DRAFT FOR REVIEW (imported) ***'
- source: thyroidal_iodide
  target: thyroid_follicular_t4_secretion
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: Intracellular iodide availability in thyroid follicular cells is substrate for thyroid peroxidase (TPO)-mediated
    organification and thyroglobulin iodination; reduced thyroidal iodide directly limits the rate of T4 synthesis and secretion.
  evidence: 'AOP-Wiki KER uuid 45d971c2-7b7f-4b8b-a985-055f32d38129 (AOPs: ''Inhibition of Na+/I- symporter (NIS) leads to
    learning and memory impairment''; ''Sodium Iodide Symporter (NIS) Inhibition and Subsequent Adverse Neurodevelopmental
    Outcomes in Mammals''; ''Sodium Iodide Symporter (NIS) Inhibition leading to altered amphibian metamorphosis''); no PMID
    supplied; pmid_ok=false; pmid_concordant=false. Established thyroid physiology: iodine deficiency → decreased T4 synthesis
    (Bianco et al. 2019 PMID:31569177). *** DRAFT FOR REVIEW (imported) ***'
- source: fxr_activity
  target: ppara_activity
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: The bile acid receptor NR1H4 (FXR) is a nuclear receptor transcription factor that binds bile acids and activates
    target gene expression. FXR directly trans-activates PPARA gene transcription in hepatocytes, upregulating PPARalpha protein
    and activity. This is part of the hepatic lipid-metabolism regulatory network.
  evidence: 'AOP-Wiki KER uuid 8ecf4269-13a8-4d7a-9f4c-8f3109705229 (AOP: ''NFE2L2/FXR activation leading to hepatic steatosis'');
    no PMID supplied in candidate record; pmid_ok=false; pmid_concordant=false. Underlying biology: Pineda Torra et al. 2003
    EMBO J (PMID:12881427) demonstrated FXR directly activates PPARalpha expression in liver. *** DRAFT FOR REVIEW (imported)
    ***'
- source: plasma_total_cholesterol
  target: testosterone
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: Plasma cholesterol is the obligate precursor for all steroid hormones. Leydig cells import cholesterol via StAR
    (steroidogenic acute regulatory protein); cholesterol is converted by CYP11A1 (side-chain cleavage enzyme) to pregnenolone,
    then to testosterone via the steroidogenic cascade. Reduced plasma cholesterol substrate limits testosterone synthesis.
  evidence: 'AOP-Wiki KER uuid 080d59cc-c252-46c4-a825-aca547b579ef; AOP: ''HMG-CoA reductase inhibition leading to decreased
    fertility''. No PMID supplied. Mechanism: statins reduce cholesterol -> reduced steroidogenesis substrate -> reduced testosterone
    (Dobs et al., J Clin Endocrinol Metab 2000; PMID not verified — using AOP-Wiki KER as provenance). Sign ''+'': increased
    cholesterol increases testosterone. *** DRAFT FOR REVIEW (imported) ***'
- source: free_t4
  target: plasma_creatinine
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: 'Thyroid hormones (free T4/T3) maintain glomerular filtration rate (GFR) via multiple mechanisms: thyroid hormone
    increases renal expression of Na/K-ATPase and eNOS, maintains cardiac output and renal perfusion, and reduces tubular
    creatinine reabsorption. Hypothyroidism reduces GFR, impairing creatinine clearance and elevating serum creatinine.'
  evidence: 'AOP-Wiki KER uuid ebcacecf-64d6-440c-9df7-473ac54f8c2a; AOP: ''Kidney dysfunction by decreased thyroid hormone''.
    Source node mapped to free_t4 (organ_system scale; more proximal mechanistic driver than cellular synthesis rate for a
    cross-organ causal claim). No PMID supplied. Clinical evidence: hypothyroidism consistently raises serum creatinine (Basu
    & Mohapatra, Indian J Endocrinol Metab 2012; Iglesias et al., J Nephrol 2009). Sign ''-'': free_t4 up -> GFR up -> creatinine
    clearance up -> plasma creatinine down. *** DRAFT FOR REVIEW (imported) ***'
- source: renal_oat1_activity
  target: plasma_urate
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: OAT1 (SLC22A6) in the proximal tubule S2 segment secretes urate from peritubular blood into tubular lumen for
    urinary excretion. Inhibition of OAT1 transport activity reduces tubular urate secretion, resulting in net urate retention
    and elevated plasma uric acid concentration.
  evidence: 'AOP-Wiki KER uuid e8563e9f-b080-4bab-a6cc-5ecc9a18216b; AOP: ''Organic anion transporter (OAT1) inhibition leading
    to renal failure and mortality''. No PMID supplied. Sign ''-'': OAT1 activity up -> renal urate secretion up -> plasma
    urate down. Multiple pharmacological studies: probenecid (OAT1/3 inhibitor) causes hyperuricemia; OAT1 knockout mice show
    hyperuricemia (Eraly et al., JASN 2008). *** DRAFT FOR REVIEW (imported) ***'
- source: egfr_activity
  target: airway_mucin_secretion_rate
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: EGFR kinase activation in airway epithelial cells drives transcription of mucin genes (MUC5AC, MUC5B) via ERK/MAP
    kinase cascade and stimulates goblet cell differentiation, increasing airway mucus secretion rate. This is part of normal
    epithelial defence response regulated by growth factors.
  evidence: 'AOP-Wiki KER uuid 1398eb4d-3f8b-4b09-a07e-5a4a5cbe931d; AOP: ''EGFR Activation Leading to Decreased Lung Function''.
    No PMID supplied. EGFR -> MUC5AC upregulation: Takeyama et al., Am J Physiol Lung Cell Mol Physiol 1999; Burgel & Nadel,
    Eur Respir J 2004. Sign ''+'': EGFR activity increase -> mucin production increase. *** DRAFT FOR REVIEW (imported) ***'
- source: endothelial_akt_signaling
  target: endothelial_no_production
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: AKT1 (RAC-alpha kinase) is activated by upstream PI3K signalling (e.g. shear stress, insulin, VEGF) and phosphorylates
    eNOS (NOS3) at Ser1177, displacing the inhibitory calmodulin and activating NO synthesis. Decreased AKT/eNOS signalling
    reduces eNOS phosphorylation at Ser1177, impairing NO production.
  evidence: 'AOP-Wiki KER uuid 47ca4026-7f6f-4c3c-ad98-b72b5aed093d; AOP: ''Peptide Oxidation Leading to Hypertension''. No
    PMID supplied. Mechanism: AKT phosphorylates NOS3 Ser1177 -> NO production (Dimmeler et al., Nature 1999 PMID 10421379;
    Fulton et al., Nature 1999 PMID 10421380). Sign ''+'': AKT activity up -> eNOS activated -> NO production up. *** DRAFT
    FOR REVIEW (imported) ***'
- source: iyd_activity
  target: thyroid_follicular_iodide
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: 'IYD (iodotyrosine deiodinase 1) catalyzes deiodination of MIT and DIT back to iodide + tyrosine within thyroid
    follicular cells; when IYD activity is higher, more iodide is recycled from iodotyrosine intermediates, enlarging the
    intracellular thyroidal iodide pool available for TPO-catalyzed organification (quality: IYD catalytic activity -> disposition:
    iodotyrosine hydrolysis -> process: iodide salvage -> quality: thyroidal iodide concentration)'
  evidence: 'AOP-Wiki KER 4988fd83-79f6-4a25-9ce9-31575e55f095; AOP: ''Iodotyrosine deiodinase (IYD) inhibition leading to
    altered amphibian metamorphosis''. No PMID provided. pmid_ok=false. Human genetic grounding: IYD deficiency (homozygous
    IYD loss-of-function mutations Q6PHW0) causes urinary iodine wasting and hypothyroidism (Moreno et al., NEJM 2008), confirming
    interventional (genetic_lof_gof) evidence. INDRA: IYD has 217 total statements but 0 specific IYD->thyroidal_iodide pairs.
    *** DRAFT FOR REVIEW (imported) ***'
- source: pendrin_activity
  target: tpo_nis_organification_capacity
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: 'Pendrin (SLC26A4) transports iodide across the apical membrane of thyroid follicular cells into the follicular
    lumen, where it serves as substrate for TPO-catalyzed organification (iodination of thyroglobulin tyrosine residues).
    Pendrin activity up -> more luminal iodide -> higher iodide-organification capacity (quality: pendrin transport activity
    -> disposition: apical iodide efflux -> process: luminal iodide accumulation -> quality: TPO/NIS organification capacity)'
  evidence: 'AOP-Wiki KER 5d76797b-5e3c-4fd5-9805-69faff17190a; AOP: ''Pendrin inhibition leading to altered amphibian metamorphosis''.
    No PMID provided. pmid_ok=false. Human genetic grounding: SLC26A4 (pendrin) biallelic loss-of-function mutations cause
    Pendred syndrome (sensorineural deafness + goiter/hypothyroidism, OMIM #274600), demonstrating that pendrin is required
    for normal thyroid hormone synthesis in humans (genetic_lof_gof). INDRA: SLC26A4->TPO: 3 statements (cross-confirming).
    *** DRAFT FOR REVIEW (imported) ***'
- source: duox_activity
