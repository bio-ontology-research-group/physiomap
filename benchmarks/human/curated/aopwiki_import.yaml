causal_edges:
- source: plasma_ketone_bodies
  target: skeletal_muscle_protein_catabolism_rate
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: Circulating ketone bodies (acetoacetate, 3-hydroxybutyrate) suppress ubiquitin-proteasome-mediated muscle protein
    catabolism during fasting; low ketone availability removes this inhibitory signal and increases muscle proteolysis
  evidence: 'AOP-Wiki KER 895c39c8-3235-4c89-8d25-f1eef024ad3f; AOP: ''Antagonist binding to PPARα leading to body-weight
    loss'' — KER direction: decreased circulating ketone bodies -> increased catabolism of muscle protein (organ UBERON:0002204);
    interventionist sign: do(ketone bodies up) -> muscle catabolism down (sign -) | No PMID in batch | *** DRAFT FOR REVIEW
    (imported) ***'
