- source: ppara_activity
  target: hepatic_ketogenesis            # boundary node (intermediary_metabolism.yaml)
  sign: +
  causal_evidence: perturbation
  mechanism: PPARalpha transactivates the hepatic fasting fatty-acid-oxidation / ketogenesis program (CPT1, mitochondrial HMG-CoA
    synthase 2 [HMGCS2], the beta-oxidation gene battery) in hepatocytes, setting ketogenic flux capacity
  evidence: 'perturbation do(): Ppara global knockout in mouse under fasting/starvation challenge. Intervention: PPARalpha-null;
