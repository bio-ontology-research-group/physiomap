  evidence: 'AOP-Wiki KER 035747ab-b591-4283-acfd-90ba868d5fc4; AOPs: ''Upregulation of Thyroid Hormone Catabolism via Activation
    of Hepatic Nuclear Receptors and Subsequent Adverse Neurodevelopmental Outcomes in Mammals'', ''Interference with thyroid
    serum binding protein transthyretin and subsequent adverse human neurodevelopmental toxicity'' — KER: increased T4 clearance
