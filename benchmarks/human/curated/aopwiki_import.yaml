  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: 'DUOX2 (dual oxidase 2) generates H2O2 at the apical surface of thyroid follicular cells; TPO requires H2O2 as
    co-substrate for iodide organification (iodination and coupling reactions on thyroglobulin). DUOX2 activity up -> more
    H2O2 -> higher TPO-dependent organification capacity (quality: DUOX2 oxidase activity -> disposition: H2O2 generation
    -> process: TPO iodination -> quality: organification capacity)'
  evidence: 'AOP-Wiki KER 5864d06a-158f-4557-a001-e5d7451b381b; AOP: ''Dual oxidase (DUOX) inhibition leading to altered amphibian
    metamorphosis''. No PMID provided. pmid_ok=false. Human genetic grounding: DUOX2 biallelic loss-of-function mutations
    cause congenital hypothyroidism (Moreno et al. NEJM 2002; Vigone et al. 2005; genetic_lof_gof). INDRA: DUOX2->TPO: 4 statements
    (cross-confirming interaction). *** DRAFT FOR REVIEW (imported) ***'
