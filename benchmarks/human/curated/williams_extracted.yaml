  evidence: 'CB-MET-008. Intervention: two tissue-specific Slc2a4/GLUT4 knockouts in mouse — muscle-specific KO (Zisman A et al., Nat Med 2000;6:924-928, PMID:10932232) and adipose-specific KO (Abel ED et al., Nature 2001;409:729-733, PMID:11217863). Measured endpoint: insulin-stimulated glucose uptake — muscle GLUT4 KO nearly abolishes insulin-stimulated muscle glucose uptake with glucose intolerance/insulin resistance; adipose GLUT4 KO impairs adipocyte uptake and induces secondary muscle/liver insulin resistance. Context: mouse skeletal muscle/adipose, chronic total-GLUT4-protein manipulation. do(GLUT4 expression down) => peripheral glucose uptake down, sign +.'
