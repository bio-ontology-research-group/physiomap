causal_edges:
- source: type_3_deiodinase_activity
  target: free_t3
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: Type 3 iodothyronine deiodinase (DIO3) removes an inner-ring iodine from T3, inactivating it; overexpression
    (GoF) in infantile hepatic hemangiomas consumes T3 faster than the thyroid can produce it, causing consumptive hypothyroidism
    with low free T3
  evidence: '"Large infantile hepatic hemangiomas express high D3 levels, causing ''consumptive hypothyroidism,'' because
    thyroid hormone is inactivated at a more rapid rate than it can be produced" — Williams Textbook of Endocrinology, 14th
    ed., ch 1, p 11'
- source: phosphorylase_kinase_activity
  target: glycogen_phosphorylase_activity
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: 'active phosphorylase kinase phosphorylates and activates glycogen phosphorylase (quality: PHK activity → disposition:
    phosphotransfer competence → process: phosphorylation of Ser-14 on glycogen phosphorylase → quality: glycogen phosphorylase
    catalytic activity)'
  evidence: '"PKA phosphorylates and activates glycogen phosphorylase kinase, which in turn phosphorylates and activates glycogen
    phosphorylase, which releases glucose-1-P from glycogen" — Williams Textbook of Endocrinology, 14th ed., ch 2, p 28'
- source: plasma_myostatin
  target: lean_body_mass
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: 'myostatin (GDF8) negatively regulates skeletal muscle growth; absence of myostatin leads to muscle hypertrophy
    and hyperplasia (quality: myostatin concentration → disposition: ActRIIB/ALK4/5 signalling → process: SMAD2/3 inhibition
    of myogenesis → quality: lean body mass)'
  evidence: '"A deficiency of myostatin is responsible for the ''double-muscled'' phenotype of Belgian Blue and Piedmontese
    cattle, and deletion of its gene in mice and humans leads to massive muscle hypertrophy and hyperplasia." — Williams Textbook
    of Endocrinology, 14th ed., ch 2, p 25'
- source: plasma_activin
  target: pituitary_fsh_secretion
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: 'activin binds type II / type I receptors on pituitary gonadotrophs → SMAD2/3 signalling → FSH secretion (quality:
    activin concentration → disposition: receptor complex assembly → process: SMAD-mediated FSHβ transcription + secretion
    → quality: plasma FSH)'
  evidence: '"the hormone activin, which promotes the release of FSH, is formed by the assembly of homodimers of the β-subunit"
    — Williams Textbook of Endocrinology, 14th ed., ch 2, p 24'
- source: adh
  target: collecting_duct_water_permeability
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: 'PKA (activated by ADH-stimulated cAMP) mediates aquaporin-2 insertion into apical membrane of collecting duct
    principal cells, raising water permeability (quality: ADH concentration → disposition: V2R/Gs/cAMP/PKA activation → process:
    AQP2 vesicle exocytosis → quality: collecting duct water permeability)'
  evidence: '"PKA also... the effects of antidiuretic hormone on the permeability of the renal collecting duct to water" —
    Williams Textbook of Endocrinology, 14th ed., ch 2, p 28'
- source: stat5_activity
  target: hepatic_igf1
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: 'GH-activated pSTAT5b translocates to nucleus and drives IGF1 gene transcription in hepatocytes, raising circulating
    IGF-1 (quality: pSTAT5 activity → disposition: STAT5 binding at IGF1 promoter GLE → process: IGF1 transcription and secretion
    → quality: plasma IGF-1)'
  evidence: '"Similar syndromes of decreased growth can also result from mutations in STAT5b and deficiency in IGF-1" and
    "STAT5b has been shown to dimerize with the glucocorticoid receptor, with the latter acting as a coactivator for STAT5b
    to promote expression of GH-regulated genes (e.g., IGF1) implicated in body growth." — Williams Textbook of Endocrinology,
    14th ed., ch 2, p 26'
- source: plasma_melatonin
  target: scn_output_rate
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: melatonin acts on MT1 receptors on SCN neurons to inhibit their activity, thereby suppressing SCN pacemaker output
  evidence: '"melatonin inhibits the activity of neurons in the SCN of the hypothalamus, the master circadian pacemaker in
    the mammalian brain... Targeted deletion (knockout) of the MT1, but not the MT2 receptor, abolished the ability of melatonin
    to inhibit the activity of SCN neurons" Williams Textbook of Endocrinology, 14th ed., ch 7, p. 126'
- source: somatostatin
  target: gastric_acid_secretion
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: somatostatin acts on parietal cells and G-cells via SSTRs to inhibit gastric acid secretion; somatostatin analogues
    used clinically to reduce gastrointestinal secretions
  evidence: '"Somatostatin... Gastric acid secretion [Inhibited]" (Table 7.5) — Williams Textbook of Endocrinology, 14th ed.,
    ch 7, p. 155'
- source: tida_neuron_dopamine_secretion
  target: lactotroph_prl_secretion
  sign: '-'
  causal_evidence: pharmacological
  mechanism: dopamine released from TIDA neurons binds D2 receptors on lactotrophs, inhibits adenylyl cyclase, lowers cAMP
    and Ca2+, inhibits PRL exocytosis
  evidence: '"dopamine inhibits PRL secretion from lactotrophs both in vivo and in vitro, and dopamine D2 receptors are expressed
    on the plasma membrane of lactotrophs. Mutant mice with a targeted disruption of the D2 receptor gene uniformly develop
    lactotroph hyperplasia, hyperprolactinemia" — Williams Textbook of Endocrinology, 14th ed., ch 7, p. 157-158'
- source: hypothalamic_kisspeptin
  target: gnrh_neuron_gnrh_secretion
  sign: +
  causal_evidence: pharmacological
  mechanism: kisspeptin binds KISS1R on GnRH axon terminals in median eminence; injection of a kisspeptin antagonist into
    the median eminence abolishes GnRH pulses
  evidence: '"injection of a kisspeptin antagonist into the median eminence of monkeys can abolish GnRH pulses" Williams Textbook
    of Endocrinology, 14th ed., ch 7, p 167'
- source: kndy_neurokinin_b
  target: hypothalamic_kisspeptin
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: neurokinin B co-expressed in KNDy neurons stimulates pulsatile kisspeptin secretion via NK3R autoreceptors; NK3R/NKB
    gene mutations cause hypogonadotropic hypogonadism
  evidence: '"inactivating mutations of the genes encoding for neurokinin B or the neurokinin B receptor, NK3R, results in
    hypogonadotropic hypogonadism" and "the tachykinin neurokinin B, which stimulates kisspeptin secretion" Williams Textbook
    of Endocrinology, 14th ed., ch 7, p 166-167'
- source: kndy_dynorphin
  target: hypothalamic_kisspeptin
  sign: '-'
  causal_evidence: pharmacological
  mechanism: dynorphin co-expressed in KNDy neurons inhibits kisspeptin secretion via kappa-opioid receptors; NK3R agonist
    plus dynorphin antagonist recovers suppressed GnRH/LH
  evidence: '"dynorphin (or possibly enkephalin in humans), which inhibits kisspeptin secretion" and "treatment with a neurokinin
    B agonist and dynorphin antagonist can recover suppressed GnRH and LH secretion" Williams Textbook of Endocrinology, 14th
    ed., ch 7, p 166, 169'
- source: plasma_prostaglandin_e2
  target: core_temperature
  sign: +
  causal_evidence: pharmacological
  mechanism: PGE2 binds EP3 receptors on GABAergic neurons in MnPO/MePO, disinhibiting sympathoexcitatory neurons (DMN/rRPA)
    to increase BAT thermogenesis and shivering, raising body temperature (fever)
  evidence: '"GABAergic neurons in the MnPO and MePO express the prostaglandin EP3 receptor, which when bound by PGE2 alters
    the thermoregulatory set-point and induces fever." Williams Textbook of Endocrinology, 14th ed., ch 7, p 171'
- source: kisspeptin
  target: gnrh
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: Kisspeptin binds KISS1R on GnRH neurons → GnRH release; administration restores estrous cyclicity and gonadotropin
    secretion suppressed by hyperprolactinemia
  evidence: '"administration of kisspeptin restored estrous cyclicity, ovulation, and circulating LH and FSH levels... kisspeptin
    administration to women with hyperprolactinemia-induced hypothalamic amenorrhea was shown to reactivate gonadotropin secretion."
    Williams Textbook of Endocrinology, 14th ed., ch 8, p 193  ||  "KISS1R, which encodes the receptor for kisspeptin 1/metastin,
    an important GnRH stimulatory neuropeptide particularly at the time of puberty (2–5%)" [of CHH mutations] — Williams Textbook
    of Endocrinology, 14th ed., ch 19, p. 729'
- source: estradiol
  target: pituitary_prolactin_secretion
  sign: +
  causal_evidence: pharmacological
  mechanism: Estrogen binds ERα on lactotroph PRL gene promoter → transcriptional activation of PRL gene → increased PRL synthesis
    and secretion
  evidence: '"Estrogen stimulates PRL gene transcription and PRL secretion, explaining why women have higher PRL levels, particularly
    during the periovulatory menstrual phase and in pregnancy." Williams Textbook of Endocrinology, 14th ed., ch 8, p 191'
- source: trh
  target: pituitary_prolactin_secretion
  sign: +
  causal_evidence: pharmacological
  mechanism: TRH binds TRHR on lactotrophs → IP3/DAG signalling → PRL exocytosis; TRH is a PRL-releasing factor and increases
    monomeric (bioactive) PRL fraction
  evidence: '"In response to TRH, the proportion of the monomeric form increases... Neuropeptides acting through G protein-coupled
    receptors to stimulate PRL include vasoactive intestinal polypeptide (VIP), prolactin-releasing peptide (PrRP), opioid
    peptides, and TRH." Williams Textbook of Endocrinology, 14th ed., ch 8, p 191  ||  "Patients with severe hypothyroidism
    may have increased serum prolactin levels, stimulated by the elevation in thyrotropin-releasing hormone (TRH) and proportional
    to the level of serum TSH elevation... Treatment with thyroid hormone normalizes the serum prolactin and TSH levels."
    Williams Textbook of Endocrinology, 14th ed., ch 13  ||  "PRL release increases in response to TRH and decreases in response
    to dopamine." Williams Textbook of Endocrinology, 14th ed., ch 23, p 835'
- source: pituitary_gh
  target: c_reactive_protein
  sign: '-'
  causal_evidence: pharmacological
  mechanism: GH replacement reduces pro-inflammatory adipokine secretion → lower CRP
  evidence: '"Proinflammatory factors such as C-reactive protein and IL6, strongly implicated in the pathogenesis of vascular
    disease, fall significantly with GH treatment" Williams Textbook of Endocrinology, 14th ed., ch 8, p. 205'
- source: pituitary_gh
  target: bone_mineral_density
  sign: +
  causal_evidence: perturbation
  mechanism: GH → IGF-1 → osteoblast stimulation → net positive bone mineral accretion
  evidence: '"GH replacement activates bone formation and bone resorption, resulting in a transient decline before a net increase
    in bone mass by 12 months" and "Fifteen years of GH replacement increases bone mineral densities" Williams Textbook of
    Endocrinology, 14th ed., ch 8, p. 206  ||  "reinstitution of treatment for 2 years in the transition period prevents deterioration
    in bone mineral density as experienced by untreated young adults with persistent GHD" Williams Textbook of Endocrinology,
    14th ed., ch 25'
- source: pituitary_gh
  target: ldl_cholesterol
  sign: '-'
  causal_evidence: pharmacological
  mechanism: GH upregulates hepatic LDL receptor → reduced plasma LDL
  evidence: '"significant shift in lipoprotein metabolism to a less atherogenic profile with improvements in the cholesterol
    and in HDL-cholesterol ratio" and Table 8.6 "High LDL and low HDL cholesterol → Improve"; Fig 8.20 shows LDL-C falls from
    3.89 to 3.22 mmol/L over 10 years of GH therapy. Williams Textbook of Endocrinology, 14th ed., ch 8, p. 205'
- source: pituitary_gh
  target: hdl_cholesterol
  sign: +
  causal_evidence: pharmacological
  mechanism: GH improves lipoprotein lipase activity and hepatic lipid metabolism → higher HDL
