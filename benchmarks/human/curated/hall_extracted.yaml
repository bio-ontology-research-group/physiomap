  mechanism: thyroid hormone increases appetite and food intake, partly counterbalancing the raised metabolic rate
  evidence: '"...thyroid hormone also increases the appetite, and this may counterbalance the change in the metabolic rate." and "In addition to increased appetite and food intake, which has been discussed..." Guyton & Hall, Textbook of Medical Physiology, ch 76 (chw34), p. 937-938.'
