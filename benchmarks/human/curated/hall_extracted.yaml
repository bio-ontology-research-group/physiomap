  mechanism: thyroid hormone (T3) activates transcription of metabolic enzymes and Na-K-ATPase in nearly all tissues, raising O2 consumption and heat production; BMR falls 40-50% without thyroid and rises 60-100% in excess
  evidence: '"Both of these hormones profoundly increase the metabolic rate of the body. Complete lack of thyroid secretion usually causes the basal metabolic rate to fall 40 to 50 per cent below normal, and extreme excesses of thyroid secretion can increase the basal metabolic rate to 60 to 100 per cent above normal." Guyton & Hall, Textbook of Medical Physiology, ch 76 (chw34), p. 934.'
- source: free_t3
  target: food_intake
