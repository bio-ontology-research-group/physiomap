  mechanism: circulating thyroid hormone (T3 is the active form) exerts direct negative feedback on anterior-pituitary thyrotrophs to decrease TSH secretion; a rise to ~1.75x normal drops TSH essentially to zero
  evidence: '"Increased thyroid hormone in the body fluids decreases secretion of TSH by the anterior pituitary. When the rate of thyroid hormone secretion rises to about 1.75 times normal, the rate of TSH secretion falls essentially to zero ... increased thyroid hormone inhibits anterior pituitary secretion of TSH mainly by a direct effect on the [anterior pituitary]." Guyton & Hall, Textbook of Medical Physiology, ch 76 (chw34), p. 939.'
- source: free_t4
  target: thyrotroph_tsh_secretion
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: circulating free T4 (converted to T3 within the pituitary) exerts direct negative feedback on thyrotrophs to decrease TSH secretion; the feedback maintains near-constant free thyroid hormone
  evidence: '"Increased thyroid hormone in the body fluids decreases secretion of TSH by the anterior pituitary. When the rate of thyroid hormone secretion rises to about 1.75 times normal, the rate of TSH secretion falls essentially to zero." Guyton & Hall, Textbook of Medical Physiology, ch 76 (chw34), p. 939.'
- source: free_t3
  target: metabolic_heat_production
