causal_edges:
- source: cardiomyocyte_intracellular_sodium
  target: na_k_atpase_activity
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: 'Elevated intracellular [Na+] allosterically stimulates Na+/K+-ATPase activity (approximately cubic relationship:
    doubling intracellular Na+ from 10 to 20 mEq/L raises pump activity ~8-fold), restoring the transmembrane sodium gradient'
  evidence: '"A special feature of the Na+-K+ ATPase pump is that its degree of activity is strongly stimulated when excess
    sodium ions accumulate inside the cell membrane. In fact, the pumping activity increases approximately in proportion to
    the third power of this intracellular sodium concentration. That is, as the internal sodium concentration rises from 10
    to 20 mEq/L, the activity of the pump does not merely double but increases about eightfold." Guyton & Hall, Textbook of
    Medical Physiology, ch w02, p 66'
- source: interstitial_fluid_protein
  target: interstitial_fluid_colloid_osmotic_pressure
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: plasma proteins that leak into interstitium are the solutes responsible for the interstitial colloid osmotic
    (oncotic) pressure; more protein → higher oncotic pressure
  evidence: '"it is the proteins of the plasma and interstitial fluids that are responsible for the osmotic pressures on the
    two sides of the capillary membrane" and "the average protein concentration of the interstitial fluid is usually only
    40 per cent of that in plasma...the average interstitial fluid colloid osmotic pressure for this concentration of proteins
    is about 8 mm Hg" — Guyton & Hall, Textbook of Medical Physiology, ch w05'
- source: lymph_drainage_rate
  target: interstitial_fluid_protein
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: lymphatic drainage removes protein from interstitium; increased lymph flow lowers interstitial protein concentration
    toward steady state
  evidence: '"Third, the increasing interstitial fluid pressure greatly increases the rate of lymph flow...This in turn carries
    away the excess interstitial fluid volume and excess protein that has accumulated in the spaces" — Guyton & Hall, Textbook
    of Medical Physiology, ch w05'
- source: interstitial_fluid_colloid_osmotic_pressure
  target: capillary_filtration_rate
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: higher interstitial oncotic pressure creates an osmotic force pulling fluid out of capillaries into the interstitium,
    adding to net filtration pressure
  evidence: '"The interstitial fluid colloid osmotic pressure (Pif), which tends to cause osmosis of fluid outward through
    the capillary membrane" listed as one of four Starling forces; and at the arterial end: interstitial fluid colloid osmotic
    pressure = 8 mm Hg contributes to 41 mm Hg total outward force — Guyton & Hall, Textbook of Medical Physiology, ch w05'
- source: capillary_hydrostatic_pressure
  target: capillary_filtration_rate
  sign: +
  causal_evidence: mechanistic_model
  mechanism: Higher capillary hydrostatic pressure increases the net filtration pressure driving fluid from capillary lumen
    into interstitial space (Starling forces)
  evidence: '"The increased cardiac output increases the capillary pressure so that fluid begins to transude out of the capillaries
    into the tissues" Guyton & Hall, Textbook of Medical Physiology, ch w07, p 242'
- source: aqueous_humor_formation_rate
  target: intraocular_pressure
  sign: +
  causal_evidence: mechanistic_model
  mechanism: increased ciliary-body secretion raises volume and pressure of anterior-chamber fluid against fixed outflow resistance
  evidence: '"The balance between formation and reabsorption of aqueous humor regulates the total volume and pressure of the
    intraocular fluid." Guyton & Hall, Textbook of Medical Physiology, ch w16, p. 623'
- source: aqueous_humor_outflow_resistance
  target: intraocular_pressure
  sign: +
  causal_evidence: mechanistic_model
  mechanism: reduced drainage through trabecular meshwork into canal of Schlemm raises steady-state fluid pressure in anterior
    chamber
  evidence: '"The level of this pressure is determined mainly by the resistance to outflow of aqueous humor from the anterior
    chamber into the canal of Schlemm. This outflow resistance results from the meshwork of trabeculae." Guyton & Hall, Textbook
    of Medical Physiology, ch w16, p. 624'
- source: retinal_rhodopsin_concentration
  target: retinal_photosensitivity
  sign: +
  causal_evidence: mechanistic_model
  mechanism: rhodopsin is the light-sensitive photochemical of rods; higher rhodopsin concentration enables detection of lower
    light intensities (dark adaptation increases both rhodopsin and sensitivity in parallel)
  evidence: '"If a person has been in bright light for hours, large portions of the photochemicals in both the rods and the
    cones will have been reduced to retinal and opsins... the concentrations of the photosensitive chemicals remaining in
    the rods and cones are considerably reduced, and the sensitivity of the eye to light is correspondingly reduced. This
    is called light adaptation." Guyton & Hall, Textbook of Medical Physiology, ch w16, p. 631'
- source: gi_sympathetic_tone
  target: gi_tract_secretion
  sign: '-'
  causal_evidence: perturbation
  mechanism: sympathetic inhibition of enteric neurons decreases GI secretion
  evidence: 'In general, stimulation of the sympathetic nervous system inhibits activity of the gastrointestinal tract...
    It exerts its effects in two ways: (1) to a slight extent by direct effect of secreted norepinephrine to inhibit intestinal
    tract smooth muscle... and (2) to a major extent by an inhibitory effect of norepinephrine on the neurons of the entire
    enteric nervous system.  ||  "Brunner''s glands are inhibited by sympathetic stimulation; therefore, such stimulation
    in very excitable persons is likely to leave the duodenal bulb unprotected and is perhaps one of the factors that cause
    this area of the gastrointestinal tract to be the site of peptic ulcers" — Guyton & Hall, Textbook of Medical Physiology,
    ch w21, p. 806'
- source: gi_sympathetic_tone
  target: splanchnic_blood_flow
  sign: '-'
  causal_evidence: perturbation
  mechanism: sympathetic norepinephrine causes arteriolar vasoconstriction in splanchnic bed → decreased blood flow
  evidence: Sympathetic stimulation, by contrast, has a direct effect on essentially all the gastrointestinal tract to cause
    intense vasoconstriction of the arterioles with greatly decreased blood flow.
- source: delta_cell_somatostatin_secretion
  target: gi_tract_motility
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: somatostatin decreases motility of stomach, duodenum, and gallbladder to extend digestion period
  evidence: '"Somatostatin decreases the motility of the stomach, duodenum, and gallbladder. Somatostatin decreases both secretion
    and absorption in the gastrointestinal tract." Guyton & Hall, Textbook of Medical Physiology, ch w25, p 972'
- source: plasma_calcium
  target: myocardial_contractility
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: extracellular Ca2+ availability directly initiates the cardiac actin-myosin contractile process; excess -> spastic contraction (raised inotropy), deficiency -> cardiac flaccidity
  evidence: '"An excess of calcium ions causes ... the heart to go toward spastic contraction. This is caused by a direct effect of calcium ions to initiate the cardiac contractile process ... Conversely, deficiency of calcium ions causes cardiac flaccidity" -- Guyton & Hall, Textbook of Medical Physiology, ch 9 (Heart Muscle), p ~114'
- source: renal_perfusion_pressure
  target: afferent_arteriolar_resistance
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: increased renal arterial/wall pressure -> afferent smooth-muscle stretch, Ca2+ entry, contraction -> raised afferent resistance (myogenic autoregulation buffering RBF/GFR)
  evidence: '"respond to increased wall tension or wall stretch by contraction of the vascular smooth muscle ... by raising vascular resistance, helps prevent excessive increases in renal blood flow and GFR when arterial pressure increases" -- Guyton & Hall, Textbook of Medical Physiology, ch 26 (Urine Formation I), p 324'
- source: sympathetic_tone
  target: afferent_arteriolar_resistance
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: renal sympathetic nerve activity -> alpha-adrenergic afferent (and efferent) arteriolar constriction -> raised afferent resistance -> reduced glomerular hydrostatic pressure and GFR
  evidence: '"Strong activation of the renal sympathetic nerves can constrict the renal arterioles and decrease renal blood flow and GFR" -- Guyton & Hall, Textbook of Medical Physiology, ch 26 (Urine Formation I), p 322'
- source: macula_densa_nacl_signal
  target: afferent_arteriolar_resistance
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: increased distal NaCl at macula densa -> ATP/adenosine release -> afferent arteriolar constriction -> raised afferent resistance (tubuloglomerular feedback); decreased NaCl dilates the afferent arteriole
  evidence: '"Decreased Macula Densa Sodium Chloride Causes Dilation of Afferent Arterioles ... it decreases resistance to blood flow in the afferent arterioles, which raises glomerular hydrostatic pressure" -- Guyton & Hall, Textbook of Medical Physiology, ch 26 (Urine Formation I), Fig 26-18, p 324'
- source: right_atrial_pressure
  target: afferent_arteriolar_resistance
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: atrial stretch (raised right atrial/filling pressure) -> reflex dilation of renal afferent arterioles -> lowered afferent resistance -> raised glomerular capillary pressure and filtration (volume reflex)
  evidence: '"Stretch of the atria also causes significant reflex dilation of the afferent arterioles in the kidneys ... The decreased afferent arteriolar resistance in the kidneys causes the glomerular capillary pressure to rise" -- Guyton & Hall, Textbook of Medical Physiology, ch 18 (Nervous Regulation of the Circulation), p 212'
- source: endothelial_no_production
  target: renal_vascular_resistance
  sign: '-'
  causal_evidence: pharmacological
  mechanism: endothelial NO -> vascular smooth-muscle cGMP -> renal arteriolar relaxation -> lowered renal vascular resistance; NOS inhibitors raise RVR and lower GFR/Na excretion
  evidence: '"administration of drugs that inhibit this normal formation of nitric oxide increases renal vascular resistance and decreases GFR and urinary sodium excretion" -- Guyton & Hall, Textbook of Medical Physiology, ch 26 (Urine Formation I), p 322'
- source: plasma_prostaglandin_e2
  target: gfr
  sign: +
  causal_evidence: pharmacological
  mechanism: PGE2/PGI2 -> afferent arteriolar vasodilation -> increased renal blood flow and glomerular hydrostatic pressure -> increased GFR; NSAID (aspirin) inhibition reduces GFR, especially under stress
  evidence: '"prostaglandins (PGE2 and PGI2) and bradykinin ... cause vasodilation and increased renal blood flow and GFR" -- Guyton & Hall, Textbook of Medical Physiology, ch 26 (Urine Formation I), p 322-323'
- source: bowmans_capsule_pressure
  target: gfr
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: increased hydrostatic pressure in Bowman's capsule lowers net filtration pressure -> reduced GFR (e.g. ureteral obstruction/stones); micropuncture-measured Starling force
  evidence: '"Increasing the hydrostatic pressure in Bowman''s capsule reduces GFR, whereas decreasing this pressure raises GFR" -- Guyton & Hall, Textbook of Medical Physiology, ch 26 (Urine Formation I), p 318'
- source: pth
  target: renal_phosphate_reabsorption
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: PTH -> decreased NaPi-IIa/IIc transport maximum in proximal tubule -> reduced phosphate reabsorption -> phosphaturia
  evidence: '"inhibition of phosphate reabsorption by the proximal tubule" -- Guyton & Hall, Textbook of Medical Physiology, ch 27 (Urine Formation II) Table 27-3, p 343'
- source: renal_perfusion_pressure
  target: peritubular_capillary_hydrostatic_pressure
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: 'increased renal arterial pressure -> raised peritubular (and vasa recta) capillary hydrostatic pressure (buffered by autoregulation) -> feeds pressure-natriuresis reduction in reabsorption (Table 27-2: up Arterial Pressure -> up Pc)'
  evidence: '"Increases in arterial pressure tend to raise peritubular capillary hydrostatic pressure" -- Guyton & Hall, Textbook of Medical Physiology, ch 27 (Urine Formation II) Table 27-2, p 341'
- source: efferent_arteriolar_resistance
  target: peritubular_capillary_hydrostatic_pressure
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: 'increased efferent arteriolar resistance -> reduced downstream peritubular capillary hydrostatic pressure -> raised net reabsorptive force -> increased Na/water reabsorption (angiotensin II mechanism; Table 27-2: down RE -> up Pc)'
  evidence: '"Increase in resistance of either the afferent or the efferent arterioles reduces peritubular capillary hydrostatic pressure ... constriction of the efferent arterioles ... lowers peritubular capillary hydrostatic pressure" -- Guyton & Hall, Textbook of Medical Physiology, ch 27 (Urine Formation II) Table 27-2, p 341'
- source: plasma_potassium
  target: renal_potassium_excretion
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: raised plasma K+ -> stimulated basolateral Na/K-ATPase and increased cell-to-lumen K+ gradient in principal cells -> increased distal K+ secretion/excretion (direct, aldosterone-independent)
  evidence: '"increased plasma potassium concentration directly raises potassium secretion by the cortical collecting tubules and indirectly increases potassium secretion by raising plasma aldosterone concentration" -- Guyton & Hall, Textbook of Medical Physiology, ch 29 (Renal Regulation), Fig 29-4/29-7, p 369-370'
- source: arterial_ph
  target: renal_potassium_excretion
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: increased H+ (low pH/acidosis) reduces principal-cell Na/K-ATPase activity and K+ secretion; alkalosis (high pH) increases distal K+ secretion
  evidence: '"Acute increases in hydrogen ion concentration of the extracellular fluid (acidosis) reduce potassium secretion, whereas decreased hydrogen ion concentration (alkalosis) increases potassium secretion" -- Guyton & Hall, Textbook of Medical Physiology, ch 29 (Renal Regulation), p 372'
- source: aldosterone
  target: cellular_potassium_uptake
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: aldosterone -> increased Na/K-ATPase-mediated cellular K+ uptake -> lowered plasma K+ (extrarenal component of aldosterone's hypokalaemic action)
  evidence: '"Aldosterone Increases Potassium Uptake into Cells. Increased potassium intake also stimulates secretion of aldosterone, which increases cell potassium uptake" -- Guyton & Hall, Textbook of Medical Physiology, ch 29 (Renal Regulation) Table 29-1, p 366'
- source: arterial_ph
  target: renal_glutaminase_activity
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: decreased pH (increased H+) -> stimulated renal glutamine metabolism/glutaminase -> increased NH4+ and new HCO3- for H+ buffering; alkalosis has the opposite effect
  evidence: '"An increase in extracellular fluid H+ concentration stimulates renal glutamine metabolism and, therefore, increases the formation of NH4+ and new HCO3- ... a decrease in H+ concentration has the opposite effect" -- Guyton & Hall, Textbook of Medical Physiology, ch 30 (Regulation of Acid-Base Balance), p 394'
- source: plasma_calcium
  target: casr_activity
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: 'extracellular Ca2+ binds and activates the parathyroid chief-cell calcium-sensing receptor (CaSR), raising CaSR signalling activity; this supplies the upstream input to the existing casr_activity -(-)-> parathyroid_chief_pth_secretion edge (net: high Ca2+ -> CaSR active -> PTH secretion falls)'
  evidence: '"Even the slightest decrease in calcium ion concentration in the extracellular fluid causes the parathyroid glands to increase their rate of secretion within minutes." Guyton & Hall, Textbook of Medical Physiology, ch 79 (chw36), p. 988. The CaSR is the established extracellular Ca2+ sensor mediating this control (named in the chapter reference list: Hofer AM, Brown EM: Extracellular calcium sensing; Chen RA, Goodman WG: Role of the calcium-sensing receptor).'
- source: plasma_calcium
  target: parathyroid_chief_cell_proliferation
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: sustained low extracellular Ca2+ drives parathyroid chief-cell hypertrophy/proliferation (glands enlarge fivefold or more in rickets, pregnancy, lactation); conditions that raise Ca2+ decrease gland size -> inverse (negative) control
  evidence: '"Even the slightest decrease in calcium ion concentration ... causes the parathyroid glands to increase their rate of secretion within minutes; if the decreased calcium concentration persists, the glands will hypertrophy, sometimes fivefold or more ... Conversely, conditions that increase the calcium ion [concentration reduce gland size]." Guyton & Hall, Textbook of Medical Physiology, ch 79 (chw36), p. 988.'
- source: pth
  target: proximal_tubule_calcitriol_production
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: PTH (via cAMP in renal proximal-tubule cells) stimulates 1-alpha-hydroxylase, driving conversion of 25-OH-D to 1,25(OH)2D3 (calcitriol); without PTH almost no calcitriol is formed
  evidence: '"Note also in Figure 79-6 that the conversion of 25-hydroxycholecalciferol to 1,25-dihydroxycholecalciferol requires PTH. In the absence of PTH, almost none of the 1,25-dihydroxycholecalciferol is formed." Guyton & Hall, Textbook of Medical Physiology, ch 79 (chw36), p. 985.'
- source: plasma_calcium
  target: proximal_tubule_calcitriol_production
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: 'raised plasma Ca2+ inversely controls calcitriol formation: a direct inhibitory effect of the Ca2+ ion on the 25-OH-D -> 1,25(OH)2D3 conversion, plus suppression of PTH (which is required for the conversion)'
  evidence: '"Figure 79-8 demonstrates that the plasma concentration of 1,25-dihydroxycholecalciferol is inversely affected by the concentration of calcium in the plasma. ... First, the calcium ion itself has a slight effect in preventing the conversion of 25-hydroxycholecalciferol to 1,25-dihydroxycholecalciferol." Guyton & Hall, Textbook of Medical Physiology, ch 79 (chw36), p. 985.'
- source: tsh
  target: thyroid_follicular_t4_secretion
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: TSH increases proteolysis of stored thyroglobulin in the follicular cells, releasing T4/T3 into the blood; TSH increases all known secretory activities of the thyroid glandular cells
  evidence: '"1. Increased proteolysis of the thyroglobulin that has already been stored in the follicles, with resultant release of the thyroid hormones into the circulating blood ... In summary, TSH increases all the known secretory activities of the thyroid glandular cells." Guyton & Hall, Textbook of Medical Physiology, ch 76 (chw34), p. 938.'
- source: tsh
  target: nis_activity
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: TSH increases activity of the follicular-cell iodide pump (NIS/SLC5A5), raising iodide trapping; hypophysectomy greatly diminishes iodide-pump activity
  evidence: '"2. Increased activity of the iodide pump, which increases the rate of “iodide trapping” in the glandular cells, sometimes increasing the ratio of intracellular to extracellular iodide concentration ... to as much as eight times normal." Guyton & Hall, Textbook of Medical Physiology, ch 76 (chw34), p. 938.'
- source: trh
  target: thyrotroph_tsh_secretion
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: hypothalamic TRH binds TRH receptors on anterior-pituitary thyrotrophs, activating phospholipase C / Ca2+ / DAG second messengers to increase TSH release
  evidence: '"TRH directly affects the anterior pituitary gland cells to increase their output of TSH." Guyton & Hall, Textbook of Medical Physiology, ch 76 (chw34), p. 938-939.'
- source: free_t3
  target: thyrotroph_tsh_secretion
