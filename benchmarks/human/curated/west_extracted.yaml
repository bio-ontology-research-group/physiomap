- source: endothelial_no_production
  target: pulmonary_vascular_resistance
  sign: '-'
  causal_evidence: pharmacological
  mechanism: NO activates soluble guanylate cyclase, raising cGMP, inhibiting Ca channels, relaxing pulmonary vascular smooth
