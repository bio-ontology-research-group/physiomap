causal_edges:
- source: alveolar_surfactant_concentration
  target: alveolar_surface_tension
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: secreted surfactant lowers the surface tension of the alveolar lining layer
  evidence: '"some of the cells lining the alveoli secrete a material called surfactant that dramatically lowers the surface
    tension of the alveolar lining layer" (West''s Respiratory Physiology, 11th ed., ch 1)'
- source: alveolar_surface_tension
  target: alveolar_stability
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: surface tension generates forces that tend to collapse alveoli, reducing their stability
  evidence: '"Because of the surface tension of the liquid lining the alveoli, relatively large forces develop that tend to
    collapse alveoli" (West''s Respiratory Physiology, 11th ed., ch 1)'
- source: alveolar_surfactant_concentration
  target: alveolar_stability
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: surfactant lowers surface tension and thereby increases alveolar stability
  evidence: '"surfactant that dramatically lowers the surface tension of the alveolar lining layer and markedly increases
    the stability of the alveoli" (West''s Respiratory Physiology, 11th ed., ch 1)'
- source: blood_gas_barrier_thickness
  target: pulmonary_gas_diffusion_rate
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: 'Fick''s law: gas flux across the barrier is inversely proportional to barrier thickness'
  evidence: '"the amount of gas that moves across a sheet of tissue is proportional to the area of the sheet but inversely
    proportional to its thickness" (West''s Respiratory Physiology, 11th ed., ch 1)'
- source: pulmonary_capillary_pressure
  target: pulmonary_interstitial_fluid_volume
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: raising capillary pressure raises capillary wall stress to a point where the barrier leaks plasma and red cells
    into the alveolar spaces
  evidence: '"Increasing the pressure in the capillaries to high levels ... can raise the wall stresses of the capillaries
    to a point at which ultrastructural changes can occur. The capillaries then leak plasma and even red blood cells into
    the alveolar spaces." (West''s Respiratory Physiology, 11th ed., ch 1)  ||  Fluid exchange across the capillary endothelium
    obeys Starling''s law. The force tending to push fluid out of the capillary is the capillary hydrostatic pressure ...
    The earliest form of pulmonary edema ... The rate of lymph flow from the lung increases considerably if the capillary
    pressure is raised'
- source: tidal_volume
  target: total_ventilation
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: minute ventilation = tidal volume x respiratory frequency; raising volume per breath raises total volume leaving
    the lung per minute
  evidence: '"Total ventilation is tidal volume × respiratory frequency" (West''s Respiratory Physiology, 11th ed., ch 2)'
- source: respiratory_rate
  target: total_ventilation
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: minute ventilation = tidal volume x respiratory frequency; raising breaths per minute raises total volume leaving
    the lung per minute
  evidence: '"If the volume exhaled with each breath is 500 ml ... and there are 12 breaths·min−1, the total volume leaving
    the lung each minute is 500 × 12 = 6,000 ml·min−1. This is known as the total ventilation" (West''s Respiratory Physiology,
    11th ed., ch 2)'
- source: total_ventilation
  target: alveolar_ventilation
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: alveolar ventilation = total ventilation - dead space ventilation; raising total ventilation (holding dead space
    ventilation fixed) raises alveolar ventilation
  evidence: '"alveolar ventilation—that portion of ventilation which participates in gas exchanges—is determined by the balance
    between total and dead space ventilation" (West''s Respiratory Physiology, 11th ed., ch 2)'
- source: dead_space_ventilation
  target: alveolar_ventilation
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: alveolar ventilation = total ventilation - dead space ventilation; raising dead space ventilation (holding total
    ventilation fixed) lowers fresh gas reaching the alveoli
  evidence: '"The larger the volume of the dead space, the smaller the volume of fresh gas entering the alveoli" (West''s
    Respiratory Physiology, 11th ed., ch 2)'
- source: anatomic_dead_space_volume
  target: dead_space_ventilation
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: dead space ventilation = dead space volume x respiratory frequency; a larger dead space volume increases the
    per-minute dead space ventilation
  evidence: '"calculate the dead space ventilation (dead space volume × respiratory frequency)" (West''s Respiratory Physiology,
    11th ed., ch 2)'
- source: tidal_volume
  target: anatomic_dead_space_volume
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: a large inspiration exerts radial traction/pull of lung parenchyma on the bronchi, widening the conducting airways
    and enlarging the anatomic dead space
  evidence: '"it increases with large inspirations because of the traction or pull exerted on the bronchi by the surrounding
    lung parenchyma" (West''s Respiratory Physiology, 11th ed., ch 2)'
- source: tidal_volume
  target: dead_space_fraction
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: with the anatomic dead space volume roughly fixed, raising tidal volume reduces the fraction of each breath occupied
    by the dead space (VD/VT)
  evidence: '"Increasing tidal volume is often more effective because this reduces the fraction of each breath occupied by
    the anatomic dead space, which is referred to as the dead space fraction" (West''s Respiratory Physiology, 11th ed., ch
    2)'
- source: alveolar_ventilation
  target: alveolar_pco2
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: alveolar ventilation equation PACO2 = (VCO2/VA)·K; raising alveolar ventilation washes out CO2 and lowers alveolar
    PCO2 (halving VA doubles PACO2)
  evidence: '"If the alveolar ventilation is halved (and CO2 production remains unchanged), for example, the alveolar and
    arterial PCO2 will double" (West''s Respiratory Physiology, 11th ed., ch 2)  ||  "if the alveolar ventilation is halved,
    the P 2 is doubled, once a steady state has been established." — West''s Respiratory Physiology, 11th ed., ch 5'
- source: alveolar_ventilation
  target: arterial_pco2
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: alveolar and arterial PCO2 are virtually identical, so the inverse alveolar-ventilation relation carries through;
    halving alveolar ventilation doubles arterial PCO2
  evidence: '"If the alveolar ventilation is halved (and CO2 production remains unchanged) ... the alveolar and arterial PCO2
    will double" (West''s Respiratory Physiology, 11th ed., ch 2)  ||  The resulting hyperventilation reduces the PCO2 in
    the blood and therefore in the CSF'
- source: co2_production
  target: alveolar_pco2
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: alveolar ventilation equation PACO2 = (VCO2/VA)·K; with alveolar ventilation fixed, raising CO2 output raises
    alveolar PCO2
  evidence: '"the alveolar ventilation can be obtained by dividing the CO2 output by the alveolar fractional concentration
    of this gas" ... "PCO2 ... is proportional to the fractional concentration of the gas in the alveoli" (West''s Respiratory
    Physiology, 11th ed., ch 2)'
- source: co2_production
  target: arterial_pco2
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: with alveolar ventilation held constant, raising metabolic CO2 production raises arterial PCO2 (alveolar ventilation
    equation, arterial = alveolar PCO2)
  evidence: '"CO2 production ... is increased by factors such as exercise, fever, infection, nutritional intake, and seizures
    and decreased by hypothermia and fasting" combined with the alveolar ventilation equation relating PCO2 to CO2 output
    (West''s Respiratory Physiology, 11th ed., ch 2)'
- source: core_temperature
  target: co2_production
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: fever raises metabolic activity, increasing whole-body CO2 production; hypothermia lowers it
  evidence: '"It [CO2 production] is increased by factors such as exercise, fever, infection ... and decreased by hypothermia
    and fasting" (West''s Respiratory Physiology, 11th ed., ch 2)'
- source: metabolic_rate
  target: co2_production
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: CO2 is the product of aerobic metabolism; raising whole-body metabolic (O2 consumption) rate increases CO2 production
  evidence: '"CO2 production at rest is usually constant, but it is affected by metabolic activity. It is increased by factors
    such as exercise ..." (West''s Respiratory Physiology, 11th ed., ch 2)'
- source: blood_gas_barrier_thickness
  target: o2_transfer_rate
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: 'Fick''s law: diffusion rate inversely proportional to membrane thickness; thickening impedes O2 diffusion'
  evidence: '"if the blood-gas barrier is markedly thickened by disease so that oxygen diffusion is impeded, the rate of rise
    of P O2 in the red blood cells is correspondingly slow" (West''s Respiratory Physiology, 11th ed., ch 3)'
- source: blood_gas_barrier_thickness
  target: pulmonary_diffusing_capacity_co
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: DL includes thickness in the denominator (Fick's law); thicker barrier lowers measured diffusing capacity
  evidence: '"the measured diffusing capacity of the lung for CO depends not only on the area and thickness of the blood-gas
    barrier" and "inversely proportional to the thickness (T)" (West''s Respiratory Physiology, 11th ed., ch 3)'
- source: alveolar_po2
  target: o2_transfer_rate
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: alveolar PO2 sets the partial-pressure difference driving O2 across the barrier; lowering it slows transfer
  evidence: '"the partial pressure difference responsible for driving the O2 across the blood-gas barrier has been reduced
    from 60 mm Hg ... to only 30 mm Hg, thereby slowing movement of O2 across the blood gas barrier" (West''s Respiratory
    Physiology, 11th ed., ch 3)'
- source: o2_transfer_rate
  target: arterial_po2
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: faster O2 transfer raises rate of rise of capillary PO2, so end-capillary/arterial PO2 reaches the alveolar value
    before the cell exits
  evidence: '"the P O2 may not reach that of alveolar gas before the red blood cell leaves the pulmonary capillary. In this
    case, a measurable difference between alveolar gas and end-capillary blood for P O2 may occur" (West''s Respiratory Physiology,
    11th ed., ch 3)'
- source: pulmonary_perfusion
  target: pulmonary_capillary_transit_time
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: increased pulmonary blood flow reduces the time a red cell spends in the capillary
  evidence: '"With heavy exercise, the pulmonary blood flow is greatly increased, and the time normally spent by the red cell
    in the capillary, about 0.75 s, may be reduced to as little as one-third of this" (West''s Respiratory Physiology, 11th
    ed., ch 3)'
- source: pulmonary_capillary_transit_time
  target: arterial_po2
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: more transit time allows fuller equilibration of capillary PO2 with alveolar gas (matters when diffusion-limited)
  evidence: '"Although the time for diffusion is decreased ... the P O2 may not reach that of alveolar gas before the red
    blood cell leaves the pulmonary capillary" (West''s Respiratory Physiology, 11th ed., ch 3)'
- source: pulmonary_capillary_blood_volume
  target: pulmonary_diffusing_capacity_co
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: more capillary blood volume provides more hemoglobin to take up CO, raising effective diffusing capacity (1/(theta*Vc)
    resistance falls)
  evidence: '"a reduction of capillary blood volume or concentration of hemoglobin by disease can reduce the measured diffusing
    capacity of the lung" (West''s Respiratory Physiology, 11th ed., ch 3)'
- source: blood_hemoglobin_concentration
  target: pulmonary_diffusing_capacity_co
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: hemoglobin binds CO in the capillary; lower Hb raises the reaction-rate resistance 1/(theta*Vc), lowering measured
    DLCO
  evidence: '"a reduction of capillary blood volume or concentration of hemoglobin by disease can reduce the measured diffusing
    capacity of the lung" (West''s Respiratory Physiology, 11th ed., ch 3)'
- source: alveolar_po2
  target: pulmonary_diffusing_capacity_co
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: high alveolar O2 competes with CO for hemoglobin, reducing theta for CO and the measured diffusing capacity
  evidence: '"theta for CO is reduced if a subject breathes a high O2 mixture, because the O2 competes with the CO for hemoglobin.
    As a result, the measured diffusing capacity is reduced by O2 breathing" (West''s Respiratory Physiology, 11th ed., ch
    3)'
- source: pulmonary_artery_pressure
  target: pulmonary_vascular_resistance
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: raising arterial perfusing pressure recruits closed capillaries and distends open ones, lowering resistance
  evidence: Figure 4.4 shows that an increase in either pulmonary arterial or venous pressure causes pulmonary vascular resistance
    to fall. ... As the pressure rises, these vessels begin to conduct blood, thus lowering the overall resistance. This is
    termed recruitment
- source: pulmonary_venous_pressure
  target: pulmonary_vascular_resistance
  sign: '-'
  causal_evidence: curated_mechanistic
  mechanism: raising venous (downstream) pressure raises intravascular pressure, recruiting and distending capillaries, lowering
    resistance
  evidence: an increase in either pulmonary arterial or venous pressure causes pulmonary vascular resistance to fall
- source: lung_volume
  target: pulmonary_vascular_resistance
  sign: '?'
  causal_evidence: curated_mechanistic
  mechanism: 'biphasic: at low volume extra-alveolar vessels narrow (resistance high); at high volume capillaries are stretched/squashed
    (resistance high); least at normal volume'
  evidence: resistance is high when lung volume is low because their walls contain smooth muscle and elastic tissue ... even
    if the transmural pressure of the capillaries is not changed with large lung inflations, their vascular resistance increases
    ... the resistance is least at normal breathing volumes
- source: plasma_serotonin
  target: pulmonary_vascular_resistance
  sign: +
  causal_evidence: pharmacological
  mechanism: serotonin contracts pulmonary vascular smooth muscle, narrowing extra-alveolar vessels
  evidence: substances that cause smooth muscle contraction increase pulmonary vascular resistance. These include serotonin,
    histamine, norepinephrine, and endothelin
- source: plasma_histamine
  target: pulmonary_vascular_resistance
  sign: +
  causal_evidence: pharmacological
  mechanism: histamine contracts pulmonary vascular smooth muscle
  evidence: substances that cause smooth muscle contraction increase pulmonary vascular resistance. These include serotonin,
    histamine, norepinephrine, and endothelin
- source: norepinephrine
  target: pulmonary_vascular_resistance
  sign: +
  causal_evidence: pharmacological
  mechanism: norepinephrine contracts pulmonary vascular smooth muscle
  evidence: substances that cause smooth muscle contraction increase pulmonary vascular resistance. These include serotonin,
