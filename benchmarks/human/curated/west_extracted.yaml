name: west_extracted
description: DRAFT within-scale signed causal edges + variables extracted from West's Respiratory Physiology, 11th ed. via
  per-chapter multi-agent fan-out. Signs adversarially verified; every edge carries a verbatim quote + chapter/page anchor.
  New nodes de-duplicated against the existing map (physiomap_core.reconcile). DRAFT for domain review.
