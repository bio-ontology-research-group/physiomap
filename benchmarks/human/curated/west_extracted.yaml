- source: plasma_thromboxane_b2
  target: pulmonary_vascular_resistance
  sign: +
  causal_evidence: pharmacological
  mechanism: thromboxane A2 contracts pulmonary vascular smooth muscle
  evidence: Increases due to alveolar hypoxia, as well as endothelin, histamine, serotonin, thromboxane A2
- source: endothelial_pgi2_production
  target: pulmonary_vascular_resistance
  sign: '-'
  causal_evidence: pharmacological
  mechanism: prostacyclin (PGI2) relaxes pulmonary vascular smooth muscle
  evidence: Substances that can relax smooth muscle in the pulmonary circulation include acetylcholine, calcium channel blockers,
