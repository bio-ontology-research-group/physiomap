# =============================================================================
# E1a — IEM enzyme -> disease-metabolite reaction edges   *** DRAFT FOR REVIEW ***
# Wires existing enzyme-activity nodes (in the "enzyme_needs_wiring" coverage bucket) to
# their disease metabolites via authoritative Rhea reactions, so a single-gene do() clamp
# (LoF = activity DOWN; a few GoF, e.g. GLUD1) propagates to abnormal-quantity HPO phenotypes.
# SIGN CONVENTION (comparative statics, d[metabolite]/d[enzyme_activity]):
#   enzyme_activity -(-)-> SUBSTRATE  (LoF => substrate ACCUMULATES)
#   enzyme_activity -(+)-> PRODUCT    (LoF => product FALLS)
# Physiological flux direction was curated per enzyme (can reverse the canonical Rhea
# equation, e.g. CPT2 vs CPT1A on plasma_palmitoylcarnitine -> opposite signs).
# Provenance: mechanism = Rhea reaction (+EC); evidence = IEM + OMIM. Fan-out validated;
# every sign self-checked against the textbook IEM accumulation/depletion.
# 29 genes / 54 edges / 4 new nodes. See benchmarks/results/e1_coverage_scan.md.
# =============================================================================
name: e1a_iem_reactions
description: DRAFT — IEM enzyme->metabolite reaction edges wiring existing PhysioMap enzyme-activity nodes
  to their disease metabolites (Rhea/EC grounded), so a monogenic LoF/GoF clamp on the enzyme propagates
  to abnormal-quantity phenotypes. Built by the E1a fan-out (Rhea reactions + per-edge sign verification
  vs known IEM direction); causal_evidence=curated_mechanistic (the Rhea reaction is the mechanism). FOR
  REVIEW.
