  - 'OpenStax Biology 2e §bio-37.4 (37.4: Regulation of Hormone Production): anterior pituitary TSH stimulates
    the thyroid gland to produce T3 and T4 (hormonal stimulus example)'
  venous_return->cardiac_output:
  - 'OpenStax Anatomy & Physiology 2e §anp-112 (20.3: Blood Flow, Blood Pressure, and Resistance): ''venoconstriction
    increases the return of blood to the heart... increases the preload or stretch of the cardiac muscle
    and increases contraction.'''
  - 'OpenStax Anatomy & Physiology 2e §anp-116 (20.7: Development of Blood Vessels and Fetal Circulation):
    Chapter review §20.2 states venoconstriction and the skeletal muscle pump promote venous return to
    the heart, implying more venous return drives cardiac output.'
  - 'OpenStax Biology 2e §bio-40.3 (40.3: Mammalian Heart and Blood Vessels): ''The atria are the chambers
    that receive blood, and the ventricles are the chambers that pump blood.'' Deoxygenated venous blood
    enters the right atrium and is pumped by the right ventricle; oxygenated blood from the left atrium
    is pumped by the left ventricle into the aorta — the cardiac cycle coordinates filling and ejection
    so that venous inflow drives cardiac output.'
  venous_return->end_diastolic_volume:
  - 'OpenStax Anatomy & Physiology 2e §anp-108 (19.4: Cardiac Cycle): ''Approximately 70–80 percent of
    ventricular filling occurs by this method'' (passive inflow from veins during diastole before atrial
    kick)'
  - 'OpenStax Anatomy & Physiology 2e §anp-109 (19.5: Cardiac Physiology): ''Any sympathetic stimulation
    to the venous system will increase venous return to the heart, which contributes to ventricular filling,
    and EDV and preload.'''
  - 'OpenStax Anatomy & Physiology 2e §anp-110 (19.6: Development of the Heart) — chapter review 19.4:
    ''Venous return determines preload … Preload then impacts both EDV and ESV.'' (lines 413–415).'
  - 'OpenStax Anatomy & Physiology 2e §anp-114 (20.5: Homeostatic Regulation of the Vascular System):
    ''As blood returns to the heart more quickly, preload rises and the Frank-Starling principle tells
    us that contraction of the cardiac muscle in the atria and ventricles will be more forceful.'''
  intracellular_atp->phosphofructokinase_activity:
  - 'OpenStax Biology 2e §bio-7.2 (7.2: Glycolysis): ''it is less active when ADP levels are low and the
    concentration of ATP is high. Thus, if there is "sufficient" ATP in the system, the pathway slows
