  mean_arterial_pressure->adh:
  - 'OpenStax Anatomy & Physiology 2e §anp-153 (Regulation of Fluid Volume and Composition): ''When blood
    volume drops 5–10 percent, causing a decrease in blood pressure, there is a rapid and significant
    increase in ADH release from the posterior pituitary'''
  mean_arterial_pressure->baroreceptor_firing_rate:
  - 'OpenStax Anatomy & Physiology 2e §anp-075 (13.4: Circulation and the Central Nervous System): ''The
    bases of the common carotids contain stretch receptors that immediately respond to the drop in blood
    pressure upon standing... Heart rate increases—a reflex of the sympathetic division of the autonomic
