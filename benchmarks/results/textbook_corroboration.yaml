  - 'OpenStax Anatomy & Physiology 2e §anp-055 (10.4: Muscle Fiber Contraction and Relaxation): ''The
    first step in the process of contraction is for Ca++ to bind to troponin so that tropomyosin can slide
    away from the binding sites on the actin strands'' — confirms Ca²⁺–troponin binding as the thin-filament
