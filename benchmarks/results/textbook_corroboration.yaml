  troponin_c_calcium_binding:
  - 'Jakubowski & Flatt, Fundamentals of Biochemistry Vol I §biochem-5.5.1 (Muscle Contraction): troponin-C
    binds Ca2+ ions released from the sarcoplasmic reticulum, initiating the conformational cascade that
    enables cross-bridge formation; corroborates Ca2+-binding activation role of troponin-C in striated
