  - 'OpenStax Anatomy & Physiology 2e §anp-109 (19.5: Cardiac Physiology): ''baroreceptors are stretch
    receptors … Rates of firing from the baroreceptors represent blood pressure … With increased pressure
    and stretch, the rate of baroreceptor firing increases.'''
  - 'OpenStax Anatomy & Physiology 2e §anp-114 (20.5: Homeostatic Regulation of the Vascular System):
    ''When blood pressure increases, the baroreceptors are stretched more tightly and initiate action
    potentials at a higher rate.'''
  - 'OpenStax Anatomy & Physiology 2e §anp-153 (Regulation of Fluid Volume and Composition): ''blood pressure
    can be measured... measured by baroreceptors in the aorta and carotid sinuses. When blood pressure
    increases, baroreceptors send more frequent action potentials'''
  - 'OpenStax Biology 2e §bio-36.2 (36.2: Somatosensation): ''Baroreceptors detect pressure changes in
    an organ. They are found in the walls of the carotid artery and the aorta where they monitor blood
    pressure'''
  mean_arterial_pressure->renal_perfusion_pressure:
  - 'OpenStax Anatomy & Physiology 2e §anp-149 (25.6: Physiology of Urine Formation): ''as long as mean
