  - 'OpenStax Anatomy & Physiology 2e §anp-092 (17.5: The Thyroid Gland): ''TSH stimulates the thyroid
    gland to secrete T3 and T4'''
  - 'OpenStax Anatomy & Physiology 2e §anp-166 (28.5: Changes During Pregnancy, Labor, and Birth): ''Thyrotropin,
    in conjunction with placental hormones, increases the production of thyroid hormone, which raises
    the maternal metabolic rate.'''
  - 'OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): ''T3 and T4 release from the
    thyroid gland is stimulated by thyroid-stimulating hormone (TSH)''; ''TSH binding at the receptors
