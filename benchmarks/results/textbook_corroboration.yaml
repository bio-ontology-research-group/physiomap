  gfr->blood_urea_nitrogen:
  - 'OpenStax Biology 2e §bio-41.4 (Nitrogenous Wastes): BUN is used as an indicator of kidney function;
    impaired GFR reduces urea clearance and raises BUN'
  plasma_urate->urinary_urate:
  - 'OpenStax Biology 2e §bio-41.4 (Nitrogenous Wastes): uric acid is formed from purine breakdown; excess
