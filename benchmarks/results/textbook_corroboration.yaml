  pth->plasma_phosphate:
  - 'OpenStax Anatomy & Physiology 2e §anp-152 (25.9: Endocrine Regulation of Kidney Function): ''It [PTH]
    also blocks reabsorption of phosphate (PO3–), causing its loss in the urine.'''
  - 'OpenStax Anatomy & Physiology 2e §anp-153 (Regulation of Fluid Volume and Composition): ''When Ca++
