  - 'OpenStax Biology 2e §bio-38.4 (38.4: Muscle Contraction and Locomotion): ''calcium ions bind to troponin,
    causing conformational changes in troponin that allow tropomyosin to move away from the myosin binding
    sites on actin'' — confirms Ca2+ binding to troponin as the regulatory switch for cross-bridge formation.'
  plasma_potassium:
  - 'OpenStax Biology 2e §bio-5.3 (5.3: Active Transport): Na+-K+ ATPase moves K+ into cells from plasma,
    maintaining low plasma K+ relative to intracellular K+.'
  plasma_sodium_concentration:
  - 'OpenStax Biology 2e §bio-5.3 (5.3: Active Transport): Na+-K+ ATPase maintains high extracellular
    (plasma) Na+ by pumping Na+ out of cells; cells have lower Na+ concentration than extracellular fluid.'
  mitochondrial_complex_i_activity:
  - 'OpenStax Biology 2e §bio-7.1 (7.1: Energy in Living Systems): NAD+ (the substrate of complex I) accepts
    electrons from organic molecules; in type 2 diabetes the oxidation efficiency of NADH is reduced,
    impacting oxidative phosphorylation — confirming complex I NADH-oxidation activity as a physiological
    variable.'
  - 'OpenStax Biology 2e §bio-7.4 (7.4: Oxidative Phosphorylation): Complex I (NADH dehydrogenase, 44
    polypeptides) receives electrons from NADH and pumps 4 H+ per electron pair across the inner mitochondrial
    membrane'
  mitochondrial_respiratory_chain_activity:
  - 'OpenStax Biology 2e §bio-7.1 (7.1: Energy in Living Systems): chemiosmosis (driven by the respiratory
    chain) generates 90% of ATP during glucose catabolism.'
  - 'OpenStax Biology 2e §bio-7.4 (7.4: Oxidative Phosphorylation): The ETC (four protein complexes plus
