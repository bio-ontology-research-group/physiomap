  anp->renin:
  - 'OpenStax Biology 2e §bio-37.5 (37.5: Endocrine Glands): ''ANP also reduces the amounts of renin released
    by the kidneys and aldosterone released by the adrenal cortex, further preventing the retention of
    water.'''
  - 'OpenStax Biology 2e §bio-41.5 (41.5: Hormonal Control of Osmoregulatory Functions): ''Its [ANP''s]
    actions suppress the actions of aldosterone, ADH, and renin.'''
  anp->aldosterone:
  - 'OpenStax Biology 2e §bio-37.5 (37.5: Endocrine Glands): ''ANP also reduces the amounts of renin released
    by the kidneys and aldosterone released by the adrenal cortex, further preventing the retention of
