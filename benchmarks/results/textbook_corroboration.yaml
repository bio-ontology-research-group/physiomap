  gs_adenylyl_cyclase_activity->camp_level:
  - 'OpenStax Biology 2e §bio-37.2 (37.2: How Hormones Work): ''Adenylyl cyclase catalyzes the conversion
    of ATP to cAMP.'''
  - 'OpenStax Biology 2e §bio-9.2 (9.2: Propagation of the Signal): ''Cyclic AMP is synthesized by the
    enzyme adenylyl cyclase from ATP'''
  camp_level->pka_activity:
  - 'OpenStax Biology 2e §bio-37.2 (37.2: How Hormones Work): ''cAMP, in turn, activates a group of proteins
    called protein kinases, which transfer a phosphate group from ATP to a substrate molecule in a process
    called phosphorylation.'''
  - 'OpenStax Biology 2e §bio-9.2 (9.2: Propagation of the Signal): ''The main role of cAMP in cells is
    to bind to and activate an enzyme called cAMP-dependent kinase (A-kinase)'''
  - 'OpenStax Biology 2e §bio-9.3 (9.3: Response to the Signal): ''Cyclic AMP activates PKA (protein kinase
    A)'''
  camp_level->pde_activity:
  - 'OpenStax Biology 2e §bio-37.2 (37.2: How Hormones Work): ''An enzyme called phosphodiesterase breaks
    down cAMP, terminating the signal.'' (substrate-driven PDE activation implied by cAMP level)'
  - 'OpenStax Biology 2e §bio-9.2 (9.2: Propagation of the Signal): ''Termination of the signal occurs
    when an enzyme called phosphodiesterase converts cAMP into AMP'' (cAMP drives PDE activity)'
  pde_activity->camp_level:
  - 'OpenStax Biology 2e §bio-37.2 (37.2: How Hormones Work): ''cAMP is deactivated by the cytoplasmic
    enzyme phosphodiesterase, or PDE. PDE is always present in the cell and breaks down cAMP to control
    hormone activity, preventing overproduction of cellular products.'''
  - 'OpenStax Biology 2e §bio-9.2 (9.2: Propagation of the Signal): ''Termination of the signal occurs
    when an enzyme called phosphodiesterase converts cAMP into AMP'' (PDE degrades cAMP, reducing its
    level)'
  - 'OpenStax Biology 2e §bio-9.3 (9.3: Response to the Signal): ''Cyclic AMP (cAMP) is degraded into
    AMP by phosphodiesterase'''
  il1beta->core_temperature:
  - 'OpenStax Biology 2e §bio-33.3 (Homeostasis): ''When a bacterium is destroyed by phagocytic leukocytes,
    chemicals called endogenous pyrogens are released into the blood. These pyrogens circulate to the
    hypothalamus and reset the thermostat. This allows the body''s temperature to increase in what is
    commonly called a fever.'''
  - 'OpenStax Biology 2e §bio-42.1 (42.1: Innate Immune Response): ''Cytokines also increase the core
    body temperature, causing a fever'' — IL-1beta is a principal pro-inflammatory cytokine driving pyrogenic
    fever.'
  il6->core_temperature:
  - 'OpenStax Biology 2e §bio-33.3 (Homeostasis): endogenous pyrogens released by leukocytes destroying
    bacteria reset the hypothalamic thermostat, causing fever — corroborates IL-6 as endogenous pyrogen
    raising core temperature.'
  - 'OpenStax Biology 2e §bio-42.1 (42.1: Innate Immune Response): ''Cytokines also increase the core
    body temperature, causing a fever'' — IL-6 is the principal circulating endogenous pyrogen.'
  beta1_adrenergic_activation->gs_adenylyl_cyclase_activity:
  - 'OpenStax Biology 2e §bio-37.2 (37.2: How Hormones Work): ''The activated G-protein in turn activates
    a membrane-bound enzyme called adenylyl cyclase.'' (Figure 37.6 caption: ''Hormone binding to receptor
    activates a G-protein, which in turn activates adenylyl cyclase'')'
  plasma_calcium->plasma_calcitonin:
  - 'OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): ''The hormone calcitonin...has
    the opposite effect on blood calcium levels as does PTH.'' — implied: calcitonin is released in response
    to high blood calcium.'
  - 'OpenStax Biology 2e §bio-37.5 (37.5: Endocrine Glands): ''calcitonin is produced by parafollicular
    cells of the thyroid... Calcitonin release is not controlled by TSH, but instead is released when
    calcium ion concentrations in the blood rise.'''
  plasma_calcitonin->plasma_calcium:
  - 'OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): ''Calcitonin decreases blood
    calcium levels by inhibiting osteoclasts, stimulating osteoblasts, and stimulating calcium excretion
    by the kidneys.'''
  - 'OpenStax Biology 2e §bio-37.5 (37.5: Endocrine Glands): ''The combination of these two events [inhibit
    osteoclast activity; stimulate renal calcium excretion] lowers body fluid levels of calcium.'''
  trh->tsh:
  - 'OpenStax Biology 2e §bio-37.4 (37.4: Regulation of Hormone Production): hypothalamus produces hormones
