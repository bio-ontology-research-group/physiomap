  arterial_ph->hemoglobin_o2_saturation:
  - Jakubowski & Flatt, Fundamentals of Biochemistry Vol I §biochem-5.03.4 (Summary)
  - 'Jakubowski & Flatt, Fundamentals of Biochemistry Vol I §biochem-5.03.7 (Summary): ''The Bohr effect,
    where a decrease in pH shifts the binding curve to favor oxygen release, is highlighted as a critical
    regulatory mechanism in oxygen delivery to tissues.'' Corroborates arterial_ph → hemoglobin_o2_saturation
    (+).'
  - 'OpenStax Biology 2e §bio-39.4 (39.4: Transport of Gases in Human Bodily Fluids): ''This increase
    in carbon dioxide and subsequent decrease in pH reduce the affinity of hemoglobin for oxygen. The
    oxygen dissociates from the Hb molecule, shifting the oxygen dissociation curve to the right.'' Lower
    pH reduces Hb-O2 affinity and saturation (Bohr effect).'
  core_temperature->hemoglobin_o2_saturation:
  - 'OpenStax Biology 2e §bio-39.4 (39.4: Transport of Gases in Human Bodily Fluids): ''A similar shift
    in the curve also results from an increase in body temperature. Increased temperature, such as from
    increased activity of skeletal muscle, causes the affinity of hemoglobin for oxygen to be reduced.''
    Higher temperature reduces Hb-O2 saturation.'
  gfr->sodium_excretion:
  - 'OpenStax Biology 2e §bio-41.2 (41.2: The Kidneys and Osmoregulatory Organs): ''Almost all solutes,
    except for proteins, are filtered out into the glomerulus by a process called glomerular filtration.''
