    when reabsorptive capacity is not proportionally increased.'
  urea_cycle_enzyme_activity->hepatic_urea_synthesis:
  - 'OpenStax Biology 2e §bio-41.4 (Nitrogenous Wastes): urea cycle enzymes catalyze the conversion of
