  - 'OpenStax Anatomy & Physiology 2e §anp-090 (17.3: Hormones): table entry ''PTH: Increases blood Ca2+
    levels'''
  - 'OpenStax Anatomy & Physiology 2e §anp-093 (17.6: The Parathyroid Glands): ''PTH secretion causes
