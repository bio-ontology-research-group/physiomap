  mitochondrial_atp_synthase_activity:
  - 'OpenStax Biology 2e §bio-7.1 (7.1: Energy in Living Systems): oxidative phosphorylation via chemiosmosis
    in mitochondria produces the majority of cellular ATP; ATP is the universal energy currency regenerated
    from ADP.'
  - 'OpenStax Biology 2e §bio-7.4 (7.4: Oxidative Phosphorylation): ATP synthase uses the proton electrochemical
    gradient (chemiosmosis) to phosphorylate ADP; generates ~90% of aerobic ATP'
  citrate_synthase_activity:
  - 'OpenStax Biology 2e §bio-7.3 (7.3: Oxidation of Pyruvate and the Citric Acid Cycle): citrate synthase
    (step 1 of TCA cycle) condenses acetyl group with oxaloacetate to form citrate; its rate is controlled
    by ATP availability.'
  pyruvate_dehydrogenase_activity:
  - 'OpenStax Biology 2e §bio-7.3 (7.3: Oxidation of Pyruvate and the Citric Acid Cycle): pyruvate dehydrogenase
    complex converts pyruvate to acetyl-CoA in a three-step process releasing CO2 and producing NADH in
    mitochondrial matrix.'
  mitochondrial_complex_ii_activity:
  - 'OpenStax Biology 2e §bio-7.4 (7.4: Oxidative Phosphorylation): Complex II directly receives FADH2;
    electrons bypass Complex I, so fewer protons are pumped and fewer ATP are produced per FADH2'
  mitochondrial_complex_iii_activity:
  - 'OpenStax Biology 2e §bio-7.4 (7.4: Oxidative Phosphorylation): Complex III (cytochrome oxidoreductase,
    containing cytochrome b, Rieske Fe-S, and cytochrome c proteins) pumps protons across the inner mitochondrial
    membrane'
  mitochondrial_complex_iv_activity:
  - 'OpenStax Biology 2e §bio-7.4 (7.4: Oxidative Phosphorylation): Complex IV (cytochromes c, a, a3 with
    heme and copper ions) reduces O2 to water, removing H+ from the matrix and contributing to the ion
    gradient'
  gastric_acid_secretion:
  - 'OpenStax Biology 2e §bio-34.1 (34.1: Digestive Systems): parietal cells secrete H⁺ and Cl⁻ that combine
    to form HCl, the primary acidic component of gastric juice (stomach pH 1.5–2.5).'
  - 'OpenStax Biology 2e §bio-34.3 (34.3: Digestive System Processes): ''The acidic environment in the
    stomach stops the action of the amylase enzyme.'''
  plasma_pepsinogen_i:
  - 'OpenStax Biology 2e §bio-34.1 (34.1: Digestive Systems): ''Pepsin is secreted by the chief cells
    in the stomach in an inactive form called pepsinogen.'''
  gastric_emptying_rate:
  - 'OpenStax Biology 2e §bio-34.1 (34.1: Digestive Systems): ''The movement of chyme from the stomach
    into the small intestine is regulated by the pyloric sphincter''; gastric emptying occurs within 2–6
    hours after a meal.'
  pancreatic_amylase_activity:
  - 'OpenStax Biology 2e §bio-34.1 (34.1: Digestive Systems): pancreatic juices ''contain a large variety
    of enzymes that are required for the digestion of protein and carbohydrates''; bile produces bile
    salts that emulsify lipids while the pancreas produces enzymes catabolizing starches.'
  - 'OpenStax Biology 2e §bio-34.3 (34.3: Digestive System Processes): ''Pancreatic juices also contain
    amylase, which continues the breakdown of starch and glycogen into maltose, a disaccharide.'''
  intestinal_lactase_activity:
  - 'OpenStax Biology 2e §bio-34.3 (34.3: Digestive System Processes): ''lactase breaks down lactose (or
    "milk sugar") into glucose and galactose.'''
  sucrase_isomaltase_activity:
  - 'OpenStax Biology 2e §bio-34.3 (34.3: Digestive System Processes): ''Sucrase breaks down sucrose (or
    "table sugar") into glucose and fructose.'''
  trypsin_activity:
  - 'OpenStax Biology 2e §bio-34.3 (34.3: Digestive System Processes): ''trypsin, elastase, and chymotrypsin—act
    on the peptides reducing them to smaller peptides.'''
  intestinal_lipid_emulsification:
  - 'OpenStax Biology 2e §bio-34.3 (34.3: Digestive System Processes): ''By forming an emulsion, bile
    salts increase the available surface area of the lipids manyfold.'''
  plasma_chylomicron:
  - 'OpenStax Biology 2e §bio-34.3 (34.3: Digestive System Processes): ''These large spheres are called
    chylomicrons. Chylomicrons contain triglycerides, cholesterol, and other lipids... Chylomicrons enter
    the lymphatic vessels, and then enter the blood in the subclavian vein.'''
  intracellular_calcium:
  - 'Jakubowski & Flatt, Fundamentals of Biochemistry Vol I §biochem-5.5.1 (Muscle Contraction): Ca2+
    ions released from SR serve as the trigger for sarcomere contraction by binding troponin-C; corroborates
    cytosolic Ca2+ as the key activating signal'
  - 'OpenStax Biology 2e §bio-35.2 (35.2: How Neurons Communicate): Ca2+ influx through presynaptic voltage-gated
    channels drives neurotransmitter release; Ca2+ through NMDA receptors drives LTP/LTD plasticity.'
  norepinephrine:
  - 'OpenStax Biology 2e §bio-35.5 (35.5: Nervous System Disorders): MAO inhibitors block enzyme that
    degrades norepinephrine, increasing synaptic norepinephrine; SSRIs and related drugs also work by
    blocking reuptake of norepinephrine'
  plasma_serotonin:
  - 'OpenStax Biology 2e §bio-35.5 (35.5: Nervous System Disorders): depression hypothesis involves decreased
    serotonin neurotransmission; SSRIs block serotonin reuptake to increase synaptic serotonin'
  sr_calcium_release:
  - 'Jakubowski & Flatt, Fundamentals of Biochemistry Vol I §biochem-5.5.1 (Muscle Contraction): Ca2+
    ions released from stores in the sarcoplasmic reticulum on neural stimulation initiate sarcomere contraction;
    corroborates SR as the source of activating Ca2+ in striated muscle'
  - 'OpenStax Biology 2e §bio-38.4 (38.4: Muscle Contraction and Locomotion): ''The trigger for calcium
    release from the sarcoplasmic reticulum into the sarcoplasm is a neural signal... excitation-contraction
    coupling is the link between the action potential generated in the sarcolemma and the start of a muscle
    contraction.'''
  renal_interstitial_fibroblast_epo_secretion:
  - 'OpenStax Biology 2e §bio-41.2 (41.2: The Kidneys and Osmoregulatory Organs): ''The JGC is an endocrine
    structure that secretes the enzyme renin and the hormone erythropoietin.'' Erythropoietin is produced
    by the kidney (primarily by peritubular interstitial fibroblasts in the cortex/outer medulla) and
    released in response to renal oxygen sensing.'
  dendritic_cell_activation:
  - 'Jakubowski & Flatt, Fundamentals of Biochemistry Vol I §biochem-5.04.1 (Recognition and Response
    in the Innate Immune System): dendritic cells bind PAMPs via TLRs, undergo maturation/activation,
    and release cytokines and chemokines to control lymphocyte movement'
  macrophage_il1beta_secretion:
  - 'Jakubowski & Flatt, Fundamentals of Biochemistry Vol I §biochem-5.04.3 (The Active Inflammasome):
    inflammasome caspase-1 activates and releases IL-1beta from macrophages'
  il1beta:
  - 'Jakubowski & Flatt, Fundamentals of Biochemistry Vol I §biochem-5.04.3 (The Active Inflammasome):
    IL-1beta is a procytokine matured by caspase-1 and released from activated inflammasome-bearing cells'
  macrophage_activation:
  - 'Jakubowski & Flatt, Fundamentals of Biochemistry Vol I §biochem-5.04.3 (The Active Inflammasome):
    NF-kB activation by PAMPs (Signal 1) primes macrophage pro-inflammatory cytokine gene expression including
    IL-1beta and NLRP3'
