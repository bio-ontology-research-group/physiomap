  red_cell_mass->hematocrit:
  - 'OpenStax Anatomy & Physiology 2e §anp-102 (18.4: Erythrocytes): hematocrit is the packed red-cell
    volume fraction; RBC count directly determines hematocrit.'
  red_cell_mass->renal_tissue_oxygenation:
  - 'OpenStax Anatomy & Physiology 2e §anp-102 (18.4: Erythrocytes): rising erythrocyte count restores
    oxygen delivery and closes the negative-feedback loop with EPO.'
  renal_perfusion_pressure->gfr:
  - 'OpenStax Anatomy & Physiology 2e §anp-149 (25.6: Physiology of Urine Formation): ''Glomerular filtration
