  norepinephrine->heart_rate:
  - 'OpenStax Anatomy & Physiology 2e §anp-081 (15.3: Autonomic Reflexes and Homeostasis): norepinephrine
    binds adrenergic receptors on SA-node cells, causing faster depolarization and increased heart rate.'
  - 'OpenStax Anatomy & Physiology 2e §anp-094 (17.7: The Adrenal Glands): ''These hormones increase the
