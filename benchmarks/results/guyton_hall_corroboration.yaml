_about: Guyton & Hall, Textbook of Medical Physiology (11th ed.) corroboration of EXISTING PhysioMap edges.
  Each entry adds authoritative provenance (chapter/section anchor + verbatim quote) for an edge PhysioMap
  already encodes. Mined by per-chapter agent fan-out over the institutional KAUST-library copy (read-only,
  not redistributed); see benchmarks/results/guyton_extraction.md. Review before inlining into edge.evidence.
edges:
  acth->aldosterone:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.74 (Introduction to Endocrinology) §Table 74-1 (Anterior
    pituitary): “Adrenocorticotropic hormone (ACTH) Stimulates synthesis and secretion of adrenocortical
    hormones (cortisol, androgens, and aldosterone)”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.77 (Adrenocortical Hormones) §Regulation of Aldosterone
    Secretion: “ACTH from the anterior pituitary gland is necessary for aldosterone secretion”'
  acth->cortisol:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.67 (Metabolism of Carbohydrates, and Formation of
    Adenosine Triphosphate) §Effect of Corticotropin and Glucocorticoids on Gluconeogenesis: “This stimulates
    the adrenal cortex to produce large quantities of glucocorticoid hormones, especially cortisol.”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.74 (Introduction to Endocrinology) §Coordination of
    Body Functions (Table 74-1): “adrenocorticotropic hormone (ACTH) from the anterior pituitary gland
    specifically stimulates the adrenal cortex, causing it to secrete adrenocortical hormones”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.77 (Adrenocortical Hormones) §Regulation of Cortisol
    Secretion by ACTH: “secretion of cortisol is controlled almost entirely by ACTH secreted by the anterior
    pituitary gland”'
  acth->plasma_androgen:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.74 (Introduction to Endocrinology) §Table 74-1 (Anterior
    pituitary): “Adrenocorticotropic hormone (ACTH) Stimulates synthesis and secretion of adrenocortical
    hormones (cortisol, androgens, and aldosterone)”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.77 (Adrenocortical Hormones) §Regulation of Cortisol
    Secretion by ACTH: “This hormone, also called corticotropin or adrenocorticotropin, also enhances
    the production of adrenal androgens.”'
  activated_protein_C->thrombin:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.36 (Hemostasis and Blood Coagulation) §Endothelial
    Surface Factors: “protein C, that acts as an anticoagulant by inactivating activated Factors V and
    VIII.”'
  adh->plasma_osmolality:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.28 (Regulation of Extracellular Fluid Osmolarity and
    Sodium Concentration) §Osmoreceptor-ADH Feedback System: “water is conserved in the body ... This
    causes dilution of the solutes in the extracellular fluid, thereby correcting the initial excessively
    concentrated extracellular fluid”'
  adh->plasma_sodium_concentration:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.28 (Regulation of Extracellular Fluid Osmolarity and
    Sodium Concentration) §Osmoreceptor-ADH Feedback System: “the renal tubules decrease their permeability
    for water, less water is reabsorbed ... This in turn concentrates the body fluids and returns plasma
    osmolarity toward normal”'
  adh->sodium_water_reabsorption:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.19 (Dominant Role of the Kidney in Long-Term Pressure
    Control) §Importance of Salt in the Renal-Body Fluid Schema: “The antidiuretic hormone then causes
    the kidneys to reabsorb greatly increased quantities of water from the renal tubular fluid”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.22 (Cardiac Failure) §Increased aldosterone secretion:
    “The antidiuretic hormone in turn promotes still greater increase in tubular reabsorption of water”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.25 (The Body Fluid Compartments: Extracellular and
    Intracellular Fluids; Interstitial Fluid and Edema) §Causes of Hyponatremia: “excessive secretion
    of antidiuretic hormone, which causes the kidney tubules to reabsorb more water”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.27 (Urine Formation by the Kidneys: II. Tubular Reabsorption
    and Secretion) §ADH Increases Water Reabsorption: “The most important renal action of ADH is to increase
    the water permeability of the distal tubule, collecting tubule, and collecting duct epithelia.”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.28 (Regulation of Extracellular Fluid Osmolarity and
    Sodium Concentration) §Requirements for Excreting a Concentrated Urine: “a high level of ADH, which
    increases the permeability of the distal tubules and collecting ducts to water, thereby allowing these
    tubular segments to avidly reabsorb water”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.74 (Introduction to Endocrinology) §Table 74-1 (Posterior
    pituitary): “Antidiuretic hormone (ADH) ... Increases water reabsorption by the kidneys and causes
    vasoconstriction and increased blood pressure”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.75 (Pituitary Hormones and Their Control by the Hypothalamus)
    §Physiological Functions of ADH: “in the presence of ADH, the permeability of the collecting ducts
    and tubules to water increases greatly and allows most of the water to be reabsorbed”'
  adh->total_peripheral_resistance:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.17 (Local and Humoral Control of Blood Flow by the
    Tissues) §Vasopressin: “Vasopressin ... is even more powerful than angiotensin II as a vasoconstrictor,
    thus making it one of the body''s most potent vascular constrictor substances.”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.24 (Circulatory Shock and Physiology of Its Treatment)
    §Nonprogressive Shock—Compensated Shock: “Formation of vasopressin (antidiuretic hormone) by the posterior
    pituitary gland, which constricts the peripheral arteries and veins”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.74 (Introduction to Endocrinology) §Table 74-1 (Posterior
    pituitary): “Antidiuretic hormone (ADH) ... causes vasoconstriction and increased blood pressure”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.75 (Pituitary Hormones and Their Control by the Hypothalamus)
    §Vasoconstrictor and Pressor Effects of ADH: “higher concentrations of ADH have a potent effect of
    constricting the arterioles throughout the body”'
  adh->urine_osmolality:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.27 (Urine Formation by the Kidneys: II. Tubular Reabsorption
    and Secretion) §Medullary Collecting Duct: “With high levels of ADH, water is avidly reabsorbed into
    the medullary interstitium, thereby reducing the urine volume and concentrating most of the solutes
    in the urine.”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.28 (Regulation of Extracellular Fluid Osmolarity and
    Sodium Concentration) §Antidiuretic Hormone Controls Urine Concentration: “the rate of ADH secretion
    determines, to a large extent, whether the kidney excretes a dilute or a concentrated urine”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.75 (Pituitary Hormones and Their Control by the Hypothalamus)
    §Physiological Functions of ADH: “conserving water in the body and producing very concentrated urine”'
  adipose_hsl_activity->lipolysis_rate:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.68 (Lipid Metabolism) §Free Fatty Acids Are Transported
    in the Blood: “a hormone-sensitive cellular lipase can be activated by several hormones ... and this
    also promotes rapid hydrolysis of triglycerides”'
  adipose_tissue_mass->leptin:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.71 (Dietary Balances; Regulation of Feeding; Obesity
    and Starvation; Vitamins and Minerals) §Feedback Signals from Adipose Tissue Regulate Food Intake:
    “When the amount of adipose tissue increases (signaling excess energy storage), the adipocytes produce
    increased amounts of leptin”'
  afterload->stroke_volume:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.9 (Heart Muscle; The Heart as a Pump and Function
    of the Heart Valves) §Concepts of Preload and Afterload: “The afterload of the ventricle is the pressure
    in the artery leading from the ventricle.”'
  agrp_npy_tone->mc4r_activity:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.71 (Dietary Balances; Regulation of Feeding; Obesity
    and Starvation; Vitamins and Minerals) §Neurons and Neurotransmitters in the Hypothalamus: “AGRP released
    from the orexigenic neurons of the hypothalamus is a natural antagonist of MCR-3 and MCR-4”'
  airway_resistance->alveolar_ventilation:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.37 (Pulmonary Ventilation) §Resistance to Airflow
    in the Bronchial Tree: “less than 1 centimeter of water pressure gradient from the alveoli to the
    atmosphere is sufficient to cause enough airflow for quiet breathing”'
  aldosterone->plasma_potassium:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.77 (Adrenocortical Hormones) §Excess Aldosterone Causes
    Hypokalemia: “excessive secretion of aldosterone ... may cause a serious decrease in the plasma potassium
    concentration”'
  aldosterone->renal_potassium_excretion:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.27 (Urine Formation by the Kidneys: II. Tubular Reabsorption
    and Secretion) §Aldosterone Increases Sodium Reabsorption and Increases Potassium Secretion: “Aldosterone,
    secreted by the zona glomerulosa cells of the adrenal cortex, is an important regulator of sodium
    reabsorption and potassium secretion”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.29 (Renal Regulation of Potassium, Calcium, Phosphate,
    and Magnesium; Integration of Renal Mechanisms for Control of Blood Volume and Extracellular Fluid
    Volume) §Aldosterone Stimulates Potassium Secretion: “aldosterone has a powerful effect to increase
    potassium excretion”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.31 (Kidney Diseases and Diuretics) §Competitive Inhibitors
    of Aldosterone Decrease Sodium Reabsorption: “these drugs also block the effect of aldosterone to
    promote potassium secretion in the tubules, they decrease the excretion of potassium”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.74 (Introduction to Endocrinology) §Table 74-1 (Adrenal
    cortex): “Aldosterone Increases renal sodium reabsorption, potassium secretion, and hydrogen ion secretion”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.77 (Adrenocortical Hormones) §Renal and Circulatory
    Effects of Aldosterone: “aldosterone increases absorption of sodium and simultaneously increases secretion
    of potassium by the renal tubular epithelial cells”'
  aldosterone->sodium_water_reabsorption:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.19 (Dominant Role of the Kidney in Long-Term Pressure
    Control) §Hypertension Caused by Primary Aldosteronism: “aldosterone increases the rate of reabsorption
    of salt and water by the tubules of the kidneys”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.22 (Cardiac Failure) §Increased aldosterone secretion:
    “The elevated aldosterone level further increases the reabsorption of sodium from the renal tubules”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.25 (The Body Fluid Compartments: Extracellular and
    Intracellular Fluids; Interstitial Fluid and Edema) §Causes of Hypernatremia: “excessive secretion
    of the sodium-retaining hormone aldosterone ... increased aldosterone secretion causes the kidneys
    to reabsorb greater amounts of water as well as sodium.”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.27 (Urine Formation by the Kidneys: II. Tubular Reabsorption
    and Secretion) §Aldosterone Increases Sodium Reabsorption and Increases Potassium Secretion: “Aldosterone...
    increases sodium reabsorption while at the same time increasing potassium secretion is by stimulating
    the sodium-potassium ATPase pump”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.28 (Regulation of Extracellular Fluid Osmolarity and
    Sodium Concentration) §Role of Angiotensin II and Aldosterone: “angiotensin II and aldosterone increase
    both sodium and water reabsorption by the renal tubules, leading to increases in extracellular fluid
    volume and sodium quantity”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.29 (Renal Regulation of Potassium, Calcium, Phosphate,
    and Magnesium; Integration of Renal Mechanisms for Control of Blood Volume and Extracellular Fluid
    Volume) §Role of Aldosterone in Controlling Renal Excretion: “Aldosterone increases sodium reabsorption,
    especially in the cortical collecting tubules”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.31 (Kidney Diseases and Diuretics) §Renal Lesions
    That Reduce the Ability of the Kidneys to Excrete Sodium and Water Promote Hypertension: “excessive
    aldosterone secretion, which increases sodium reabsorption mainly in the cortical collecting tubules”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.74 (Introduction to Endocrinology) §Table 74-1 (Adrenal
    cortex): “Aldosterone Increases renal sodium reabsorption, potassium secretion, and hydrogen ion secretion”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.77 (Adrenocortical Hormones) §Renal and Circulatory
    Effects of Aldosterone: “aldosterone increases absorption of sodium ... aldosterone causes sodium
    to be conserved in the extracellular fluid”'
  alpha_msh->mc4r_activity:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.71 (Dietary Balances; Regulation of Feeding; Obesity
    and Starvation; Vitamins and Minerals) §Neurons and Neurotransmitters in the Hypothalamus: “The POMC
    neurons release a-MSH, which then acts on melanocortin receptors found especially in neurons of the
    paraventricular nuclei.”'
  alveolar_po2->pulmonary_arteriole_diameter:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.38 (Pulmonary Circulation, Pulmonary Edema, Pleural
    Fluid) §Effect of Diminished Alveolar Oxygen on Local Alveolar Blood Flow: “When the concentration
    of oxygen in the air of the alveoli decreases below normal ... the adjacent blood vessels constrict”'
  alveolar_surface_tension->tidal_volume:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.37 (Pulmonary Ventilation) §Surfactant, Surface Tension,
    and Collapse of the Alveoli: “important surfactant is in reducing alveolar surface tension and therefore
    also reducing the effort required by the respiratory muscles to expand the lungs”'
  alveolar_surfactant_amount->alveolar_surface_tension:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.37 (Pulmonary Ventilation) §Surfactant, Surface Tension,
    and Collapse of the Alveoli: “The fluid-air surface tension elastic forces of the lungs also increase
    tremendously when the substance called surfactant is not present in the alveolar fluid.”'
  alveolar_surfactant_concentration->alveolar_surface_tension:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.37 (Pulmonary Ventilation) §Surfactant and Its Effect
    on Surface Tension: “Surfactant is a surface active agent in water, which means that it greatly reduces
    the surface tension of water.”'
  alveolar_ventilation->arterial_pco2:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.30 (Regulation of Acid-Base Balance) §Increasing Alveolar
    Ventilation Decreases Extracellular Fluid Hydrogen Ion Concentration and Raises pH: “The higher the
    alveolar ventilation, the lower the Pco2; conversely, the lower the alveolar ventilation rate, the
    higher the Pco2.”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.41 (Regulation of Respiration) §Unimportance of Oxygen
    for Control of the Respiratory Center: “both the blood and tissue Pco2 changes inversely with the
    rate of pulmonary ventilation”'
  angiotensin_II->aldosterone:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.19 (Dominant Role of the Kidney in Long-Term Pressure
    Control) §Stimulation of Aldosterone Secretion by Angiotensin: “Angiotensin is also one of the most
    powerful stimulators of aldosterone secretion by the adrenal glands”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.22 (Cardiac Failure) §Increased aldosterone secretion:
    “the effect of angiotensin to stimulate aldosterone secretion by the adrenal cortex”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.27 (Urine Formation by the Kidneys: II. Tubular Reabsorption
    and Secretion) §Angiotensin II Increases Sodium and Water Reabsorption: “Angiotensin II stimulates
    aldosterone secretion, which in turn increases sodium reabsorption.”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.29 (Renal Regulation of Potassium, Calcium, Phosphate,
    and Magnesium; Integration of Renal Mechanisms for Control of Blood Volume and Extracellular Fluid
    Volume) §Role of Aldosterone in Controlling Renal Excretion: “the increased angiotensin II levels
    that occur stimulate aldosterone secretion”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.77 (Adrenocortical Hormones) §Regulation of Aldosterone
    Secretion: “Increased activity of the renin-angiotensin system (increased levels of angiotensin II)
    also greatly increases aldosterone secretion.”'
  angiotensin_II->sodium_water_reabsorption:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.19 (Dominant Role of the Kidney in Long-Term Pressure
    Control) §Effect of Angiotensin in the Kidneys: “Angiotensin acts directly on the kidneys to cause
    salt and water retention”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.22 (Cardiac Failure) §Activation of the renin-angiotensin
    system: “promoting greatly increased reabsorption of both water and salt from the tubules”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.24 (Circulatory Shock and Physiology of Its Treatment)
    §Nonprogressive Shock—Compensated Shock: “decreased output of water and salt by the kidneys, both
    of which help prevent progression of shock.”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.27 (Urine Formation by the Kidneys: II. Tubular Reabsorption
    and Secretion) §Angiotensin II Increases Sodium and Water Reabsorption: “Angiotensin II is perhaps
    the body''s most powerful sodium-retaining hormone... increasing sodium and water reabsorption from
    the renal tubules”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.28 (Regulation of Extracellular Fluid Osmolarity and
    Sodium Concentration) §Role of Angiotensin II and Aldosterone: “increased levels of these hormones
    stimulate sodium reabsorption by the kidneys ... they also increase the extracellular fluid volume
    by increasing reabsorption of water along with the sodium”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.29 (Renal Regulation of Potassium, Calcium, Phosphate,
    and Magnesium; Integration of Renal Mechanisms for Control of Blood Volume and Extracellular Fluid
    Volume) §Role of Angiotensin II In Controlling Renal Excretion: “angiotensin II has several important
    effects in increasing tubular reabsorption of sodium”'
  angiotensin_II->total_peripheral_resistance:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.17 (Local and Humoral Control of Blood Flow by the
    Tissues) §Angiotensin II: “it normally acts on many of the arterioles of the body at the same time
    to increase the total peripheral resistance, thereby increasing the arterial pressure.”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.19 (Dominant Role of the Kidney in Long-Term Pressure
    Control) §Rapidity and Intensity of the Vasoconstrictor Response: “Constriction of the arterioles
    increases the total peripheral resistance, thereby raising the arterial pressure”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.24 (Circulatory Shock and Physiology of Its Treatment)
    §Nonprogressive Shock—Compensated Shock: “Formation of angiotensin by the kidneys, which constricts
    the peripheral arteries”'
  angiotensin_II->water_intake:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.28 (Regulation of Extracellular Fluid Osmolarity and
    Sodium Concentration) §Stimuli for Thirst: “A third important stimulus for thirst is angiotensin II.
    Studies in animals have shown that angiotensin II acts on the subfornical organ”'
  anp->sodium_excretion:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.27 (Urine Formation by the Kidneys: II. Tubular Reabsorption
    and Secretion) §Atrial Natriuretic Peptide Decreases Sodium and Water Reabsorption: “Increased levels
    of this peptide in turn inhibit the reabsorption of sodium and water by the renal tubules... This
    decreased sodium and water reabsorption increases urinary excretion”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.29 (Renal Regulation of Potassium, Calcium, Phosphate,
    and Magnesium; Integration of Renal Mechanisms for Control of Blood Volume and Extracellular Fluid
    Volume) §Role of Atrial Natriuretic Peptide: “These combined actions of ANP lead to increased excretion
    of salt and water”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.74 (Introduction to Endocrinology) §Table 74-1 (Heart):
    “Atrial natriuretic peptide (ANP) Increases sodium excretion by kidneys, reduces blood pressure”'
  antithrombin->thrombin:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.36 (Hemostasis and Blood Coagulation) §Antithrombin
    Action of Fibrin and Antithrombin III: “the thrombin... soon combines with antithrombin III, which
    further blocks the effect of the thrombin... and then also inactivates the thrombin itself”'
  arterial_compliance->pulse_pressure:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.15 (Vascular Distensibility and Functions of the Arterial
    and Venous Systems) §Arterial Pressure Pulsations: “the less the compliance of the arterial system,
    the greater the rise in pressure for a given stroke volume of blood pumped into the arteries”'
  arterial_pco2->arterial_ph:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.30 (Regulation of Acid-Base Balance) §Respiratory
    Regulation of Acid-Base Balance: “decreased ventilation increases CO2, thus also increasing H+ concentration
    in the extracellular fluid.”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.40 (Transport of Oxygen and Carbon Dioxide in Blood
    and Tissue Fluids) §Change in Blood Acidity During Carbon Dioxide Transport: “The carbonic acid formed
    when carbon dioxide enters the blood in the peripheral tissues decreases the blood pH”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.41 (Regulation of Respiration) §Carbon Dioxide Stimulates
    the Chemosensitive Area: “it reacts with the water of the tissues to form carbonic acid, which dissociates
    into hydrogen and bicarbonate ions”'
  arterial_pco2->chemoreceptor_drive:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.41 (Regulation of Respiration) §Carbon Dioxide Stimulates
    the Chemosensitive Area: “respiratory center activity is increased very strongly by changes in blood
    carbon dioxide”'
  arterial_pco2->hemoglobin_o2_saturation:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.40 (Transport of Oxygen and Carbon Dioxide in Blood
    and Tissue Fluids) §The Bohr Effect: “an increase in carbon dioxide in the blood causes oxygen to
    be displaced from the hemoglobin (the Bohr effect)”'
  arterial_pco2->plasma_bicarbonate:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.30 (Regulation of Acid-Base Balance) §Table 30-2 /
    Henderson-Hasselbalch: “the bicarbonate concentration is regulated mainly by the kidneys, whereas
    the PCO2 in extracellular fluid is controlled by the rate of respiration.”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.40 (Transport of Oxygen and Carbon Dioxide in Blood
    and Tissue Fluids) §Transport of Carbon Dioxide in the Form of Bicarbonate Ion: “The dissolved carbon
    dioxide in the blood reacts with water to form carbonic acid...dissociates into hydrogen and bicarbonate
    ions (H+ and HCO3-)”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.41 (Regulation of Respiration) §Decreased Stimulatory
    Effect of Carbon Dioxide After the First 1 to 2 Days: “The kidneys achieve this by increasing the
    blood bicarbonate, which binds with the hydrogen ions in the blood and cerebrospinal fluid”'
  arterial_ph->cellular_potassium_uptake:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.29 (Renal Regulation of Potassium, Calcium, Phosphate,
    and Magnesium; Integration of Renal Mechanisms for Control of Blood Volume and Extracellular Fluid
    Volume) §Acid-Base Abnormalities Can Cause Changes in Potassium Distribution: “one effect of increased
    hydrogen ion concentration is to reduce the activity of the sodium-potassium adenosine triphosphatase
    (ATPase) pump. This in turn decreases cellular uptake of potassium”'
  arterial_ph->chemoreceptor_drive:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.30 (Regulation of Acid-Base Balance) §Increased Hydrogen
    Ion Concentration Stimulates Alveolar Ventilation: “the alveolar ventilation rate increases four to
    five times normal as the pH decreases from the normal value of 7.4 to the strongly acidic value of
    7.0.”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.41 (Regulation of Respiration) §Excitation of the
    Chemosensitive Neurons by Hydrogen Ions: “The sensor neurons in the chemosensitive area are especially
    excited by hydrogen ions; in fact, it is believed that hydrogen ions may be the only important direct
    stimulus”'
  arterial_ph->hemoglobin_o2_saturation:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.40 (Transport of Oxygen and Carbon Dioxide in Blood
    and Tissue Fluids) §Factors That Shift the Dissociation Curve: “when the blood becomes slightly acidic,
    with the pH decreasing from the normal value of 7.4 to 7.2, the oxygen-hemoglobin dissociation curve
    shifts...to the right”'
  arterial_ph->plasma_bicarbonate:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.30 (Regulation of Acid-Base Balance) §Renal Correction
    of Alkalosis: “the HCO3- that cannot react with H+ is not reabsorbed and is excreted in the urine.
    This results in a decrease in plasma HCO3- concentration”'
  arterial_po2->arterial_o2_content:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.40 (Transport of Oxygen and Carbon Dioxide in Blood
    and Tissue Fluids) §Transport of Oxygen in the Dissolved State: “At the normal arterial Po2 of 95
    mm Hg, about 0.29 milliliter of oxygen is dissolved in every 100 milliliters of water in the blood”'
  arterial_po2->chemoreceptor_drive:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.18 (Nervous Regulation of the Circulation, and Rapid
    Control of Arterial Pressure) §Control of Arterial Pressure by the Carotid and Aortic Chemoreceptors:
    “the chemoreceptors become stimulated because diminished blood flow causes decreased oxygen as well
    as excess buildup of carbon dioxide and hydrogen ions”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.41 (Regulation of Respiration) §Stimulation of the
    Chemoreceptors by Decreased Arterial Oxygen: “When the oxygen concentration in the arterial blood
    falls below normal, the chemoreceptors become strongly stimulated.”'
  arterial_po2->hemoglobin_o2_saturation:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.40 (Transport of Oxygen and Carbon Dioxide in Blood
    and Tissue Fluids) §Oxygen-Hemoglobin Dissociation Curve: “demonstrates a progressive increase in
    the percentage of hemoglobin bound with oxygen as blood Po2 increases”'
  baroreceptor_firing_rate->parasympathetic_tone:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.18 (Nervous Regulation of the Circulation, and Rapid
    Control of Arterial Pressure) §Circulatory Reflex Initiated by the Baroreceptors: “secondary signals
    inhibit the vasoconstrictor center of the medulla and excite the vagal parasympathetic center.”'
  baroreceptor_firing_rate->sympathetic_tone:
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.18 (Nervous Regulation of the Circulation, and Rapid
    Control of Arterial Pressure) §Circulatory Reflex Initiated by the Baroreceptors: “After the baroreceptor
    signals have entered the tractus solitarius of the medulla, secondary signals inhibit the vasoconstrictor
    center of the medulla”'
  - 'Guyton & Hall, Medical Physiology, 11th ed. Ch.24 (Circulatory Shock and Physiology of Its Treatment)
    §Sympathetic Reflex Compensations in Shock: “These reflexes stimulate the sympathetic vasoconstrictor
