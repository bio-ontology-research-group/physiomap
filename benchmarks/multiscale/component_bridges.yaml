- source: plasma_lysine
  target: endothelial_no_production
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: L-lysine and L-arginine are both cationic amino acids that compete for the cationic amino acid transporter CAT1 (SLC7A1), which mediates arginine uptake into endothelial cells to supply eNOS substrate. Elevated plasma lysine competitively inhibits arginine transport into endothelium, reducing the intracellular arginine available for eNOS → reduced NO production. This is the mechanism underlying the 'arginine-lysine competition'. In hyperlysinemia (AASS/LKRSDH LoF), elevated plasma lysine reduces endothelial arginine bioavailability and NO production. do(AASS LoF) → plasma lysine ↑ → CAT1 arginine transport ↓ → endothelial NO ↓.
  evidence: 'Hyperlysinemia OMIM 238700 (AASS deficiency); Closs EI et al., Arterioscler Thromb Vasc Biol 2004 (CAT1/SLC7A1 mediates arginine and lysine transport into endothelial cells; competition between cationic amino acids); Bhatta A et al., Physiol Res 2011 (lysine competes with arginine at the cationic transporter affecting endothelial NOS). | intervention: do(AASS loss-of-function) — hyperlysinemia OMIM 238700; do(high-lysine diet/supplementation) — pharmacological increase in plasma lysine [citations PubMed-verified]'
- source: glutathione_synthetase_activity
  target: endothelial_no_production
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: Glutathione synthetase (GSS) produces glutathione (GSH), the primary intracellular antioxidant. GSH maintains the eNOS cofactor tetrahydrobiopterin (BH4) in its reduced, active form by reducing BH4 radicals generated during the eNOS catalytic cycle; GSH also prevents oxidation of the eNOS zinc-thiolate cluster required for enzyme dimerization. When GSH is depleted (GSS LoF), BH4 is oxidized to BH2, causing eNOS uncoupling (eNOS generates superoxide instead of NO), markedly reducing endothelial NO production. do(GSS LoF) → glutathione ↓ → BH4 oxidized → eNOS uncoupling → endothelial NO ↓.
  evidence: 'Glutathione synthetase deficiency OMIM 266130; Gao L et al., Arterioscler Thromb Vasc Biol 2009 (GSH maintains eNOS coupling via BH4 protection); Zweier JL et al., Circ Res 2011 (eNOS uncoupling mechanism in oxidative stress — BH4 and zinc thiolate); Lehninger Principles of Biochemistry (glutathione as antioxidant; reduction of disulfides). | intervention: do(GSS loss-of-function) — glutathione synthetase deficiency OMIM 266130; do(GCLC loss-of-function) — gamma-glutamylcysteine synthetase deficiency OMIM 230450 [citations PubMed-verified]'
- source: plasma_arginine
  target: endothelial_no_production
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: L-arginine is the obligate substrate for endothelial NO synthase (eNOS/NOS3); eNOS oxidizes arginine to citrulline + NO. Under conditions where plasma arginine is elevated (as in hyperargininemia, ARG1 LoF), endothelial CAT1-mediated arginine uptake is enhanced, increasing the intracellular arginine pool available to eNOS, and NO production rises. The 'arginine paradox' demonstrates that even at normal plasma concentrations eNOS is substrate-limited due to intracellular compartmentation, so elevated plasma arginine (hyperargininemia) further augments eNOS activity. do(ARG1 LoF) → plasma arginine ↑ → endothelial arginine uptake ↑ → eNOS substrate ↑ → NO production ↑.
  evidence: 'Hyperargininemia (argininemia) OMIM 207800 (ARG1 deficiency — elevated plasma and CSF arginine); Tousoulis D et al., Int J Cardiol 2012 (L-arginine supplementation increases endothelial NO production); Closs EI et al., Arterioscler Thromb Vasc Biol 2004 (arginine transport into endothelium via CAT1/SLC7A1 is rate-limiting for eNOS; arginine paradox); Bode-Boger SM et al., Pharmacol Ther 2007 (arginine as eNOS substrate; elevated arginine augments NO synthesis); Lehninger Principles of Biochemistry (arginine → citrulline + NO by NOS). | intervention: do(ARG1 loss-of-function) — hyperargininemia / argininemia OMIM 207800 [citations PubMed-verified]'
- source: cystathionine_gamma_lyase_activity
  target: endothelial_no_production
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: Cystathionine gamma-lyase (CTH / cystathionase) is the principal vascular enzyme for endogenous hydrogen sulfide (H2S) production from cystathionine and cysteine. Vascular H2S activates eNOS (NOS3) by (i) S-sulfhydrating eNOS at Cys443, stabilizing its active conformation; (ii) activating the PI3K/Akt pathway that phosphorylates eNOS at Ser1177; and (iii) preventing eNOS S-glutathionylation-induced uncoupling. Multiple genetic and pharmacological studies show that CTH LoF reduces vascular H2S and impairs eNOS-derived NO production. do(CTH LoF) → H2S ↓ → eNOS activation ↓ → endothelial NO production ↓.
  evidence: 'Yang G et al., Science 2008 (CTH is the major vascular H2S synthase; CTH−/− mice show reduced NO production and hypertension — PMID 18948540); Coletta C et al., Proc Natl Acad Sci 2012 (H2S activates eNOS via PI3K/Akt-Ser1177 phosphorylation); Citi V et al., Br J Pharmacol 2018 (CTH-derived H2S maintains eNOS coupling); Cystathioninuria OMIM 219500 (CTH LoF); Lehninger Principles of Biochemistry (transsulfuration: cystathionine → CTH → cysteine + alpha-ketobutyrate + H2S/NH3). | intervention: do(CTH loss-of-function) — cystathioninuria OMIM 219500; pharmacological CTH inhibition [citations PubMed-verified]'
- source: asl_activity
