- source: sod3_ecm_anchoring
  target: endothelial_no_production
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: SOD3/EC-SOD is anchored in the vascular extracellular matrix and pericellular space via its C-terminal heparin-binding domain; this localization positions SOD3 at the endothelial surface where it scavenges superoxide before it can react with NO (forming peroxynitrite) or impair eNOS activity. When ECM anchoring is intact (sod3_ecm_anchoring high), SOD3 protects endothelial NO from superoxide-mediated destruction, sustaining endothelial NO production. Reduced ECM anchoring (e.g. SOD3 p.R231G LoF variant) releases SOD3 into plasma but depletes vascular-wall-bound SOD3, increasing local O2-radical levels that quench NO and impair shear-stress-induced eNOS activation. do(sod3_ecm_anchoring decreased) -> less vascular SOD3 -> more endothelial superoxide -> lower NO bioavailability and endothelial_no_production falls.
  evidence: 'Circulation Research 2004 (10.1161/01.res.0000092140.81594.a8, Extracellular Superoxide Dismutase Is a Major Determinant of Nitric Oxide Bioavailability): EC-SOD is the principal superoxide scavenger protecting endothelial NO; PMC3376381 (Role of Vascular Extracellular Superoxide Dismutase in Hypertension): SOD3 deletion increases vascular O2- and reduces NO in vessels; PMC3757697 (Extracellular but not cytosolic SOD protects against oxidant-mediated endothelial dysfunction): ecSOD specifically prevents endothelial dysfunction; PMC8058336 (SOD3 p.R231G reduces heparan sulfate affinity and redistributes SOD3 from ECM to plasma). intervention: do(sod3_ecm_anchoring decreased via p.R231G or ECM-binding LoF) -> vascular-wall SOD3 depleted -> superoxide accumulates at endothelium -> eNOS uncoupling and reduced NO production. | intervention: do(SOD3 ECM-anchoring loss-of-function, e.g. p.R231G variant reducing heparan sulfate binding)'
- source: plasma_homocysteine
  target: endothelial_no_production
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: 'Elevated plasma homocysteine (hyperhomocysteinaemia) inhibits endothelial nitric oxide production via three convergent mechanisms: (1) oxidative stress — homocysteine auto-oxidises to generate superoxide and peroxynitrite that scavenge NO and oxidise eNOS sulfhydryl groups, uncoupling the enzyme; (2) ADMA accumulation — homocysteine inhibits DDAH (dimethylarginine dimethylaminohydrolase), allowing ADMA (an endogenous eNOS inhibitor) to accumulate; (3) arginine transport impairment — homocysteine downregulates CAT-1 transporter expression, limiting L-arginine supply to eNOS. All three mechanisms converge on reduced eNOS activity and NO production. In CBS deficiency (classic homocystinuria, OMIM 236200), severe hyperhomocysteinaemia causes premature endothelial dysfunction and thromboembolism via NO deficiency.'
  evidence: 'PubMed 10997917 (Tyagi et al. Am J Physiol Renal Physiol 2000): ''concentrations of homocysteine >20 µM produce a significant indirect suppression of eNOS activity''; homocysteine-induced superoxide and peroxynitrite reversed by SOD mimetic. PMC4400833 (Tawfik et al. 2015, ''Hyperhomocystinemia Impairs Endothelial Function and eNOS Activity via PKC Activation''): decreased eNOS protein expression and increased Thr495 phosphorylation. PubMed 17622691 (Stühlinger et al. 2007, ''Homocysteine induces endothelial dysfunction via inhibition of arginine transport''). Frontiers Cardiovasc Med 2022, doi:10.3389/fcvm.2022.1109445 (''Mechanism of homocysteine-mediated endothelial injury and its consequences for atherosclerosis''). CBS deficiency OMIM 236200. | intervention: do(CBS LoF, homocystinuria OMIM 236200) -> plasma_homocysteine UP -> endothelial_no_production DOWN -> endothelial dysfunction, thromboembolism [citations PubMed-verified]'

