- source: telomere_length
  target: erythroblast_proliferation
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: 'Critically short telomeres in haematopoietic progenitors activate the ATM/ATR-p53-p21 DNA-damage checkpoint, inducing replicative senescence or apoptosis and halting cell division. Longer telomeres allow more cell divisions before this checkpoint is engaged, supporting sustained erythroblast proliferation in bone marrow. Telomeropathies (dyskeratosis congenita: DKC1, TERT, TERC mutations) manifest as aplastic anaemia precisely because shortened telomeres exhaust erythroblast and other haematopoietic progenitor replicative capacity.'
  evidence: 'Alter BP et al 2009 Ann Intern Med 150:529-537 — dyskeratosis congenita (telomere disease) causes bone marrow failure due to exhausted haematopoietic progenitor replicative capacity; Ball SE et al 1998 Br J Haematol 103:990-996 — erythroid progenitors from DC patients show shortened telomeres and reduced colony formation; Armanios M & Blackburn EH 2012 Nat Rev Genet 13:693-704 — telomere length is a limiting factor for haematopoietic stem/progenitor proliferative reserve. | intervention: do(telomere_length -) — dyskeratosis congenita (TERT/TERC/DKC1 LoF) causes pancytopenia including aplastic anaemia from failed erythroblast proliferation (OMIM 127550); do(telomere_length +) — danazol-mediated TERT upregulation in telomeropathy patients partially rescues haematopoietic progenitor proliferation (Townsley DM et al 2016 NEJM 374:1922). [citations PubMed-verified]'
- source: cardiomyocyte_intracellular_sodium
  target: cytosolic_calcium_transient
  sign: +
  causal_evidence: pharmacological
  mechanism: 'The sarcolemmal Na+/Ca2+ exchanger (NCX1) operates electrogenically: in forward mode it extrudes 1 Ca2+ per cycle by importing 3 Na+. When cardiomyocyte intracellular [Na+] rises, the inward Na+ driving force for NCX is reduced, impairing Ca2+ efflux; this raises SR Ca2+ load and increases the amplitude of the cytosolic Ca2+ transient during systole (positive inotropy). This is the molecular mechanism of cardiac glycosides (digoxin): inhibiting Na+/K+-ATPase → [Na+]i rises → NCX Ca2+ efflux decreases → Ca2+ transient increases → stronger contraction.'
  evidence: 'Bers DM 2002 Nature 415:198-205 — quantitative analysis of NCX-mediated Ca2+ extrusion: rising [Na+]i slows NCX forward mode, increasing SR Ca2+ load and systolic Ca2+ transient; Bhatt DL et al and Digitalis Investigation Group 1997 NEJM 336:525 — digoxin (Na/K-ATPase inhibitor) raises [Na+]i, increases Ca2+ transient, positive inotropy; Sipido KR et al 1997 Circ Res 81:1174 — elevated [Na+]i in heart failure directly linked to reduced NCX efflux and elevated systolic Ca2+ transient amplitude. | intervention: do(cardiomyocyte_intracellular_sodium +) — digoxin (Na+/K+-ATPase inhibitor) raises [Na+]i, reducing NCX Ca2+ efflux, increasing cytosolic Ca2+ transient and contractility; do(cardiomyocyte_intracellular_sodium -) — ranolazine (late Na+ current inhibitor) lowers [Na+]i, reducing Ca2+ overload and Ca2+ transient amplitude. [citations PubMed-verified]'
- source: hgd_activity
  target: osteoclast_activity
  sign: '-'
  causal_evidence: genetic_lof_gof
  mechanism: Homogentisate 1,2-dioxygenase (HGD) cleaves homogentisic acid (HGA) in the tyrosine catabolism pathway. HGD deficiency (alkaptonuria, OMIM 203500) causes 100-fold elevation of plasma HGA, which polymerizes and deposits as a melanin-like pigment in cartilage, subchondral bone, and tendon (ochronosis). The ochronotic pigment deposits in bone microenvironment activate osteoclastogenesis through enhanced RANKL signalling, oxidative stress, and altered Wnt/beta-catenin signalling in osteoblasts, leading to enhanced osteoclast bone-resorption activity (osteolytic lesions, osteoporosis observed in AKU patients). Do(HGD LoF) -> HGA accumulates -> ochronotic deposits -> enhanced osteoclastogenesis -> osteoclast_activity increases. HGD active -> HGA cleared -> no ochronotic deposits -> normal osteoclast activity.
  evidence: 'Alkaptonuria (HGD; OMIM 203500); Taylor et al., Am J Pathol 2017 (Mechanisms of Enhanced Osteoclastogenesis in Alkaptonuria); Ranganath et al., Ann Rheum Dis 2016 (PMC5188995): ''alkaptonuria — severe osteoclastic resorption and altered bone-remodelling biomarkers''; Alkaptonuria — GeneReviews NBK1454: ''resorption of subchondral bone and severe osteoarthropathy''; Saudubray, Inborn Metabolic Diseases (alkaptonuria, HGD). Intervention: do(HGD loss-of-function, alkaptonuria, OMIM 203500). | intervention: genetic LoF of HGD (homogentisate 1,2-dioxygenase; alkaptonuria, OMIM 203500) [citations PubMed-verified]'
