  mechanism: Argininosuccinate lyase (ASL) cleaves argininosuccinate -> arginine + fumarate (urea cycle step 4). ASL is the sole route of endogenous arginine de novo synthesis. Arginine is the obligate substrate for all NOS isoforms including eNOS/NOS3. ASL deficiency (argininosuccinic aciduria, OMIM 207900) causes systemic arginine deficiency AND disrupts the ASL-ASS1-eNOS multi-protein complex, impairing eNOS-dependent NO production. do(ASL LoF) -> endothelial NO production falls; do(ASL GOF / higher activity) -> more arginine -> more eNOS substrate -> more NO.
