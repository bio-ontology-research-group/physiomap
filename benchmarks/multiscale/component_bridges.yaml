# CB-BIO-006 — reviewed component-bridge integration (2026-07-18 component-bridges swarm,
# review/reviewed-plan.json). Osteoblast activity -> tissue-nonspecific (bone) ALP/TNAP activity;
# curated_mechanistic, grade B. This is osteoblast differentiation/function upregulating ALPL/TNAP
# expression and activity, NOT a generic total-serum-ALP biomarker association. Target is the ALPL
# (TNAP) isozyme node tissue_nonspecific_alp_activity (PR:000003968), so the liver/intestinal/placental
# total-ALP confound does not apply. Defensibly a production/expression relation — flagged for
# maintainer typing review.
- source: osteoblast_activity
  target: tissue_nonspecific_alp_activity
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: 'Osteoblast differentiation and bone-forming (anabolic) activity upregulates ALPL transcription and the membrane-anchored tissue-nonspecific alkaline phosphatase (TNAP) that osteoblasts express as a differentiation / bone-formation marker; this is the osteoblast SOURCE of the bone TNAP enzyme-activity fraction. It is NOT a generic total-serum-ALP biomarker association — the target tissue_nonspecific_alp_activity is the ALPL/TNAP isozyme (PR:000003968), so the liver/intestinal/placental total-ALP confound does not apply. RUNX2/BMP2 induce ALPL during osteoblast differentiation (RUNX2 loss abolishes ALPL expression). The effect feeds the existing island edge tissue_nonspecific_alp_activity -(+)-> alkaline_phosphatase.'
  evidence: 'Curated osteoblast-differentiation mechanism (evidence grade B). Endpoint: osteoblast-expressed tissue-nonspecific alkaline phosphatase (TNAP/ALPL) catalytic activity, bone fraction. Intervention/support: anabolic osteoblast stimulation — teriparatide / PTH raises osteoblast number and activity and bone-specific TNAP (StatPearls NBK559248; teriparatide marked-ALP-rise case reports PMC7333273); RUNX2/BMP2 transcriptional induction of ALPL as a canonical osteoblast-differentiation gene, with RUNX2 loss abolishing ALPL expression (Komori RUNX2 reviews); antiresorptives lower bone turnover and bone ALP — mechanistically distinct interventions moving TNAP the same direction. Context: human bone anabolic/antiresorptive therapy and osteoblast-differentiation biology; ALPL (TNAP) isozyme, bone fraction. TYPING NOTE: defensibly a production/expression relation (osteoblast expresses its own TNAP); authored as causal + because osteoblast_activity is a rate node — flagged for maintainer. | intervention: osteoblast differentiation / anabolic stimulation, do(osteoblast_activity up) -> tissue-nonspecific ALP (ALPL/TNAP) activity up'
