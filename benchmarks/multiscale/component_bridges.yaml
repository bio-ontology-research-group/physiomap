  evidence: 'Lehninger Principles of Biochemistry (folate coenzymes in one-carbon metabolism and thymidylate synthesis); Harrison''s ''Folate deficiency and megaloblastic anemia''; GeneReviews FOLR1 / OMIM 613068 (cerebral folate transport deficiency); Lucock M Mol Genet Metab 2000 (folate-dependent thymidylate synthesis in proliferating cells). | intervention: do(plasma folate / 5-MTHF deficiency, as in dietary folate deficiency or FOLR1 LoF)'
