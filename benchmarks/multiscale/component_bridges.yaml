  causal_evidence: genetic_lof_gof
  mechanism: 'Methylcobalamin is the obligatory cofactor for methionine synthase (MTR). In cobalamin deficiency (or TCN2/cblC/cblF LoF), folate becomes trapped as 5-methyltetrahydrofolate (''methyl-folate trap''), blocking de novo thymidylate and purine synthesis. Erythroblasts, with their rapid proliferation and high DNA-synthesis demand, are the principal victims: impaired thymidylate synthesis leads to uracil misincorporation, DNA double-strand breaks, and erythroblast apoptosis — producing megaloblastic anemia (ineffective erythropoiesis). do(methylcobalamin deficiency) → erythroblast proliferation rate decreases.'
  evidence: 'Harrison''s Principles of Internal Medicine ''Megaloblastic Anemias''; Scott JM & Weir DG Blood 1981; Stover PJ PNAS 2017 (folate rescues B12-depletion-induced thymidylate synthesis inhibition); Lahner E et al. Ann Hematol 2025 (MTHFR/B12); OMIM 275350 (TCN2 deficiency — functional intracellular B12 deficiency despite normal serum B12 → megaloblastic anemia). | intervention: do(methylcobalamin deficiency, as in TCN2 LoF or nutritional B12 deficiency) [citations PubMed-verified]'
- source: plasma_5_methyltetrahydrofolate
