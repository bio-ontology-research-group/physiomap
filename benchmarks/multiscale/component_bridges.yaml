- source: umps_activity
  target: erythroid_progenitor_proliferation
  sign: +
  causal_evidence: genetic_lof_gof
  mechanism: UMPS (UMP synthase) catalyses the last two steps of de novo pyrimidine biosynthesis (orotate -> OMP -> UMP), providing the UMP precursor for all pyrimidine nucleotides (UTP, CTP, dTTP). UMP is essential for DNA synthesis in rapidly dividing erythroid progenitors. UMPS deficiency (hereditary orotic aciduria, OMIM 258900) blocks de novo pyrimidine synthesis, causing UMP/pyrimidine nucleotide deficiency in erythroid progenitors; impaired DNA synthesis leads to megaloblastic changes, nuclear-cytoplasmic asynchrony, intramedullary apoptosis, and megaloblastic anemia (severely impaired erythroid progenitor proliferation and maturation). Higher UMPS activity ensures adequate UMP supply for erythroid progenitor DNA synthesis.
