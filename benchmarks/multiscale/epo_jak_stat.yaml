# =============================================================================
# Multi-scale: EPO receptor -> JAK2/STAT5 erythropoiesis     *** DRAFT FOR REVIEW ***
# =============================================================================
# A molecular/subcellular signal-transduction vertical giving the mechanistic basis
# for the EPO -> red-cell-mass arm of the existing EPO/hematology system. Encodes the
# canonical type-I cytokine-receptor cascade for erythropoiesis:
#
#   WITHIN-SCALE CAUSAL (subcellular signal transduction in erythroid progenitors):
#       erythropoietin (boundary, organ_system)              # circulating EPO ligand
#         -> epo_receptor_activity                            # Epo-bound, dimerized EpoR
#         -> jak2_activity                                    # receptor-associated JAK2 trans-/autophosphorylation
#         -> stat5_activity                                   # JAK2 phosphorylates STAT5 -> nuclear pSTAT5
#         -> erythroid_progenitor_proliferation               # STAT5 transcriptional survival/proliferation program
#       stat5_activity -> socs_activity -> jak2_activity (-)   # SOCS negative-feedback loop
#       stat5_activity -> bcl_xl_level -> erythroid_progenitor_proliferation (+)  # anti-apoptotic survival
#
#   CROSS-SCALE CONSTITUTIVE (part_of + determination; NOT causal):
#       erythroid_progenitor_proliferation (cellular) >> red_cell_mass (organ_system)
#
# Feedback: pSTAT5 transcribes SOCS proteins (CIS/SOCS1/SOCS3) which bind JAK2/EpoR and
# accelerate receptor degradation -> JAK2 activity down. Correct net steady-state response
# of jak2/stat5 to sustained EPO needs loop-aware comparative statics (this SOCS brake is
# why the JAK-STAT response is transient/adaptive, not the naive forward sign).
#
# SOURCES (verified against BioModels + textbook):
#   - BioModels BIOMD0000000271  Becker2010_EpoR_CoreModel
#       Becker, Schilling, Bachmann, Baumann, Raue, Maiwald, Timmer & Klingmüller (2010)
#       "Covering a broad dynamic range: information processing at the erythropoietin
#       receptor." Science 328:1404-1408. PubMed 20488988.
#       -> Epo binds EpoR, receptor activation, ligand depletion / receptor turnover.
#   - BioModels BIOMD0000001077  Adlung2021 - Cell-to-cell variability in JAK2/STAT5
#       Adlung, Stapor, Tönsing, Schmiester, Schwarzmüller, Postawa, Wang, Timmer,
#       Klingmüller, Hasenauer & Schilling (2021) "Cell-to-cell variability in JAK2/STAT5
#       pathway components and cytoplasmic volumes defines survival threshold in erythroid
#       progenitor cells." Cell Reports 36:109507. PubMed 34380040.
#       -> EpoR -> JAK2 -> STAT5 cascade controls erythroid progenitor survival/proliferation.
#   - Boron & Boulpaep, Medical Physiology (hematopoiesis / erythropoiesis): EPO produced
#       by renal interstitial cells acts on EpoR-bearing CFU-E/erythroid progenitors via
#       JAK2/STAT5, driving proliferation and survival (Bcl-xL) -> expansion of the
#       erythroid lineage -> increased red cell mass. SOCS proteins terminate signaling.
#
# BOUNDARY NODES (existing-map ids, NOT redefined here):
#   erythropoietin, red_cell_mass
# =============================================================================
# NOTE (integration fix): the downward macro->micro causal 'driver' edge was REMOVED.
# PhysioMap models causation WITHIN scale and cross-scale dependence as CONSTITUTIVE
# (upward determination) only (see MULTISCALE.md). This vertical's top molecular node is
# therefore a root, exercised by molecular/drug interventions, and lifts UP via the
# constitutive edge(s). This keeps the combined causal+constitutive meta-graph acyclic.

