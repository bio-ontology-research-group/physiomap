# =============================================================================
# Cellular scale: innate-adaptive immune paracrine loop   *** DRAFT FOR REVIEW ***
# =============================================================================
# Cell-cell (cytokine) communication among three immune cell populations, lifted onto
# the EXISTING systemic-inflammation nodes (tnf_alpha, il6).
#
#   CELL TYPES (cellular-scale nodes):
#     dendritic_cell_activation        CL:0000451  conventional dendritic cell
#     th1_cell_activation              CL:0000545  T-helper 1 cell
#     th17_cell_activation             CL:0000899  T-helper 17 cell
#     macrophage_activation            CL:0000235  macrophage (M1 / classical)
#     treg_il10_secretion              CL:0000815  regulatory T cell (IL-10 source)
#
#   CELL-CELL CYTOKINE SIGNALS (within-cellular CausalEdges; sign = d(target cell
#   quality)/d(source cell signal) at steady state). Ligand->receptor verified in
#   OmniPath intercell (consensus_stimulation=True for the receptor engagement):
#     dendritic IL-12 (IL12A/IL12B -> IL12RB1/IL12RB2)  -> Th1 activation        (+)
#     Th1 IFN-gamma  (IFNG -> IFNGR1/IFNGR2)            -> macrophage classical  (+)
#     macrophage IL-6 (IL6 -> IL6R/IL6ST)              -> Th17 activation        (+)
#     macrophage IL-1/TNF (TNF -> TNFRSF1A)            -> dendritic activation   (+)  (feed-forward / amplification)
#     Treg IL-10 (IL10 -> IL10RA/IL10RB)               -> macrophage activation  (-)  (anti-inflammatory)
#   This forms a positive amplification loop (DC -> Th1 -> Mphi -> DC) restrained by
#   the IL-10 negative arm.
#
#   UPWARD CONSTITUTIVE LIFT (part_of + determination; cellular -> EXISTING organ_system):
#     macrophage_activation  >> tnf_alpha (+)
#     macrophage_activation  >> il6       (+)
#   (M1 macrophages are the principal tissue source of secreted TNF-alpha and IL-6.)
#
#   SOURCES:
#     - OmniPath intercell / ligand-receptor (is_stimulation/consensus signs):
#       IL12A-IL12RB1/RB2, IFNG-IFNGR1/IFNGR2, TNF-TNFRSF1A, IL6-IL6R/IL6ST,
#       IL10-IL10RA/IL10RB  (https://omnipathdb.org/interactions).
#     - Murray PJ & Wynn TA, Nat Rev Immunol 2011;11:723-737 (PMID:21997792) macrophage activation.
#     - Janeway's Immunobiology (Murphy & Weaver), 9th ed., ch. 9 & 11 (Th differentiation, macrophage activation).
# =============================================================================

name: immune_paracrine_multiscale

nodes:
- id: dendritic_cell_activation
  label: dendritic cell activation / IL-12 secretion rate
  scale: cellular
  entity_iri: GO:0001773                # myeloid dendritic cell activation
  quality_iri: PATO:0000161
  bearer_entity_iri: CL:0000451  # dendritic cell
- id: th1_cell_activation
  label: Th1 cell activation / IFN-gamma secretion rate
  scale: cellular
  entity_iri: CL:0000545                # T-helper 1 cell
  quality_iri: PATO:0002354             # activated
- id: th17_cell_activation
  label: Th17 cell activation / IL-17 secretion rate
  scale: cellular
  entity_iri: CL:0000899                # T-helper 17 cell
  quality_iri: PATO:0002354             # activated
- id: macrophage_activation
  label: macrophage classical (M1) activation / pro-inflammatory cytokine secretion
  scale: cellular
  entity_iri: GO:0042116                # macrophage activation
  quality_iri: PATO:0000161
  bearer_entity_iri: CL:0000235  # macrophage
- id: treg_il10_secretion
  label: regulatory T cell IL-10 secretion rate
  scale: cellular
