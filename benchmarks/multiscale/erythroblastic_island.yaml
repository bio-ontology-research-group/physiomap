  label: erythroblastic-island central (nurse) macrophage support activity
  scale: cellular
  entity_iri: CL:0000235
  quality_iri: PATO:0000161
- id: erythroblast_proliferation
  label: erythroblast proliferation rate
  scale: cellular
  entity_iri: CL:0000765
  quality_iri: PATO:0000161
- id: erythroblast_maturation
  label: erythroblast terminal maturation / enucleation rate
  scale: cellular
