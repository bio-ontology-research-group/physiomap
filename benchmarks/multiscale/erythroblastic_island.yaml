causal_edges:
- source: island_macrophage_activity
  target: erythroblast_proliferation
  sign: +
  causal_evidence: perturbation
  mechanism: 'paracrine/juxtacrine: macrophage membrane-bound SCF (KITLG) engages erythroblast
    KIT receptor tyrosine kinase (quality: macrophage support activity -> disposition:
    KITLG presentation + VCAM1 adhesion -> process: KIT signaling, GO:0038109 KIT-signaling-pathway
    -> quality: erythroblast proliferation rate)'
  evidence: 'Interventional: erythroblasts in direct macrophage contact proliferate ~3-fold more than progenitors cultured alone (EPO-independent, altered G0/G1 transit), and chemical depletion of splenic macrophages prevents the appropriate erythroid response to bleeding — do(macrophage support up/down) shifts erythroblast proliferation. Chasis & Mohandas (2008) Blood 112:470-478, PMID 18650462 (full text). OmniPath ligrec KITLG->KIT is_stimulation=True, PMID 7680037; Manwani & Bieker (2008) Curr Top Dev Biol 82:23-53, PMID 18282516. Boron & Boulpaep, Medical Physiology. [citations PubMed-verified]'
- source: island_macrophage_activity
  target: erythroblast_maturation
  sign: +
  causal_evidence: perturbation
  mechanism: 'juxtacrine adhesion + iron handoff: macrophage VCAM1 binds erythroblast integrin
    alpha4-beta1 (VLA-4) anchoring the cell and supplying iron/ferritin for hemoglobinization
    (quality: macrophage support activity -> disposition: VCAM1-VLA4 adhesion + iron supply
    -> process: GO:0043249 erythrocyte maturation / enucleation -> quality: erythroblast maturation rate)'
  evidence: 'Interventional: macrophage depletion causes pro-erythroblast differentiation arrest, i.e. do(macrophage down) impairs terminal maturation/enucleation; macrophage contact (VCAM1-VLA4 adhesion, iron/ferritin handoff) supports hemoglobinization and enucleation. Chasis & Mohandas (2008) Blood 112:470-478, PMID 18650462 (full text). OmniPath ligrec VCAM1->ITGA4 is_stimulation=True; 22623428; Manwani & Bieker (2008) Curr Top Dev Biol 82:23-53, PMID 18282516. Boron & Boulpaep, Medical Physiology. [citations PubMed-verified]'
- source: erythroblast_proliferation
  target: island_macrophage_activity
  sign: +
  mechanism: 'juxtacrine feedback: expanding erythroblasts present ICAM4 to macrophage alphaV
    integrin, assembling/stabilizing the island and sustaining macrophage support (quality:
    erythroblast number/proliferation -> disposition: ICAM4-alphaV adhesion -> process: GO:0007157
    heterophilic cell-cell adhesion / island assembly -> quality: macrophage support activity)'
  evidence: 'OmniPath ligrec ICAM4->ITGAV is_stimulation=True, PMID 11435317 (15355350); Chasis & Mohandas (2008) Blood 112:470-478, PMID 18650462. Manwani & Bieker (2008) PMID 18282516. [citations PubMed-verified]'
- source: erythroblast_maturation
  target: island_macrophage_activity
  sign: +
  mechanism: 'erythroblast enucleation releases pyrenocytes (extruded nuclei) presenting
    phosphatidylserine, engaging macrophage clearance receptors that reinforce the nurse
    program (quality: erythroblast maturation/enucleation rate -> disposition: PS exposure +
    ICAM4-alphaV contact -> process: GO:0006911 phagocytosis of pyrenocytes -> quality: macrophage support activity)'
  evidence: 'Chasis & Mohandas (2008) Blood 112:470-478, PMID 18650462 (central macrophage ingests extruded nuclei); Manwani & Bieker (2008) Curr Top Dev Biol 82:23-53, PMID 18282516. [citations PubMed-verified]'
- source: erythroblast_proliferation
  target: erythroblast_maturation
  sign: +
  mechanism: 'lineage progression: a larger proliferating erythroblast pool feeds the terminal
    maturation/enucleation program (quality: erythroblast proliferation rate -> disposition:
    cell-cycle exit competence -> process: GO:0030218 erythrocyte differentiation -> quality:
    erythroblast maturation/enucleation rate)'
  evidence: 'Manwani & Bieker (2008) Curr Top Dev Biol 82:23-53, PMID 18282516; Boron & Boulpaep, Medical Physiology (erythroid precursors proliferate then mature/enucleate). [citations PubMed-verified]'
- source: island_macrophage_activity
  target: erythroid_progenitor_proliferation
  sign: +
  causal_evidence: perturbation
  mechanism: 'the central macrophage niche supports earliest erythroid progenitor (CFU-E)
    expansion via SCF/adhesion + iron provision (quality: macrophage support activity ->
    disposition: KITLG/VCAM1 presentation -> process: niche-supported progenitor survival/proliferation
    -> quality: erythroid progenitor proliferation rate)'
  evidence: 'Interventional: macrophage depletion reduces early (CFU-E) progenitor proliferation and causes differentiation arrest, i.e. do(macrophage down) impairs progenitor expansion. Chasis & Mohandas (2008) Blood 112:470-478, PMID 18650462 (full text; macrophage essential for erythroid expansion); Manwani & Bieker (2008) Curr Top Dev Biol 82:23-53, PMID 18282516. [citations PubMed-verified]'
production_edges:
- source: erythroblast_maturation
  target: red_cell_mass
  sign: +
  production_evidence: legacy-evidence-unclassified
