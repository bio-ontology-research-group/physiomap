# =============================================================================
# Cellular scale: Erythroblastic island (central macrophage <-> erythroblast)
#                                                          *** DRAFT FOR REVIEW ***
# =============================================================================
# The erythroblastic island is the anatomical/functional niche of terminal
# erythropoiesis: a central nurse macrophage surrounded by maturing erythroblasts.
# The macrophage anchors, feeds (iron) and supports erythroblasts; erythroblasts in
# turn signal back to the macrophage (adhesion + retention + final enucleation /
# pyrenocyte clearance). This module encodes that bidirectional cell-cell
# communication at the CELLULAR scale and ties the EPO/JAK-STAT erythropoiesis
# vertical (epo_jak_stat.yaml) to its physical niche.
#
# CELL TYPES (nodes):  quality determinable = PATO:0000161 'rate' (graded magnitude;
#   NOT PATO:0000161 'accumulation' (structural) nor PATO:0002354 'active' (a determinate
#   state value), per ontology audit 2026-06):
#   - island_macrophage_activity   central nurse macrophage support rate (CL:0000235)
#   - erythroblast_proliferation    erythroblast proliferation rate (CL:0000765)
#   - erythroblast_maturation       erythroblast enucleation / terminal maturation rate (CL:0000765)
#
# CELL-CELL SIGNALS (ligand -> receptor, OmniPath consensus_stimulation = +):
#   macrophage -> erythroblast:
#     VCAM1 (macrophage)  -> ITGA4/VLA-4 (erythroblast)   adhesion/retention (+)
#         OmniPath VCAM1->ITGA4 is_stimulation=True, PMID 11751331; 22623428
#     KITLG/SCF (macrophage, membrane) -> KIT (erythroblast)  survival/proliferation (+)
#         OmniPath KITLG->KIT is_stimulation=True, PMID 7680037
#   erythroblast -> macrophage:
#     ICAM4 (erythroblast) -> ITGAV/alphaV integrin (macrophage)  island assembly (+)
#         OmniPath ICAM4->ITGAV is_stimulation=True, PMID 11435317 (15355350)
#
# WITHIN-CELLULAR CAUSAL INTEGRATION (into EXISTING fine-scale cellular node):
#     island_macrophage_activity -> erythroid_progenitor_proliferation (+)
#         (the macrophage niche supports CFU-E/erythroid progenitor expansion)
#
# CROSS-SCALE CONSTITUTIVE LIFT (part_of + determination; NOT causal):
#     erythroblast_maturation (cellular) >> red_cell_mass (organ_system) (+)
#
# Bidirectional macrophage<->erythroblast edges form a CELLULAR SCC (the island as a
# positive-feedback adhesion/support unit), so net response to perturbing one cell
# requires loop-aware comparative statics, not forward propagation.
#
# (EPO hormonal input is a downward macro->micro influence and is NOT modeled here;
#  the macrophage node is a ROOT exercised by interventions.)
#
# SOURCES (verified):
#   - Manwani D, Bieker JJ (2008) "The erythroblastic island." Curr Top Dev Biol
#       82:23-53. PMID 18282516.
#   - Chasis JA, Mohandas N (2008) "Erythroblastic islands: niches for erythropoiesis."
#       Blood 112:470-478. PMID 18650462.
#   - OmniPath ligand-receptor (intercell): VCAM1->ITGA4, KITLG->KIT, ICAM4->ITGAV
#       (consensus_stimulation = True; PMIDs above).
#   - Boron & Boulpaep, Medical Physiology (erythropoiesis): macrophage-supported
#       maturation and enucleation of erythroid precursors expands red cell mass.
#
# BOUNDARY NODES (existing-map ids, NOT redefined here):
#   erythroid_progenitor_proliferation (cellular), red_cell_mass (organ_system)
# =============================================================================

name: erythroblastic_island
