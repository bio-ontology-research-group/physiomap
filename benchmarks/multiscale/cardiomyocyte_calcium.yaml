# =============================================================================
# Multi-scale: cardiomyocyte excitation-contraction Ca2+ handling  *** DRAFT FOR REVIEW ***
# =============================================================================
# A subcellular/molecular vertical for calcium-induced calcium release (CICR), the
# core of cardiac excitation-contraction (EC) coupling, lifted constitutively onto the
# existing organ-system cardiac variable (cardiac_output / contractility). Encodes the
# canonical EC-coupling cascade in the ventricular myocyte:
#
#   WITHIN-SCALE CAUSAL (subcellular Ca2+ handling):
#       sympathetic_tone (boundary, organ_system)              # beta-adrenergic / PKA drive
#         -> l_type_calcium_current                            # PKA phosphorylates Cav1.2 -> larger I_CaL
#       l_type_calcium_current
#         -> sr_calcium_release                                # trigger Ca2+ opens RyR2 (CICR, gain)
#         -> cytosolic_calcium_transient                       # I_CaL also adds directly to cytosol
#       sr_calcium_release
#         -> cytosolic_calcium_transient                       # bulk of the systolic Ca2+ rise
#       cytosolic_calcium_transient
#         -> troponin_c_calcium_binding                        # Ca2+ binds cTnC -> thin-filament activation
#       cytosolic_calcium_transient
#         -> serca_uptake_rate                                 # elevated Ca2+ drives SERCA2a pumping
#       serca_uptake_rate
#         -> sr_calcium_load                                   # SERCA refills the SR store
#       sr_calcium_load
#         -> sr_calcium_release                                # higher SR load -> larger CICR (load dependence)
#       sr_calcium_release
#         -> sr_calcium_load                                   # release flux DEPLETES the SR store (-)
#       cytosolic_calcium_transient
#         -> sr_calcium_release                                # Ca2+-dependent INACTIVATION of RyR2 (-)
#
#   FEEDBACK LOOPS (need loop-aware comparative statics, not forward propagation):
#       (P) Load-depletion loop (DOMINANT NEGATIVE / self-limiting — graded release):
#           sr_calcium_load -> sr_calcium_release ("+", load-dependence)
#           -> sr_calcium_load ("-", release empties the store). One "-" edge => negative
#           loop. Local junctional-SR depletion ("induction decay", Cannell 2013) is the
#           dominant beat-to-beat CICR-termination mechanism, and provides the negative
#           counterweight to the SERCA store-replenishing loop (A).
#       (A) SERCA refill loop (NET POSITIVE / store-replenishing):
#           cytosolic_calcium_transient -> serca_uptake_rate -> sr_calcium_load
#             -> sr_calcium_release -> cytosolic_calcium_transient
#           Four "+" edges => positive loop: SERCA uptake recycles Ca2+ into the SR so it
#           is available for the next beat. Counterbalanced on sr_calcium_load by the
#           release-depletion edge (loop P), not left to the implicit self-loop alone.
#       (B) RyR2 Ca-dependent-inactivation loop (SECONDARY NEGATIVE / self-limiting):
#           cytosolic_calcium_transient -> sr_calcium_release ("-", CDI of RyR2)
#           -> cytosolic_calcium_transient ("+"). One "-" edge => negative loop; a
#           secondary cytosolic-side contributor to terminating release (the primary
#           graded-release feedback is the load-depletion loop P).
#
#   CROSS-SCALE CONSTITUTIVE (part_of + determination; NOT causal):
#       troponin_c_calcium_binding (subcellular) >> cardiac_output (organ_system)
#         # thin-filament Ca2+ activation constitutes myofilament force => contractility =>
#         # stroke volume; at fixed heart rate, cardiac output. Determination, not causation.
#
# SOURCES (verified):
#   - BioModels MODEL7914464799  Shannon2004_VentricularMyocyte
#       Shannon, Wang, Puglisi, Weber & Bers (2004) "A mathematical treatment of
#       integrated Ca dynamics within the ventricular myocyte." Biophys J 87:3351-3371.
#       PubMed 15347581.  -> integrated I_CaL -> RyR (CICR, SR-load-dependent) -> cytosolic
#       Ca transient -> TnC buffering; SERCA uptake -> SR load; Ca-dependent inactivation.
#   - BioModels MODEL0393108880  tenTusscher2004_CardiacArrhythmias ("A model for human
#       ventricular tissue") ten Tusscher, Noble, Noble & Panfilov (2004) Am J Physiol
#       Heart Circ Physiol 286:H1573-H1589. PubMed 14656705. -> human ventricular I_CaL,
#       CICR, intracellular Ca dynamics & SR handling.
#   - Bers DM, Excitation-Contraction Coupling and Cardiac Contractile Force (2nd ed,
#       Kluwer 2001): I_CaL is the physiological trigger for SR Ca2+ release via RyR2
#       (CICR); SR Ca2+ load sets release gain; cytosolic Ca2+ binds troponin C to
#       activate the myofilaments; SERCA2a reuptake refills the SR. Canonical EC-coupling.
#   - Boron & Boulpaep, Medical Physiology (cardiac muscle EC coupling): beta-adrenergic
#       (sympathetic) stimulation -> PKA phosphorylation of L-type Ca2+ channels increases
#       I_CaL, augmenting the Ca2+ transient and contractility (positive inotropy).
#   - Cannell, Kong, Imtiaz & Laver (2013) "Control of SR Ca2+ Release by Stochastic RyR
#       Gating within a 3D Model of the Cardiac Dyad and Importance of Induction Decay for
#       CICR Termination." Biophys J 104:2149-2159. PubMed 23708355 / PMC3660628. ->
#       release-driven local junctional-SR depletion ("induction decay") is the dominant
#       beat-to-beat CICR-termination mechanism (sr_calcium_release -| sr_calcium_load).
#
# BOUNDARY NODES (existing-map ids, NOT redefined here):
#   sympathetic_tone, cardiac_output
# =============================================================================
# NOTE (integration fix): the downward macro->micro causal 'driver' edge was REMOVED.
# PhysioMap models causation WITHIN scale and cross-scale dependence as CONSTITUTIVE
# (upward determination) only (see MULTISCALE.md). This vertical's top molecular node is
# therefore a root, exercised by molecular/drug interventions, and lifts UP via the
# constitutive edge(s). This keeps the combined causal+constitutive meta-graph acyclic.

