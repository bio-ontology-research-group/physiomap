  evidence: 'PMID 1887826; (Urinary excretion of pyridinoline crosslinks correlates with bone turnover measured on iliac crest biopsy in patients with vertebral osteoporosis, abstract); “Urinary pyridinoline crosslinks, but not hydroxyproline, correlated significantly with histologic resorption, assessed by the osteoclast surface” | Urinary pyridinoline tracks histologic osteoclastic bone resorption, supporting osteoclast_activity -> urinary_pyridinoline with sign +. [citations PubMed-verified]'
