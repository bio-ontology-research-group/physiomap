- source: membrane_pip2_vsmc
  target: intracellular_calcium
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: 'PLC hydrolyzes membrane PIP2 to IP3; IP3 binds the ER IP3 receptor and releases stored Ca2+ into the cytosol, so available PIP2 substrate sets IP3-driven cytosolic Ca2+ rise'
  evidence: 'Alberts et al., Molecular Biology of the Cell, 6th ed.; (Chapter 15, Signaling through GPCRs / the inositol phospholipid pathway); “Phospholipase C cleaves PI(4,5)P2 to generate two second messengers, inositol 1,4,5-trisphosphate (IP3) and diacylglycerol; IP3 releases Ca2+ from the endoplasmic reticulum.” | do(increase membrane PIP2) increases cytosolic Ca2+ (+): PIP2 is the substrate whose PLC-generated IP3 releases ER Ca2+'
