  evidence: 'PMID 41573517; “H1 treatment alleviated memory impairment and reduced amyloid deposition and neuroinflammation both in Tg2576 mice and Aβ-induced BV-2 microglial cells.” | do(block CHI3L1 with mAb) -> reduced microglial neuroinflammation, so CHI3L1 -> macrophage/microglial activation (+) [citations PubMed-verified]'
