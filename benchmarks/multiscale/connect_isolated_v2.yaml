  evidence: 'PMID 40056413; “Secreted NfL activates microglial cells, which can be blocked with anti-NfL antibodies.” | do(raise CSF NfL) -> increased microglial/macrophage activation (+), confirmed by anti-NfL blockade and NfL KO [citations PubMed-verified]'
