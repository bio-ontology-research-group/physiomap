- source: csf_glutamate
  target: intracellular_calcium
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: 'extracellular/CSF glutamate concentration -> NMDA (and AMPA/KA) receptor overstimulation disposition -> excitotoxic cation-channel opening process -> cytosolic free Ca2+ (intracellular calcium) influx'
  evidence: 'Basic Neurochemistry: Molecular, Cellular and Medical Aspects, 6th edition (Siegel et al.); (Chapter: Excitotoxic injury in Hypoxia-Ischemia); “Experiments with cortical or hippocampal cell cultures suggest that much of the neuronal death associated with brief, intense glutamate exposure is mediated by NMDA receptor activation, probably because this can induce lethal amounts of Ca2+ influx more rapidly than can AMPA/KA receptor stimulation.” | Elevated extracellular glutamate activates NMDA receptors that drive Ca2+ influx into neurons, so do(raise CSF glutamate) raises intracellular Ca2+ (sign +).'
- source: osteoclast_activity
  target: urinary_galactosyl_hydroxylysine
  sign: +
  causal_evidence: curated_mechanistic
  mechanism: 'Osteoclastic bone resorption degrades bone-type-I collagen; galactosyl-hydroxylysine (a collagen-unique, non-reutilized hydroxylysine glycoside enriched in bone) is liberated and excreted -> higher osteoclast resorption activity -> higher galactosyl-hydroxylysine output (sign +).'
  evidence: 'PMID 10222355; (Abstract / Conclusion); “Serum free Gal-Hyl may be useful as a serum marker of bone resorption.” | Galactosyl-hydroxylysine is a marker of (osteoclastic) bone collagen resorption, so increasing osteoclast resorption activity increases galactosyl-hydroxylysine release/excretion (sign +). [citations PubMed-verified]'
