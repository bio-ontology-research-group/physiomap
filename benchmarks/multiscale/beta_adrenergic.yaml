# =============================================================================
# Multi-scale: beta-adrenergic GPCR cardiac signaling   *** DRAFT FOR REVIEW ***
# =============================================================================
# A molecular/subcellular signal-transduction vertical for sympathetic catecholamine
# control of the heart, lifted constitutively onto the existing organ-system cardiac
# variables. Encodes the canonical Gs-coupled beta1-adrenergic cascade:
#
#   WITHIN-SCALE CAUSAL (subcellular signal transduction):
#       sympathetic_tone (boundary, organ_system)        # NE release onto SA node / myocardium
#         -> beta1_adrenergic_activation                  # agonist-occupied receptor
#         -> gs_adenylyl_cyclase_activity                 # Gs-alpha stimulates AC
#         -> camp_level                                   # AC: ATP -> cAMP
#         -> pka_activity                                 # cAMP binds PKA-R, frees PKA-C
#       camp_level -> pde_activity -> camp_level          # PDE hydrolysis negative feedback loop
#
#   CROSS-SCALE CONSTITUTIVE (part_of + determination; NOT causal):
#       pka_activity (subcellular)  >> heart_rate (organ_system)        # chronotropy
#       pka_activity (subcellular)  >> cardiac_output (organ_system)    # inotropy
#
# Feedback: cAMP up -> PDE flux up -> cAMP down  (substrate-driven negative feedback,
# the cAMP buffering loop; correct net sign of camp_level under sustained AC drive needs
# loop-aware comparative statics, not forward propagation).
#
# SOURCES (verified):
#   - BioModels MODEL1006230118  Saucerman2003_CardiacMyocyte_BetaAdrenergic
#       Saucerman, Brunton, Michailova & McCulloch (2003) "Modeling beta-adrenergic
#       control of cardiac myocyte contractility in silico." J Biol Chem 278:47997-48003.
#       PubMed 12972422.  -> beta1 -> Gs/AC -> cAMP -> PKA cascade + PDE feedback + inotropy.
#   - BioModels BIOMD0000000165  Saucerman2006_PKA
#       Saucerman, Zhang, Martin, Peng, Stenbit, Tsien & McCulloch (2006) "Systems
#       analysis of PKA-mediated phosphorylation gradients in live cardiac myocytes."
#       PNAS 103:12923-12928.  PubMed 16905651.  -> cAMP -> PKA activation kinetics.
#   - Boron & Boulpaep, Medical Physiology (autonomic control of the heart):
#       sympathetic NE -> beta1 receptors -> Gs -> AC -> cAMP -> PKA; PKA phosphorylates
#       HCN/If, L-type Ca2+ channels, phospholamban, RyR => positive chronotropy &
#       inotropy. PDE (PDE3/PDE4) hydrolyses cAMP (basis of inotrope pharmacology).
#
# BOUNDARY NODES (existing-map ids, NOT redefined here):
#   sympathetic_tone, heart_rate, cardiac_output
# =============================================================================
# NOTE (integration fix): the downward macro->micro causal 'driver' edge was REMOVED.
# PhysioMap models causation WITHIN scale and cross-scale dependence as CONSTITUTIVE
# (upward determination) only (see MULTISCALE.md). This vertical's top molecular node is
# therefore a root, exercised by molecular/drug interventions, and lifts UP via the
# constitutive edge(s). This keeps the combined causal+constitutive meta-graph acyclic.

