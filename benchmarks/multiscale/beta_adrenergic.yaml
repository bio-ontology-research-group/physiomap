causal_edges:
- source: beta1_adrenergic_activation
  target: gs_adenylyl_cyclase_activity
  sign: +
  causal_evidence: mechanistic_model
  mechanism: 'active beta-1 receptor catalyses GDP/GTP exchange on Gs-alpha (disposition: GEF activity -> process: G-protein activation), and Gs-alpha-GTP stimulates adenylyl cyclase -> quality: AC catalytic rate'
  evidence: 'BioModels MODEL1006230118 Saucerman et al. 2003 J Biol Chem 278:47997 (PubMed 12972422): receptor -> Gs -> adenylyl cyclase module; Boron & Boulpaep, Medical Physiology. | textbook corroboration: OpenStax Biology 2e §bio-37.2 (37.2: How Hormones Work): ''The activated G-protein in turn activates a membrane-bound enzyme called adenylyl cyclase.'' (Figure 37.6 caption: ''Hormone binding to receptor activates a G-protein, which in turn activates adenylyl cyclase'') [citations PubMed-verified]'
- source: gs_adenylyl_cyclase_activity
  target: camp_level
  sign: +
  causal_evidence: mechanistic_model
  mechanism: 'adenylyl cyclase (disposition: cyclase catalytic activity) runs process ATP -> 3'',5''-cyclic AMP + PPi, raising quality: cytosolic cAMP concentration'
  evidence: 'BioModels MODEL1006230118 Saucerman et al. 2003 J Biol Chem 278:47997 (PubMed 12972422): AC production flux of cAMP; Boron & Boulpaep, Medical Physiology. | textbook corroboration: OpenStax Biology 2e §bio-37.2 (37.2: How Hormones Work): ''Adenylyl cyclase catalyzes the conversion of ATP to cAMP.''; OpenStax Biology 2e §bio-9.2 (9.2: Propagation of the Signal): ''Cyclic AMP is synthesized by the enzyme adenylyl cyclase from ATP'' [citations PubMed-verified]'
- source: camp_level
  target: pka_activity
  sign: +
  causal_evidence: mechanistic_model
  mechanism: 'cAMP (quality: concentration) binds PKA regulatory subunits (disposition: allosteric release -> process: dissociation of catalytic subunits) -> quality: free PKA-C catalytic activity'
  evidence: 'BioModels BIOMD0000000165 Saucerman et al. 2006 PNAS 103:12923 (PubMed 16905651): cAMP-dependent PKA activation; also MODEL1006230118 Saucerman et al. 2003 (PubMed 12972422); Boron & Boulpaep, Medical Physiology. | textbook corroboration: OpenStax Biology 2e §bio-37.2 (37.2: How Hormones Work): ''cAMP, in turn, activates a group of proteins called protein kinases, which transfer a phosphate group from ATP to a substrate molecule in a process called phosphorylation.''; OpenStax Biology 2e §bio-9.2 (9.2: Propagation of the Signal): ''The main role of cAMP in cells is to bind to and activate an enzyme called cAMP-dependent kinase (A-kinase)''; OpenStax Biology 2e §bio-9.3 (9.3: Response to the Signal): ''Cyclic AMP activates PKA (protein kinase A)'' [citations PubMed-verified]'
- source: camp_level
  target: pde_activity
  sign: +
  causal_evidence: mechanistic_model
  mechanism: 'rising cAMP (quality: substrate concentration) increases occupancy of phosphodiesterase (disposition: hydrolase activity) -> process: cAMP hydrolysis flux -> quality: PDE turnover rate (substrate-driven; PKA also feed-forward activates PDE3/PDE4)'
  evidence: 'BioModels MODEL1006230118 Saucerman et al. 2003 J Biol Chem 278:47997 — PDE hydrolysis of cAMP; Boron & Boulpaep, Medical Physiology (PDE3/PDE4 as cAMP-degrading enzymes underlying inotrope pharmacology). | textbook corroboration: OpenStax Biology 2e §bio-37.2 (37.2: How Hormones Work): ''An enzyme called phosphodiesterase breaks down cAMP, terminating the signal.'' (substrate-driven PDE activation implied by cAMP level); OpenStax Biology 2e §bio-9.2 (9.2: Propagation of the Signal): ''Termination of the signal occurs when an enzyme called phosphodiesterase converts cAMP into AMP'' (cAMP drives PDE activity) [citations PubMed-verified]'
- source: pde_activity
  target: camp_level
  sign: '-'
  causal_evidence: mechanistic_model
  mechanism: 'phosphodiesterase (disposition: 3'',5''-cyclic-nucleotide hydrolase) runs process cAMP -> 5''-AMP, lowering quality: cytosolic cAMP concentration'
  evidence: 'BioModels MODEL1006230118 Saucerman et al. 2003 J Biol Chem 278:47997 — PDE degradation flux reduces cAMP; Boron & Boulpaep, Medical Physiology. | textbook corroboration: OpenStax Biology 2e §bio-37.2 (37.2: How Hormones Work): ''cAMP is deactivated by the cytoplasmic enzyme phosphodiesterase, or PDE. PDE is always present in the cell and breaks down cAMP to control hormone activity, preventing overproduction of cellular products.''; OpenStax Biology 2e §bio-9.2 (9.2: Propagation of the Signal): ''Termination of the signal occurs when an enzyme called phosphodiesterase converts cAMP into AMP'' (PDE degrades cAMP, reducing its level); OpenStax Biology 2e §bio-9.3 (9.3: Response to the Signal): ''Cyclic AMP (cAMP) is degraded into AMP by phosphodiesterase'' [citations PubMed-verified]'
- source: pka_activity
  target: heart_rate
  sign: +
  causal_evidence: mechanistic_model
  mechanism: PKA phosphorylation of pacemaker and calcium-handling targets increases sinoatrial firing rate and positive chronotropy
  evidence: Saucerman et al. 2003 J Biol Chem 278:47997 (PMID 12972422); Boron & Boulpaep, Medical Physiology (beta-adrenergic cAMP/PKA control of chronotropy).
- source: pka_activity
  target: cardiac_output
  sign: +
  causal_evidence: mechanistic_model
  mechanism: PKA phosphorylation of L-type calcium channels, phospholamban, RyR2, and contractile targets increases cardiac inotropy and thereby cardiac output
  evidence: Saucerman et al. 2003 J Biol Chem 278:47997 (PMID 12972422); Saucerman et al. 2006 PNAS 103:12923 (PMID 16905651); Boron & Boulpaep, Medical Physiology.
