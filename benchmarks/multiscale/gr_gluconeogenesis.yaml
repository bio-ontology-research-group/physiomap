# Multi-scale GRN import: glucocorticoid receptor -> gluconeogenic gene transcription
#                                                       *** DRAFT FOR REVIEW ***
# =============================================================================
# Causal-evidence-gated import. Hepatic GR transactivates the rate-limiting gluconeogenic genes.
# GR activity is a molecular ROOT (clamped by GR agonist/antagonist drugs); the downward driver
# (cortisol -> GR) is OMITTED (cross-scale). PEPCK and G6Pase lift to hepatic glucose production.
#
#   gr_activity --(+)--> pepck1_expression      (PCK1 is a classic GR target gene)
#   gr_activity --(+)--> g6pase_expression       (G6PC is GR/PGC-1alpha driven)
#   pepck1_expression ▷(+) hepatic_glucose_production
#   g6pase_expression ▷(+) hepatic_glucose_production
#
# INTERVENTIONAL GROUNDING:
#   - dexamethasone (GR agonist) induces PEPCK/G6Pase and RAISES hepatic glucose output /
#     causes hyperglycemia (pharmacological do())
#   - mifepristone (GR antagonist) blocks dexamethasone-induced gluconeogenesis (pharmacological)
#   - liver-specific GR knockout blunts dexamethasone-induced PEPCK/G6Pase (perturbation)
#   - generalized (primary) glucocorticoid resistance from NR3C1 mutations (genetic)
# (No PMID/OMIM numbers cited: the importer's proposed identifiers were found on review to be
#  fabricated/misattributed, so only the well-established drug/KO/disease facts are recorded here;
#  primary-citation verification pending. DRAFT for domain review.)
#
# BOUNDARY NODES (exist; not redefined): hepatic_glucose_production
# =============================================================================
