causal_edges:
- source: bmp6_ligand
  target: bmp_smad_signaling
  sign: +
  causal_evidence: perturbation
  mechanism: 'BMP6 binds BMP type-I/II receptors with the co-receptor hemojuvelin on the hepatocyte; the activated receptor disposition phosphorylates SMAD1/5/8, which complex with SMAD4 (process), raising nuclear SMAD signaling activity.

    '
  evidence: 'Ganz & Nemeth 2012 (Biochim Biophys Acta 1823:1434-1443, PMID 22306005); BioModels BIOMD0000000734 (Parmar et al. 2017, BMC Syst Biol 11:57). Opened primary knockout: Bmp6-deficient mice have low phospho-SMAD1/5/8 and markedly reduced hepcidin with massive iron overload -- do(BMP6 down) lowers BMP-SMAD signaling (Meynard et al. 2009, Nat Genet, PMID 19252488). [citations PubMed-verified]'
- source: bmp_smad_signaling
  target: hepcidin_transcription
  sign: +
  causal_evidence: perturbation
  mechanism: 'Phospho-SMAD1/5/8-SMAD4 complexes bind BMP-responsive elements in the HAMP promoter (disposition -> transcriptional activation process), increasing hepcidin mRNA synthesis rate.

    '
  evidence: 'Ganz & Nemeth 2011 (Annu Rev Med 62:347-360); Boron & Boulpaep, Medical Physiology (hepcidin/BMP-SMAD regulation). Opened primary conditional knockout: liver-specific Smad4 disruption markedly decreases hepcidin and abrogates its transcriptional activation by BMP/iron/IL-6 -- do(SMAD signaling down) lowers hepcidin transcription (Wang et al. 2005, Cell Metab, PMID 16330325). [citations PubMed-verified]'
- source: il6_stat3_signaling
  target: hepcidin_transcription
  sign: +
  causal_evidence: perturbation
  mechanism: 'IL-6 binds IL6R/gp130, activating JAK1; phospho-STAT3 dimerizes and binds the STAT3 element of the HAMP promoter (disposition -> transcriptional activation process), raising hepcidin mRNA synthesis rate (basis of anemia of inflammation).

    '
  evidence: 'Sobotta et al. 2017 (Front Physiol 8:775, PMID 29062282; BioModels MODEL2307050001); Ganz & Nemeth 2011 (Annu Rev Med 62:347-360). Opened primary: STAT3 binds a conserved hepcidin-promoter element and is necessary and sufficient for IL-6 responsiveness; disrupting STAT3 abolishes induction (loss-of-function), corroborated by human IL-6 infusion (controlled stimulation) rapidly raising hepcidin -- do(IL-6/STAT3 signaling up) raises hepcidin transcription (Wrighting & Andrews 2006, Blood, PMID 16835372; Nemeth 2004). [citations PubMed-verified]'
- source: erythroferrone
  target: bmp_smad_signaling
  sign: '-'
  causal_evidence: perturbation
  mechanism: 'Erythroblast-derived ERFE acts as a BMP ligand trap: it sequesters BMP6 (and the BMP2/6 heterodimer), preventing the ligand from binding the hepatocyte BMP type-I receptor ALK3 (disposition), which lowers SMAD1/5/8 phosphorylation and hepatic BMP-SMAD signaling activity.

    '
  evidence: 'Arezes et al. 2018, "Erythroferrone inhibits the induction of hepcidin by BMP6" (Blood 132:1473-1477, PMID 30097509) — recombinant ERFE suppresses the hepatic BMP/SMAD pathway; Kautz et al. 2014 (Nat Genet 46:678-684, PMID 24880340). [citations PubMed-verified]'
production_edges:
- source: hepcidin_transcription
  target: hepcidin
  sign: +
  production_evidence: legacy-evidence-unclassified
