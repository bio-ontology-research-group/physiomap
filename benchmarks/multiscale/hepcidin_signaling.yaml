# =============================================================================
# Molecular vertical: hepcidin transcription control        *** DRAFT FOR REVIEW ***
# =============================================================================
# The hepatocyte integrates two transcriptional inputs onto the HAMP (hepcidin)
# gene, plus an erythropoietic suppression arm, all at the molecular/subcellular
# scale. This vertical is intentionally self-contained on the iron axis (no iron
# nodes exist in the map yet) and connects to the EXISTING map through the
# erythropoietic-drive arm:
#
#   WITHIN-SCALE CAUSAL (molecular signal transduction -> transcription):
#       bmp6_ligand            -> bmp_smad_signaling        (+)
#       bmp_smad_signaling     -> hepcidin_transcription    (+)   iron / BMP arm
#       il6_stat3_signaling    -> hepcidin_transcription    (+)   inflammation arm
#       erythroferrone         -> bmp_smad_signaling        (-)   erythroid suppression
#
#   INTEGRATION WITH EXISTING MAP (boundary nodes, correct signs):
#       renal_tissue_oxygenation -> erythropoietin           (-)  hypoxia drives EPO
#       erythropoietin           -> erythroferrone           (+)  EPO induces ERFE in erythroblasts
#   (=> low renal tissue O2 raises EPO, raises ERFE, suppresses BMP/SMAD, lowers
#    hepcidin transcription: a real, loop-relevant physiological integration.)
#
#   CONSTITUTIVE (cross-scale): OMITTED ON PURPOSE. There is no existing macro
#   organ/organ-system node that hepcidin_transcription constitutes (the systemic
#   iron / serum-iron / ferroportin layer is not in the vocabulary yet). Per the
#   assignment, this vertical is staged for a future `iron_hepcidin` system; the
#   constitutive lift (hepcidin_transcription >> plasma_hepcidin / serum iron)
#   should be added when that system lands.
#
# SOURCES (all verified):
#   - BioModels BIOMD0000000734 (Parmar et al. 2017, BMC Syst Biol 11:57,
#     PMID 28521769) "Modeling the dynamics of mouse iron body distribution:
#     hepcidin is necessary but not sufficient" — hepcidin-centred iron model.
#   - BioModels MODEL2307050001 (Sobotta et al. 2017, Front Physiol 8:775,
#     PMID 29062282) "Model Based Targeting of IL-6-Induced Inflammatory Responses
#     ... JAK1-STAT3-signaling" — IL-6 -> JAK1/STAT3 hepatocyte model.
#   - Ganz & Nemeth 2011, "Hepcidin and disorders of iron metabolism",
#     Annu Rev Med 62:347-360 (PMID 20887198).
#   - Ganz & Nemeth 2012, "Hepcidin and iron homeostasis",
#     Biochim Biophys Acta 1823:1434-1443 (PMID 22306005).
#   - Kautz et al. 2014, "Identification of erythroferrone as an erythroid
#     regulator of iron metabolism", Nat Genet 46:678-684 (PMID 24880340).
#   - Arezes et al. 2018, "Erythroferrone inhibits the induction of hepcidin by
#     BMP6", Blood 132:1473-1477 (PMID 30097509) — recombinant ERFE suppresses the
#     hepatic BMP/SMAD pathway (mechanistic anchor for the ERFE -| BMP/SMAD edge).
#   - Wang et al. 2020, "Erythroferrone lowers hepcidin by sequestering BMP2/6
#     heterodimer from binding to the BMP type I receptor ALK3", Blood 135:453-456
#     (PMID 31800957).
#   - Boron & Boulpaep, Medical Physiology (iron / hepcidin regulation).
#
# BOUNDARY NODES (existing vocabulary, reused verbatim):
#   renal_tissue_oxygenation, erythropoietin
# =============================================================================
# NOTE (integration fix): the downward macro->micro causal 'driver' edge was REMOVED.
# PhysioMap models causation WITHIN scale and cross-scale dependence as CONSTITUTIVE
# (upward determination) only (see MULTISCALE.md). This vertical's top molecular node is
# therefore a root, exercised by molecular/drug interventions, and lifts UP via the
# constitutive edge(s). This keeps the combined causal+constitutive meta-graph acyclic.

