causal_edges:
  # --- RAAS cascade ---------------------------------------------------------
  - source: renal_perfusion_pressure
    target: renin
    sign: "-"
    causal_evidence: mechanistic_model
    mechanism: renal baroreceptor + macula densa (tubuloglomerular) feedback
    evidence: "Guyton1972_Angiotensin MODEL0911342562 (MDFLW -> ANGSCR, decreasing): higher renal/MD flow suppresses renin secretion | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-098 (17.11: Organs with Secondary Endocrine Functions): 'A decline in blood flow to the kidneys stimulates them to release the enzyme renin, triggering the renin-angiotensin-aldosterone (RAAS) system'; OpenStax Anatomy & Physiology 2e §anp-114 (20.5: Homeostatic Regulation of the Vascular System): 'Specialized cells in the kidneys, called juxtaglomerular (JG) cells, respond to decreased blood pressure by secreting renin into the blood.'"
  - source: sympathetic_tone
    target: renin
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: beta-adrenergic stimulation of juxtaglomerular renin release
    evidence: "Guyton1972_Autonomics MODEL0911270005 (AU -> renin); classic sympathetic renin stimulation | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-151 (25.8: Regulation of Renal Blood Flow): 'If blood pressure falls, the sympathetic nerves will also stimulate the release of renin. Additional renin increases production of the powerful vasoconstrictor angiotensin II.'; OpenStax Biology 2e §bio-41.5 (41.5: Hormonal Control of Osmoregulatory Functions): epinephrine and norepinephrine 'go one step further and trigger the renin-angiotensin-aldosterone system' — catecholamines stimulate juxtaglomerular renin release."
  - source: renin
    target: angiotensin_II
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: renin cleaves angiotensinogen -> AngI -> (ACE) AngII
    evidence: "Guyton1972_Angiotensin MODEL0911342562 (REK/ANX1 -> ANC) | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-094 (17.7: The Adrenal Glands): 'Renin then catalyzes the conversion of... angiotensinogen... to... angiotensin I. Angiotensin I is converted in the lungs to angiotensin II by angiotensin-converting enzyme (ACE).'; OpenStax Anatomy & Physiology 2e §anp-148 (25.5: Microscopic Anatomy of the Kidney): 'Active renin... cleaves several amino acids from angiotensinogen to produce angiotensin I. Angiotensin I is not biologically active until converted to angiotensin II by angiotensin-converting enzyme (ACE) from the lungs.'; OpenStax Anatomy & Physiology 2e §anp-152 (25.9: Endocrine Regulation of Kidney Function): 'Renin is an enzyme...It enzymatically converts angiotensinogen...into angiotensin I. ACE...enzymatically converts inactive angiotensin I into active angiotensin II.'; OpenStax Anatomy & Physiology 2e §anp-154 (25.11: The Urinary System and Homeostasis): 'Renin converts angiotensinogen into angiotensin I, and ACE produced in the lung converts angiotensin I into biologically active angiotensin II' (lines 45-46); OpenStax Biology 2e §bio-41.5 (41.5: Hormonal Control of Osmoregulatory Functions): 'Renin acts on angiotensinogen, which is made in the liver and converts it to angiotensin I. Angiotensin converting enzyme (ACE) converts angiotensin I to angiotensin II.'"
  - source: angiotensin_II
    target: aldosterone
    sign: "+"
    mechanism: AngII stimulates adrenal aldosterone synthesis
    evidence: "Guyton1972_Aldosterone MODEL0911376350 (ANM -> AMC) | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-094 (17.7: The Adrenal Glands): 'Signaling the adrenal cortex to secrete aldosterone, the effects of which further contribute to fluid retention, restoring blood pressure and blood volume.'; OpenStax Anatomy & Physiology 2e §anp-114 (20.5: Homeostatic Regulation of the Vascular System): 'It also stimulates the release of ADH and aldosterone, a hormone produced by the adrenal cortex.'; OpenStax Anatomy & Physiology 2e §anp-148 (25.5: Microscopic Anatomy of the Kidney): 'Angiotensin II also stimulates the release of the steroid hormone aldosterone from the adrenal cortex.'; OpenStax Anatomy & Physiology 2e §anp-150 (25.7: Tubular Reabsorption): 'Aldosterone is secreted by the adrenal cortex in response to angiotensin II stimulation.'; OpenStax Anatomy & Physiology 2e §anp-152 (25.9: Endocrine Regulation of Kidney Function): 'Aldosterone...is released from the adrenal cortex in response to angiotensin II.'; OpenStax Anatomy & Physiology 2e §anp-153 (Regulation of Fluid Volume and Composition): 'rise in pressure is sustained by the aldosterone effects initiated by angiotensin II; this includes an increase in Na+ retention and water volume'; OpenStax Anatomy & Physiology 2e §anp-154 (25.11: The Urinary System and Homeostasis): 'angiotensin II also stimulates the adrenal cortex to release the steroid hormone aldosterone' (lines 47-48); OpenStax Anatomy & Physiology 2e §anp-156 (26.3: Water Balance): 'angiotensin II... stimulates the release of the hormone aldosterone from the adrenal glands'; OpenStax Anatomy & Physiology 2e §anp-157 (26.4: Electrolyte Balance): 'Angiotensin II also signals an increase in the release of aldosterone from the adrenal cortex.'; OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): 'Angiotensin II functions as a hormone and then causes the release of the hormone aldosterone by the adrenal cortex, resulting in increased Na+ reabsorption, water retention, and an increase in blood pressure.'; OpenStax Biology 2e §bio-41.5 (41.5: Hormonal Control of Osmoregulatory Functions): 'It [angiotensin II] also triggers the release of the mineralocorticoid aldosterone from the adrenal cortex, which in turn stimulates the renal tubules to reabsorb more sodium.'"
  - source: angiotensin_II
    target: adh
    sign: "+"
    mechanism: AngII stimulates ADH (vasopressin) release
    evidence: "Guyton1972_AntidiureticHormone MODEL0911309080 | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-114 (20.5: Homeostatic Regulation of the Vascular System): 'It also stimulates the release of ADH and aldosterone...'; OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): 'Angiotensin II in addition to being a potent vasoconstrictor also causes an increase in ADH and increased thirst, both of which help to raise blood pressure.'; OpenStax Biology 2e §bio-41.5 (41.5: Hormonal Control of Osmoregulatory Functions): 'Angiotensin II also triggers the release of anti-diuretic hormone (ADH) from the hypothalamus, leading to water retention in the kidneys.'"
  - source: angiotensin_II
    target: total_peripheral_resistance
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: AngII-induced arteriolar vasoconstriction
    evidence: "circulation.cellml non_renal_systemic_arterial_resistance_multiplier (ANU/ARM); Guyton circulatory dynamics | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-094 (17.7: The Adrenal Glands): 'Initiating vasoconstriction of the arterioles, decreasing blood flow.'; OpenStax Anatomy & Physiology 2e §anp-114 (20.5: Homeostatic Regulation of the Vascular System): 'Angiotensin II is a powerful vasoconstrictor, greatly increasing blood pressure.'; OpenStax Anatomy & Physiology 2e §anp-148 (25.5: Microscopic Anatomy of the Kidney): 'Angiotensin II is a systemic vasoconstrictor that helps to regulate blood pressure by increasing it.'; OpenStax Anatomy & Physiology 2e §anp-152 (25.9: Endocrine Regulation of Kidney Function): 'Angiotensin II is a potent vasoconstrictor that plays an immediate role in the regulation of blood pressure. It acts systemically to cause vasoconstriction.'; OpenStax Anatomy & Physiology 2e §anp-153 (Regulation of Fluid Volume and Composition): 'renin activity leads to an almost immediate rise in blood pressure as activated angiotensin II produces vasoconstriction'; OpenStax Anatomy & Physiology 2e §anp-154 (25.11: The Urinary System and Homeostasis): 'The immediate and short-term effect of angiotensin II is to raise blood pressure by causing widespread vasoconstriction' (lines 46-47); OpenStax Anatomy & Physiology 2e §anp-157 (26.4: Electrolyte Balance): 'Angiotensin II causes vasoconstriction and an increase in systemic blood pressure.'; OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): 'Angiotensin II in addition to being a potent vasoconstrictor also causes an increase in ADH and increased thirst.'; OpenStax Biology 2e §bio-41.5 (41.5: Hormonal Control of Osmoregulatory Functions): 'Angiotensin II raises blood pressure by constricting blood vessels.'"
  - source: angiotensin_II
    target: sodium_water_reabsorption
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: AngII increases proximal/distal tubular Na reabsorption
    evidence: "kidney.cellml angiotensin_induced_Na_reabsorption_into_distal_tubules | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-094 (17.7: The Adrenal Glands): 'Stimulating kidney tubules to reabsorb NaCl and water, increasing blood volume.'; OpenStax Anatomy & Physiology 2e §anp-152 (25.9: Endocrine Regulation of Kidney Function): 'It [AngII] reduces both GFR and renal blood flow, thereby limiting fluid loss and preserving blood volume'; sodium retention via aldosterone stimulation.; OpenStax Biology 2e §bio-41.5 (41.5: Hormonal Control of Osmoregulatory Functions): aldosterone 'stimulates the renal tubules to reabsorb more sodium' triggered by Ang II; Ang II also directly decreases GFR reducing filtered load."

  # --- aldosterone / ADH on tubule -----------------------------------------
  - source: aldosterone
    target: sodium_water_reabsorption
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: aldosterone-driven distal Na reabsorption (ENaC)
    evidence: "Guyton1972_Electrolytes MODEL0912160001 (AMK -> Na handling); kidney.cellml Na reabsorption | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-090 (17.3: Hormones): table entry 'Aldosterone: Increases blood Na+ levels'; OpenStax Anatomy & Physiology 2e §anp-094 (17.7: The Adrenal Glands): 'aldosterone increases the excretion of K+ and the retention of Na+, which in turn increases blood volume and blood pressure.'; OpenStax Anatomy & Physiology 2e §anp-114 (20.5: Homeostatic Regulation of the Vascular System): 'Aldosterone increases the reabsorption of sodium into the blood by the kidneys. Since water follows sodium, this increases the reabsorption of water.'; OpenStax Anatomy & Physiology 2e §anp-116 (20.7: Development of Blood Vessels and Fetal Circulation): Review question 17 confirms 'aldosterone prompts the kidneys to reabsorb sodium' as the correct answer in the renin-angiotensin-aldosterone mechanism.; OpenStax Anatomy & Physiology 2e §anp-147 (25.4: Gross Anatomy of the Kidney): 'The adrenal cortex directly influences renal function through the production of the hormone aldosterone to stimulate sodium reabsorption.'; OpenStax Anatomy & Physiology 2e §anp-148 (25.5: Microscopic Anatomy of the Kidney): 'Aldosterone stimulates Na+ reabsorption by the kidney, which also results in water retention and increased blood pressure.'; OpenStax Anatomy & Physiology 2e §anp-150 (25.7: Tubular Reabsorption): aldosterone stimulates principal cells to manufacture luminal Na+ channels and Na+/K+ ATPase pumps in DCT/collecting duct, increasing Na+ reabsorption; OpenStax Anatomy & Physiology 2e §anp-152 (25.9: Endocrine Regulation of Kidney Function): 'It [aldosterone] promotes Na+ reabsorption by the nephron, promoting the retention of water.'; OpenStax Anatomy & Physiology 2e §anp-153 (Regulation of Fluid Volume and Composition): 'Aldosterone stimulates the uptake of Na+ on the apical cell membrane of cells in the DCT and collecting ducts'; OpenStax Anatomy & Physiology 2e §anp-154 (25.11: The Urinary System and Homeostasis): aldosterone 'results in renal reabsorption of Na+ and its associated osmotic recovery of water. The reabsorption of Na+ helps to raise and maintain blood pressure over a longer term' (lines 49-50); 'Aldosterone stimulates Na+ recovery by the collecting duct' (line 345); OpenStax Anatomy & Physiology 2e §anp-156 (26.3: Water Balance): 'Aldosterone increases the reabsorption of sodium in the distal tubules of the nephrons in the kidneys, and water follows this reabsorbed sodium back into the blood.'; OpenStax Anatomy & Physiology 2e §anp-157 (26.4: Electrolyte Balance): 'aldosterone increases the...reabsorption of sodium in the distal tubule...Aldosterone causes an increase in blood sodium levels and blood volume.'; OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): 'aldosterone maintains proper water balance by enhancing Na+ reabsorption'; 'The hormone aldosterone stimulates the reabsorption of water and sodium ions in the kidney.'; OpenStax Biology 2e §bio-41.5 (41.5: Hormonal Control of Osmoregulatory Functions): 'Almost all of the sodium in the blood is reclaimed by the renal tubules under the influence of aldosterone. Because sodium is always reabsorbed by active transport and water follows sodium to maintain osmotic balance, aldosterone manages not only sodium levels but also the water levels in body fluids.'"
  - source: adh
    target: sodium_water_reabsorption
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: ADH increases collecting-duct water reabsorption
    evidence: "Guyton1972_AntidiureticHormone MODEL0911309080 -> renal water handling | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-090 (17.3: Hormones): 'ADH... Stimulates water reabsorption by kidneys'; also 'The hormone causes the kidneys to reabsorb more water and reduce the volume of urine produced'; OpenStax Anatomy & Physiology 2e §anp-091 (17.4: The Pituitary Gland and Hypothalamus): 'Its effect is to increase epithelial permeability to water, allowing increased water reabsorption.'; OpenStax Anatomy & Physiology 2e §anp-114 (20.5: Homeostatic Regulation of the Vascular System): 'ADH signals its target cells in the kidneys to reabsorb more water, thus preventing the loss of additional fluid in the urine.'; OpenStax Anatomy & Physiology 2e §anp-148 (25.5: Microscopic Anatomy of the Kidney): 'When stimulated by ADH, these [collecting duct] cells will insert aquaporin channel proteins into their membranes... allowing water to pass from the duct lumen through the cells and into the interstitial spaces to be recovered by the vasa recta.'; OpenStax Anatomy & Physiology 2e §anp-150 (25.7: Tubular Reabsorption): ADH (vasopressin) stimulates insertion of aquaporin channels into apical membrane of principal cells in collecting ducts, increasing water reabsorption; OpenStax Anatomy & Physiology 2e §anp-152 (25.9: Endocrine Regulation of Kidney Function): 'ADH...promotes the recovery of water, decreases urine volume, and maintains plasma osmolarity and blood pressure...by stimulating the movement of aquaporin proteins into the apical cell membrane of principal cells of the collecting ducts.'; OpenStax Anatomy & Physiology 2e §anp-153 (Regulation of Fluid Volume and Composition): 'ADH also causes activation of aquaporin channels in the collecting ducts to affect the recovery of water to help restore vascular volume'; OpenStax Anatomy & Physiology 2e §anp-154 (25.11: The Urinary System and Homeostasis): 'ADH stimulation of aquaporin channels allows for regulation of water recovery in the collecting ducts' (line 38); 'ADH promotes water recovery by the collecting ducts by stimulating the insertion of aquaporin water channels into cell membranes' (lines 358-359); OpenStax Anatomy & Physiology 2e §anp-156 (26.3: Water Balance): 'ADH also causes the epithelial cells that line the renal collecting tubules to move water channel proteins, called aquaporins... large increase in water passage from the urine through the walls of the collecting tubules, leading to more reabsorption of water into the bloodstream.'; OpenStax Biology 2e §bio-37.3 (37.3: Regulation of Body Processes): 'ADH changes the kidneys to become more permeable to water by temporarily inserting water channels, aquaporins, into the kidney tubules. Water moves out of the kidney tubules through the aquaporins, reducing urine volume.'; OpenStax Biology 2e §bio-41.5 (41.5: Hormonal Control of Osmoregulatory Functions): 'It [ADH] acts by inserting aquaporins in the collecting ducts and promotes reabsorption of water.'"
  - source: mean_arterial_pressure
    target: adh
    sign: "-"
    causal_evidence: mechanistic_model
    mechanism: arterial/atrial baroreflex suppression of ADH at high pressure
    evidence: "Guyton1972_AntidiureticHormone MODEL0911309080 (PA1 input, decreasing) | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-153 (Regulation of Fluid Volume and Composition): 'When blood volume drops 5–10 percent, causing a decrease in blood pressure, there is a rapid and significant increase in ADH release from the posterior pituitary'"

  # --- ANP negative-feedback arm -------------------------------------------
  - source: blood_volume
    target: anp
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: atrial stretch (raised atrial pressure) releases ANP
    evidence: "Guyton1972_AtrialNatriureticPeptide MODEL0911272039 (PLA/PRA -> ANPC) | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-098 (17.11: Organs with Secondary Endocrine Functions): 'When the body experiences an increase in blood volume or pressure, the cells of the heart's atrial wall stretch … produce and secrete … atrial natriuretic peptide (ANP)'; OpenStax Anatomy & Physiology 2e §anp-114 (20.5: Homeostatic Regulation of the Vascular System): 'Secreted by cells in the atria of the heart, atrial natriuretic hormone (ANH) is secreted when blood volume is high enough to cause extreme stretching of the cardiac cells.'; OpenStax Anatomy & Physiology 2e §anp-153 (Regulation of Fluid Volume and Composition): 'Cardiomyocytes of the atria also respond to greater stretch (as blood pressure rises) by secreting ANH'; OpenStax Biology 2e §bio-37.5 (37.5: Endocrine Glands): 'These cells release the hormone atrial natriuretic peptide (ANP) in response to increased blood volume. High blood volume causes the cells to be stretched, resulting in hormone release.'; OpenStax Biology 2e §bio-41.5 (41.5: Hormonal Control of Osmoregulatory Functions): 'It [ANP] is released by cells in the atrium of the heart in response to high blood pressure' (atrial stretch from elevated blood volume/pressure triggers ANP release)."
  - source: anp
    target: sodium_excretion
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: ANP promotes natriuresis (raises GFR, inhibits Na reabsorption)
    evidence: "Guyton1972_AtrialNatriureticPeptide MODEL0911272039; kidney natriuretic effect | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-098 (17.11: Organs with Secondary Endocrine Functions): 'ANP signals the kidneys to reduce sodium reabsorption, thereby decreasing the amount of water reabsorbed … reducing blood volume'; OpenStax Anatomy & Physiology 2e §anp-152 (25.9: Endocrine Regulation of Kidney Function): 'Natriuretic hormones are peptides that stimulate the kidneys to excrete sodium...natriuretic peptides inhibit both Na+ and water recovery.'; OpenStax Anatomy & Physiology 2e §anp-153 (Regulation of Fluid Volume and Composition): 'More Na+ is lost, and as water follows, total blood volume and pressure decline'; OpenStax Anatomy & Physiology 2e §anp-154 (25.11: The Urinary System and Homeostasis): 'ANH is released by the cardiomyocytes when blood pressure increases, causing Na+ and water loss' (lines 369); OpenStax Biology 2e §bio-41.5 (41.5: Hormonal Control of Osmoregulatory Functions): 'ANP prevents sodium reabsorption by the renal tubules, decreasing water reabsorption (thus acting as a diuretic) and lowering blood pressure.'"

  # --- fluid balance --------------------------------------------------------
  - source: sodium_water_reabsorption
    target: blood_volume
    sign: "+"
    causal_evidence: curated_mechanistic
    mechanism: reabsorbed Na/water enter peritubular capillary blood, expanding blood volume directly (P. Schofield 2026-07-22; ECF follows by equilibration)
    evidence: "Guyton1972_Electrolytes MODEL0912160001 (NAE/VTW); body fluid balance | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-156 (26.3: Water Balance): 'water follows this reabsorbed sodium back into the blood' — renal reabsorption expands ECF/blood volume."
  - source: sodium_excretion
    target: extracellular_fluid_volume
    sign: "-"
    causal_evidence: mechanistic_model
    mechanism: urinary Na/water loss contracts ECF
    evidence: "kidney.cellml urinary_excretion (actual_Na_excretion_rate, actual_urine_volume); Electrolytes balance"
  - source: extracellular_fluid_volume
    target: blood_volume
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: ECF expansion raises plasma/blood volume (capillary equilibrium)
    evidence: "Guyton1972_CapillaryDynamics MODEL0912160000 (VEC -> VP); circulation total_blood_volume"

  # --- hemodynamics (circulatory dynamics integrator) ----------------------
  - source: blood_volume
    target: venous_return
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: raised blood volume raises mean systemic filling pressure -> venous return
    evidence: "circulation.cellml venous_blood_volume/venous_average_pressure -> rate_of_blood_flow_from_veins_to_right_atrium (QVO) | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-110 (19.6: Development of the Heart) — chapter review 19.4: 'Venous return is determined by activity of the skeletal muscles, blood volume, and changes in peripheral circulation.' (lines 413–414).; OpenStax Anatomy & Physiology 2e §anp-112 (20.3: Blood Flow, Blood Pressure, and Resistance): 'As blood volume decreases, pressure and flow decrease. As blood volume increases, pressure and flow increase.'; OpenStax Anatomy & Physiology 2e §anp-156 (26.3: Water Balance): 'Decreased blood volume resulting from water loss... baroreceptors detect a decrease in blood pressure that results from decreased blood volume.'"
  - source: venous_return
    target: cardiac_output
    sign: "+"
    causal_evidence: mechanistic_model
    mechanism: Frank-Starling — venous return / atrial filling sets stroke volume
    evidence: "circulation.cellml Guyton curves: right_atrial_pressure -> right/left_ventricular_output (QLO/QAO) | textbook corroboration: OpenStax Anatomy & Physiology 2e §anp-112 (20.3: Blood Flow, Blood Pressure, and Resistance): 'venoconstriction increases the return of blood to the heart... increases the preload or stretch of the cardiac muscle and increases contraction.'; OpenStax Anatomy & Physiology 2e §anp-116 (20.7: Development of Blood Vessels and Fetal Circulation): Chapter review §20.2 states venoconstriction and the skeletal muscle pump promote venous return to the heart, implying more venous return drives cardiac output.; OpenStax Biology 2e §bio-40.3 (40.3: Mammalian Heart and Blood Vessels): 'The atria are the chambers that receive blood, and the ventricles are the chambers that pump blood.' Deoxygenated venous blood enters the right atrium and is pumped by the right ventricle; oxygenated blood from the left atrium is pumped by the left ventricle into the aorta — the cardiac cycle coordinates filling and ejection so that venous inflow drives cardiac output."
  - source: sympathetic_tone
    target: total_peripheral_resistance
    sign: "+"
