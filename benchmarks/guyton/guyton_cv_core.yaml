# =============================================================================
# Guyton cardiovascular core — PhysioMap fragment      *** DRAFT FOR REVIEW ***
# =============================================================================
# Hand-encoded from the vendored Guyton source models (see SOURCES.md). Every edge
# sign is the sign of the partial derivative of the target's defining equation w.r.t.
# the source variable in the cited model file. ROBERT: please correct signs/edges.
#
# Scope (this step): single scale (ORGAN / ORGAN_SYSTEM), NO cross-scale constitutive
# edges yet — multi-scale comes next. All within-scale causal edges; cycles included.
#
# The three required negative-feedback loops are present and share one big SCC:
#   1. Pressure natriuresis : MAP -> renal_perfusion_pressure -> sodium_excretion
#                             -> ECF volume -> blood_volume -> venous_return
#                             -> cardiac_output -> MAP        (net negative)
#   2. Baroreflex           : MAP -> sympathetic_tone -> TPR/CO -> MAP   (net negative)
#   3. RAAS suppression     : renal_perfusion_pressure -> renin -> angiotensin_II
#                             -> TPR -> MAP -> renal_perfusion_pressure  (net negative)
# =============================================================================

name: guyton_cv_core
description: >-
  DRAFT cardiovascular core of the Guyton circulation model as a PhysioMap signed
  cyclic causal graph. Derived from BioModels Guyton1972 control modules + Physiome
  circulation/kidney integrator modules (see SOURCES.md). Single-scale (Phase 1).

