production_edges:
  # --- typed production of secreted hormones by their cellular source processes ---
  # These are neither constitution nor authored causal influences. The producing cell/process
  # is not asserted part_of the hormone; the relation records production of an output.
  #
  # Zona glomerulosa cells of the adrenal cortex synthesise/secrete aldosterone; their
  # secretion rate sets the plasma aldosterone level. (Guyton & Hall, Textbook of Medical
  # Physiology — "Adrenocortical Hormones": aldosterone from the zona glomerulosa.
  # Williams Textbook of Endocrinology — adrenal steroidogenesis.)
  - source: zona_glomerulosa_cell_aldosterone_secretion
    target: aldosterone
    sign: "+"
    production_evidence: legacy-evidence-unclassified
  # Hypothalamic magnocellular neurosecretory neurons (supraoptic + paraventricular nuclei)
  # synthesise vasopressin (ADH), transported down the hypothalamo-hypophyseal tract and
  # released from the posterior pituitary; their secretion rate sets plasma ADH.
  # (Guyton & Hall — "The Posterior Pituitary Gland and ADH"; Boron & Boulpaep, Medical
  # Physiology — vasopressin synthesis in magnocellular neurons.)
  - source: magnocellular_neuron_adh_secretion
    target: adh
    sign: "+"
    production_evidence: legacy-evidence-unclassified
  # Atrial cardiomyocytes secrete atrial natriuretic peptide on atrial stretch; their
