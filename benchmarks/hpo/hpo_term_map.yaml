# =============================================================================
# HPO term -> (PhysioMap node, PATO direction)   *** curated, hp.obo-verified ***
# =============================================================================
# Maps HPO abnormal-quantity terms to a PhysioMap node + sign (the increased/decreased
# direction). Every HP id + label was verified DIRECTLY against the downloaded hp.obo
# (scripts/build_hpo_observations.py re-checks the label at build time). Scope = the
# physiological lab/vital/metabolite terms PhysioMap covers; an annotation to a more SPECIFIC
# HP term is matched via the is-a hierarchy (true-path rule) at build time.
# =============================================================================
# HP terms that must NOT propagate up the is_a hierarchy into a mapped term, because HPO files
# them under a directional term for a DIFFERENT analyte. The deoxycortisols are steroid PRECURSORS
# that accumulate when cortisol synthesis is blocked (21-/11-hydroxylase deficiency) — i.e. they
# rise *because cortisol falls* — yet HPO places them under "Increased circulating cortisol level".
block_propagation:
  - HP:0025436   # Elevated serum 11-deoxycortisol (CYP11B1/CYP11B2) — NOT cortisol
  - HP:6000516   # Elevated circulating 21-deoxycortisol (CYP21A2) — NOT cortisol

