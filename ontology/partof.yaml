# =============================================================================
# part_of backbone for PhysioMap constitution validation   *** curated, ontology-grounded ***
# =============================================================================
# A small, versioned mereology (BFO:0000050 part_of) over the anatomical/cell entities used
# by PhysioMap nodes, taken from Uberon and the Cell Ontology (CL) and used by
# physiomap_core/constitution.py to VALIDATE constitutive `part_of+determination` (and
# `aggregation`) edges: a structural constitutive edge micro ▷ macro should have a part_of
# path from the micro node's (bearer) entity to the macro node's entity. Labels were verified
# verbatim against the downloaded canonical OBO files (PATO/CL/Uberon/ChEBI/GO/PR, 2026-06);
# part_of facts are textbook anatomy as encoded in Uberon/CL.
#
# This is NOT the full OWL import (the ontology/ ELK module is a later phase) — it is the
# minimal mereological scaffold needed to check that the constitution we assert is consistent
# with real part-whole structure, to derive/check scale, and to expose missing rungs.
#
# Each entry: <IRI>: { label, scale, part_of: [parent IRIs] }  (part_of = "is part of").
# =============================================================================

