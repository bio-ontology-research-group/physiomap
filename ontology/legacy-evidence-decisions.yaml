  source_file: benchmarks/human/systems/textbook_extracted.yaml
  rationale: Opened authoritative source confirms hyperkalemia impairs renal proximal-tubule ammoniagenesis
    and ammonium reabsorption (K competes at the Na-K-2Cl cotransporter), reducing ammonia-dependent acid
    excretion and bicarbonate regeneration and producing metabolic acidosis (type-4 RTA). Correcting hyperkalemia
    corrects the acidosis (causal, interventionally supported in the literature). Direction and sign (-)
    confirmed via an opened authoritative source; curated_mechanistic. B rather than A because I opened
    an authoritative teaching monograph, not the primary interventional study. The YAML's stated mechanism
    (K/H competition at Na/H exchange) is an oversimplification but does not affect the sign.
  evidence_checked:
  - 'Deranged Physiology, ''Type 4 (hyperkalemic) renal tubular acidosis'' (opened authoritative): hyperkalemia
    impairs renal ammoniagenesis and ammonium handling, reducing acid excretion and bicarbonate regeneration
    (type-4 RTA), and correcting the hyperkalemia corrects the acidosis - mechanism-grounded support for
    the negative plasma_potassium -> plasma_bicarbonate edge; a teaching monograph rather than the primary
    interventional study, so held at curated_mechanistic'
  - OpenStax A&P 2e §26.5 (renal regulation of acid-base; textbook corroboration)
  approved_by: Robert Hoehndorf
  approved_on: '2026-07-17'
