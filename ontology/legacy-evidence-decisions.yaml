- work_item_id: legacy-evidence-99b87be5686e3e48cf34
  status: approved
  decision: curated_mechanistic
  reviewer: opus-validation-2026-07-17:child-01 (opus), PMV-B (machine_accepted_lower_confidence)
  reviewed_on: '2026-07-17'
  source_file: benchmarks/human/systems/thyroid.yaml
  rationale: 'T3 increases sinoatrial-node automaticity/net chronotropy: it upregulates HCN2/HCN4 pacemaker
    channels and raises the funny current If (plus L-type Ca and SERCA cycling), yielding the tachycardia
    of hyperthyroidism and bradycardia of hypothyroidism. The opened review confirms the positive chronotropic
    action while cautioning that If/HCN upregulation alone is not fully sufficient (multi-channel and
    autonomic contributions). Sign (+) is undisputed clinically and experimentally (T3 raises If in isolated
    SAN myocytes; hyperthyroid tachycardia). Opened an authoritative review supporting the action but
    complicating the single-mechanism (If/HCN) story, so held to B/curated_mechanistic rather than an
    interventional class.'
  evidence_checked:
  - 'Endocrinology review ''Thyroid Hormone Receptors in Control of Heart Rate'' (bqae093, opened authoritative):
    T3 upregulates HCN2/HCN4 pacemaker channels and raises the funny current If (plus L-type Ca and SERCA
    cycling), yielding hyperthyroid tachycardia / hypothyroid bradycardia - mechanism-grounded support
