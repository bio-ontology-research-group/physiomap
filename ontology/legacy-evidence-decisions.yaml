- work_item_id: legacy-evidence-32a81c089aef3439209b
  status: proposed
  decision: curated_mechanistic
  reviewer: legacy-review-agent:hpo_csf_markers
  reviewed_on: '2026-07-11'
  source_file: benchmarks/human/systems/hpo_csf_markers.yaml
  rationale: 'Guanidinoacetate -> creatine via GAMT is standard product-formation biochemistry. The cited
    GAMT-deficiency evidence shows dissociation (guanidinoacetate accumulates while creatine falls when
    GAMT itself is LOF), analogous to the AADC case, so genetic_lof_gof is not supported for this source-target
    pair; curated_mechanistic (enzymatic mechanism, substrate-supply limb) is appropriate. Concern recorded
    separately: GAMT-deficiency dissociation shows context-dependence (holds only with normal GAMT activity),
    worth flagging though the edge/sign is left unchanged.'
  evidence_checked:
  - 'Lehninger Principles of Biochemistry (creatine biosynthesis: AGAT then GAMT)'
  - Blau et al. Physician's Guide to Inherited Metabolic Diseases (cerebral creatine-deficiency syndromes;
    GAMT deficiency shows dissociation, a confound not direct support for this edge)
