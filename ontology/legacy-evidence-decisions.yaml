- work_item_id: legacy-evidence-190c53942399fe76e08a
  status: approved
  decision: pharmacological
  reviewer: legacy-review-agent:hpo_trace_metals
  reviewed_on: '2026-07-11'
  source_file: benchmarks/human/systems/hpo_trace_metals.yaml
  rationale: 'The cited evidence explicitly includes a controlled pharmacological intervention: penicillamine
    (a copper-chelating drug) challenge causes a marked increase in urinary copper excretion by mobilizing/raising
    free (non-ceruloplasmin) copper available for glomerular filtration. This directly demonstrates do(source:
