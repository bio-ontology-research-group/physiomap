- work_item_id: legacy-evidence-3aada237129f2bba08ae
  status: proposed
  decision: reclassified_quantitative
  reviewer: legacy-review-agent:hpo_pulmonary_bloodgas
  reviewed_on: '2026-07-11'
  source_file: benchmarks/human/systems/hpo_pulmonary_bloodgas.yaml
  rationale: 'Edge pulmonary_artery_pressure -> right_ventricular_systolic_pressure (+) rests on anatomical
    continuity: absent pulmonic stenosis, RV and PA form one continuous chamber in systole, so RV systolic
    pressure equals PA systolic pressure by definition (basis of the TR-jet echo estimate of PASP). This
    is a structural-function equality/identity, not a demonstrated independent causal intervention distinct
    from the identity itself. Concern: RVSP and systolic PAP are, per the cited mechanism, the same transmitted
    pressure rather than independently causally linked quantities; consider a definitional/quantitative
    identity edge instead of an ordinary causal edge.'
  evidence_checked:
  - Harrison's 21st ed., 'Pulmonary Hypertension' (echo estimation of PASP from RVSP via TR jet; describes
    the anatomical-continuity identity, not a perturbation study)
- work_item_id: legacy-evidence-685c1ae848f60966cc56
  status: proposed
  decision: reclassified_quantitative
  reviewer: legacy-review-agent:hpo_pulmonary_bloodgas
  reviewed_on: '2026-07-11'
  source_file: benchmarks/human/systems/hpo_pulmonary_bloodgas.yaml
  rationale: 'Edge left_atrial_pressure -> pulmonary_capillary_wedge_pressure (+) is described purely
    as physical hydrostatic transmission/equilibration through a static, non-flowing catheter column (Pascal''s-law
    equalisation); PCWP is a measurement surrogate numerically ~equal to LAP under the wedge condition.
    This is a structural-function/definitional identity, not an interventional demonstration of an independent
    do(LAP)->delta(PCWP) effect. Concern: PCWP and LAP are, by the cited mechanism, essentially the same
    physical quantity measured two ways rather than distinct causally-linked variables; consider modelling
    PCWP as a definitional proxy for left_atrial_pressure instead of a downstream causal target.'
  evidence_checked:
  - Boron & Boulpaep 3rd ed., 'The Heart as a Pump' (Swan-Ganz wedge-pressure measurement physics, not
    an interventional study)
- work_item_id: legacy-evidence-9c3e8eb4afe6be466d49
  status: proposed
  decision: reclassified_quantitative
  reviewer: legacy-review-agent:hpo_pulmonary_bloodgas
  reviewed_on: '2026-07-11'
  source_file: benchmarks/human/systems/hpo_pulmonary_bloodgas.yaml
  rationale: 'Edge stroke_volume -> pulse_pressure (+) is grounded in the Windkessel-derived approximation
    pulse pressure ~= stroke_volume / arterial_compliance (pulse pressure is literally defined as systolic
    minus diastolic pressure). This is a formula/ratio-type quantitative relationship holding arterial
    compliance implicitly fixed, matching the reclassified_quantitative category, rather than a demonstrated
    independent interventional causal claim beyond the textbook formula and general corroborating narrative.
    Concern: arterial_compliance (the implicit denominator) is not represented as a node/edge in this
    fragment, so the edge silently holds it fixed; recommend eventually a ratio/quantitative construct
    (numerator=stroke_volume, denominator=arterial_compliance) once that node exists.'
  evidence_checked:
  - Boron & Boulpaep 3rd ed., 'Arterial pressure' (PP ~ SV/arterial compliance formula)
  - OpenStax A&P 2e SS20.3 (corroborating narrative description, not a controlled perturbation report)
- work_item_id: legacy-evidence-a58499836bc4bd53a56b
  status: proposed
  decision: curated_mechanistic
  reviewer: legacy-review-agent:hpo_pulmonary_bloodgas
  reviewed_on: '2026-07-11'
  source_file: benchmarks/human/systems/hpo_pulmonary_bloodgas.yaml
  rationale: 'Edge pulmonary_artery_pressure -> right_atrial_pressure (+) is a genuine multi-step pathophysiological
    cascade (chronically raised PAP -> raised RV afterload -> RV failure/congestion -> backward-transmitted
    elevated right atrial/central-venous pressure = cor pulmonale), not an algebraic identity and not
    mere association/co-occurrence. This matches existing codebase precedent for curated_mechanistic (e.g.
    angiotensin_II -> water_intake, plasma_osmolality -> adh in benchmarks/human/systems/body_fluids_osmolality.yaml),
    which likewise rest on a specific, named, textbook-curated physiological mechanism rather than a quoted
    single-factor perturbation experiment. No more specific class is actually demonstrated by the cited
    evidence, so curated_mechanistic is the narrowest admissible class. Concern: the cascade passes through
    an unrepresented pathological intermediate state (RV hypertrophy/failure) not itself a node in this
    fragment; direct edge as encoded is directionally sound as a coarse-grained summary, but a future
    curation pass could add an explicit intermediate node.'
  evidence_checked:
  - Harrison's 21st ed., 'Pulmonary Hypertension' / 'Cor Pulmonale' (names the specific afterload -> RV
    failure -> venous congestion mechanism)
  - Boron & Boulpaep 3rd ed. (RV afterload/failure physiology)
- work_item_id: legacy-evidence-bd0863e097026117a82e
  status: proposed
  decision: reclassified_quantitative
  reviewer: legacy-review-agent:hpo_pulmonary_bloodgas
  reviewed_on: '2026-07-11'
  source_file: benchmarks/human/systems/hpo_pulmonary_bloodgas.yaml
  rationale: 'Edge pulmonary_capillary_wedge_pressure -> pulmonary_artery_pressure (+) is not an independent
    interventional causal claim: the cited mechanism is literally an additive term in the steady-state
    identity mean PAP = PVR x CO + PCWP. This is a sum/algebraic-identity relationship (reclassified_quantitative
    category), not evidence of do(PCWP)->delta(PAP) from a perturbation, drug, genetic lesion, MR instrument,
    or curated ODE Jacobian. Concern: PAP in this fragment is only partially parented (CO term not represented
    as an edge here), so this is an incomplete algebraic identity as currently encoded; recommend eventually
    modelling the full mean-PAP relation as a typed sum/definitional structure once a CO->PAP edge exists.'
  evidence_checked:
  - Harrison's 21st ed. 'Pulmonary Hypertension' (textbook description of the additive PAP identity, not
    an interventional study)
  - Boron & Boulpaep 3rd ed. (same hemodynamic identity)
- work_item_id: legacy-evidence-e271cb604abb892099c7
  status: proposed
  decision: reclassified_quantitative
  reviewer: legacy-review-agent:hpo_pulmonary_bloodgas
  reviewed_on: '2026-07-11'
  source_file: benchmarks/human/systems/hpo_pulmonary_bloodgas.yaml
  rationale: 'Edge cardiac_output -> cardiac_index (+) is a pure normalization ratio, CI = CO / body_surface_area,
    stated explicitly in the cited mechanism. This is precisely the ratio pattern the migration protocol
    reserves for reclassified_quantitative, not an interventional causal claim: cardiac_index and cardiac_output
