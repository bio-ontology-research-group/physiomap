  source_file: benchmarks/multiscale/jga_cellcomm.yaml
  rationale: 'High macula-densa NaCl delivery raises basolateral ATP/adenosine, activating ADORA1 (Gi)
    on JG granular cells to lower cAMP and suppress renin exocytosis. I opened the primary interventional
    evidence: A1 adenosine receptor knockout mice have significantly increased plasma renin activity and
    abolished tubuloglomerular feedback (Brown 2001), and adenosine/A1 is a required constituent of JGA
    signaling (Sun 2001). Removing the mediating receptor disinhibits renin, confirming the tonic suppressive
    (negative) sign. Rank A: directly opened primary germline loss-of-function evidence (ADORA1 KO) establishing
    that the adenosine/A1 arm of the macula-densa signal tonically suppresses renin (KO -> increased renin),
    which is a natural do() supporting the negative edge sign. genetic_lof_gof is the narrowest class
    demonstrated (germline receptor LoF). Caveat noted: the KO is global (systemic adenosine effects possible),
    but the JGA localization is well supported by Sun 2001 and the TGF literature.'
  evidence_checked:
  - 'PMID:11641103 (Brown et al. 2001, Am J Physiol Regul Integr Comp Physiol, opened primary): A1 adenosine-receptor
    (ADORA1) knockout mice show significantly increased plasma renin activity and abolished tubuloglomerular
    feedback - germline receptor loss-of-function disinhibiting renin, confirming the negative macula_densa_nacl_signal
    -> jg_granular_renin_secretion partial'
  - 'PMID:11504952 (Sun et al. 2001, PNAS, opened): adenosine/ADORA1 is a required constituent of JGA/tubuloglomerular-feedback
    signaling, localizing the suppressive adenosine arm to the macula densa (caveat: the ADORA1 KO is
    global, so systemic adenosine effects cannot be fully excluded)'
  approved_by: Robert Hoehndorf
  approved_on: '2026-07-17'
