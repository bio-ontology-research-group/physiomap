- work_item_id: legacy-evidence-2c337c6a1f0e78fcfb3b
  status: proposed
  decision: curated_mechanistic
  reviewer: legacy-review-agent:adrenal_cortisol
  reviewed_on: '2026-07-11'
  source_file: benchmarks/human/systems/adrenal_cortisol.yaml
  rationale: 'crh -> pituitary_acth_secretion (+): CRH acting on corticotroph CRH-R1 receptors to trigger
    POMC/ACTH release is a well-characterized, specific receptor-mediated endocrine mechanism (Boron &
    Boulpaep HPA axis; HumMod endocrine module), corroborated by multiple independent OpenStax passages
    naming the specific stimulatory relationship. This is a curated mechanistic causal statement, not
    a bare narrative co-occurrence. No perturbation/pharmacological experiment (e.g. CRH-stimulation-test
    primary literature) is quoted in the evidence text, so I did not promote further to pharmacological
    without verifying an unquoted claim.'
  evidence_checked:
  - HumMod endocrine module (CRH->ACTH)
  - Boron & Boulpaep Medical Physiology HPA axis chapter
  - OpenStax A&P 2e anp-091, anp-094 (quoted in shard)
