  - curatorial note by Paul N. Schofield in the YAML
- work_item_id: legacy-evidence-7a0c24952d93c6ee068f
  status: approved
  decision: pharmacological
  reviewer: legacy-review-agent:adrenal_cortisol
  reviewed_on: '2026-07-11'
  source_file: benchmarks/human/systems/adrenal_cortisol.yaml
  rationale: 'cortisol -> plasma_glucose (+): the net hyperglycaemic effect of cortisol is classically
    established through cortisol/glucocorticoid administration experiments and clinical exogenous-corticosteroid
    (e.g. prednisone/dexamethasone) therapy, which is one of the best-documented pharmacological causes
    of hyperglycaemia ("steroid-induced hyperglycaemia"), consistent with the cited Guyton & Hall hyperglycaemia
    discussion and clinical Cushing''s corroboration. This is the narrowest admissible class actually
    demonstrated by the well-established glucocorticoid-administration literature underlying this textbook
    statement.'
  evidence_checked:
  - Guyton & Hall glucocorticoid hyperglycaemia chapter
  - clinical Cushing's syndrome corroboration
  - OpenStax A&P 2e anp-094, anp-138 and Biology 2e bio-37.5 (quoted in shard)
  approved_by: Robert Hoehndorf
  approved_on: '2026-07-11'
- work_item_id: legacy-evidence-b2e99ae78279add664de
  status: proposed
  decision: curated_mechanistic
  reviewer: legacy-review-agent:adrenal_cortisol
  reviewed_on: '2026-07-11'
  source_file: benchmarks/human/systems/adrenal_cortisol.yaml
  rationale: 'cortisol -> sodium_water_reabsorption (+): at high concentrations cortisol saturates renal
    11beta-HSD2 and activates the mineralocorticoid receptor -- a specific, well-characterized molecular
    mechanism ("apparent mineralocorticoid excess"), corroborated by the clinical Cushing''s-syndrome
    sodium/water retention phenotype named in the evidence text. The quoted evidence does not itself cite
    a pharmacological 11beta-HSD2-inhibition study (e.g. licorice/glycyrrhetinic acid), so I did not promote
    to pharmacological on unquoted background knowledge.'
  evidence_checked:
  - Boron & Boulpaep, high cortisol overwhelms 11beta-HSD2 / MR activation
  - clinical Cushing's syndrome corroboration (quoted in shard)
- work_item_id: legacy-evidence-f277f8266958082c5be9
  status: approved
  decision: pharmacological
  reviewer: opus-validation-2026-07-17:child-05 (opus), PMV-A (machine_accepted_direct)
  reviewed_on: '2026-07-17'
  source_file: benchmarks/human/systems/adrenal_cortisol.yaml
  rationale: 'The dexamethasone suppression test is the canonical pharmacological demonstration: dexamethasone
    (a glucocorticoid / GR agonist, cortisol analog) binds pituitary glucocorticoid receptors and suppresses
    ACTH secretion, lowering cortisol. do(glucocorticoid up) -> ACTH down. Opened an authoritative description
    of a direct pharmacological intervention (dexamethasone/GR agonist) that suppresses ACTH, matching
    source=cortisol (glucocorticoid), target=pituitary ACTH secretion, sign=-. Pharmacological is the
    narrowest demonstrated class. A because directly-checked interventional support with matching endpoints/sign.'
  evidence_checked:
  - 'Dexamethasone suppression test (opened authoritative description, en.wikipedia.org/wiki/Dexamethasone_suppression_test):
    dexamethasone, a glucocorticoid/GR agonist and cortisol analog, binds pituitary glucocorticoid receptors
    and suppresses ACTH secretion - a source-directed pharmacological intervention confirming the negative
    cortisol -> pituitary_acth_secretion edge'
  - OpenStax A&P 2e §17.3 (glucocorticoid negative feedback on ACTH; textbook corroboration of the direction)
  approved_by: Robert Hoehndorf
  approved_on: '2026-07-17'
