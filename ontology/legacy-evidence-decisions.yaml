    biological variables. Concern: body_surface_area (the denominator) is not represented as a node in
    this fragment; recommend the existing RatioDefinition construct (numerator=cardiac_output, denominator=body_surface_area)
    rather than an ordinary directional causal_edge, consistent with the hematocrit ratio pattern documented
    in CLAUDE.md.'
  evidence_checked:
  - Boron & Boulpaep 3rd ed., 'The Heart as a Pump' (cardiac index definition, CI = CO / BSA)
