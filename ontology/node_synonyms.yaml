# Physiology abbreviation / synonym lexicon for node de-duplication.
#
# Used by physiomap_core.reconcile to normalize labels before matching, so that
# e.g. "MAP", "mean arterial pressure", and "mean arterial blood pressure" collapse
# to the same canonical form and a re-extracted variable maps to the EXISTING node
# instead of creating a duplicate.
#
# Each entry: a canonical phrase -> list of surface variants/abbreviations that mean it.
# Matching is case-insensitive on the normalized (punctuation-stripped) form.
# Keep entries conservative: only TRUE synonyms (same entity+quality), never
# near-neighbours that are genuinely distinct variables
# (e.g. renal blood flow != renal plasma flow -> NOT synonyms).

synonyms:
  mean arterial pressure: [map, mean arterial blood pressure, mean systemic arterial pressure, mean bp]
  blood pressure: [bp, arterial blood pressure, systemic blood pressure]
  heart rate: [hr, cardiac rate, pulse rate, chronotropy]
  cardiac output: [co, cardiac index]
  stroke volume: [sv]
  total peripheral resistance: [tpr, systemic vascular resistance, svr, peripheral vascular resistance]
  glomerular filtration rate: [gfr]
  renal blood flow: [rbf]
  renal plasma flow: [rpf]
  effective renal plasma flow: [erpf]
  extracellular fluid volume: [ecf volume, ecfv, extracellular volume]
  intracellular fluid volume: [icf volume, icfv, intracellular volume]
  plasma volume: [pv]
  blood volume: [total blood volume]
  central venous pressure: [cvp, right atrial pressure]
  pulmonary capillary wedge pressure: [pcwp, pulmonary wedge pressure, wedge pressure]
  systemic vascular resistance: [svr, total peripheral resistance, tpr]
  antidiuretic hormone: [adh, vasopressin, arginine vasopressin, avp]
  atrial natriuretic peptide: [anp, atrial natriuretic factor, anf]
  brain natriuretic peptide: [bnp, b-type natriuretic peptide]
  angiotensin ii: [ang ii, ang2, at-ii, angiotensin 2]
  angiotensin i: [ang i, ang1, angiotensin 1]
  plasma renin activity: [pra, renin activity]
  aldosterone: [plasma aldosterone]
  cortisol: [plasma cortisol, hydrocortisone]
  adrenocorticotropic hormone: [acth, corticotropin]
  corticotropin releasing hormone: [crh, corticotropin releasing factor, crf]
  thyroid stimulating hormone: [tsh, thyrotropin]
  thyrotropin releasing hormone: [trh]
  thyroxine: [t4, free t4, ft4, free thyroxine]
  triiodothyronine: [t3, free t3, ft3, free triiodothyronine]
  growth hormone: [gh, somatotropin]
  insulin like growth factor 1: [igf-1, igf1, somatomedin c]
  parathyroid hormone: [pth, parathormone]
  follicle stimulating hormone: [fsh]
  luteinizing hormone: [lh]
  gonadotropin releasing hormone: [gnrh, lhrh]
  partial pressure of oxygen: [po2, pao2, oxygen tension, partial pressure of arterial oxygen, arterial po2]
  partial pressure of carbon dioxide: [pco2, paco2, carbon dioxide tension, arterial pco2]
  arterial oxygen saturation: [sao2, sao2 percent, oxygen saturation, spo2]
  oxygen content: [cao2, arterial oxygen content, blood oxygen content]
  bicarbonate: [hco3, plasma bicarbonate, serum bicarbonate, hco3-]
  blood ph: [arterial ph, plasma ph, ph]
  alveolar ventilation: [va]
  minute ventilation: [ve, total ventilation, minute volume]
  functional residual capacity: [frc]
  tidal volume: [vt]
  ventilation perfusion ratio: [v/q, va/q, ventilation-perfusion ratio, v/q ratio]
  pulmonary vascular resistance: [pvr]
  pulmonary arterial pressure: [pap, pulmonary artery pressure]
  alveolar oxygen tension: [pao2 alveolar, alveolar po2]
  blood glucose: [plasma glucose, serum glucose, glucose, glycemia, blood sugar]
  insulin: [plasma insulin, serum insulin]
  glucagon: [plasma glucagon]
  free fatty acids: [ffa, nefa, non-esterified fatty acids, plasma free fatty acids]
  plasma calcium: [serum calcium, ionized calcium, calcium]
  plasma phosphate: [serum phosphate, phosphate, inorganic phosphate, pi]
  plasma potassium: [serum potassium, potassium, kalemia]
  plasma sodium: [serum sodium, sodium, natremia]
  hemoglobin concentration: [hb, hgb, blood hemoglobin]
  hematocrit: [hct, packed cell volume, pcv]
  red cell mass: [red blood cell mass, erythrocyte mass]
  erythropoietin: [epo, plasma erythropoietin]
  body temperature: [core temperature, core body temperature, core temp]
  plasma osmolality: [serum osmolality, osmolality, plasma osmolarity]
  sympathetic tone: [sympathetic activity, sympathetic nerve activity, sna, sympathetic outflow]
  parasympathetic tone: [vagal tone, parasympathetic activity, vagal activity]
