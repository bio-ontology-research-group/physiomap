[project]
name = "physiomap"
version = "1.1.1"
description = "An ontology-grounded causal knowledge graph of human physiology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "clingo>=5.7",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.9",
    "scipy>=1.14",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
physiomap-eval = "physiomap_core.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physiomap_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
